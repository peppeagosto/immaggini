<!DOCTYPE html>
<html lang="it" class="bg-transparent">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console Controller Studio</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>

  <style type="text/css">
    html, body {
      background-color: transparent !important;
      color: #FFFFFF;
      margin: 0;
      padding: 6px;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      pointer-events: auto !important;
    }

    .controller-box {
      width: 100%;
      max-width: 728px;
      margin: 0 auto;
      pointer-events: auto !important;
    }

    button, input, select {
      cursor: pointer !important;
      pointer-events: auto !important;
      touch-action: manipulation;
    }

    input[type=range] {
      accent-color: #38bdf8;
    }

    /* Equalizzatore audio animato */
    .eq-bar {
      width: 2.5px;
      background: #38bdf8;
      border-radius: 1px;
      height: 3px;
      transition: height 0.12s ease;
    }
    .music-active .eq-bar:nth-child(1) { animation: eqPulse 0.7s infinite alternate ease-in-out; }
    .music-active .eq-bar:nth-child(2) { animation: eqPulse 0.9s infinite alternate ease-in-out 0.2s; }
    .music-active .eq-bar:nth-child(3) { animation: eqPulse 0.6s infinite alternate ease-in-out 0.4s; }
    .music-active .eq-bar:nth-child(4) { animation: eqPulse 0.8s infinite alternate ease-in-out 0.1s; }
    @keyframes eqPulse {
      0% { height: 3px; }
      100% { height: 14px; }
    }
  </style>
</head>

<body class="selection:bg-cyan-500 selection:text-slate-950 flex justify-center items-center">

  <!-- ======================================================== -->
  <!-- CONSOLE STUDIO HARDWARE RACK                             -->
  <!-- ======================================================== -->
  <div class="controller-box">
    <div class="w-full p-3 rounded-2xl bg-slate-900/95 border border-slate-800 shadow-2xl backdrop-blur-xl">
      
      <!-- Barra superiore con telemetria e comandi scorrimento -->
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-2 mb-2">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-sm shadow-cyan-400 animate-pulse"></span>
          <h2 class="text-xs font-bold tracking-wide uppercase font-mono text-white">Studio Console</h2>
          <span class="text-[10px] text-cyan-400/80 font-mono hidden sm:inline">&bull; Controllo Remoto Sync</span>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Tasto Singolo Inverti Direzione (DX <-> SX) con cambio istantaneo -->
          <button type="button" id="toggleDirectionBtn" class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-cyan-500 text-slate-950 font-bold text-[11px] font-mono transition shadow-sm shadow-cyan-500/20 active:scale-95" title="Inverti direzione scorrimento">
            <span id="directionIcon" class="text-xs font-bold">&larr;</span>
            <span id="directionText">DX &rarr; SX</span>
          </button>

          <!-- Tasto Pausa / Play -->
          <button type="button" id="togglePlayBtn" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-[11px] font-mono transition active:scale-95">
            <svg id="playPauseIcon" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
            <span id="playPauseText">Pausa</span>
          </button>
        </div>
      </div>

      <!-- MODULO AUDIO & STREAMING RADIO ZENO -->
      <div id="audioPlayerCard" class="mb-2 p-2 rounded-xl bg-slate-800/70 border border-cyan-500/30 shadow-inner relative overflow-hidden">
        <audio id="bgMusic" crossorigin="anonymous" loop preload="none"></audio>

        <div class="relative z-20 flex flex-wrap items-center justify-between gap-2">
          <!-- Play Radio, Cover & Titolo brano -->
          <div class="flex items-center gap-2">
            <button type="button" id="musicToggleBtn" class="flex items-center justify-center w-8 h-8 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-md shadow-cyan-500/20 transition active:scale-95 shrink-0" title="Play / Pausa Radio">
              <svg id="musicPlayIcon" class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </button>

            <img id="radioCoverArt" src="https://xatimg.com/image/KRUeEt3n4lEa.jpg" alt="Cover Radio" 
                 class="w-8 h-8 rounded-lg object-cover border border-cyan-500/30 shadow shrink-0">
            
            <div class="flex flex-col">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold text-white font-mono uppercase tracking-wide">Zeno Live</span>
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span>
                <div id="eqVisualizer" class="flex items-end gap-0.5 h-3 px-1 py-0.5 rounded bg-slate-900/60 border border-slate-700/80">
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                </div>
              </div>
              <span id="musicStatusText" class="text-[10px] text-cyan-300 font-mono font-semibold truncate max-w-[160px] sm:max-w-[210px]">
                🎵 IN ONDA: RICERCA COVER...
              </span>
            </div>
          </div>

          <!-- Pulsanti Satellite Rapidi -->
          <div class="flex flex-wrap items-center gap-1">
            <button type="button" onclick="triggerSatellite('disco')" id="discoToggleBtn" class="px-2 py-0.5 rounded bg-purple-600/30 hover:bg-purple-600/50 text-purple-300 border border-purple-500/30 text-[10px] font-mono font-semibold transition">
              🪩 Disco
            </button>
            <button type="button" onclick="triggerSatellite('esplosione')" id="explosionToggleBtn" class="px-2 py-0.5 rounded bg-amber-600/30 hover:bg-amber-600/50 text-amber-300 border border-amber-500/30 text-[10px] font-mono font-semibold transition">
              💥 Glow
            </button>
            <button type="button" onclick="triggerSatellite('titolo')" class="px-1.5 py-0.5 rounded bg-slate-900/80 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[10px] font-mono transition">
              🎵 Brano
            </button>
            <button type="button" onclick="triggerSatellite('meteo')" class="px-1.5 py-0.5 rounded bg-slate-900/80 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[10px] font-mono transition">
              🌍 Meteo
            </button>
            <button type="button" onclick="triggerSatellite('data')" class="px-1.5 py-0.5 rounded bg-slate-900/80 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[10px] font-mono transition">
              📅 Data
            </button>
            <button type="button" onclick="triggerSatellite('ora')" class="px-1.5 py-0.5 rounded bg-slate-900/80 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[10px] font-mono transition">
              ⏰ Ora
            </button>
            <button type="button" onclick="triggerSatellite('oroscopo')" class="px-1.5 py-0.5 rounded bg-slate-900/80 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[10px] font-mono transition">
              ✨ Mood
            </button>
          </div>

          <!-- Volume e Mute -->
          <div class="flex items-center gap-1.5 bg-slate-900/80 px-2 py-1 rounded-lg border border-slate-700/70 ml-auto sm:ml-0">
            <button type="button" id="muteToggleBtn" class="text-slate-300 hover:text-cyan-400 transition" title="Muto / Attiva">
              <svg id="volumeIcon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
              </svg>
            </button>
            <input id="musicVolumeSlider" type="range" min="0" max="1" step="0.05" value="0.7" class="w-14 h-1 bg-slate-700 rounded cursor-pointer">
            <span id="musicVolumeDisplay" class="text-[9px] font-mono text-cyan-400 w-6 text-right">70%</span>
          </div>
        </div>
      </div>

      <!-- Griglia 4 Trimmer di Regolazione (Dimensioni, Velocità, Bordi, Luce) -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        
        <!-- 1. Dimensioni Schede -->
        <div class="flex flex-col justify-between bg-slate-800/50 p-2 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center">
            <label for="cardSizeSlider" class="text-[10px] font-bold text-slate-200">Misura Foto</label>
            <span id="cardSizeDisplay" class="text-[10px] font-mono font-bold text-cyan-400">250px</span>
          </div>
          <input id="cardSizeSlider" type="range" min="160" max="320" value="250" step="5"
            class="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer my-1">
          <div class="flex justify-between text-[9px] text-slate-400 font-mono">
            <button type="button" id="resetSizeBtn" class="text-cyan-400 hover:underline">250x160 (Default)</button>
            <span id="cardRatioLabel">160h</span>
          </div>
        </div>

        <!-- 2. Velocità Scorrimento Marquee -->
        <div class="flex flex-col justify-between bg-slate-800/50 p-2 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center">
            <label for="speedSlider" class="text-[10px] font-bold text-slate-200">Velocità Movimento</label>
            <span id="speedDisplay" class="text-[10px] font-mono font-bold text-cyan-400">Normale (1.8x)</span>
          </div>
          <input id="speedSlider" type="range" min="0.5" max="4.5" value="1.8" step="0.1"
            class="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer my-1">
          <div class="flex justify-between text-[9px] text-slate-400 font-mono">
            <button type="button" id="speedFastBtn" class="hover:text-cyan-300 transition">Veloce (3.2x)</button>
            <button type="button" id="speedNormalBtn" class="text-cyan-400 hover:underline">Normale (1.8x)</button>
            <button type="button" id="speedSlowBtn" class="hover:text-cyan-300 transition">Lento (0.9x)</button>
          </div>
        </div>

        <!-- 3. Bordi Arcobaleno Sfumati -->
        <div class="flex flex-col justify-between bg-slate-800/50 p-2 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center">
            <label for="rainbowBorderSlider" class="text-[10px] font-bold text-slate-200">Bordi Arcobaleno</label>
            <span id="rainbowBorderDisplay" class="text-[10px] font-mono font-bold text-fuchsia-400">0% (3.5px)</span>
          </div>
          <input id="rainbowBorderSlider" type="range" min="0" max="100" value="0" step="5"
            class="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer my-1">
          <div class="flex justify-between items-center text-[9px] text-slate-400 font-mono">
            <button type="button" id="rainbowOffBtn" class="text-slate-300 hover:underline">Riposo 3.5px</button>
            <button type="button" id="rainbowGlowBtn" class="text-fuchsia-300 hover:underline">Max 16px</button>
          </div>
        </div>

        <!-- 4. Super Luminosità & Glow -->
        <div class="flex flex-col justify-between bg-slate-800/50 p-2 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center">
            <label for="photoBrightnessSlider" class="text-[10px] font-bold text-slate-200">Super Luminosità</label>
            <span id="photoBrightnessDisplay" class="text-[10px] font-mono font-bold text-cyan-400">120%</span>
          </div>
          <input id="photoBrightnessSlider" type="range" min="80" max="250" value="120" step="5"
            class="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer my-1">
          <div class="flex justify-between items-center text-[9px] text-slate-400 font-mono">
            <button type="button" id="boostGlowBtn" class="text-cyan-300 font-bold hover:underline">Ultra 200%</button>
            <button type="button" id="resetGlowBtn" class="text-slate-300 hover:underline">120% Std</button>
          </div>
        </div>

      </div>

      <!-- Barra di supporto inferiore compatta -->
      <div class="mt-2 pt-1.5 border-t border-slate-800/70 flex items-center justify-between text-[10px] text-slate-400 font-mono">
        <span class="truncate">Console Wireless &bull; Trasmissione real-time alle foto</span>
        <span class="text-slate-500 shrink-0">&bull; 100% Trasparente per xat</span>
      </div>

    </div>
  </div>

  <script>
    // Canale BroadcastChannel per comunicare istantaneamente con lo scroller
    const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('xat_marquee_sync') : null;

    function sendToScroller(messageObj) {
      if (syncChannel) {
        syncChannel.postMessage(messageObj);
      }
      // Supporto postMessage standard (verso finestre e iframe esterni)
      try {
        window.parent.postMessage(messageObj, '*');
      } catch (e) {}
    }

    // Elementi DOM Console
    const toggleDirectionBtn = document.getElementById('toggleDirectionBtn');
    const directionIcon = document.getElementById('directionIcon');
    const directionText = document.getElementById('directionText');
    const togglePlayBtn = document.getElementById('togglePlayBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const playPauseText = document.getElementById('playPauseText');

    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const speedFastBtn = document.getElementById('speedFastBtn');
    const speedNormalBtn = document.getElementById('speedNormalBtn');
    const speedSlowBtn = document.getElementById('speedSlowBtn');

    const cardSizeSlider = document.getElementById('cardSizeSlider');
    const cardSizeDisplay = document.getElementById('cardSizeDisplay');
    const resetSizeBtn = document.getElementById('resetSizeBtn');
    const cardRatioLabel = document.getElementById('cardRatioLabel');

    const rainbowBorderSlider = document.getElementById('rainbowBorderSlider');
    const rainbowBorderDisplay = document.getElementById('rainbowBorderDisplay');
    const rainbowOffBtn = document.getElementById('rainbowOffBtn');
    const rainbowGlowBtn = document.getElementById('rainbowGlowBtn');

    const photoBrightnessSlider = document.getElementById('photoBrightnessSlider');
    const photoBrightnessDisplay = document.getElementById('photoBrightnessDisplay');
    const boostGlowBtn = document.getElementById('boostGlowBtn');
    const resetGlowBtn = document.getElementById('resetGlowBtn');

    // 1. Play / Pausa
    let isPaused = false;
    togglePlayBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        playPauseText.textContent = "Riprendi";
        playPauseIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      } else {
        playPauseText.textContent = "Pausa";
        playPauseIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      }
      sendToScroller({ type: 'TOGGLE_PLAY', isPaused: isPaused });
    });

    // 2. Inversione di Direzione (DX <-> SX)
    let currentDirection = -1; // -1 = DX -> SX, +1 = SX -> DX
    toggleDirectionBtn.addEventListener('click', () => {
      currentDirection = (currentDirection === -1) ? 1 : -1;
      if (currentDirection === -1) {
        directionIcon.innerHTML = "&larr;";
        directionText.innerHTML = "DX &rarr; SX";
        toggleDirectionBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded-lg bg-cyan-500 text-slate-950 font-bold text-[11px] font-mono transition shadow-sm shadow-cyan-500/20 active:scale-95";
      } else {
        directionIcon.innerHTML = "&rarr;";
        directionText.innerHTML = "SX &rarr; DX";
        toggleDirectionBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded-lg bg-fuchsia-500 text-slate-950 font-bold text-[11px] font-mono transition shadow-sm shadow-fuchsia-500/20 active:scale-95";
      }
      sendToScroller({ type: 'TOGGLE_DIRECTION' });
    });

    // 3. Velocità Scorrimento
    function setMarqueeSpeed(val) {
      speedSlider.value = val;
      if (val >= 2.8) {
        speedDisplay.textContent = `Veloce (${val}x)`;
      } else if (val <= 1.1) {
        speedDisplay.textContent = `Lento (${val}x)`;
      } else {
        speedDisplay.textContent = `Normale (${val}x)`;
      }
      sendToScroller({ type: 'SET_SPEED', value: parseFloat(val) });
    }

    speedSlider.addEventListener('input', (e) => setMarqueeSpeed(e.target.value));
    speedFastBtn.addEventListener('click', () => setMarqueeSpeed(3.2));
    speedNormalBtn.addEventListener('click', () => setMarqueeSpeed(1.8));
    speedSlowBtn.addEventListener('click', () => setMarqueeSpeed(0.9));

    // 4. Misura Foto
    function applyCardDimensions(widthVal) {
      cardSizeSlider.value = widthVal;
      const heightVal = Math.round(widthVal * 0.64);
      cardSizeDisplay.textContent = `${widthVal}px`;
      cardRatioLabel.textContent = `${heightVal}h`;
      sendToScroller({ type: 'SET_SIZE', value: widthVal });
    }

    cardSizeSlider.addEventListener('input', (e) => applyCardDimensions(parseInt(e.target.value)));
    resetSizeBtn.addEventListener('click', () => applyCardDimensions(250));

    // 5. Bordi Arcobaleno
    function applyRainbowBorder(val) {
      rainbowBorderSlider.value = val;
      const borderThickness = (3.5 + (val / 100) * 12.5).toFixed(1);
      rainbowBorderDisplay.textContent = `${val}% (${borderThickness}px)`;
      sendToScroller({ type: 'SET_BORDER', value: val });
    }

    rainbowBorderSlider.addEventListener('input', (e) => applyRainbowBorder(e.target.value));
    rainbowOffBtn.addEventListener('click', () => applyRainbowBorder(0));
    rainbowGlowBtn.addEventListener('click', () => applyRainbowBorder(100));

    // 6. Super Luminosità
    function applyBrightness(val) {
      photoBrightnessSlider.value = val;
      photoBrightnessDisplay.textContent = `${val}%`;
      sendToScroller({ type: 'SET_BRIGHTNESS', value: val });
    }

    photoBrightnessSlider.addEventListener('input', (e) => applyBrightness(e.target.value));
    boostGlowBtn.addEventListener('click', () => applyBrightness(200));
    resetGlowBtn.addEventListener('click', () => applyBrightness(120));

    // ========================================================
    // RADIO LIVE STREAMING & AUDIO SYNC
    // ========================================================
    const radioID = 'ylkruiq5e4fvv';
    const defaultImg = "https://xatimg.com/image/KRUeEt3n4lEa.jpg";
    let isPlaying = false;
    let isDiscoMode = false;
    let isExplosionMode = false;
    let last_song = "";

    let audioCtx, analyser, dataArray, source;
    const audio = document.getElementById("bgMusic");
    const radioCoverArt = document.getElementById("radioCoverArt");
    const musicToggleBtn = document.getElementById("musicToggleBtn");
    const musicPlayIcon = document.getElementById("musicPlayIcon");
    const musicStatusText = document.getElementById("musicStatusText");
    const eqVisualizer = document.getElementById("eqVisualizer");
    const musicVolumeSlider = document.getElementById("musicVolumeSlider");
    const musicVolumeDisplay = document.getElementById("musicVolumeDisplay");
    const muteToggleBtn = document.getElementById("muteToggleBtn");
    const volumeIcon = document.getElementById("volumeIcon");

    function renderAudioFrame() {
      requestAnimationFrame(renderAudioFrame);
      if (analyser && isPlaying) {
        analyser.getByteFrequencyData(dataArray);
        let bass = dataArray[1] || 0;
        let scale = 1 + (bass / 255) * 0.05;
        let flash = (bass > 222);
        sendToScroller({ type: 'BEAT_PULSE', scale: scale, flash: flash });
      }
    }

    function triggerSatellite(tipo) {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          analyser.fftSize = 64;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          renderAudioFrame();
        } catch (e) {}
      }

      if (tipo === 'musica') {
        if (!isPlaying) {
          audio.src = "https://stream.zeno.fm/" + radioID;
          audio.play().then(() => {
            isPlaying = true;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            updateMusicUIState(true);
          }).catch(() => {
            musicStatusText.textContent = "Clicca per avviare Audio";
            updateMusicUIState(false);
          });
        } else {
          audio.pause();
          isPlaying = false;
          updateMusicUIState(false);
          sendToScroller({ type: 'BEAT_PULSE', scale: 1, flash: false });
        }
      }

      if (tipo === 'disco') {
        isDiscoMode = !isDiscoMode;
        document.getElementById('discoToggleBtn').classList.toggle('bg-purple-600', isDiscoMode);
        sendToScroller({ type: 'TRIGGER_SATELLITE', satellite: 'disco', active: isDiscoMode, bannerText: isDiscoMode ? "🪩 MODALITÀ DISCO: ATTIVA" : "🪩 MODALITÀ DISCO: OFF" });
      }

      if (tipo === 'esplosione') {
        isExplosionMode = !isExplosionMode;
        document.getElementById('explosionToggleBtn').classList.toggle('bg-amber-600', isExplosionMode);
        sendToScroller({ type: 'TRIGGER_SATELLITE', satellite: 'esplosione', active: isExplosionMode, bannerText: isExplosionMode ? "💥 GLOW FX: ATTIVO" : "💥 GLOW FX: SPENTO" });
      }

      if (tipo === 'data') {
        const now = new Date();
        const txt = "📅 DATA: " + now.toLocaleDateString('it-IT', { weekday: 'long', day: '2-digit', month: 'long' }).toUpperCase();
        sendToScroller({ type: 'TRIGGER_SATELLITE', bannerText: txt });
      }

      if (tipo === 'ora') {
        const now = new Date();
        const txt = "⏰ ORARIO: " + now.toLocaleTimeString('it-IT');
        sendToScroller({ type: 'TRIGGER_SATELLITE', bannerText: txt });
      }

      if (tipo === 'titolo') {
        sendToScroller({ type: 'TRIGGER_SATELLITE', bannerText: "🎵 IN ONDA: " + (last_song || "ZENO FM LIVE") });
      }

      if (tipo === 'oroscopo') {
        sendToScroller({ type: 'TRIGGER_SATELLITE', bannerText: "✨ SELEZIONA LE TUE ONDE E GODITI IL SOUND" });
      }

      if (tipo === 'meteo') {
        fetch('https://ipapi.co/json/')
          .then(res => res.json())
          .then(data => {
            const city = (data.city || 'ONLINE').toUpperCase();
            sendToScroller({ type: 'TRIGGER_SATELLITE', bannerText: `🌍 METEO [${city}]: LIVE ON AIR` });
          })
          .catch(() => {
            sendToScroller({ type: 'TRIGGER_SATELLITE', bannerText: "🌍 METEO: LIVE RADIO ONLINE" });
          });
      }
    }

    async function updateMeta() {
      try {
        const r = await fetch(`https://zenoplay.zenomedia.com/api/zenofm/nowplaying/${radioID}?t=${Date.now()}`);
        const d = await r.json();
        if (d.title) {
          last_song = d.title.toUpperCase();
          musicStatusText.textContent = "🎵 IN ONDA: " + last_song;
          const it = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(last_song)}&limit=1`);
          const j = await it.json();
          const cover = j.results?.[0]?.artworkUrl100?.replace("100x100", "600x600") || defaultImg;
          radioCoverArt.src = cover;
        } else {
          radioCoverArt.src = defaultImg;
          musicStatusText.textContent = "🎵 IN ONDA: ZENO FM STREAM";
        }
      } catch (e) {
        radioCoverArt.src = defaultImg;
      }
    }
    setInterval(updateMeta, 10000);
    updateMeta();

    function updateMusicUIState(active) {
      if (active) {
        musicPlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        eqVisualizer.classList.add('music-active');
      } else {
        musicPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        eqVisualizer.classList.remove('music-active');
      }
    }

    musicToggleBtn.addEventListener('click', () => triggerSatellite('musica'));

    musicVolumeSlider.addEventListener('input', (e) => {
      const vol = parseFloat(e.target.value);
      audio.volume = vol;
      musicVolumeDisplay.textContent = `${Math.round(vol * 100)}%`;
      audio.muted = false;
      updateVolumeIcon(vol);
    });

    muteToggleBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      if (audio.muted) {
        musicVolumeDisplay.textContent = "0%";
        volumeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`;
      } else {
        musicVolumeDisplay.textContent = `${Math.round(audio.volume * 100)}%`;
        updateVolumeIcon(audio.volume);
      }
    });

    function updateVolumeIcon(vol) {
      if (vol === 0) {
        volumeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`;
      } else {
        volumeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>`;
      }
    }
  </script>
</body>
