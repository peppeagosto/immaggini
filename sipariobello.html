<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>PEPPE TEST PLAYER SFONDO - Sipario Overlay xat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Server89.com">

    <!-- Font pulito e leggibile -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           VARIABILI E RESET BASE (OVERLAY 100% TRASPARENTE PER XAT)
           ========================================================= */
        :root {
            --velvet-dark: #250107;
            --velvet-mid: #750614;
            --velvet-bright: #b60e23;
            --gold-dark: #8a6418;
            --gold-mid: #d4af37;
            --gold-light: #fff0ad;
            --curtain-speed: 2s;
            --curtain-ease: cubic-bezier(0.65, 0.02, 0.25, 1);
            --light-transition: 0.75s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Architettura identica all'esempio funzionante su iframe xat */
        html, body {
            width: 100%;
            height: 100vh;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #fdf6e3;
        }

        /* =========================================================
           CONTENITORE MASTER CENTRATO (1308x484 ADATTIVO)
           ========================================================= */
        .master-stage {
            position: relative;
            width: min(1308px, 100vw);
            height: min(484px, 100vh);
            background: transparent !important;
            overflow: hidden;
            pointer-events: none;
        }

        /* =========================================================
           AREA CENTRALE .chat (100% TRASPARENTE E NON BLOCCANTE)
           ========================================================= */
        .chat {
            position: absolute;
            width: 620px;
            height: 410px;
            max-width: 94%;
            max-height: 85%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: transparent !important;
            pointer-events: none;
            z-index: 15;
        }

        /* =========================================================
           SISTEMA LUCI: RIFLETTORI VOLUMETRICI & GLOW
           ========================================================= */
        .spotlights-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 22;
            overflow: hidden;
            opacity: 1;
            transition: opacity var(--light-transition);
        }

        .spotlight {
            position: absolute;
            top: -16%;
            width: 48%;
            height: 132%;
            mix-blend-mode: screen;
            filter: blur(18px);
            transform-origin: top center;
            opacity: 0.92;
        }

        .spotlight-left {
            left: 4%;
            background: conic-gradient(
                from 164deg at 50% 0%,
                transparent 0deg,
                rgba(255, 224, 130, 0.36) 13deg,
                rgba(255, 190, 75, 0.18) 24deg,
                transparent 36deg
            );
            animation: spotSweepLeft 9s ease-in-out infinite alternate;
        }

        .spotlight-right {
            right: 4%;
            background: conic-gradient(
                from 162deg at 50% 0%,
                transparent 0deg,
                rgba(255, 224, 130, 0.36) 14deg,
                rgba(255, 190, 75, 0.18) 25deg,
                transparent 36deg
            );
            animation: spotSweepRight 11s ease-in-out infinite alternate;
        }

        .spotlight-center {
            left: 50%;
            transform: translateX(-50%);
            width: 68%;
            background: radial-gradient(
                ellipse at 50% 0%,
                rgba(255, 240, 175, 0.38) 0%,
                rgba(255, 196, 85, 0.15) 42%,
                transparent 72%
            );
            animation: centerGlowPulse 4s ease-in-out infinite alternate;
        }

        @keyframes spotSweepLeft {
            0%   { transform: rotate(-7deg); }
            100% { transform: rotate(5deg); }
        }

        @keyframes spotSweepRight {
            0%   { transform: rotate(7deg); }
            100% { transform: rotate(-5deg); }
        }

        @keyframes centerGlowPulse {
            0%   { opacity: 0.72; }
            100% { opacity: 1; }
        }

        /* Canvas trasparente per pulviscolo e scintille dorate */
        #sparkleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            opacity: 1;
            transition: opacity var(--light-transition);
        }

        /* =========================================================
           SIPARIO IN VELLUTO (PANNELLI SINISTRO E DESTRO)
           ========================================================= */
        .curtains-container {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            overflow: hidden;
        }

        .curtain-panel {
            position: absolute;
            top: 0;
            width: 52.5%;
            height: 100%;
            pointer-events: auto;
            cursor: pointer;
            will-change: transform, filter;
            transition:
                transform var(--curtain-speed) var(--curtain-ease),
                filter var(--light-transition),
                box-shadow var(--light-transition);

            /* Pieghe verticali 3D realistiche in velluto cremisi/bordeaux */
            background-color: var(--velvet-mid);
            background-image:
                linear-gradient(180deg, rgba(16, 0, 4, 0.85) 0%, rgba(16, 0, 4, 0.16) 14%, transparent 32%, rgba(16, 0, 4, 0.38) 84%, rgba(8, 0, 2, 0.82) 100%),
                radial-gradient(ellipse at 50% 30%, rgba(255, 200, 130, 0.16) 0%, transparent 65%),
                repeating-linear-gradient(
                    90deg,
                    rgba(22, 0, 5, 0.82) 0%,
                    rgba(145, 10, 28, 0.36) 3.5%,
                    rgba(215, 34, 54, 0.44) 6.5%,
                    rgba(115, 8, 22, 0.48) 10%,
                    rgba(28, 1, 7, 0.85) 13.5%,
                    rgba(160, 16, 35, 0.38) 17.5%,
                    rgba(38, 2, 9, 0.80) 21%
                ),
                repeating-linear-gradient(
                    90deg,
                    #34020a 0px,
                    #8c091b 16px,
                    #bc142a 28px,
                    #620411 46px,
                    #220106 62px,
                    #9a0c1f 82px,
                    #34020a 100px
                );
        }

        /* Riflesso ondeggiante del velluto */
        .curtain-fabric-sway {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 225, 180, 0.05) 4%,
                transparent 8%,
                rgba(0, 0, 0, 0.16) 12%,
                transparent 16%
            );
            background-size: 200% 100%;
            animation: velvetShimmer 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes velvetShimmer {
            0%   { background-position: 0% 0%; }
            100% { background-position: 18% 0%; }
        }

        /* Pannello Sinistro */
        .curtain-left {
            left: -2%;
            transform-origin: top left;
            border-right: 3px solid rgba(250, 220, 120, 0.55);
            box-shadow:
                16px 0 38px rgba(0, 0, 0, 0.85),
                inset -18px 0 30px rgba(15, 0, 4, 0.65);
        }

        /* Pannello Destro */
        .curtain-right {
            right: -2%;
            transform-origin: top right;
            border-left: 3px solid rgba(250, 220, 120, 0.55);
            box-shadow:
                -16px 0 38px rgba(0, 0, 0, 0.85),
                inset 18px 0 30px rgba(15, 0, 4, 0.65);
        }

        /* Bordo ricamato e frangia dorata inferiore */
        .curtain-gold-trim {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 24px;
            background:
                linear-gradient(180deg,
                    rgba(255, 240, 173, 0.98) 0px,
                    rgba(212, 175, 55, 0.98) 3px,
                    #54030e 4px,
                    #54030e 7px,
                    rgba(250, 224, 140, 0.98) 8px,
                    rgba(138, 100, 24, 0.98) 11px,
                    transparent 12px
                ),
                repeating-linear-gradient(
                    90deg,
                    #d4af37 0px,
                    #fff0ad 2px,
                    #8a6418 4px,
                    rgba(30, 5, 2, 0.35) 5px,
                    #d4af37 7px
                );
            background-position: top, bottom;
            background-size: 100% 12px, 100% 12px;
            background-repeat: no-repeat;
            pointer-events: none;
            transition: filter var(--light-transition);
        }

        /* Scintillio animato sulle frange dorate in modalità Glow */
        .curtain-gold-trim::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                105deg,
                transparent 20%,
                rgba(255, 250, 220, 0.78) 50%,
                transparent 80%
            );
            background-size: 220% 100%;
            animation: goldSweep 3.8s linear infinite;
            opacity: 0.92;
            transition: opacity var(--light-transition);
        }

        @keyframes goldSweep {
            0%   { background-position: 180% 0; }
            100% { background-position: -80% 0; }
        }

        /* Cordoni e nappe dorate laterali (Embrasse) */
        .tieback {
            position: absolute;
            top: 50%;
            width: 96px;
            height: 128px;
            opacity: 0;
            pointer-events: none;
            transition:
                opacity 1s ease 0.45s,
                transform 1.3s var(--curtain-ease) 0.3s,
                filter var(--light-transition);
        }

        .curtain-left .tieback {
            right: -12px;
            transform: translateX(-20px) scale(0.85);
        }

        .curtain-right .tieback {
            left: -12px;
            transform: translateX(20px) scale(0.85) scaleX(-1);
        }

        /* =========================================================
           STATO APERTO DEL SIPARIO (LASCIA LIBERO IL CENTRO)
           ========================================================= */
        .master-stage.is-open .curtain-left {
            transform: translateX(-76%) scaleX(0.62) skewX(-5deg);
        }

        .master-stage.is-open .curtain-right {
            transform: translateX(76%) scaleX(0.62) skewX(5deg);
        }

        .master-stage.is-open .curtain-left .tieback {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        .master-stage.is-open .curtain-right .tieback {
            opacity: 1;
            transform: translateX(0) scale(1) scaleX(-1);
        }

        @media (max-width: 640px) {
            .master-stage.is-open .curtain-left {
                transform: translateX(-86%) scaleX(0.54) skewX(-3deg);
            }
            .master-stage.is-open .curtain-right {
                transform: translateX(86%) scaleX(0.54) skewX(3deg);
            }
        }

        /* =========================================================
           MANTOVANA SUPERIORE (VALANCE) + LUCI DI RIBALTA
           ========================================================= */
        .valance-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 76px;
            z-index: 40;
            pointer-events: none;
            transition: filter var(--light-transition);
        }

        @media (max-width: 640px) {
            .valance-wrapper {
                height: 58px;
            }
        }

        .valance-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Fila superiore di lampadine di ribalta dorate */
        .stage-bulbs {
            position: absolute;
            top: 6px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 3%;
            z-index: 42;
            pointer-events: none;
            transition: opacity var(--light-transition);
        }

        .stage-bulb {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #fff1a8 45%, #f59e0b 100%);
            box-shadow:
                0 0 8px 3px rgba(255, 240, 165, 0.95),
                0 0 22px 8px rgba(255, 196, 55, 0.8),
                0 0 40px 14px rgba(255, 165, 20, 0.45);
            animation: bulbPulse 2.4s ease-in-out infinite alternate;
        }

        .stage-bulb:nth-child(even) {
            animation-delay: 1.2s;
        }

        @keyframes bulbPulse {
            0%   { transform: scale(0.92); opacity: 0.82; }
            100% { transform: scale(1.18); opacity: 1; }
        }

        /* =========================================================
           STATO 1: LUCE GLOW ACCESA (DEFAULT)
           ========================================================= */
        .master-stage.lights-glow .curtain-left {
            box-shadow:
                6px 0 28px rgba(255, 208, 70, 0.6),
                14px 0 55px rgba(255, 165, 30, 0.38),
                inset -8px 0 26px rgba(255, 224, 130, 0.4);
            filter: brightness(1.14) saturate(1.14);
        }

        .master-stage.lights-glow .curtain-right {
            box-shadow:
                -6px 0 28px rgba(255, 208, 70, 0.6),
                -14px 0 55px rgba(255, 165, 30, 0.38),
                inset 8px 0 26px rgba(255, 224, 130, 0.4);
            filter: brightness(1.14) saturate(1.14);
        }

        .master-stage.lights-glow .curtain-gold-trim {
            filter:
                drop-shadow(0 0 8px rgba(255, 224, 115, 0.95))
                drop-shadow(0 -4px 18px rgba(255, 184, 40, 0.82));
        }

        .master-stage.lights-glow .tieback {
            filter:
                drop-shadow(0 0 10px rgba(255, 224, 115, 0.92))
                drop-shadow(0 4px 18px rgba(255, 175, 35, 0.68));
        }

        .master-stage.lights-glow .valance-wrapper {
            filter:
                drop-shadow(0 6px 16px rgba(255, 210, 75, 0.72))
                drop-shadow(0 14px 32px rgba(255, 165, 20, 0.48));
        }

        /* =========================================================
           STATO 2: LUCE SPENTA (TEATRO OSCURATO, CENTRO TRASPARENTE)
           ========================================================= */
        .master-stage.lights-off .spotlights-layer,
        .master-stage.lights-off #sparkleCanvas,
        .master-stage.lights-off .stage-bulbs {
            opacity: 0;
        }

        .master-stage.lights-off .curtain-panel {
            filter: brightness(0.42) contrast(1.12);
            border-color: rgba(45, 5, 10, 0.85);
            box-shadow: 0 0 28px rgba(0, 0, 0, 0.88);
        }

        .master-stage.lights-off .curtain-gold-trim {
            filter: drop-shadow(0 -2px 4px rgba(0, 0, 0, 0.8));
        }

        .master-stage.lights-off .curtain-gold-trim::after {
            opacity: 0;
        }

        .master-stage.lights-off .tieback {
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.85));
        }

        .master-stage.lights-off .valance-wrapper {
            filter: brightness(0.42) contrast(1.12) drop-shadow(0 10px 16px rgba(0, 0, 0, 0.92));
        }

        /* =========================================================
           COMANDI CLICCABILI NELLA ZONA ESATTA FUNZIONANTE SU XAT
           (top: 2px; right: 12px; z-index: 99999 - entro 270px DX)
           ========================================================= */
        .theater-controls {
            position: absolute;
            top: 2px;
            right: 12px;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: auto;
        }

        .ctrl-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 20px;
            border: 1.5px solid rgba(212, 175, 55, 0.75);
            background: rgba(14, 6, 10, 0.9);
            color: #f8eed8;
            font-family: 'Arial Black', 'Inter', Impact, sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            line-height: 1;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.75);
            transition: transform 0.16s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
        }

        .ctrl-btn:hover {
            transform: scale(1.06);
        }

        .ctrl-btn:active {
            transform: scale(0.94);
        }

        /* Triangolino CSS compatto a sinistra della scritta */
        .ctrl-tri {
            width: 0;
            height: 0;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 7px solid #d4af37;
            transition: border-left-color 0.22s ease, filter 0.22s ease, transform 0.22s ease;
        }

        /* 1) Pulsante ON (Luce Glow Oro) */
        .btn-glow-on {
            border-color: rgba(250, 204, 21, 0.8);
        }

        .btn-glow-on .ctrl-tri {
            border-left-color: #fde047;
        }

        .btn-glow-on:hover,
        .btn-glow-on.is-active {
            border-color: #fff3b0;
            background: rgba(180, 120, 10, 0.92);
            color: #ffffff;
            text-shadow: 0 0 6px #fde047;
            box-shadow:
                0 0 10px rgba(255, 224, 102, 0.95),
                0 0 18px rgba(255, 175, 25, 0.75),
                inset 0 0 6px rgba(255, 245, 190, 0.55);
        }

        .btn-glow-on.is-active .ctrl-tri {
            border-left-color: #ffffff;
            filter: drop-shadow(0 0 5px #fff3b0);
        }

        /* 2) Pulsante OFF (Spegni Luce Blu/Argento Scuro) */
        .btn-light-off {
            border-color: rgba(148, 163, 184, 0.75);
        }

        .btn-light-off .ctrl-tri {
            border-left-color: #94a3b8;
        }

        .btn-light-off:hover,
        .btn-light-off.is-active {
            border-color: #e2e8f0;
            background: rgba(24, 34, 62, 0.95);
            color: #ffffff;
            text-shadow: 0 0 6px rgba(186, 230, 253, 0.9);
            box-shadow:
                0 0 10px rgba(148, 185, 255, 0.85),
                inset 0 0 6px rgba(186, 230, 253, 0.45);
        }

        .btn-light-off.is-active .ctrl-tri {
            border-left-color: #e2e8f0;
            filter: drop-shadow(0 0 5px #bae6fd);
        }

        /* 3) Pulsante SIPARIO (Cremisi / Oro) */
        .btn-curtain {
            border-color: rgba(220, 38, 68, 0.85);
        }

        .btn-curtain .ctrl-tri {
            border-left-color: #fbbf24;
        }

        .btn-curtain:hover,
        .btn-curtain.is-active {
            border-color: #fde068;
            background: rgba(145, 12, 32, 0.95);
            color: #fff8dc;
            text-shadow: 0 0 6px rgba(255, 210, 80, 0.85);
            box-shadow:
                0 0 10px rgba(255, 190, 60, 0.8),
                0 0 16px rgba(185, 18, 42, 0.8),
                inset 0 0 6px rgba(255, 224, 130, 0.45);
        }

        .btn-curtain.is-active .ctrl-tri {
            border-left-color: #fff3b0;
            transform: rotate(90deg);
            filter: drop-shadow(0 0 5px #fde068);
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

    <!-- CONTENITORE PRINCIPALE CENTRATO 1308x484 (Luce Glow attiva di default) -->
    <main id="theaterStage" class="master-stage lights-glow" aria-label="Sipario di teatro trasparente">

        <!-- =====================================================
             COMANDI CLICCABILI IN ALTO A DESTRA (ZONA ATTIVA XAT)
             ===================================================== -->
        <div class="theater-controls" role="group" aria-label="Controlli luci e sipario">
            <button id="btnGlowOn" type="button" class="ctrl-btn btn-glow-on is-active" title="Accendi Luce Glow" aria-pressed="true">
                <span class="ctrl-tri" aria-hidden="true"></span>
                <span>ON</span>
            </button>

            <button id="btnLightOff" type="button" class="ctrl-btn btn-light-off" title="Spegni Luce Teatro" aria-pressed="false">
                <span class="ctrl-tri" aria-hidden="true"></span>
                <span>OFF</span>
            </button>

            <button id="btnToggleCurtain" type="button" class="ctrl-btn btn-curtain" title="Apri o Chiudi Sipario" aria-pressed="false">
                <span class="ctrl-tri" aria-hidden="true"></span>
                <span>SIPARIO</span>
            </button>
        </div>

        <!-- =====================================================
             AREA CENTRALE .chat (100% TRASPARENTE)
             ===================================================== -->
        <div class="chat">
            <!-- INTERNO COMPLETAMENTE TRASPARENTE PER CHAT / PLAYER -->
        </div>

        <!-- Fasci di riflettori volumetrici caldi -->
        <div class="spotlights-layer" aria-hidden="true">
            <div class="spotlight spotlight-left"></div>
            <div class="spotlight spotlight-center"></div>
            <div class="spotlight spotlight-right"></div>
        </div>

        <!-- Canvas HTML5 trasparente per pulviscolo e scintille dorate -->
        <canvas id="sparkleCanvas" aria-hidden="true"></canvas>

        <!-- =====================================================
             SIPARIO IN VELLUTO (SINISTRA E DESTRA)
             ===================================================== -->
        <div class="curtains-container">
            <!-- Tenda Sinistra -->
            <div id="curtainLeft" class="curtain-panel curtain-left" title="Clicca per aprire o chiudere il sipario">
                <div class="curtain-fabric-sway"></div>
                <div class="curtain-gold-trim"></div>

                <!-- Cordone e nappa dorata (Embrasse) -->
                <svg class="tieback" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="goldRopeGrad" x1="0" y1="0" x2="120" y2="160" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#fff0ad"/>
                            <stop offset="50%" stop-color="#d4af37"/>
                            <stop offset="100%" stop-color="#8a6418"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 22 C 48 56, 86 58, 108 38" stroke="url(#goldRopeGrad)" stroke-width="9" stroke-linecap="round"/>
                    <path d="M12 22 C 48 56, 86 58, 108 38" stroke="#5e4108" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity="0.6"/>
                    <circle cx="88" cy="52" r="9" fill="url(#goldRopeGrad)" stroke="#6e4d0c" stroke-width="1.5"/>
                    <path d="M81 61 H95 L98 76 H78 Z" fill="url(#goldRopeGrad)" stroke="#6e4d0c" stroke-width="1.2"/>
                    <path d="M78 76 L72 136 M82 76 L79 140 M86 76 L86 142 M90 76 L92 140 M94 76 L99 136 M98 76 L104 132" stroke="url(#goldRopeGrad)" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Tenda Destra -->
            <div id="curtainRight" class="curtain-panel curtain-right" title="Clicca per aprire o chiudere il sipario">
                <div class="curtain-fabric-sway"></div>
                <div class="curtain-gold-trim"></div>

                <!-- Cordone e nappa dorata (specchiato via CSS) -->
                <svg class="tieback" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 22 C 48 56, 86 58, 108 38" stroke="url(#goldRopeGrad)" stroke-width="9" stroke-linecap="round"/>
                    <path d="M12 22 C 48 56, 86 58, 108 38" stroke="#5e4108" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity="0.6"/>
                    <circle cx="88" cy="52" r="9" fill="url(#goldRopeGrad)" stroke="#6e4d0c" stroke-width="1.5"/>
                    <path d="M81 61 H95 L98 76 H78 Z" fill="url(#goldRopeGrad)" stroke="#6e4d0c" stroke-width="1.2"/>
                    <path d="M78 76 L72 136 M82 76 L79 140 M86 76 L86 142 M90 76 L92 140 M94 76 L99 136 M98 76 L104 132" stroke="url(#goldRopeGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- =========================================================
         LOGICA JAVASCRIPT (SIPARIO, 2 LUCI E SCINTILLE DORATE)
         ========================================================= -->
    <script>
        (function () {
            'use strict';

            // Blocco tasto destro globale (come da esempio xat)
            document.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });

            // Elementi DOM
            const stage = document.getElementById('theaterStage');
            const curtainLeft = document.getElementById('curtainLeft');
            const curtainRight = document.getElementById('curtainRight');
            const btnGlowOn = document.getElementById('btnGlowOn');
            const btnLightOff = document.getElementById('btnLightOff');
            const btnToggleCurtain = document.getElementById('btnToggleCurtain');
            const canvas = document.getElementById('sparkleCanvas');

            // Stati iniziali
            let isCurtainOpen = false;
            let isGlowActive = true;
            let autoOpenTimer = null;

            /**
             * Aggiorna lo stato aperto/chiuso del sipario.
             * @param {boolean} open - True per aprire, False per chiudere.
             */
            function setCurtainState(open) {
                isCurtainOpen = open;
                stage.classList.toggle('is-open', isCurtainOpen);
                btnToggleCurtain.classList.toggle('is-active', isCurtainOpen);
                btnToggleCurtain.setAttribute('aria-pressed', String(isCurtainOpen));
            }

            /**
             * Alterna apertura/chiusura del sipario.
             */
            function toggleCurtain() {
                if (autoOpenTimer) {
                    clearTimeout(autoOpenTimer);
                    autoOpenTimer = null;
                }
                setCurtainState(!isCurtainOpen);
            }

            /**
             * Imposta il sistema a 2 luci: Glow ON oppure Spegni Luce OFF.
             * @param {boolean} glowOn - True per luce Glow forte, False per teatro oscurato.
             */
            function setLightMode(glowOn) {
                isGlowActive = glowOn;
                stage.classList.toggle('lights-glow', glowOn);
                stage.classList.toggle('lights-off', !glowOn);

                btnGlowOn.classList.toggle('is-active', glowOn);
                btnGlowOn.setAttribute('aria-pressed', String(glowOn));

                btnLightOff.classList.toggle('is-active', !glowOn);
                btnLightOff.setAttribute('aria-pressed', String(!glowOn));
            }

            // Eventi click sui 3 pulsanti nativi con stopPropagation
            btnGlowOn.addEventListener('click', function (e) {
                e.stopPropagation();
                setLightMode(true);
            });

            btnLightOff.addEventListener('click', function (e) {
                e.stopPropagation();
                setLightMode(false);
            });

            btnToggleCurtain.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleCurtain();
            });

            // Click diretto sulle tende laterali
            curtainLeft.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleCurtain();
            });

            curtainRight.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleCurtain();
            });

            // Apertura automatica del sipario dopo 0.8 secondi
            autoOpenTimer = setTimeout(function () {
                setCurtainState(true);
                autoOpenTimer = null;
            }, 800);

            // =====================================================
            // ANIMAZIONE CANVAS: PULVISCOLO E SCINTILLE DORATE
            // =====================================================
            let ctx = null;
            try {
                ctx = canvas.getContext('2d');
            } catch (err) {
                ctx = null;
            }

            if (ctx) {
                let width = 0;
                let height = 0;
                const particles = [];
                const PARTICLE_COUNT = 55;

                function resizeCanvas() {
                    const rect = stage.getBoundingClientRect();
                    width = canvas.width = Math.max(1, Math.floor(rect.width));
                    height = canvas.height = Math.max(1, Math.floor(rect.height));
                }

                function createParticle(randomY) {
                    const isStar = Math.random() < 0.35;
                    return {
                        x: Math.random() * width,
                        y: randomY ? Math.random() * height : height + 10,
                        radius: isStar ? Math.random() * 2.2 + 1.2 : Math.random() * 1.6 + 0.6,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: -(Math.random() * 0.45 + 0.15),
                        alpha: Math.random() * 0.65 + 0.25,
                        phase: Math.random() * Math.PI * 2,
                        twinkleSpeed: Math.random() * 0.045 + 0.015,
                        isStar: isStar
                    };
                }

                function initParticles() {
                    particles.length = 0;
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        particles.push(createParticle(true));
                    }
                }

                function drawSparkles() {
                    ctx.clearRect(0, 0, width, height);

                    if (isGlowActive) {
                        for (let i = 0; i < particles.length; i++) {
                            const p = particles[i];
                            p.x += p.vx + Math.sin(p.phase * 0.5) * 0.15;
                            p.y += p.vy;
                            p.phase += p.twinkleSpeed;

                            if (p.y < -12 || p.x < -12 || p.x > width + 12) {
                                particles[i] = createParticle(false);
                                continue;
                            }

                            const twinkle = 0.45 + 0.55 * Math.sin(p.phase);
                            const currentAlpha = p.alpha * twinkle;

                            ctx.save();
                            ctx.globalAlpha = currentAlpha;

                            if (p.isStar) {
                                // Piccola scintilla a croce dorata
                                const s = p.radius * 2.4;
                                ctx.strokeStyle = '#fff3b0';
                                ctx.shadowColor = '#fbbf24';
                                ctx.shadowBlur = 10;
                                ctx.lineWidth = 1.1;
                                ctx.beginPath();
                                ctx.moveTo(p.x - s, p.y);
                                ctx.lineTo(p.x + s, p.y);
                                ctx.moveTo(p.x, p.y - s);
                                ctx.lineTo(p.x, p.y + s);
                                ctx.stroke();
                            }

                            ctx.fillStyle = '#ffe896';
                            ctx.shadowColor = '#f59e0b';
                            ctx.shadowBlur = 8;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }
                    }

                    requestAnimationFrame(drawSparkles);
                }

                window.addEventListener('resize', resizeCanvas);
                window.addEventListener('load', function () {
                    resizeCanvas();
                    initParticles();
                    requestAnimationFrame(drawSparkles);
                });

                // Avvio immediato nel caso il DOM sia già pronto
                resizeCanvas();
                initParticles();
            }
        })();
    </script>
