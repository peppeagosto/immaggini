<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>PEPPE TEST PLAYER SFONDO - Sipario Overlay xat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Server89.com">

    <style>
        /* =========================================================
           VARIABILI E RESET BASE (OVERLAY 100% TRASPARENTE PER XAT)
           ========================================================= */
        :root {
            --velvet-deep: #580410;
            --velvet-mid: #a60c20;
            --velvet-bright: #dc1c34;
            --velvet-specular: #ff5c6c;
            --gold-dark: #9c6e14;
            --gold-mid: #e6be42;
            --gold-light: #fff4bc;
            --curtain-speed: 2.1s;
            --curtain-ease: cubic-bezier(0.62, 0.04, 0.24, 1);
            --light-transition: 0.7s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Architettura identica all'esempio funzionante su iframe xat */
        html, body {
            width: 100%;
            height: 100vh;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #fdf6e3;
        }

        /* =========================================================
           CONTENITORE MASTER CENTRATO (1308x484 ADATTIVO)
           ========================================================= */
        .master-stage {
            position: relative;
            width: min(1308px, 100vw);
            height: min(484px, 100vh);
            background: transparent !important;
            overflow: hidden;
            pointer-events: none;
        }

        /* =========================================================
           AREA CENTRALE .chat (100% TRASPARENTE E NON BLOCCANTE)
           ========================================================= */
        .chat {
            position: absolute;
            width: 620px;
            height: 410px;
            max-width: 94%;
            max-height: 85%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: transparent !important;
            pointer-events: none;
            z-index: 15;
        }

        /* =========================================================
           SISTEMA LUCI: RIFLETTORI VOLUMETRICI & GLOW
           ========================================================= */
        .spotlights-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 22;
            overflow: hidden;
            opacity: 1;
            transition: opacity var(--light-transition);
        }

        .spotlight {
            position: absolute;
            top: -16%;
            width: 48%;
            height: 132%;
            mix-blend-mode: screen;
            filter: blur(18px);
            transform-origin: top center;
            opacity: 0.92;
        }

        .spotlight-left {
            left: 2%;
            background: conic-gradient(
                from 164deg at 50% 0%,
                transparent 0deg,
                rgba(255, 232, 145, 0.46) 13deg,
                rgba(255, 198, 82, 0.24) 24deg,
                transparent 38deg
            );
            animation: spotSweepLeft 8.5s ease-in-out infinite alternate;
        }

        .spotlight-right {
            right: 2%;
            background: conic-gradient(
                from 162deg at 50% 0%,
                transparent 0deg,
                rgba(255, 232, 145, 0.46) 14deg,
                rgba(255, 198, 82, 0.24) 25deg,
                transparent 38deg
            );
            animation: spotSweepRight 10.5s ease-in-out infinite alternate;
        }

        .spotlight-center {
            left: 50%;
            transform: translateX(-50%);
            width: 74%;
            background: radial-gradient(
                ellipse at 50% 0%,
                rgba(255, 245, 190, 0.48) 0%,
                rgba(255, 204, 92, 0.2) 44%,
                transparent 74%
            );
            animation: centerGlowPulse 3.8s ease-in-out infinite alternate;
        }

        .spotlight-right {
            right: 4%;
            background: conic-gradient(
                from 162deg at 50% 0%,
                transparent 0deg,
                rgba(255, 224, 130, 0.36) 14deg,
                rgba(255, 190, 75, 0.18) 25deg,
                transparent 36deg
            );
            animation: spotSweepRight 11s ease-in-out infinite alternate;
        }

        .spotlight-center {
            left: 50%;
            transform: translateX(-50%);
            width: 68%;
            background: radial-gradient(
                ellipse at 50% 0%,
                rgba(255, 240, 175, 0.38) 0%,
                rgba(255, 196, 85, 0.15) 42%,
                transparent 72%
            );
            animation: centerGlowPulse 4s ease-in-out infinite alternate;
        }

        @keyframes spotSweepLeft {
            0%   { transform: rotate(-7deg); }
            100% { transform: rotate(5deg); }
        }

        @keyframes spotSweepRight {
            0%   { transform: rotate(7deg); }
            100% { transform: rotate(-5deg); }
        }

        @keyframes centerGlowPulse {
            0%   { opacity: 0.72; }
            100% { opacity: 1; }
        }

        /* Canvas trasparente per pulviscolo e scintille dorate */
        #sparkleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            opacity: 1;
            transition: opacity var(--light-transition);
        }

        /* =========================================================
           SIPARIO IN VELLUTO (PANNELLI SINISTRO E DESTRO)
           ========================================================= */
        .curtains-container {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            overflow: hidden;
        }

        .curtain-panel {
            position: absolute;
            top: 0;
            width: 52.5%;
            height: 100%;
            pointer-events: none;
            will-change: transform, filter, border-radius;
            overflow: visible;
            transition:
                transform var(--curtain-speed) var(--curtain-ease),
                border-radius var(--curtain-speed) var(--curtain-ease),
                filter var(--light-transition),
                box-shadow var(--light-transition);

            /* Velluto rosso teatrale luminoso con pieghe 3D profonde e luci speculari cangianti */
            background-color: var(--velvet-mid);
            background-image:
                /* Luce dall'alto e morbida profondità in basso (mai nero pesto) */
                linear-gradient(
                    180deg,
                    rgba(58, 4, 12, 0.55) 0%,
                    rgba(255, 185, 145, 0.14) 16%,
                    rgba(255, 215, 175, 0.12) 44%,
                    rgba(75, 5, 14, 0.22) 82%,
                    rgba(48, 3, 10, 0.58) 100%
                ),
                /* Alone caldo centrale tipico del velluto illuminato */
                radial-gradient(
                    ellipse at 50% 34%,
                    rgba(255, 224, 170, 0.26) 0%,
                    rgba(230, 38, 62, 0.12) 48%,
                    transparent 76%
                ),
                /* Micro-trama tessile da velluto */
                repeating-linear-gradient(
                    135deg,
                    rgba(255, 235, 220, 0.035) 0px,
                    rgba(255, 235, 220, 0.035) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                /* Pieghe principali ad alto contrasto satinato (creste luminose + incavi rubino) */
                repeating-linear-gradient(
                    90deg,
                    #5c0411 0%,
                    #9e0c20 2.6%,
                    #d91c34 5.2%,
                    #f24358 6.8%,
                    #c2142b 8.8%,
                    #6b0514 11.8%,
                    #b00f25 14.8%,
                    #e62840 17.2%,
                    #8a081a 19.6%,
                    #5c0411 21.5%
                ),
                /* Sotto-pieghe secondarie per spessore organico del tessuto */
                repeating-linear-gradient(
                    90deg,
                    rgba(70, 4, 14, 0.45) 0px,
                    rgba(255, 120, 130, 0.22) 18px,
                    rgba(185, 18, 38, 0.35) 36px,
                    rgba(62, 3, 12, 0.45) 56px,
                    rgba(240, 60, 82, 0.25) 74px,
                    rgba(70, 4, 14, 0.45) 94px
                );
        }

        /* Effetto tenda viva: respiro ondulato delle pieghe e riflesso cangiante del velluto */
        .curtain-fabric-sway {
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(255, 238, 200, 0.14) 3.5%,
                    rgba(255, 255, 255, 0.07) 5%,
                    transparent 8.5%,
                    rgba(45, 2, 10, 0.18) 12%,
                    transparent 16%
                ),
                linear-gradient(
                    180deg,
                    rgba(255, 220, 150, 0.16) 0%,
                    transparent 38%,
                    rgba(255, 190, 120, 0.08) 70%,
                    transparent 100%
                );
            background-size: 165% 100%, 100% 100%;
            animation: velvetBreathe 6.5s ease-in-out infinite alternate;
            pointer-events: none;
            transition: transform var(--curtain-speed) var(--curtain-ease);
        }

        @keyframes velvetBreathe {
            0% {
                background-position: 0% 0%, 0% 0%;
                transform: skewX(0deg) scaleX(1);
            }
            50% {
                background-position: 10% 0%, 0% 0%;
                transform: skewX(0.45deg) scaleX(1.008);
            }
            100% {
                background-position: 20% 0%, 0% 0%;
                transform: skewX(-0.35deg) scaleX(0.996);
            }
        }

        /* Ombra radiale di raccolta attorno al cordone embrasse (visibile all'apertura) */
        .curtain-pinch-fold {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.3s ease 0.25s;
        }

        .curtain-left .curtain-pinch-fold {
            background:
                radial-gradient(ellipse 65% 24% at 96% 56%, rgba(55, 3, 10, 0.55) 0%, transparent 72%),
                linear-gradient(125deg, rgba(255, 225, 175, 0.18) 0%, transparent 45%, rgba(65, 4, 14, 0.28) 100%);
        }

        .curtain-right .curtain-pinch-fold {
            background:
                radial-gradient(ellipse 65% 24% at 4% 56%, rgba(55, 3, 10, 0.55) 0%, transparent 72%),
                linear-gradient(235deg, rgba(255, 225, 175, 0.18) 0%, transparent 45%, rgba(65, 4, 14, 0.28) 100%);
        }

        /* Pannello Sinistro */
        .curtain-left {
            left: -2%;
            transform-origin: top left;
            border-right: 4px solid rgba(255, 226, 128, 0.85);
            box-shadow:
                10px 0 28px rgba(45, 2, 10, 0.6),
                inset -14px 0 24px rgba(85, 6, 18, 0.45);
        }

        /* Pannello Destro */
        .curtain-right {
            right: -2%;
            transform-origin: top right;
            border-left: 4px solid rgba(255, 226, 128, 0.85);
            box-shadow:
                -10px 0 28px rgba(45, 2, 10, 0.6),
                inset 14px 0 24px rgba(85, 6, 18, 0.45);
        }

        /* Bordo inferiore con passamaneria ricamata e vera frangia dorata a fili */
        .curtain-gold-trim {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 28px;
            background:
                /* Passamaneria superiore a doppia treccia dorata */
                linear-gradient(180deg,
                    rgba(255, 246, 195, 1) 0px,
                    rgba(235, 192, 62, 1) 3px,
                    #7a0818 4px,
                    #7a0818 7px,
                    rgba(255, 232, 145, 1) 8px,
                    rgba(182, 132, 28, 1) 12px,
                    transparent 13px
                ),
                /* Fili verticali della frangia dorata */
                repeating-linear-gradient(
                    90deg,
                    #e6be42 0px,
                    #fff4bc 1.5px,
                    #b8861d 3px,
                    rgba(55, 8, 10, 0.28) 4.2px,
                    #f2ce5c 5.5px
                );
            background-position: top, bottom;
            background-size: 100% 13px, 100% 15px;
            background-repeat: no-repeat;
            pointer-events: none;
            transition: filter var(--light-transition);
        }

        /* Scintillio metallico scorrevole sulle frange dorate */
        .curtain-gold-trim::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                105deg,
                transparent 18%,
                rgba(255, 252, 230, 0.85) 50%,
                transparent 82%
            );
            background-size: 220% 100%;
            animation: goldSweep 3.4s linear infinite;
            opacity: 0.95;
            transition: opacity var(--light-transition);
        }

        @keyframes goldSweep {
            0%   { background-position: 180% 0; }
            100% { background-position: -80% 0; }
        }

        /* Cordoni intrecciati e nappe dorate laterali (Embrasse) con leggero dondolio */
        .tieback {
            position: absolute;
            top: 48%;
            width: 102px;
            height: 136px;
            opacity: 0;
            pointer-events: none;
            transform-origin: top center;
            transition:
                opacity 1s ease 0.45s,
                transform 1.3s var(--curtain-ease) 0.3s,
                filter var(--light-transition);
        }

        .curtain-left .tieback {
            right: -14px;
            transform: translateX(-22px) scale(0.84);
        }

        .curtain-right .tieback {
            left: -14px;
            transform: translateX(22px) scale(0.84) scaleX(-1);
        }

        .tieback-tassel {
            transform-origin: 88px 52px;
            animation: tasselSway 4.2s ease-in-out infinite alternate;
        }

        @keyframes tasselSway {
            0%   { transform: rotate(-3.2deg); }
            100% { transform: rotate(3.2deg); }
        }

        /* =========================================================
           STATO APERTO DEL SIPARIO (DRAPPEGGIO RACCOLTO AI LATI)
           ========================================================= */
        .master-stage.is-open .curtain-left {
            transform: translateX(-75%) scaleX(0.58) skewX(-6.5deg);
            border-bottom-right-radius: 90px 180px;
        }

        .master-stage.is-open .curtain-right {
            transform: translateX(75%) scaleX(0.58) skewX(6.5deg);
            border-bottom-left-radius: 90px 180px;
        }

        .master-stage.is-open .curtain-pinch-fold {
            opacity: 1;
        }

        .master-stage.is-open .curtain-left .tieback {
            opacity: 1;
            transform: translateX(4px) scale(1.02);
        }

        .master-stage.is-open .curtain-right .tieback {
            opacity: 1;
            transform: translateX(-4px) scale(1.02) scaleX(-1);
        }

        @media (max-width: 640px) {
            .master-stage.is-open .curtain-left {
                transform: translateX(-85%) scaleX(0.5) skewX(-4deg);
                border-bottom-right-radius: 50px 120px;
            }
            .master-stage.is-open .curtain-right {
                transform: translateX(85%) scaleX(0.5) skewX(4deg);
                border-bottom-left-radius: 50px 120px;
            }
        }

        /* =========================================================
           MANTOVANA SUPERIORE (VALANCE) + LUCI DI RIBALTA
           ========================================================= */
        .valance-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 82px;
            z-index: 40;
            pointer-events: none;
            transition: filter var(--light-transition);
        }

        @media (max-width: 640px) {
            .valance-wrapper {
                height: 62px;
            }
        }

        /* =========================================================
           MANTOVANA SUPERIORE (VALANCE) + LUCI DI RIBALTA
           ========================================================= */
        .valance-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 76px;
            z-index: 40;
            pointer-events: none;
            transition: filter var(--light-transition);
        }

        @media (max-width: 640px) {
            .valance-wrapper {
                height: 58px;
            }
        }

        .valance-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Fila superiore di lampadine di ribalta dorate */
        .stage-bulbs {
            position: absolute;
            top: 6px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 3%;
            z-index: 42;
            pointer-events: none;
            transition: opacity var(--light-transition);
        }

        .stage-bulb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #fff6be 45%, #f59e0b 100%);
            box-shadow:
                0 0 10px 4px rgba(255, 245, 180, 0.98),
                0 0 26px 10px rgba(255, 200, 60, 0.88),
                0 0 46px 16px rgba(255, 165, 25, 0.55);
            animation: bulbPulse 2.2s ease-in-out infinite alternate;
        }

        .stage-bulb:nth-child(even) {
            animation-delay: 1.2s;
        }

        @keyframes bulbPulse {
            0%   { transform: scale(0.92); opacity: 0.82; }
            100% { transform: scale(1.18); opacity: 1; }
        }

        /* =========================================================
           STATO 1: LUCE GLOW ACCESA (PLAY - LUMINOSITÀ ESPLOSIVA)
           ========================================================= */
        .master-stage.lights-glow .curtain-left {
            border-right-color: #fff3b0;
            box-shadow:
                8px 0 32px rgba(255, 218, 88, 0.72),
                18px 0 64px rgba(255, 172, 36, 0.48),
                inset -10px 0 30px rgba(255, 232, 150, 0.5);
            filter: brightness(1.22) saturate(1.18) contrast(1.04);
        }

        .master-stage.lights-glow .curtain-right {
            border-left-color: #fff3b0;
            box-shadow:
                -8px 0 32px rgba(255, 218, 88, 0.72),
                -18px 0 64px rgba(255, 172, 36, 0.48),
                inset 10px 0 30px rgba(255, 232, 150, 0.5);
            filter: brightness(1.22) saturate(1.18) contrast(1.04);
        }

        .master-stage.lights-glow .curtain-gold-trim {
            filter:
                drop-shadow(0 0 10px rgba(255, 232, 130, 1))
                drop-shadow(0 -5px 22px rgba(255, 190, 48, 0.9));
        }

        .master-stage.lights-glow .tieback {
            filter:
                drop-shadow(0 0 12px rgba(255, 232, 130, 0.98))
                drop-shadow(0 4px 20px rgba(255, 180, 40, 0.75));
        }

        .master-stage.lights-glow .valance-wrapper {
            filter:
                brightness(1.18)
                saturate(1.15)
                drop-shadow(0 6px 18px rgba(255, 218, 85, 0.8))
                drop-shadow(0 16px 36px rgba(255, 170, 28, 0.56));
        }

        /* =========================================================
           STATO 2: OFF (CHIUSO MA LUMINOSO - LUCE MORBIDA DI SALA)
           ========================================================= */
        .master-stage.lights-off .spotlights-layer,
        .master-stage.lights-off #sparkleCanvas,
        .master-stage.lights-off .stage-bulbs {
            opacity: 0;
        }

        .master-stage.lights-off .curtain-panel {
            /* Rosso velluto ricco e ben visibile, mai buio pesto */
            filter: brightness(0.92) saturate(1.06) contrast(1.03);
            border-color: rgba(235, 194, 78, 0.72);
            box-shadow: 0 0 22px rgba(45, 4, 12, 0.58);
        }

        .master-stage.lights-off .curtain-gold-trim {
            filter: drop-shadow(0 -2px 6px rgba(180, 125, 20, 0.45));
        }

        .master-stage.lights-off .curtain-gold-trim::after {
            opacity: 0.35;
        }

        .master-stage.lights-off .tieback {
            filter: drop-shadow(0 4px 8px rgba(40, 4, 10, 0.6));
        }

        .master-stage.lights-off .valance-wrapper {
            filter: brightness(0.92) saturate(1.06) drop-shadow(0 8px 14px rgba(45, 4, 10, 0.65));
        }

        /* =========================================================
           COMANDI CLICCABILI NELLA ZONA ESATTA FUNZIONANTE SU XAT
           (top: 2px; right: 12px; z-index: 99999 - entro 270px DX)
           ========================================================= */
        .theater-controls {
            position: absolute;
            top: 2px;
            right: 12px;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: auto;
        }

        .ctrl-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1.5px solid rgba(230, 190, 66, 0.8);
            background: rgba(22, 6, 12, 0.9);
            color: #fff6e0;
            font-family: 'Arial Black', 'Inter', Impact, sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            line-height: 1;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.65);
            transition: transform 0.16s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
        }

        .ctrl-btn:hover {
            transform: scale(1.06);
        }

        .ctrl-btn:active {
            transform: scale(0.94);
        }

        /* Triangolino CSS compatto a sinistra della scritta PLAY */
        .ctrl-tri {
            width: 0;
            height: 0;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 7px solid #fde047;
            transition: border-left-color 0.22s ease, filter 0.22s ease, transform 0.22s ease;
        }

        /* 1) Pulsante PLAY (Luce Glow Oro + Apri Sipario) */
        .btn-play {
            border-color: rgba(250, 204, 21, 0.85);
        }

        .btn-play .ctrl-tri {
            border-left-color: #fde047;
            filter: drop-shadow(0 0 4px rgba(253, 224, 71, 0.85));
        }

        .btn-play:hover,
        .btn-play.is-active {
            border-color: #fff3b0;
            background: rgba(185, 124, 12, 0.95);
            color: #ffffff;
            text-shadow: 0 0 6px #fde047;
            box-shadow:
                0 0 10px rgba(255, 224, 102, 0.95),
                0 0 18px rgba(255, 175, 25, 0.78),
                inset 0 0 6px rgba(255, 245, 190, 0.55);
        }

        .btn-play.is-active .ctrl-tri {
            border-left-color: #ffffff;
            filter: drop-shadow(0 0 6px #fff3b0);
        }

        /* 2) Pulsante OFF (Chiudi Sipario + Spegni Riflettori Glow) */
        .btn-off {
            border-color: rgba(185, 45, 65, 0.85);
            background: rgba(24, 10, 16, 0.92);
            color: #e2e8f0;
        }

        .btn-off:hover,
        .btn-off.is-active {
            border-color: #e2e8f0;
            background: linear-gradient(135deg, rgba(110, 16, 32, 0.96), rgba(32, 28, 46, 0.96));
            color: #ffffff;
            text-shadow: 0 0 6px rgba(226, 232, 240, 0.85);
            box-shadow:
                0 0 10px rgba(203, 213, 225, 0.75),
                0 0 16px rgba(175, 28, 48, 0.65),
                inset 0 0 6px rgba(226, 232, 240, 0.35);
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

    <!-- CONTENITORE PRINCIPALE CENTRATO 1308x484 (Parte CHIUSO e a LUCI SPENTE) -->
    <main id="theaterStage" class="master-stage lights-off" aria-label="Sipario di teatro trasparente">

        <!-- =====================================================
             COMANDI CLICCABILI IN ALTO A DESTRA (ZONA ATTIVA XAT)
             ===================================================== -->
        <div class="theater-controls" role="group" aria-label="Controlli sipario e luci">
            <button id="btnPlay" type="button" class="ctrl-btn btn-play" title="Accendi luci Glow e apri il sipario" aria-pressed="false">
                <span class="ctrl-tri" aria-hidden="true"></span>
                <span>PLAY</span>
            </button>

            <button id="btnOff" type="button" class="ctrl-btn btn-off is-active" title="Chiudi il sipario e spegni le luci" aria-pressed="true">
                <span>OFF</span>
            </button>

    <!-- =========================================================
         LOGICA JAVASCRIPT (SIPARIO, 2 LUCI E SCINTILLE DORATE)
         ========================================================= -->
    <script>
        (function () {
            'use strict';

            // Blocco tasto destro globale (come da esempio xat)
            document.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });

            // Elementi DOM
            const stage = document.getElementById('theaterStage');
            const btnPlay = document.getElementById('btnPlay');
            const btnOff = document.getElementById('btnOff');
            const canvas = document.getElementById('sparkleCanvas');

            // Stato iniziale: sipario CHIUSO e luci SPENTE
            let isTheaterActive = false;

            /**
             * Imposta lo stato sincronizzato del teatro (luci + sipario).
             * @param {boolean} active - True: accende luci Glow e apre il sipario; False: chiude il sipario e spegne le luci.
             */
            function setTheaterState(active) {
                isTheaterActive = active;

                // Aggiorna classi di illuminazione e apertura sipario
                stage.classList.toggle('lights-glow', active);
                stage.classList.toggle('lights-off', !active);
                stage.classList.toggle('is-open', active);

                // Evidenziazione visiva del pulsante attivo
                btnPlay.classList.toggle('is-active', active);
                btnPlay.setAttribute('aria-pressed', String(active));

                btnOff.classList.toggle('is-active', !active);
                btnOff.setAttribute('aria-pressed', String(!active));
            }

            // Click su PLAY: accende subito le luci Glow e apre il sipario
            btnPlay.addEventListener('click', function (e) {
                e.stopPropagation();
                setTheaterState(true);
            });

            // Click su OFF: chiude il sipario e spegne le luci
            btnOff.addEventListener('click', function (e) {
                e.stopPropagation();
                setTheaterState(false);
            });

            // =====================================================
            // ANIMAZIONE CANVAS: PULVISCOLO E SCINTILLE DORATE
            // =====================================================
            let ctx = null;
            try {
                ctx = canvas.getContext('2d');
            } catch (err) {
                ctx = null;
            }

            if (ctx) {
                let width = 0;
                let height = 0;
                let loopStarted = false;
                const particles = [];
                const PARTICLE_COUNT = 55;

                function resizeCanvas() {
                    const rect = stage.getBoundingClientRect();
                    width = canvas.width = Math.max(1, Math.floor(rect.width));
                    height = canvas.height = Math.max(1, Math.floor(rect.height));
                }

                function createParticle(randomY) {
                    const isStar = Math.random() < 0.35;
                    return {
                        x: Math.random() * width,
                        y: randomY ? Math.random() * height : height + 10,
                        radius: isStar ? Math.random() * 2.2 + 1.2 : Math.random() * 1.6 + 0.6,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: -(Math.random() * 0.45 + 0.15),
                        alpha: Math.random() * 0.65 + 0.25,
                        phase: Math.random() * Math.PI * 2,
                        twinkleSpeed: Math.random() * 0.045 + 0.015,
                        isStar: isStar
                    };
                }

                function initParticles() {
                    particles.length = 0;
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        particles.push(createParticle(true));
                    }
                }

                function drawSparkles() {
                    ctx.clearRect(0, 0, width, height);

                    if (isTheaterActive) {
                        for (let i = 0; i < particles.length; i++) {
                            const p = particles[i];
                            p.x += p.vx + Math.sin(p.phase * 0.5) * 0.15;
                            p.y += p.vy;
                            p.phase += p.twinkleSpeed;

                            if (p.y < -12 || p.x < -12 || p.x > width + 12) {
                                particles[i] = createParticle(false);
                                continue;
                            }

                            const twinkle = 0.45 + 0.55 * Math.sin(p.phase);
                            const currentAlpha = p.alpha * twinkle;

                            ctx.save();
                            ctx.globalAlpha = currentAlpha;

                            if (p.isStar) {
                                // Piccola scintilla a croce dorata
                                const s = p.radius * 2.4;
                                ctx.strokeStyle = '#fff3b0';
                                ctx.shadowColor = '#fbbf24';
                                ctx.shadowBlur = 10;
                                ctx.lineWidth = 1.1;
                                ctx.beginPath();
                                ctx.moveTo(p.x - s, p.y);
                                ctx.lineTo(p.x + s, p.y);
                                ctx.moveTo(p.x, p.y - s);
                                ctx.lineTo(p.x, p.y + s);
                                ctx.stroke();
                            }

                            ctx.fillStyle = '#ffe896';
                            ctx.shadowColor = '#f59e0b';
                            ctx.shadowBlur = 8;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }
                    }

                    requestAnimationFrame(drawSparkles);
                }

                window.addEventListener('resize', resizeCanvas);
                window.addEventListener('load', function () {
                    resizeCanvas();
                    initParticles();
                    if (!loopStarted) {
                        loopStarted = true;
                        requestAnimationFrame(drawSparkles);
                    }
                });
            }
        })();
    </script>
