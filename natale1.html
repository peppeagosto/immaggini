<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITALIA_GHOST - BUONE FESTE</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #141229 0%, #06060d 65%, #000000 100%);
    font-family: 'Arial Black', Impact, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-user-drag: none;
}

/* Canvas Neve Luminosa e Polvere di Stelle (sfondo) */
#snow-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
}

/* Canvas Scie Luminose Arcobaleno del Puntatore (in primo piano) */
#trail-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10000;
}

/* Contenitore Testo 3D Luminoso */
.stage-3d {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    perspective: 900px;
    z-index: 50;
    pointer-events: none;
    text-align: center;
    width: 60%;
}

.text-3d {
    font-size: clamp(38px, 6vw, 96px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 5px;
    color: #ffffff;
    display: inline-block;
    transform-style: preserve-3d;
    animation: float3D 4.5s ease-in-out infinite, neonCycle 6s linear infinite;
    text-shadow:
        0 1px 0 #d6e9ff,
        0 2px 0 #a8d4ff,
        0 3px 0 #79beff,
        0 4px 0 #4aa8ff,
        0 5px 0 #1e90ff,
        0 6px 0 #0066cc,
        0 7px 0 #004999,
        0 8px 0 #002e66,
        0 10px 18px rgba(0, 0, 0, 0.85),
        0 0 18px rgba(0, 212, 255, 0.95),
        0 0 40px rgba(0, 170, 255, 0.85),
        0 0 80px rgba(140, 0, 255, 0.75);
}

@keyframes float3D {
    0%, 100% {
        transform: rotateX(12deg) rotateY(-12deg) translateY(0px) scale(1);
    }
    50% {
        transform: rotateX(-8deg) rotateY(12deg) translateY(-12px) scale(1.04);
    }
}

@keyframes neonCycle {
    0%   { filter: hue-rotate(0deg) brightness(1.05); }
    50%  { filter: hue-rotate(180deg) brightness(1.2); }
    100% { filter: hue-rotate(360deg) brightness(1.05); }
}

/* Box Video Destra e Sinistra con bordo 6px arcobaleno + glow */
.video-box {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 20px;
    z-index: 9999;
    pointer-events: none;
}

.video-left { left: 12px; }
.video-right { right: 12px; }

/* Glow esterno sfumato arcobaleno */
.video-box::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 24px;
    background: linear-gradient(
        45deg,
        #ff0000, #ff7300, #fffb00, #48ff00,
        #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000
    );
    background-size: 300% 300%;
    animation: rainbowFlow 4s linear infinite;
    filter: blur(18px);
    opacity: 0.9;
    z-index: 1;
}

/* Bordo netto da 6px sfumato arcobaleno */
.video-box::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(
        45deg,
        #ff0000, #ff7300, #fffb00, #48ff00,
        #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000
    );
    background-size: 300% 300%;
    animation: rainbowFlow 4s linear infinite;
    z-index: 2;
}

/* Contenitore interno del video (lascia esattamente 6px di bordo) */
.video-inner {
    position: absolute;
    inset: 6px;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    z-index: 3;
}

.video-inner video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
}

@keyframes rainbowFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Barra Marquee Scorrevole in Basso */
.marquee-bar {
    position: fixed;
    bottom: 8px;
    left: 0;
    width: 100%;
    height: 36px;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(10,10,25,0.72) 15%, rgba(10,10,25,0.72) 85%, rgba(0,0,0,0) 100%);
    border-top: 1px solid rgba(255, 255, 255, 0.14);
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    z-index: 9998;
    pointer-events: none;
}

.marquee-track {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%;
    animation: marqueeScroll 18s linear infinite;
}

.marquee-text {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffffff, #ffd700, #00ffd5, #ff00c8, #ffd700, #ffffff);
    background-size: 250% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowFlow 5s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.65));
}

@keyframes marqueeScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}
</style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

<canvas id="snow-canvas"></canvas>
<canvas id="trail-canvas"></canvas>

<div class="stage-3d">
    <div class="text-3d">BUONE FESTE</div>
</div>

<div class="video-box video-left">
    <div class="video-inner">
        <video src="https://i.imgur.com/RvT2bRh.mp4" autoplay loop muted playsinline disablePictureInPicture controlsList="nodownload"></video>
    </div>
</div>

<div class="video-box video-right">
    <div class="video-inner">
        <video src="https://i.imgur.com/RvT2bRh.mp4" autoplay loop muted playsinline disablePictureInPicture controlsList="nodownload"></video>
    </div>
</div>

<div class="marquee-bar">
    <div class="marquee-track">
        <span class="marquee-text">★ BENVENUTI E BUON ASCOLTO E BUONE FESTE A TUTTI ★</span>
    </div>
</div>

<script>
/* --- PROTEZIONE ANTI-COPIA BASE --- */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (
        e.key === 'F12' ||
        (e.ctrlKey && ['u', 's', 'c', 'a', 'p'].includes(key)) ||
        (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(key))
    ) {
        e.preventDefault();
        return false;
    }
});

/* --- SETUP CANVAS --- */
const snowCanvas = document.getElementById('snow-canvas');
const sCtx = snowCanvas.getContext('2d');

const trailCanvas = document.getElementById('trail-canvas');
const tCtx = trailCanvas.getContext('2d');

let width = snowCanvas.width = trailCanvas.width = window.innerWidth;
let height = snowCanvas.height = trailCanvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = snowCanvas.width = trailCanvas.width = window.innerWidth;
    height = snowCanvas.height = trailCanvas.height = window.innerHeight;
});

/* --- NEVE LUMINOSA E POLVERE DI STELLE --- */
const flakes = [];
const flakeCount = 75;

function createFlake(randomY = false) {
    const typeRand = Math.random();
    let color;
    if (typeRand < 0.62) {
        color = '#ffffff';
    } else if (typeRand < 0.84) {
        color = '#ffe066';
    } else {
        color = `hsl(${Math.floor(Math.random() * 360)}, 100%, 75%)`;
    }

    return {
        x: Math.random() * width,
        y: randomY ? Math.random() * height : -15,
        radius: Math.random() * 2.6 + 1,
        speedY: Math.random() * 0.9 + 0.35,
        swayAmp: Math.random() * 0.6 + 0.2,
        swayAngle: Math.random() * Math.PI * 2,
        swaySpeed: Math.random() * 0.02 + 0.008,
        alpha: Math.random() * 0.55 + 0.35,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        color: color
    };
}

for (let i = 0; i < flakeCount; i++) {
    flakes.push(createFlake(true));
}

/* --- SCIE LUMINOSE ARCOBALENO DEL PUNTATORE --- */
const particles = [];
const trailPoints = [];
let hue = 0;

function addPoint(x, y) {
    trailPoints.push({ x, y, hue, alpha: 1 });
    if (trailPoints.length > 28) trailPoints.shift();

    for (let i = 0; i < 3; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 10,
            y: y + (Math.random() - 0.5) * 10,
            vx: (Math.random() - 0.5) * 1.8,
            vy: (Math.random() - 0.5) * 1.8,
            size: Math.random() * 7 + 3,
            hue: (hue + Math.random() * 40) % 360,
            alpha: 1,
            decay: Math.random() * 0.025 + 0.02
        });
    }
}

window.addEventListener('mousemove', (e) => {
    addPoint(e.clientX, e.clientY);
});

window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
        addPoint(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

/* --- LOOP ANIMAZIONE UNICO --- */
function animate() {
    // 1. Disegna Neve & Polvere di Stelle
    sCtx.clearRect(0, 0, width, height);
    for (let i = 0; i < flakes.length; i++) {
        const f = flakes[i];
        f.y += f.speedY;
        f.swayAngle += f.swaySpeed;
        f.x += Math.sin(f.swayAngle) * f.swayAmp;
        f.twinkle += f.twinkleSpeed;

        if (f.y > height + 15) {
            flakes[i] = createFlake(false);
            continue;
        }
        if (f.x > width + 15) f.x = -15;
        if (f.x < -15) f.x = width + 15;

        const currentAlpha = Math.max(0.15, f.alpha * (0.65 + 0.35 * Math.sin(f.twinkle)));

        sCtx.save();
        sCtx.globalAlpha = currentAlpha;
        sCtx.shadowBlur = f.radius * 4.5;
        sCtx.shadowColor = f.color;
        sCtx.fillStyle = f.color;
        sCtx.beginPath();
        sCtx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        sCtx.fill();
        sCtx.restore();
    }

    // 2. Disegna Scia Arcobaleno Puntatore
    tCtx.clearRect(0, 0, width, height);
    hue = (hue + 2.5) % 360;
    tCtx.globalCompositeOperation = 'lighter';

    for (let i = 1; i < trailPoints.length; i++) {
        const prev = trailPoints[i - 1];
        const curr = trailPoints[i];
        curr.alpha -= 0.032;

        if (curr.alpha > 0) {
            tCtx.beginPath();
            tCtx.moveTo(prev.x, prev.y);
            tCtx.lineTo(curr.x, curr.y);
            tCtx.strokeStyle = `hsla(${curr.hue}, 100%, 60%, ${curr.alpha * 0.85})`;
            tCtx.lineWidth = Math.max(1, (i / trailPoints.length) * 14);
            tCtx.lineCap = 'round';
            tCtx.shadowBlur = 20;
            tCtx.shadowColor = `hsl(${curr.hue}, 100%, 60%)`;
            tCtx.stroke();
        }
    }

    while (trailPoints.length > 0 && trailPoints[0].alpha <= 0) {
        trailPoints.shift();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        p.size *= 0.97;

        if (p.alpha <= 0 || p.size <= 0.4) {
            particles.splice(i, 1);
            continue;
        }

        const grad = tCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.2);
        grad.addColorStop(0, `hsla(${p.hue}, 100%, 75%, ${p.alpha})`);
        grad.addColorStop(0.5, `hsla(${p.hue}, 100%, 55%, ${p.alpha * 0.5})`);
        grad.addColorStop(1, `hsla(${p.hue}, 100%, 50%, 0)`);

        tCtx.shadowBlur = 0;
        tCtx.fillStyle = grad;
        tCtx.beginPath();
        tCtx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
        tCtx.fill();
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
