<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --rb: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #f0f, #f00); }
        body { background: transparent; margin: 0; font-family: 'Arial Black', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        
        #btn-pali { position: fixed; right: 20px; top: 60px; width: 250px; height: 60px; background: #000; border: 2px solid #fff; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 999999; box-shadow: 0 0 15px rgba(255,255,255,0.3); pointer-events: auto; }
        
        .btn-text, #clicca-qui-text { background: var(--rb); -webkit-background-clip: text; color: transparent; text-transform: uppercase; font-weight: 900; }
        .btn-text { font-size: 11px; }
        #clicca-qui-text { font-size: 14px; animation: pulse 1.5s infinite; letter-spacing: 2px; margin-top: 2px; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
        
        .led-verde { width: 10px; height: 10px; background-color: #0f0; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 10px #0f0; animation: blink 0.8s infinite; }
        .led-rosso { width: 10px; height: 10px; background-color: #f00; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 8px #f00; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #locandina { display: none; position: fixed; right: 10px; top: 150px; width: 280px; background: #000; border: 3px solid #333; border-radius: 12px; padding: 10px; box-shadow: 0 0 50px #000; z-index: 999998; pointer-events: auto; max-height: 480px; overflow-y: auto; }
        .header { text-align: center; border-bottom: 2px solid #222; margin-bottom: 12px; padding-bottom: 8px; }
        #giorno-live { color: #ffff00; font-size: 14px; text-transform: uppercase; }
        
        .titolo, .testo-lama { background: var(--rb); -webkit-background-clip: text; color: transparent; font-weight: 900; text-transform: uppercase; }
        .titolo { font-size: 13px; }
        
        .slot { background: #0a0a0a; border: 1px solid #222; border-radius: 30px; margin-bottom: 6px; padding: 5px; display: flex; align-items: center; gap: 8px; }
        .ora { color: #0ff; font-size: 10px; width: 45px; text-align: center; font-weight: bold; }
        .foto { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #444; object-fit: cover; background: #222; transition: 0.3s; }
        
        .ruota-disco { animation: rotate-disco 2s linear infinite !important; border-color: #0f0 !important; box-shadow: 0 0 15px #0f0; }
        @keyframes rotate-disco { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .nome { color: #ff00ff; font-size: 10px; text-transform: uppercase; font-weight: 900; flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding-right: 10px;}
        .testo-lama { font-size: 13px; text-align: center; padding: 20px 5px; display: block; letter-spacing: 0.5px; line-height: 1.4; }
        
        /* Stile per la Cover (In alto a sinistra per Xat) */
        #box-cover270 { 
            position: fixed;
            top: 30px;  
            left: 45px; 
            pointer-events: auto; 
            display: none; 
            text-align: center; 
            z-index: 999999;
        }
        #cover270 { 
            width: 80px; 
            height: 80px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 2px solid #0f0; 
            box-shadow: 0 0 15px #0f0; 
            animation: rotate-disco 4s linear infinite; 
        }
        #nome-cover270 { 
            margin-top: 5px; 
            background: var(--rb); 
            -webkit-background-clip: text; 
            color: transparent; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
    </style>
</head>
<body>
    <!-- Box dove appare la foto e il NOME del DJ in diretta -->
    <div id="box-cover270">
        <img id="cover270" src="" alt="DJ In Diretta">
        <div id="nome-cover270"></div>
    </div>

    <div id="btn-pali">
        <div class="btn-text">PALINSESTO DE IL CARTAIO</div>
        <div id="clicca-qui-text">CLICCA QUI</div>
    </div>

    <div id="locandina">
        <div class="header">
            <span id="giorno-live">---</span>
            <div class="titolo" id="titolo-locandina">DIRETTE RADIO LIVE</div>
        </div>
        <div id="lista-dj"></div>
    </div>

<script>
    // Link della tua Radio Shoutcast
    const URL_RADIO = "https://stm2.srvif.com:7198/stats?sid=1&json=1&callback=?";

    const giorni = ["DOMENICA", "LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ", "SABATO"];
    
    const djs = [
        { nome: "DJ NIKITA",  foto: "https://xatimg.com/image/pORicTZi3lhE.jpg" }, // 0
        { nome: "DJ TOTTI",   foto: "https://xatimg.com/image/9EUxzchBUN3A.jpg" }, // 1
        { nome: "DJ CLAUDIA", foto: "https://xatimg.com/image/zC9XQHm7xHte.jpg" }, // 2
        { nome: "DJ SIMONA",  foto: "https://xatimg.com/image/HnHeYw6n4jj3.jpg" }, // 3
        { nome: "DJ STEFANY", foto: "https://xatimg.com/image/X7febOvNHs96.jpg" }, // 4
        { nome: "DJ ROBERTO", foto: "https://xatimg.com/image/DYidsujYf2BT.jpg" }, // 5
        { nome: "DJ ALESSIA", foto: "https://xatimg.com/image/DsFXMhIKnNDE.jpg" }, // 6
        { nome: "DJ GENNY",   foto: "https://xatimg.com/image/4Fa39NYJYZUF.jpg" }, // 7
        { nome: "DJ MERY",    foto: "https://xatimg.com/image/5vCvkJiVlHWF.jpg" }, // 8
        { nome: "DJ CARTAIO", foto: "https://xatimg.com/image/RrNrzPFPVBwN.png" }  // 9
    ];

    const databaseTurni = {
        "LUNEDÌ": [
            {h:18, dj: djs[0]}, {h:19, dj: djs[1]}, {h:20, dj: djs[2]}, {h:21, dj: djs[3]}
        ],
        "MARTEDÌ": [
            {h:17, dj: djs[4]}, {h:18, dj: djs[5]}, {h:19, dj: djs[6]}, {h:20, dj: djs[7]}, {h:21, dj: djs[8]}
        ],
        "MERCOLEDÌ": [
            {h:18, dj: djs[9]}, {h:19, dj: djs[0]}, {h:20, dj: djs[1]}, {h:21, dj: djs[2]}
        ],
        "GIOVEDÌ": [
            {h:17, dj: djs[3]}, {h:18, dj: djs[4]}, {h:19, dj: djs[5]}, {h:20, dj: djs[6]}, {h:21, dj: djs[7]}
        ],
        "VENERDÌ": [
            {h:18, dj: djs[8]}, {h:19, dj: djs[9]}, {h:20, dj: djs[0]}, {h:21, dj: djs[1]}
        ],
        "SABATO": [
            {h:10, dj: djs[2]}, 
            {h:11, dj: djs[3]}, 
            {h:12, dj: djs[4]}, 
            {h:13, dj: djs[0]}, 
            {h:14, dj: djs[1]}, 
            {h:17, dj: djs[5]}, 
            {h:18, dj: djs[6]}, 
            {h:19, dj: djs[7]}, 
            {h:20, dj: djs[8]}, 
            {h:21, dj: djs[9]}
        ],
        "DOMENICA": "RIPOSO"
    };

    function processaInterfaccia(djDalServer) {
        const d = new Date();
        const oggi = giorni[d.getDay()];
        let oraAttuale = d.getHours();
        
        $('#giorno-live').text(oggi);
        const container = $('#lista-dj').empty();
        const djsOggi = databaseTurni[oggi];
        const titoloLoc = $('#titolo-locandina');
        
        let coverTrovata = false;

        if (oggi === "DOMENICA" || djsOggi === "RIPOSO") {
            titoloLoc.hide();
            container.append('<div class="testo-lama">BUONA DOMENICA DA<br>IL CARTAIO<br>DOMANI SI RIPARTE!</div>');
            $('#box-cover270').hide();
        } else {
            titoloLoc.show();
            if (Array.isArray(djsOggi)) {
                let qualcunoLiveDaOrario = djsOggi.some(turno => turno.h === oraAttuale);
                
                djsOggi.forEach((turno, index) => {
                    let èLive = false;

                    // 1. Controlla se il server radio trasmette il nome di questo DJ
                    if (djDalServer && turno.dj.nome === djDalServer) {
                        èLive = true;
                    } 
                    // 2. Se non c'è nessun nome dal server, usa l'orologio come piano B
                    else if (!djDalServer) {
                        if (oraAttuale === turno.h) èLive = true;
                        if (!qualcunoLiveDaOrario && oraAttuale > 21 && index === djsOggi.length - 1) èLive = true;
                        if (!qualcunoLiveDaOrario && oraAttuale < 9 && index === 0) èLive = true;
                    }

                    let classeGira = èLive ? "ruota-disco" : "";
                    let statusLed = èLive ? '<span class="led-verde"></span>' : '<span class="led-rosso"></span>';
                    
                    if (èLive) {
                        $('#cover270').attr('src', turno.dj.foto); 
                        $('#nome-cover270').text(turno.dj.nome + " IN ONDA");
                        $('#box-cover270').fadeIn();
                        coverTrovata = true;
                    }
                    
                    container.append(`
                        <div class="slot">
                            <span class="ora">${turno.h}:00</span>
                            <img class="foto ${classeGira}" src="${turno.dj.foto}" onerror="this.src='https://xatimg.com/image/or3rbqD5I3rS.png'">
                            <div class="nome"><span>${turno.dj.nome}</span> ${statusLed}</div>
                        </div>`);
                });
                
                if(!coverTrovata) { 
                    $('#box-cover270').hide();
                }
            }
        }
    }

    function controllaRadio() {
        $.getJSON(URL_RADIO, function(data) {
            let stringaServer = "";
            let djReale = null;
            
            // Unisce il titolo della regia e il titolo della canzone
            if(data.servertitle) stringaServer += data.servertitle.toUpperCase() + " ";
            if(data.songtitle) stringaServer += data.songtitle.toUpperCase();

            // Cerca se uno dei DJ è menzionato nel titolo
            djs.forEach(dj => {
                if (stringaServer.includes(dj.nome)) {
                    djReale = dj.nome; // Trovato il DJ in onda!
                }
            });

            // Aggiorna la grafica
            processaInterfaccia(djReale);

        }).fail(function() {
            // Se la radio è spenta, usa l'orologio
            processaInterfaccia(null);
        });
    }

    $('#btn-pali').on('click', function() { $('#locandina').toggle(); });
    
    // Controlla la radio ogni 10 secondi
    setInterval(controllaRadio, 10000); 
    controllaRadio();
</script>
</body>
</html>
