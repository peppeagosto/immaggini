
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Palinsesto DJ Live - Full Day</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --grad-colore: linear-gradient(135deg, #ff0055, #ff5500, #ffcc00);
        }

        body { 
            background: transparent; 
            margin: 0; 
            padding: 0; 
            font-family: 'Arial Black', Arial, sans-serif; 
            overflow: hidden; 
        }

        /* 1. COVER 120x120 ROTANTE A SINISTRA */
        #cover-box-sx {
            position: fixed; 
            left: 40px; 
            top: 130px; 
            width: 120px; 
            height: 120px; 
            z-index: 999999; 
            display: none; 
        }

        .disco-cover {
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            border: 3px solid #ff0055; 
            object-fit: cover; 
            background: #000; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8); 
            animation: giraDisco 6s linear infinite;
        }

        @keyframes giraDisco { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }

        /* 2. RETTANGOLO A DESTRA (Invisibile, compare al passaggio del mouse) */
        #btn-pali {
            position: fixed;
            right: 20px;
            top: 80px; 
            width: 220px;
            height: 55px;
            background: #000;
            border: 2px solid #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999999;
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        #btn-pali:hover {
            opacity: 1;
        }

        .btn-main-txt {
            background: var(--grad-colore);
            -webkit-background-clip: text;
            color: transparent;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-sub-txt {
            color: #00ffff;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 2px;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.96); }
        }

        /* 3. LOCANDINA POPUP TURNI */
        #locandina-popup {
            display: none; 
            position: fixed; 
            right: 20px; 
            top: 145px; 
            width: 260px; 
            background: #111; 
            border: 2px solid #333; 
            border-radius: 12px; 
            padding: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); 
            z-index: 999998;
        }

        .header-pali { 
            text-align: center; 
            border-bottom: 2px solid #222; 
            padding-bottom: 8px; 
            margin-bottom: 10px; 
        }
        
        #nome-giorno { 
            color: #ffff00; 
            font-size: 14px; 
            text-transform: uppercase; 
            font-weight: 900; 
            display: block; 
        }
        
        .sub-header { 
            color: #888; 
            font-size: 10px; 
            letter-spacing: 1px; 
        }

        /* CONTENITORE LISTA CON SCROLLBAR PER TURNI LUNGHI */
        #elenco-turni {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        #elenco-turni::-webkit-scrollbar { width: 5px; }
        #elenco-turni::-webkit-scrollbar-track { background: #111; }
        #elenco-turni::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 5px; }

        /* RIGHE TURNI */
        .riga-turno { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #181818; 
            border: 1px solid #2a2a2a; 
            border-radius: 8px; 
            padding: 7px 10px; 
            margin-bottom: 6px; 
        }
        
        .riga-turno.on-air { 
            background: #250810; 
            border-color: #00ff66; 
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.2); 
        }
        
        .orario-txt { 
            color: #00ffff; 
            font-size: 11px; 
            font-weight: bold; 
        }
        
        .nome-dj-txt { 
            color: #fff; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .led-verde { 
            width: 9px; 
            height: 9px; 
            background-color: #00ff66; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #00ff66; 
            animation: lampeggio 0.8s infinite; 
        }
        
        .led-rosso { 
            width: 9px; 
            height: 9px; 
            background-color: #ff2200; 
            border-radius: 50%; 
            box-shadow: 0 0 5px #ff2200; 
        }

        @keyframes lampeggio { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.3; } 
        }

        .messaggio-riposo { 
            color: #ffaa00; 
            text-align: center; 
            font-size: 12px; 
            padding: 15px 5px; 
            line-height: 1.5; 
        }
    </style>
</head>
<body>

    <div id="cover-box-sx">
        <img id="imgCoverDJ" class="disco-cover" src="https://xatimg.com/image/RrNrzPFPVBwN.png" alt="Cover DJ">
    </div>

    <div id="btn-pali">
        <div class="btn-main-txt">PALINSESTO DJ</div>
        <div class="btn-sub-txt">CLICCA QUI</div>
    </div>

    <div id="locandina-popup">
        <div class="header-pali">
            <span id="nome-giorno">---</span>
            <span class="sub-header">DIRETTE RADIO LIVE</span>
        </div>
        <div id="elenco-turni"></div>
    </div>

<script>
    const giorni = ["DOMENICA", "LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ", "SABATO"];
    
    const foto = {
        ROSY: "https://xatimg.com/image/9EUxzchBUN3A.jpg",
        CLAUDIA: "https://xatimg.com/image/zC9XQHm7xHte.jpg",
        SIMONA: "https://xatimg.com/image/HnHeYw6n4jj3.jpg",
        NIKITA: "https://xatimg.com/image/pORicTZi3lhE.jpg",
        MISS: "https://xatimg.com/image/STWt9W4m59dS.jpg",
        ALESSIA: "https://xatimg.com/image/DsFXMhIKnNDE.jpg",
        GENNY: "https://xatimg.com/image/4Fa39NYJYZUF.jpg",
        MERY: "https://xatimg.com/image/5vCvkJiVlHWF.jpg",
        STEFANY: "https://xatimg.com/image/X7febOvNHs96.jpg",
        ROBERTA: "https://xatimg.com/image/DYidsujYf2BT.jpg"
    };

    const databaseTurni = {
        "LUNEDÌ": [ 
            { h: 11, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 12, n: "DJ MERY", f: foto.MERY }, { h: 13, n: "DJ STEFANY", f: foto.STEFANY }, { h: 14, n: "DJ ROBERTA", f: foto.ROBERTA },
            { h: 15, n: "DJ GENNY", f: foto.GENNY }, { h: 16, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 17, n: "DJ SIMONA", f: foto.SIMONA }, { h: 18, n: "DJ NIKITA", f: foto.NIKITA },
            { h: 19, n: "DJ ROSY", f: foto.ROSY }, { h: 20, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 21, n: "DJ SIMONA", f: foto.SIMONA }, { h: 22, n: "DJ NIKITA", f: foto.NIKITA }, { h: 23, n: "DJ CARTAIO", f: foto.CARTAIO } 
        ],
        "MARTEDÌ": [ 
            { h: 11, n: "DJ ROSY", f: foto.ROSY }, { h: 12, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 13, n: "DJ SIMONA", f: foto.SIMONA }, { h: 14, n: "DJ NIKITA", f: foto.NIKITA },
            { h: 15, n: "DJ CARTAIO", f: foto.CARTAIO }, { h: 16, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 17, n: "DJ GENNY", f: foto.GENNY }, { h: 18, n: "DJ MERY", f: foto.MERY },
            { h: 19, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 20, n: "DJ GENNY", f: foto.GENNY }, { h: 21, n: "DJ MERY", f: foto.MERY }, { h: 22, n: "DJ STEFANY", f: foto.STEFANY }, { h: 23, n: "DJ NIKITA", f: foto.NIKITA } 
        ],
        "MERCOLEDÌ": [ 
            { h: 11, n: "DJ GENNY", f: foto.GENNY }, { h: 12, n: "DJ MERY", f: foto.MERY }, { h: 13, n: "DJ STEFANY", f: foto.STEFANY }, { h: 14, n: "DJ ROBERTA", f: foto.ROBERTA },
            { h: 15, n: "DJ ROSY", f: foto.ROSY }, { h: 16, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 17, n: "DJ SIMONA", f: foto.SIMONA }, { h: 18, n: "DJ CARTAIO", f: foto.CARTAIO },
            { h: 19, n: "DJ NIKITA", f: foto.NIKITA }, { h: 20, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 21, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 22, n: "DJ SIMONA", f: foto.SIMONA }, { h: 23, n: "DJ CARTAIO", f: foto.CARTAIO } 
        ],
        "GIOVEDÌ": [ 
            { h: 11, n: "DJ SIMONA", f: foto.SIMONA }, { h: 12, n: "DJ NIKITA", f: foto.NIKITA }, { h: 13, n: "DJ CARTAIO", f: foto.CARTAIO }, { h: 14, n: "DJ ALESSIA", f: foto.ALESSIA },
            { h: 15, n: "DJ GENNY", f: foto.GENNY }, { h: 16, n: "DJ MERY", f: foto.MERY }, { h: 17, n: "DJ STEFANY", f: foto.STEFANY }, { h: 18, n: "DJ ROBERTA", f: foto.ROBERTA },
            { h: 19, n: "DJ ROSY", f: foto.ROSY }, { h: 20, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 21, n: "DJ GENNY", f: foto.GENNY }, { h: 22, n: "DJ SIMONA", f: foto.SIMONA }, { h: 23, n: "DJ STEFANY", f: foto.STEFANY } 
        ],
        "VENERDÌ": [ 
            { h: 11, n: "DJ ROBERTA", f: foto.ROBERTA }, { h: 12, n: "DJ STEFANY", f: foto.STEFANY }, { h: 13, n: "DJ MERY", f: foto.MERY }, { h: 14, n: "DJ GENNY", f: foto.GENNY },
            { h: 15, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 16, n: "DJ CARTAIO", f: foto.CARTAIO }, { h: 17, n: "DJ NIKITA", f: foto.NIKITA }, { h: 18, n: "DJ SIMONA", f: foto.SIMONA },
            { h: 19, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 20, n: "DJ NIKITA", f: foto.NIKITA }, { h: 21, n: "DJ GENNY", f: foto.GENNY }, { h: 22, n: "DJ MERY", f: foto.MERY }, { h: 23, n: "DJ CARTAIO", f: foto.CARTAIO } 
        ],
        "SABATO": [ 
            { h: 11, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 12, n: "DJ ROSY", f: foto.ROSY }, { h: 13, n: "DJ CARTAIO", f: foto.CARTAIO }, { h: 14, n: "DJ NIKITA", f: foto.NIKITA },
            { h: 15, n: "DJ SIMONA", f: foto.SIMONA }, { h: 16, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 17, n: "DJ GENNY", f: foto.GENNY }, { h: 18, n: "DJ MERY", f: foto.MERY },
            { h: 19, n: "DJ GENNY", f: foto.GENNY }, { h: 20, n: "DJ MERY", f: foto.MERY }, { h: 21, n: "DJ CARTAIO", f: foto.CARTAIO }, { h: 22, n: "DJ ALESSIA", f: foto.ALESSIA }, { h: 23, n: "DJ ROBERTA", f: foto.ROBERTA } 
        ],
        "DOMENICA": [ 
            { h: 11, n: "DJ MISS", f: foto.CARTAIO }, { h: 12, n: "DJ NIKITA", f: foto.NIKITA }, { h: 13, n: "DJ SIMONA", f: foto.SIMONA }, { h: 14, n: "DJ ALESSIA", f: foto.ALESSIA },
            { h: 15, n: "DJ ROSY", f: foto.ROSY }, { h: 16, n: "DJ CLAUDIA", f: foto.CLAUDIA }, { h: 17, n: "DJ GENNY", f: foto.GENNY }, { h: 18, n: "DJ MERY", f: foto.MERY },
            { h: 19, n: "DJ STEFANY", f: foto.STEFANY }, { h: 20, n: "DJ ROBERTA", f: foto.ROBERTA }, { h: 21, n: "MISS", f: foto.CARTAIO }, { h: 22, n: "DJ NIKITA", f: foto.NIKITA }, { h: 23, n: "DJ SIMONA", f: foto.SIMONA } 
        ]
    };

    function aggiornaPalinsesto() {
        const d = new Date(); 
        const oggi = giorni[d.getDay()]; 
        const oraAttuale = d.getHours();
        const defaultFoto = foto.CARTAIO;
        
        $('#nome-giorno').text(oggi);
        const contenitore = $('#elenco-turni').empty(); 
        const turniOggi = databaseTurni[oggi];
        
        if (!turniOggi || turniOggi === "RIPOSO") {
            $('#imgCoverDJ').attr('src', defaultFoto);
            contenitore.append('<div class="messaggio-riposo">BUONA DOMENICA DA<br><b>IL CARTAIO</b><br>NESSUNA DIRETTA OGGI!</div>');
            return;
        }
        
        let trovatoInOnda = false;
        
        turniOggi.forEach(turno => {
            const inOndaOra = (turno.h === oraAttuale);
            const classeRiga = inOndaOra ? "riga-turno on-air" : "riga-turno";
            const led = inOndaOra ? '<span class="led-verde"></span>' : '<span class="led-rosso"></span>';
            
            if (inOndaOra) { 
                $('#imgCoverDJ').attr('src', turno.f); 
                trovatoInOnda = true; 
            }
            
            contenitore.append(`<div class="${classeRiga}"><span class="orario-txt">${turno.h}:00 - ${turno.h + 1}:00</span><span class="nome-dj-txt">${turno.n} ${led}</span></div>`);
        });
        
        if (!trovatoInOnda) { 
            $('#imgCoverDJ').attr('src', defaultFoto); 
        }
    }

    $('#btn-pali').on('click', function() { 
        $('#locandina-popup').fadeToggle(200); 
        $('#cover-box-sx').fadeToggle(200); 
    });
    
    aggiornaPalinsesto(); 
    setInterval(aggiornaPalinsesto, 15000);
</script>
</body>
</html>
