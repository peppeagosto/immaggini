<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Palinsesto De Il Cartaio</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { 
            --rb: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #f0f, #f00); 
        }
        body { 
            background: transparent; 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            pointer-events: none; 
        }
        
        #btn-pali { 
            position: fixed; 
            right: 20px; 
            top: 60px; 
            width: 250px; 
            height: 60px; 
            background: #000; 
            border: 2px solid #fff; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 999999; 
            box-shadow: 0 0 15px rgba(255,255,255,0.3); 
            pointer-events: auto; 
        }
        
        .btn-text, #clicca-qui-text { 
            background: var(--rb); 
            -webkit-background-clip: text; 
            color: transparent; 
            text-transform: uppercase; 
            font-weight: 900; 
        }
        .btn-text { font-size: 11px; }
        #clicca-qui-text { 
            font-size: 14px; 
            animation: pulse 1.5s infinite; 
            letter-spacing: 2px; 
            margin-top: 2px; 
        }
        
        @keyframes pulse { 
            0%, 100% { opacity: 1; transform: scale(1); } 
            50% { opacity: 0.7; transform: scale(0.95); } 
        }
        
        .led-verde { 
            width: 10px; 
            height: 10px; 
            background-color: #0f0; 
            border-radius: 50%; 
            display: inline-block; 
            margin-left: 10px; 
            box-shadow: 0 0 10px #0f0; 
            animation: blink 0.8s infinite; 
        }
        .led-rosso { 
            width: 10px; 
            height: 10px; 
            background-color: #f00; 
            border-radius: 50%; 
            display: inline-block; 
            margin-left: 10px; 
            box-shadow: 0 0 8px #f00; 
        }
        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0; } 
        }
        
        #locandina { 
            display: none; 
            position: fixed; 
            right: 10px; 
            top: 130px; 
            width: 290px; 
            background: #000; 
            border: 3px solid #333; 
            border-radius: 12px; 
            padding: 10px; 
            box-shadow: 0 0 50px #000; 
            z-index: 999998; 
            pointer-events: auto; 
        }
        .header { 
            text-align: center; 
            border-bottom: 2px solid #222; 
            margin-bottom: 12px; 
            padding-bottom: 8px; 
        }
        #giorno-live { 
            color: #ffff00; 
            font-size: 14px; 
            text-transform: uppercase; 
        }
        
        .titolo, .testo-lama { 
            background: var(--rb); 
            -webkit-background-clip: text; 
            color: transparent; 
            font-weight: 900; 
            text-transform: uppercase; 
        }
        .titolo { font-size: 13px; }
        
        .slot { 
            background: #0a0a0a; 
            border: 1px solid #222; 
            border-radius: 30px; 
            margin-bottom: 6px; 
            padding: 5px 8px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .slot.live-active {
            border-color: #0f0;
            background: #061806;
        }

        .foto { 
            width: 44px; 
            height: 44px; 
            min-width: 44px;
            border-radius: 50%; 
            border: 2px solid #444; 
            object-fit: cover; 
            background: #222; 
        }
        
        .ruota-disco { 
            animation: rotate-disco 3s linear infinite !important; 
            border-color: #0f0 !important; 
            box-shadow: 0 0 12px #0f0; 
        }
        @keyframes rotate-disco { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }

        .info-slot {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .ora { 
            color: #0ff; 
            font-size: 10px; 
            font-weight: bold; 
        }
        .nome { 
            color: #ff00ff; 
            font-size: 11px; 
            text-transform: uppercase; 
            font-weight: 900; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        .testo-lama { 
            font-size: 13px; 
            text-align: center; 
            padding: 20px 5px; 
            display: block; 
            letter-spacing: 0.5px; 
            line-height: 1.4; 
        }
    </style>
</head>
<body>

    <div id="btn-pali">
        <div class="btn-text">PALINSESTO DE IL CARTAIO</div>
        <div id="clicca-qui-text">CLICCA QUI</div>
    </div>

    <div id="locandina">
        <div class="header">
            <span id="giorno-live">---</span>
            <div class="titolo" id="titolo-locandina">DIRETTE RADIO LIVE</div>
        </div>
        <div id="lista-dj"></div>
    </div>

<script>
    const giorni = ["DOMENICA", "LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ", "SABATO"];

    const turni = {
        "LUNEDÌ": [
            {h: 19, n: "DJ ROSY", f: "https://xatimg.com/image/9EUxzchBUN3A.jpg"},
            {h: 20, n: "DJ CLAUDIA", f: "https://xatimg.com/image/zC9XQHm7xHte.jpg"},
            {h: 21, n: "DJ SIMONA", f: "https://xatimg.com/image/HnHeYw6n4jj3.jpg"},
            {h: 22, n: "DJ NIKITA", f: "https://xatimg.com/image/pORicTZi3lhE.jpg"},
            {h: 23, n: "DJ CARTAIO", f: "https://xatimg.com/image/RrNrzPFPVBwN.png"}
        ],
        "MARTEDÌ": [
            {h: 19, n: "DJ ALESSIA", f: "https://xatimg.com/image/DsFXMhIKnNDE.jpg"},
            {h: 20, n: "DJ GENNY", f: "https://xatimg.com/image/4Fa39NYJYZUF.jpg"},
            {h: 21, n: "DJ MERY", f: "https://xatimg.com/image/5vCvkJiVlHWF.jpg"},
            {h: 22, n: "DJ STEFANY", f: "https://xatimg.com/image/X7febOvNHs96.jpg"},
            {h: 23, n: "DJ NIKITA", f: "https://xatimg.com/image/pORicTZi3lhE.jpg"}
        ],
        "MERCOLEDÌ": [
            {h: 19, n: "DJ NIKITA", f: "https://xatimg.com/image/pORicTZi3lhE.jpg"},
            {h: 20, n: "DJ ALESSIA", f: "https://xatimg.com/image/DsFXMhIKnNDE.jpg"},
            {h: 21, n: "DJ CLAUDIA", f: "https://xatimg.com/image/zC9XQHm7xHte.jpg"},
            {h: 22, n: "DJ SIMONA", f: "https://xatimg.com/image/HnHeYw6n4jj3.jpg"},
            {h: 23, n: "DJ CARTAIO", f: "https://xatimg.com/image/RrNrzPFPVBwN.png"}
        ],
        "GIOVEDÌ": [
            {h: 19, n: "DJ ROSY", f: "https://xatimg.com/image/9EUxzchBUN3A.jpg"},
            {h: 20, n: "DJ ALESSIA", f: "https://xatimg.com/image/DsFXMhIKnNDE.jpg"},
            {h: 21, n: "DJ GENNY", f: "https://xatimg.com/image/4Fa39NYJYZUF.jpg"},
            {h: 22, n: "DJ SIMONA", f: "https://xatimg.com/image/HnHeYw6n4jj3.jpg"},
            {h: 23, n: "DJ STEFANY", f: "https://xatimg.com/image/X7febOvNHs96.jpg"}
        ],
        "VENERDÌ": [
            {h: 19, n: "DJ CLAUDIA", f: "https://xatimg.com/image/zC9XQHm7xHte.jpg"},
            {h: 20, n: "DJ NIKITA", f: "https://xatimg.com/image/pORicTZi3lhE.jpg"},
            {h: 21, n: "DJ GENNY", f: "https://xatimg.com/image/4Fa39NYJYZUF.jpg"},
            {h: 22, n: "DJ MERY", f: "https://xatimg.com/image/5vCvkJiVlHWF.jpg"},
            {h: 23, n: "DJ CARTAIO", f: "https://xatimg.com/image/RrNrzPFPVBwN.png"}
        ],
        "SABATO": [
            {h: 19, n: "DJ GENNY", f: "https://xatimg.com/image/4Fa39NYJYZUF.jpg"},
            {h: 20, n: "DJ MERY", f: "https://xatimg.com/image/5vCvkJiVlHWF.jpg"},
            {h: 21, n: "DJ CARTAIO", f: "https://xatimg.com/image/RrNrzPFPVBwN.png"},
            {h: 22, n: "DJ ALESSIA", f: "https://xatimg.com/image/DsFXMhIKnNDE.jpg"},
            {h: 23, n: "DJ ROBERTA", f: "https://xatimg.com/image/DYidsujYf2BT.jpg"}
        ],
        "DOMENICA": "RIPOSO"
    };

    function aggiornaLive() {
        const d = new Date();
        const oggi = giorni[d.getDay()];
        let oraAttuale = d.getHours();
        
        $('#giorno-live').text(oggi);
        const container = $('#lista-dj').empty();
        const djsOggi = turni[oggi];
        const titoloLoc = $('#titolo-locandina');

        if (oggi === "DOMENICA" || djsOggi === "RIPOSO") {
            titoloLoc.hide();
            container.append('<div class="testo-lama">BUONA DOMENICA DA<br>IL CARTAIO<br>DOMANI SI RIPARTE!</div>');
        } else {
            titoloLoc.show();
            if (Array.isArray(djsOggi)) {
                djsOggi.forEach((dj) => {
                    let eLive = (oraAttuale === dj.h);
                    let classeGira = eLive ? "ruota-disco" : "";
                    let classeSlot = eLive ? "slot live-active" : "slot";
                    let statusLed = eLive ? '<span class="led-verde"></span>' : (oraAttuale > dj.h) ? '<span class="led-rosso"></span>' : '';
                    
                    container.append(`
                        <div class="${classeSlot}">
                            <img class="foto ${classeGira}" src="${dj.f}" onerror="this.src='https://xatimg.com/image/RrNrzPFPVBwN.png'">
                            <div class="info-slot">
                                <span class="ora">${dj.h}:00 - ${dj.h + 1}:00</span>
                                <div class="nome">
                                    <span>${dj.n}</span>
                                    ${statusLed}
                                </div>
                            </div>
                        </div>
                    `);
                });
            }
        }
    }

    $('#btn-pali').on('click', function() { 
        $('#locandina').fadeToggle(200); 
    });

    setInterval(aggiornaLive, 10000);
    aggiornaLive();
</script>
</body>
</html>
