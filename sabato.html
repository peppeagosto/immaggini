<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --rb: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #f0f, #f00); }
        /* Aggiunto il blocco per non far evidenziare il testo col mouse */
        body { background: transparent; margin: 0; font-family: 'Arial Black', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; pointer-events: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        
        /* Modificato qui: larghezza 180px e altezza 40px per farlo più piccolo e a riga singola */
        #btn-pali { position: fixed; right: 20px; top: 60px; width: 180px; height: 40px; background: #000; border: 2px solid #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999999; box-shadow: 0 0 15px rgba(255,255,255,0.3); pointer-events: auto; }
        
        /* Modificato: unico testo pulsante */
        .btn-text { background: var(--rb); -webkit-background-clip: text; color: transparent; text-transform: uppercase; font-weight: 900; font-size: 14px; letter-spacing: 1px; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
        
        .led-verde { width: 10px; height: 10px; background-color: #0f0; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 10px #0f0; animation: blink 0.8s infinite; }
        .led-rosso { width: 10px; height: 10px; background-color: #f00; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 8px #f00; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #locandina { display: none; position: fixed; right: 10px; top: 150px; width: 280px; background: #000; border: 3px solid #333; border-radius: 12px; padding: 10px; box-shadow: 0 0 50px #000; z-index: 999998; pointer-events: auto; max-height: 480px; overflow-y: auto; }
        .header { text-align: center; border-bottom: 2px solid #222; margin-bottom: 12px; padding-bottom: 8px; }
        #giorno-live { color: #ffff00; font-size: 14px; text-transform: uppercase; }
        
        .titolo, .testo-lama { background: var(--rb); -webkit-background-clip: text; color: transparent; font-weight: 900; text-transform: uppercase; }
        .titolo { font-size: 13px; }
        
        .slot { background: #0a0a0a; border: 1px solid #222; border-radius: 30px; margin-bottom: 6px; padding: 5px; display: flex; align-items: center; gap: 8px; }
        .ora { color: #0ff; font-size: 10px; width: 45px; text-align: center; font-weight: bold; }
        .foto { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #444; object-fit: cover; background: #222; transition: 0.3s; }
        
        .ruota-disco { animation: rotate-disco 2s linear infinite !important; border-color: #0f0 !important; box-shadow: 0 0 15px #0f0; }
        @keyframes rotate-disco { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .nome { color: #ff00ff; font-size: 10px; text-transform: uppercase; font-weight: 900; flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding-right: 10px;}
        .testo-lama { font-size: 13px; text-align: center; padding: 20px 5px; display: block; letter-spacing: 0.5px; line-height: 1.4; }
        
        #box-cover270 { 
            position: fixed; top: 85px; left: 75px; pointer-events: auto; display: none; text-align: center; z-index: 999999;
        }
        #cover270 { 
            width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid #0f0; box-shadow: 0 0 15px #0f0; animation: rotate-disco 4s linear infinite; 
        }
        #nome-cover270 { 
            margin-top: 5px; background: var(--rb); -webkit-background-clip: text; color: transparent; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; 
        }
    </style>
</head>
<body>

    <div id="box-cover270">
        <img id="cover270" src="" alt="DJ In Diretta">
        <div id="nome-cover270"></div>
    </div>

    <!-- Modificato qui in riga singola -->
    <div id="btn-pali">
        <div class="btn-text">PALINSESTO DJ</div>
    </div>

    <div id="locandina">
        <div class="header">
            <span id="giorno-live">---</span>
            <div class="titolo" id="titolo-locandina">DIRETTE RADIO LIVE</div>
        </div>
        <div id="lista-dj"></div>
    </div>

<script>
const URL_RADIO="https://stm2.srvif.com:7198/stats?sid=1&json=1&callback=?";const giorni=["DOMENICA","LUNEDÌ","MARTEDÌ","MERCOLEDÌ","GIOVEDÌ","VENERDÌ","SABATO"];const djs=[{nome:"DJ NIKITA",foto:"https://xatimg.com/image/pORicTZi3lhE.jpg"},{nome:"DJ TOTTI",foto:"https://xatimg.com/image/9EUxzchBUN3A.jpg"},{nome:"DJ CLAUDIA",foto:"https://xatimg.com/image/zC9XQHm7xHte.jpg"},{nome:"DJ SIMONA",foto:"https://xatimg.com/image/HnHeYw6n4jj3.jpg"},{nome:"DJ STEFANY",foto:"https://xatimg.com/image/X7febOvNHs96.jpg"},{nome:"DJ ROBERTO",foto:"https://xatimg.com/image/DYidsujYf2BT.jpg"},{nome:"DJ ALESSIA",foto:"https://xatimg.com/image/DsFXMhIKnNDE.jpg"},{nome:"DJ GENNY",foto:"https://xatimg.com/image/4Fa39NYJYZUF.jpg"},{nome:"DJ MERY",foto:"https://xatimg.com/image/5vCvkJiVlHWF.jpg"},{nome:"DJ CARTAIO",foto:"https://xatimg.com/image/RrNrzPFPVBwN.png"}];const databaseTurni={"LUNEDÌ":[{h:18,dj:djs[0]},{h:19,dj:djs[1]},{h:20,dj:djs[2]},{h:21,dj:djs[3]}],"MARTEDÌ":[{h:17,dj:djs[4]},{h:18,dj:djs[5]},{h:19,dj:djs[6]},{h:20,dj:djs[7]},{h:21,dj:djs[8]}],"MERCOLEDÌ":[{h:18,dj:djs[9]},{h:19,dj:djs[0]},{h:20,dj:djs[1]},{h:21,dj:djs[2]}],"GIOVEDÌ":[{h:17,dj:djs[3]},{h:18,dj:djs[4]},{h:19,dj:djs[5]},{h:20,dj:djs[6]},{h:21,dj:djs[7]}],"VENERDÌ":[{h:18,dj:djs[8]},{h:19,dj:djs[9]},{h:20,dj:djs[0]},{h:21,dj:djs[1]}],"SABATO":[{h:10,dj:djs[2]},{h:11,dj:djs[3]},{h:12,dj:djs[4]},{h:13,dj:djs[0]},{h:14,dj:djs[1]},{h:17,dj:djs[5]},{h:18,dj:djs[6]},{h:19,dj:djs[7]},{h:20,dj:djs[8]},{h:21,dj:djs[9]}],"DOMENICA":"RIPOSO"};function processaInterfaccia(e){const o=new Date,t=giorni[o.getDay()];$("#giorno-live").text(t);const a=$("#lista-dj").empty(),s=databaseTurni[t],i=$("#titolo-locandina");let n=!1;if("DOMENICA"===t||"RIPOSO"===s){i.hide();a.append('<div class="testo-lama">BUONA DOMENICA DA<br>IL CARTAIO<br>DOMANI SI RIPARTE!</div>');$("#box-cover270").hide()}else{i.show();if(Array.isArray(s)){s.forEach((o=>{let t=!1;if(e&&o.dj.nome===e){t=!0}let s=t?"ruota-disco":"",i=t?'<span class="led-verde"></span>':'<span class="led-rosso"></span>';if(t){$("#cover270").attr("src",o.dj.foto);$("#nome-cover270").text(o.dj.nome+" IN ONDA");$("#box-cover270").fadeIn();n=!0}a.append(`<div class="slot"><span class="ora">${o.h}:00</span><img class="foto ${s}" src="${o.dj.foto}" onerror="this.src='https://xatimg.com/image/or3rbqD5I3rS.png'"><div class="nome"><span>${o.dj.nome}</span> ${i}</div></div>`)}));if(!n){$("#box-cover270").hide()}}}}function aggiornaLiveDaServer(){$.getJSON(URL_RADIO,(e=>{let o="",t=null;if(e.servertitle)o+=e.servertitle.toUpperCase()+" ";if(e.songtitle)o+=e.songtitle.toUpperCase();djs.forEach((e=>{if(o.includes(e.nome)){t=e.nome}}));processaInterfaccia(t)})).fail((function(){processaInterfaccia(null)}))}$("#btn-pali").on("click",(function(){$("#locandina").toggle()}));setInterval(aggiornaLiveDaServer,10000);aggiornaLiveDaServer();document.addEventListener("contextmenu",e=>e.preventDefault());document.onkeydown=function(e){if(123==e.keyCode)return!1;if(e.ctrlKey&&e.shiftKey&&e.keyCode=="I".charCodeAt(0))return!1;if(e.ctrlKey&&e.shiftKey&&e.keyCode=="C".charCodeAt(0))return!1;if(e.ctrlKey&&e.shiftKey&&e.keyCode=="J".charCodeAt(0))return!1;if(e.ctrlKey&&e.keyCode=="U".charCodeAt(0))return!1;if(e.ctrlKey&&e.keyCode=="S".charCodeAt(0))return!1};
</script>
</body>
</html>
