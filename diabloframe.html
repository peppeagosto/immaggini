<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>666 - INFERNAL FLAMES</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
    }
    #canvas-container {
      width: 750px;
      height: 180px;
      margin: 0 auto;
      position: relative;
    }
    canvas {
      display: block;
      background: transparent !important;
      cursor: pointer;
    }
    .controls {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
    }
    .btn-reset {
      background: linear-gradient(135deg, #2b0000 0%, #b30000 50%, #ff3700 100%);
      color: #fff;
      border: 1px solid #ff5500;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 900;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 55, 0, 0.9), inset 0 0 6px rgba(255, 180, 0, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .btn-reset:hover {
      background: linear-gradient(135deg, #4d0000 0%, #ff2200 50%, #ffd700 100%);
      color: #000;
      box-shadow: 0 0 22px rgba(255, 60, 0, 1), 0 0 35px rgba(255, 215, 0, 0.8);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="canvas" width="750" height="150"></canvas>
  <div class="controls">
    <button class="btn-reset" id="resetBtn">🔥 SIGILLO INFERNALE</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CW = 750;
const CH = 150;
const MAIN_TITLE = "666";
const SUB_TITLE = "🔥 SI ESEGUONO LAVORI: SFONDI MP4 • TESTI • VIDEO • PLAYER • SFONDI PNG 🔥";

const colors = ["#FF1100", "#FF4500", "#FF7700", "#FF0033", "#FFAA00", "#FFD700", "#FFF275"];

let particles = [];
let trailParticles = [];
let selectedLetterIndex = null;

class Particle {
  constructor(x, y, color, speed, life, isFlame = false) {
    this.x = x + (Math.random() * 20 - 10);
    this.y = y + (Math.random() * 10 - 5);
    const ang = isFlame ? (-Math.PI / 2 + (Math.random() * 0.7 - 0.35)) : (Math.random() * Math.PI * 2);
    const spd = isFlame ? (Math.random() * 2.6 + 1.2) : (Math.random() * 3.5 + 1.2) * speed;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd - (isFlame ? 1.5 : 0.4);
    this.color = color;
    this.size = Math.random() * (isFlame ? 4.5 : 3) + 1.8;
    this.alpha = 1;
    this.decay = Math.random() * 0.025 + (life || 0.015);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.size *= 0.97;
    this.alpha -= this.decay;
    return this.alpha <= 0 || this.size <= 0.3;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.shadowColor = "#FF3300";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function spawnBurst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color, 1.6, 0.022));
  }
}

function spawnFlames(x, y, count) {
  for (let i = 0; i < count; i++) {
    const randomCol = colors[Math.floor(Math.random() * colors.length)];
    trailParticles.push(new Particle(x, y, randomCol, 1.0, 0.025, true));
  }
}

// Calcolo posizionamento titolo 666
ctx.font = "900 88px 'Impact', sans-serif";
const letterSpacing = 32;
let charData = [];
let totalW = 0;

for (let i = 0; i < MAIN_TITLE.length; i++) {
  const w = ctx.measureText(MAIN_TITLE[i]).width;
  totalW += w + (i < MAIN_TITLE.length - 1 ? letterSpacing : 0);
}

let startX = (CW - totalW) / 2;
for (let i = 0; i < MAIN_TITLE.length; i++) {
  const ch = MAIN_TITLE[i];
  const w = ctx.measureText(ch).width;
  charData.push({
    id: i,
    char: ch,
    targetX: startX,
    currentX: startX,
    w: w,
    col: colors[i % colors.length],
    jumpY: 0,
    isSpace: ch === ' '
  });
  startX += w + letterSpacing;
}

// Clic per swap e fiammata
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  for (let i = 0; i < charData.length; i++) {
    const c = charData[i];
    if (c.isSpace) continue;

    const charCenterX = c.currentX + c.w / 2;
    if (Math.abs(clickX - charCenterX) < c.w / 2 + 10 && Math.abs(clickY - 55) < 45) {
      c.jumpY = -24;
      spawnBurst(charCenterX, 55, "#FF3300", 25);

      if (selectedLetterIndex === null) {
        selectedLetterIndex = i;
      } else if (selectedLetterIndex === i) {
        selectedLetterIndex = null;
      } else {
        const first = charData[selectedLetterIndex];
        const second = c;

        const tempX = first.targetX;
        first.targetX = second.targetX;
        second.targetX = tempX;

        first.jumpY = -28;
        second.jumpY = -28;

        spawnBurst(first.currentX + first.w / 2, 55, "#FF0033", 30);
        spawnBurst(second.currentX + second.w / 2, 55, "#FFDD00", 30);

        selectedLetterIndex = null;
      }
      break;
    }
  }
});

// Reset Posizioni
document.getElementById("resetBtn").addEventListener("click", () => {
  let currentStartX = (CW - totalW) / 2;
  for (let i = 0; i < charData.length; i++) {
    const c = charData[i];
    c.targetX = currentStartX;
    c.jumpY = -20;
    spawnBurst(c.currentX + c.w / 2, 55, "#FF4500", 20);
    currentStartX += c.w + letterSpacing;
  }
  selectedLetterIndex = null;
});

let state = "BUILD";
let stateTime = 0;
let revealed = 0;
let lastRevealTime = 0;
const revealInterval = 170;
let sweepProgress = 0;

function animate(time) {
  ctx.clearRect(0, 0, CW, CH);

  const mainY = 56;

  if (state === "BUILD") {
    if (time - lastRevealTime > revealInterval) {
      if (revealed < MAIN_TITLE.length) {
        revealed++;
        lastRevealTime = time;
        const cur = charData[revealed - 1];
        spawnBurst(cur.currentX + cur.w / 2, mainY, "#FF1100", 28);
      } else {
        state = "FLARE_SWEEP";
        stateTime = time;
        sweepProgress = 0;
      }
    }
  } else if (state === "FLARE_SWEEP") {
    const elapsed = time - stateTime;
    sweepProgress = elapsed / 1000;
    if (sweepProgress >= 1) {
      state = "GLOW_PULSE";
      stateTime = time;
    }
  } else if (state === "GLOW_PULSE") {
    if (time - stateTime > 5500) {
      revealed = 0;
      state = "BUILD";
      lastRevealTime = time;
    }
  }

  // 1. TITOLO PRINCIPALE: 666
  ctx.font = "900 88px 'Impact', sans-serif";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  for (let i = 0; i < revealed; i++) {
    const c = charData[i];
    c.currentX += (c.targetX - c.currentX) * 0.12;
    c.jumpY *= 0.88;

    const wave = Math.sin(time * 0.007 + i * 1.3) * 4 + c.jumpY;
    const yPos = mainY + wave;

    if (Math.random() < 0.6) {
      spawnFlames(c.currentX + c.w / 2, yPos + 34, 1);
    }

    if (selectedLetterIndex === i) {
      ctx.save();
      ctx.strokeStyle = "#FFDD00";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#FF3300";
      ctx.shadowBlur = 18;
      ctx.strokeRect(c.currentX - 6, yPos - 44, c.w + 12, 88);
      ctx.restore();
    }

    // Aura esterna
    ctx.save();
    ctx.shadowColor = "#FF0000";
    ctx.shadowBlur = 24 + Math.sin(time * 0.01 + i) * 6;
    ctx.strokeStyle = "#400000";
    ctx.lineWidth = 8;
    ctx.strokeText(c.char, c.currentX, yPos);
    ctx.restore();

    // Contorno luminoso di fuoco
    ctx.save();
    ctx.strokeStyle = "#FF2200";
    ctx.lineWidth = 4;
    ctx.shadowColor = "#FF5500";
    ctx.shadowBlur = 12;
    ctx.strokeText(c.char, c.currentX, yPos);
    ctx.restore();

    // Riempimento brillante
    const grad = ctx.createLinearGradient(c.currentX, yPos - 42, c.currentX, yPos + 42);
    grad.addColorStop(0, "#FFFFFF");
    grad.addColorStop(0.2, "#FFF099");
    grad.addColorStop(0.55, "#FF8800");
    grad.addColorStop(1, "#FF1A00");

    ctx.save();
    ctx.fillStyle = grad;
    ctx.fillText(c.char, c.currentX, yPos);
    ctx.restore();
  }

  // 2. FASCIO DI FUOCO E BRACI
  if (state === "FLARE_SWEEP" && sweepProgress <= 1) {
    const flareX = (CW + 160) * sweepProgress - 80;
    spawnFlames(flareX - 10, mainY + (Math.random() * 30 - 15), 4);

    ctx.save();
    const flareGrad = ctx.createRadialGradient(flareX, mainY, 0, flareX, mainY, 85);
    flareGrad.addColorStop(0, "rgba(255, 255, 220, 1)");
    flareGrad.addColorStop(0.3, "rgba(255, 140, 0, 0.85)");
    flareGrad.addColorStop(0.7, "rgba(220, 20, 0, 0.45)");
    flareGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

    ctx.fillStyle = flareGrad;
    ctx.beginPath();
    ctx.arc(flareX, mainY, 85, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 80, 0, 0.9)";
    ctx.fillRect(flareX - 140, mainY - 2.5, 280, 5);
    ctx.fillStyle = "#FFF";
    ctx.fillRect(flareX - 70, mainY - 1, 140, 2);
    ctx.restore();
  }

  for (let i = trailParticles.length - 1; i >= 0; i--) {
    trailParticles[i].draw(ctx);
    if (trailParticles[i].update()) {
      trailParticles.splice(i, 1);
    }
  }

  // 3. TESTO SERVIZI SOTTO AL 666
  const subY = 124;
  const pulseSub = Math.sin(time * 0.006) * 4;

  ctx.save();
  ctx.font = "bold 12.5px 'Trebuchet MS', 'Arial Black', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // Bordo nero di contrasto
  ctx.strokeStyle = "#000000";
  ctx.lineWidth = 4;
  ctx.strokeText(SUB_TITLE, CW / 2, subY);

  // Bagliore infuocato
  ctx.shadowColor = "#FF3300";
  ctx.shadowBlur = 14 + pulseSub;
  ctx.fillStyle = "#FFDD00";
  ctx.fillText(SUB_TITLE, CW / 2, subY);
  ctx.restore();

  // 4. PARTICELLE
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].draw(ctx);
    if (particles[i].update()) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
