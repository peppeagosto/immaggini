<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>EL DIABLO</title>
<style>
body {
  margin: 0;
  /* Sfondo colore mare */
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.container {
  position: relative;
  width: 1308px;
  height: 520px; /* leggermente aumentato per contenere l'abbassamento */
}

/* ===== VIDEO LATERALI (9:16) ===== */
.video-wrapper {
  position: absolute;
  top: 35px; /* Abbassati verso il basso */
  width: 270px;
  height: 484px;
  overflow: hidden;
  z-index: 1;
  background: transparent;
  border-radius: 20px;
}
.left { left: 0; }
.right { right: 0; }

.side-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
  display: block;
}

/* Testi sovrapposti in basso all'interno dei video */
.overlay-text {
  position: absolute;
  bottom: 20px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.85);
  pointer-events: none;
  z-index: 5;
}

/* ===== AREA CENTRALE ===== */
.center-area {
  position: absolute;
  left: 340px;  
  right: 340px; 
  top: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2; 
}

.center-box {
  position: relative;
  width: 100%; 
  height: 420px;
}

.center-box video {
  width: 100%;
  height: 100%;
  object-fit: contain; 
  border-radius: 12px;
  /* Sfondo del video colore mare anziché nero */
  background: #006994;
}
</style>
</head>
<body>

<div class="container">

  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://i.imgur.com/GOjvY2S.mp4" type="video/mp4">
    </video>
    <div class="overlay-text">Bun venit</div>
  </div>

  <div class="center-area">
    <div class="center-box">
      </div>
  </div>

  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://i.imgur.com/GOjvY2S.mp4" type="video/mp4">
    </video>
    <div class="overlay-text">SarutDulce2018</div>
  </div>

</div>

</body>
</html>
