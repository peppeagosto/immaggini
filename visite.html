<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Ultimi 10 Ingressi - ITALIA_GHOST</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
  #box-visite { width: 250px; background-color: #111; border: 2px solid #ff0000; border-radius: 8px; padding: 10px; color: #fff; font-family: Arial, sans-serif; font-size: 13px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
  .titolo { text-align: center; font-weight: bold; color: #ffcc00; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
  #lista-citta { list-style-type: none; margin: 0; padding: 0; }
  .citta-item { padding: 6px 0; border-bottom: 1px dashed #333; display: flex; align-items: center; justify-content: space-between; }
  .citta-info { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .orario-testo { font-size: 11px; color: #00d4ff; font-weight: bold; padding-left: 5px; }
  .citta-item:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="box-visite">
  <div class="titolo">Ultimi 10 Ingressi</div>
  <ul id="lista-citta"></ul>
</div>

<script>
  // 🔒 SISTEMA ANTI-COPIA DEL CARTAIO 🔒
  const chatAutorizzate = ["lorycuorestellare", "italia_ghost", "xat.com"]; 
  
  const provenienza = document.referrer.toLowerCase();
  let bloccoAttivo = true;

  if (provenienza === "" || provenienza.includes("github.io")) {
    bloccoAttivo = false; 
  } else {
    for (let i = 0; i < chatAutorizzate.length; i++) {
      if (provenienza.includes(chatAutorizzate[i])) {
        bloccoAttivo = false;
        break;
      }
    }
  }

  // IL NUOVO MESSAGGIO DI ERRORE CHE SPY-A IL LINK DI XAT
  if (bloccoAttivo) {
    document.body.innerHTML = `
      <div style="width: 250px; background-color: #111; border: 2px solid #ff0000; border-radius: 8px; padding: 15px; color: #ff0000; font-family: Arial; font-weight: bold; text-align: center; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);">
        🚫 ACCESSO NEGATO<br><br>
        <span style="color:#fff; font-size:12px;">Codice di <b>EL DIABLO</b>.</span><br><br>
        <span style="color:#ffcc00; font-size:10px;">Link intercettato:<br>${provenienza || "Nessun link"}</span>
      </div>`;
    throw new Error("Blocco Anti-Copia attivato.");
  }
  // 🔒 FINE SISTEMA ANTI-COPIA 🔒


  // --- CONNESSIONE FIREBASE E LISTA VISITE ---
  const firebaseConfig = {
    apiKey: "AIzaSyDpc_UGHeNBiph4pmGzjPjPiuca-KylAic",
    authDomain: "globovisitatoricartaio.firebaseapp.com",
    databaseURL: "https://globovisitatoricartaio-default-rtdb.firebaseio.com",
    projectId: "globovisitatoricartaio",
    storageBucket: "globovisitatoricartaio.firebasestorage.app",
    messagingSenderId: "870797967861",
    appId: "1:870797967861:web:0bc578a2053ff1f441e0bc"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const visitatoriRef = db.ref('visitatori');

  function aggiungiCitta(citta, nazione, bandiera, timestamp) {
    const lista = document.getElementById('lista-citta');
    const nuovaRiga = document.createElement('li');
    nuovaRiga.className = 'citta-item';
    
    let orarioFormattato = "";
    if (timestamp) {
      const data = new Date(timestamp);
      const ore = String(data.getHours()).padStart(2, '0');
      const minuti = String(data.getMinutes()).padStart(2, '0');
      orarioFormattato = `<span class="orario-testo">${ore}:${minuti}</span>`;
    }

    nuovaRiga.innerHTML = `
      <div class="citta-info">
        <img src="${bandiera}" width="20" style="border-radius:3px;"> 
        <span>${citta}</span>
      </div>
      ${orarioFormattato}
    `;
    lista.prepend(nuovaRiga);
    if (lista.children.length > 10) { lista.removeChild(lista.lastChild); }
  }

  visitatoriRef.limitToLast(10).on('child_added', function(snapshot) {
    const datiUtente = snapshot.val();
    if (datiUtente && datiUtente.citta) {
      aggiungiCitta(datiUtente.citta, datiUtente.nazione, datiUtente.bandiera, datiUtente.tempo);
    }
  });

  fetch('https://ipwho.is/')
    .then(response => response.json())
    .then(data => {
      if (!data.success) throw new Error("API");
      visitatoriRef.push({ citta: data.city || "Sconosciuta", nazione: data.country || "Mondo", bandiera: \`https://flagcdn.com/20x15/\${(data.country_code || 'it').toLowerCase()}.png\`, tempo: firebase.database.ServerValue.TIMESTAMP });
    })
    .catch(errore => {
      visitatoriRef.push({ citta: "Visitatore", nazione: "Nascosto", bandiera: "https://flagcdn.com/20x15/un.png", tempo: firebase.database.ServerValue.TIMESTAMP });
    });
</script>

</body>
</html>
