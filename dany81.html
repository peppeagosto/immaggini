<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Animazioni Strette MP4 - Centro Trasparente</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== CONTENITORE PRINCIPALE ===== */
    .container {
      position: relative;
      width: 1308px;
      height: 484px;
    }

    /* ===== CONTENITORE ANIMAZIONI SIDE (STRETTE) ===== */
    .video-wrapper {
      position: absolute;
      width: 260px;
      height: 484px;
      top: 0;
      overflow: hidden;
      z-index: 2;
      background: transparent;
      border-radius: 20px;
    }
    .left { left: 0; }
    .right { right: 0; }

    /* ===== BORDI ARCOBALENO ===== */
    .video-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 4px;
      border-radius: 20px;
      background: conic-gradient(
        red, orange, yellow, lime, cyan, blue, violet, red
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: drop-shadow(0 0 10px rgba(255,0,255,.7));
      pointer-events: none;
      z-index: 3;
    }

    /* ===== VIDEO MP4 STRETTI ===== */
    .side-video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Mantiene le proporzioni nel rettangolo stretto */
      border-radius: 20px;
      display: block;
    }

    /* ===== AREA CENTRALE COMPLETAMENTE TRASPARENTE ===== */
    .center-area {
      position: absolute;
      left: 260px;
      right: 260px;
      top: 0;
      height: 484px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      background: transparent; /* Trasparente */
      border-radius: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Animazione Sinistra (sx) inserita -->
  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://i.imgur.com/gLjYJIS.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Animazione Destra (dx) da inserire -->
  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://i.imgur.com/gLjYJIS.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Area centrale (Trasparente) -->
  <div class="center-area">
    <!-- Qui va il tuo contenuto centrale -->
  </div>
</div>

</body>
</html>
