<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>EL DIABLO</title>
<style>
body{
  margin:0;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}
.container{
  position:relative;
  width:1308px;
  height:515px;
}

/* ===== TASTO CLIK PIÙ PICCOLO E ABBASSATO ===== */
.play-btn {
  position: absolute;
  top: 2px;     /* Sceso un po' di più, appena sopra il rettangolo destro */
  right: 15px;  /* Allineato a destra sopra il box */
  z-index: 9999;
  background: rgba(15, 15, 20, 0.85);
  color: #ffe9b0;
  border: 1.5px solid #ff007f;
  border-radius: 14px;
  padding: 2px 10px;
  font-family: 'Trebuchet MS', sans-serif;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 0 6px rgba(255, 0, 127, 0.7), 0 0 8px rgba(0, 255, 255, 0.5);
  transition: transform 0.2s, background 0.2s;
  pointer-events: auto;
}
.play-btn:hover {
  transform: scale(1.06);
  background: rgba(35, 15, 40, 0.95);
}

/* ===== CONTENITORE VIDEO (ABBASSATI) ===== */
.video-wrapper{
  position:absolute;
  top: 25px;
  width:270px;
  height:484px;
  overflow:hidden;
  z-index:1;
  background:transparent;
  border-radius:20px;
}
.left{left:0}
.right{right:0}

/* ===== BORDI ARCOBALENO + GLOW (STATICI) ===== */
.video-wrapper::before{
  content:"";
  position:absolute;
  inset:0;
  padding:4px;
  border-radius:20px;
  background:conic-gradient(
    #ff0000,
    #ff7f00,
    #ffff00,
    #00ff00,
    #0000ff,
    #4b0082,
    #9400d3,
    #ff0000
  );
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  filter:
    drop-shadow(0 0 6px rgba(255,0,0,.6))
    drop-shadow(0 0 12px rgba(0,255,255,.5));
  pointer-events:none;
}

/* ===== VIDEO ===== */
.side-video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:transparent;
  border-radius:16px;
}

.video-text{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  font-size:25px;
  font-family:Trebuchet MS;
  color:#ffe9b0;
  z-index:2;
}

/* ===== AREA CENTRALE (trasparente) ===== */
.center-area{
  position:absolute;
  left:280px;
  right:280px;
  height:726px;
  top:37px;
  border-radius:20px;
  background:transparent;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="container">

  <!-- TASTO CLIK POSIZIONATO SOPRA IL RETTANGOLO DESTRO -->
  <button id="playBtn" class="play-btn" onclick="attivaVideo()">CLIK</button>

  <!-- VIDEO SINISTRO -->
  <div id="videoA" class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/sorriso.mp4">
    </video>
    <div class="video-text">MANUELA</div>
  </div>

  <!-- VIDEO DESTRO -->
  <div id="videoB" class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/sorriso.mp4">
    </video>
    <div class="video-text">ROSALÍA</div>
  </div>

  <!-- AREA CENTRALE (trasparente) -->
  <div class="center-area"></div>

</div>

<script>
function attivaVideo() {
  const videos = document.querySelectorAll('.side-video');
  const btn = document.getElementById('playBtn');
  
  videos.forEach(video => {
    video.muted = !video.muted;
    video.play();
  });

  if (!videos[0].muted) {
    btn.innerHTML = "AUDIO ON";
    btn.style.borderColor = "#00ff88";
  } else {
    btn.innerHTML = "CLIK";
    btn.style.borderColor = "#ff007f";
  }
}
</script>

</body>
</html>
