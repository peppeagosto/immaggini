<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL CARTAIO - Radio Connect FM</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow-x: hidden;
}

/* =========================================
   BOX LATERALI CON FOTO SCORREVOLE IN CONTINUO
   ========================================= */
.rule-panel {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 280px;
    height: 520px;
    background: #05000a;
    border: 2px solid #ff0000;
    box-shadow: 0 0 20px #ff0000, 0 0 40px #ffff00;
    border-radius: 14px;
    overflow: hidden;
    z-index: 9999;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
}

/* POSIZIONE DEI 2 BOX */
.panel-left { left: 15px; }
.panel-right { right: 15px; }

/* HEADER FISSO CON EFFETTO LAMPEGGIANTE (BLINK) */
.rules-header {
    background: linear-gradient(90deg, #ff0000, #ff00ff);
    color: #fff;
    text-align: center;
    padding: 10px;
    font-size: 15px;
    font-weight: bold;
    text-shadow: 0 0 5px #000;
    letter-spacing: 1px;
    border-bottom: 2px solid #ffff00;
    z-index: 3;
    animation: blinkText 1.5s infinite;
}

@keyframes blinkText {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* CONTENITORE PRINCIPALE SCORREVOLE */
.rules-content {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #000;
}

/* CONTENITORE ANIMATO CON LE DUE FOTO IN FILA */
.rules-image-scroll {
    position: absolute;
    width: 100%;
    animation: scrollPhotoLoop 22s linear infinite;
}

/* Ferma lo scorrimento e fa lo zoom quando avvicini il mouse */
.rule-panel:hover .rules-image-scroll {
    animation-play-state: paused;
}

.rule-panel:hover .rules-bg-img {
    transform: scale(1.10);
}

/* LE FOTO ORIGINALI */
.rules-bg-img {
    width: 100%;
    display: block;
    transition: transform 0.4s ease;
}

@keyframes scrollPhotoLoop {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
}

/* Responsive per schermi piccoli */
@media(max-width: 650px) {
    .rule-panel { display: none; }
}
</style>
</head>
<body>

<!-- BOX SINISTRO (UTENTI) -->
<div class="rule-panel panel-left">
    <div class="rules-header">REGULAMENT IMPORTANT</div>
    <div class="rules-content">
        <div class="rules-image-scroll">
            <!-- Prima copia dell'immagine -->
            <img src="https://xatimg.com/image/95MQNMaF7uqb.jpg" class="rules-bg-img" alt="Regulament Utilizatori">
            <!-- Seconda copia esatta per chiudere il loop senza stacchi -->
            <img src="https://xatimg.com/image/95MQNMaF7uqb.jpg" class="rules-bg-img" alt="Regulament Utilizatori 2">
        </div>
    </div>
</div>

<!-- BOX DESTRO (MODERATORI) -->
<div class="rule-panel panel-right">
    <div class="rules-header">REGULAMENT IMPORTANT</div>
    <div class="rules-content">
        <div class="rules-image-scroll" style="animation-delay: -11s;">
            <!-- Prima copia dell'immagine -->
            <img src="https://xatimg.com/image/95MQNMaF7uqb.jpg" class="rules-bg-img" alt="Regulament Moderatorit">
            <!-- Seconda copia esatta per chiudere il loop senza stacchi -->
            <img src="https://xatimg.com/image/95MQNMaF7uqb.jpg" class="rules-bg-img" alt="Regulament Moderatorit 2">
        </div>
    </div>
</div>

</body>
</html>
