<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>666 - INFERNAL FLAMES</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
    user-select: none;
  }
  #canvas-container {
    width: 750px;
    height: 185px;
    margin: 0 auto;
    position: relative;
  }
  canvas {
    display: block;
    width: 750px;
    height: 155px;
    background: transparent !important;
    cursor: pointer;
  }
  .controls {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99;
  }
  .btn-reset {
    background: linear-gradient(135deg, #2b0000 0%, #b30000 50%, #ff3700 100%);
    color: #fff;
    border: 1px solid #ff5500;
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 900;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 55, 0, 0.9), inset 0 0 6px rgba(255, 180, 0, 0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s ease;
  }
  .btn-reset:hover {
    background: linear-gradient(135deg, #4d0000 0%, #ff2200 50%, #ffd700 100%);
    color: #000;
    box-shadow: 0 0 22px rgba(255, 60, 0, 1), 0 0 35px rgba(255, 215, 0, 0.8);
    transform: scale(1.05);
  }
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="canvas" width="750" height="155"></canvas>
  <div class="controls">
    <button class="btn-reset" id="resetBtn">🔥 SIGILLO INFERNALE</button>
  </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", function() {
  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");

  var CW = 750;
  var CH = 155;
  var MAIN_TITLE = "666";
  var SUB_TITLE = "🔥 SI ESEGUONO LAVORI: SFONDI MP4 • TESTI • VIDEO • PLAYER • SFONDI PNG 🔥";
  var colors = ["#FF1100", "#FF4500", "#FF7700", "#FF0033", "#FFAA00", "#FFD700", "#FFF275"];

  var particles = [];
  var trailParticles = [];
  var selectedLetterIndex = null;

  function createParticle(x, y, color, speed, life, isFlame) {
    var ang = isFlame ? (-Math.PI / 2 + (Math.random() * 0.7 - 0.35)) : (Math.random() * Math.PI * 2);
    var spd = isFlame ? (Math.random() * 2.6 + 1.2) : (Math.random() * 3.5 + 1.2) * speed;
    return {
      x: x + (Math.random() * 20 - 10),
      y: y + (Math.random() * 10 - 5),
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - (isFlame ? 1.5 : 0.4),
      color: color,
      size: Math.random() * (isFlame ? 4.5 : 3) + 1.8,
      alpha: 1,
      decay: Math.random() * 0.025 + (life || 0.015)
    };
  }

  function updateParticle(p) {
    p.x += p.vx;
    p.y += p.vy;
    p.size *= 0.97;
    p.alpha -= p.decay;
    return p.alpha <= 0 || p.size <= 0.3;
  }

  function drawParticle(p) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    ctx.shadowColor = "#FF3300";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function spawnBurst(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      particles.push(createParticle(x, y, color, 1.6, 0.022, false));
    }
  }

  function spawnFlames(x, y, count) {
    for (var i = 0; i < count; i++) {
      var randomCol = colors[Math.floor(Math.random() * colors.length)];
      trailParticles.push(createParticle(x, y, randomCol, 1.0, 0.025, true));
    }
  }

  ctx.font = "900 88px Impact, Arial Black, sans-serif";
  var letterSpacing = 32;
  var charData = [];
  var totalW = 0;

  for (var i = 0; i < MAIN_TITLE.length; i++) {
    var w = ctx.measureText(MAIN_TITLE[i]).width || 55;
    totalW += w + (i < MAIN_TITLE.length - 1 ? letterSpacing : 0);
  }

  var startX = (CW - totalW) / 2;
  for (var j = 0; j < MAIN_TITLE.length; j++) {
    var ch = MAIN_TITLE[j];
    var cw = ctx.measureText(ch).width || 55;
    charData.push({
      id: j,
      char: ch,
      targetX: startX,
      currentX: startX,
      w: cw,
      col: colors[j % colors.length],
      jumpY: 0
    });
    startX += cw + letterSpacing;
  }

  canvas.addEventListener("click", function(e) {
    var rect = canvas.getBoundingClientRect();
    var clickX = e.clientX - rect.left;
    var clickY = e.clientY - rect.top;

    for (var i = 0; i < charData.length; i++) {
      var c = charData[i];
      var charCenterX = c.currentX + c.w / 2;
      if (Math.abs(clickX - charCenterX) < c.w / 2 + 12 && Math.abs(clickY - 58) < 48) {
        c.jumpY = -24;
        spawnBurst(charCenterX, 58, "#FF3300", 25);

        if (selectedLetterIndex === null) {
          selectedLetterIndex = i;
        } else if (selectedLetterIndex === i) {
          selectedLetterIndex = null;
        } else {
          var first = charData[selectedLetterIndex];
          var second = c;
          var tempX = first.targetX;
          first.targetX = second.targetX;
          second.targetX = tempX;
          first.jumpY = -28;
          second.jumpY = -28;
          spawnBurst(first.currentX + first.w / 2, 58, "#FF0033", 30);
          spawnBurst(second.currentX + second.w / 2, 58, "#FFDD00", 30);
          selectedLetterIndex = null;
        }
        break;
      }
    }
  });

  document.getElementById("resetBtn").addEventListener("click", function() {
    var currentStartX = (CW - totalW) / 2;
    for (var i = 0; i < charData.length; i++) {
      var c = charData[i];
      c.targetX = currentStartX;
      c.jumpY = -22;
      spawnBurst(c.currentX + c.w / 2, 58, "#FF4500", 25);
      currentStartX += c.w + letterSpacing;
    }
    selectedLetterIndex = null;
    sweepFrame = 0;
  });

  var frame = 0;
  var sweepFrame = 0;

  function render() {
    frame++;
    ctx.clearRect(0, 0, CW, CH);

    var mainY = 58;

    ctx.font = "900 88px Impact, Arial Black, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";

    for (var i = 0; i < charData.length; i++) {
      var c = charData[i];
      c.currentX += (c.targetX - c.currentX) * 0.12;
      c.jumpY *= 0.88;

      var wave = Math.sin(frame * 0.08 + i * 1.3) * 4 + c.jumpY;
      var yPos = mainY + wave;

      if (Math.random() < 0.65) {
        spawnFlames(c.currentX + c.w / 2, yPos + 32, 1);
      }

      if (selectedLetterIndex === i) {
        ctx.save();
        ctx.strokeStyle = "#FFDD00";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#FF3300";
        ctx.shadowBlur = 18;
        ctx.strokeRect(c.currentX - 6, yPos - 44, c.w + 12, 88);
        ctx.restore();
      }

      ctx.save();
      ctx.shadowColor = "#FF0000";
      ctx.shadowBlur = 24 + Math.sin(frame * 0.1 + i) * 6;
      ctx.strokeStyle = "#400000";
      ctx.lineWidth = 8;
      ctx.strokeText(c.char, c.currentX, yPos);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = "#FF2200";
      ctx.lineWidth = 4;
      ctx.shadowColor = "#FF5500";
      ctx.shadowBlur = 12;
      ctx.strokeText(c.char, c.currentX, yPos);
      ctx.restore();

      var grad = ctx.createLinearGradient(c.currentX, yPos - 42, c.currentX, yPos + 42);
      grad.addColorStop(0, "#FFFFFF");
      grad.addColorStop(0.2, "#FFF099");
      grad.addColorStop(0.55, "#FF8800");
      grad.addColorStop(1, "#FF1A00");

      ctx.save();
      ctx.fillStyle = grad;
      ctx.fillText(c.char, c.currentX, yPos);
      ctx.restore();
    }

    sweepFrame++;
    if (sweepFrame > 320) {
      sweepFrame = 0;
    }
    if (sweepFrame <= 65) {
      var prog = sweepFrame / 65;
      var flareX = (CW + 160) * prog - 80;
      spawnFlames(flareX - 10, mainY + (Math.random() * 30 - 15), 3);

      ctx.save();
      var flareGrad = ctx.createRadialGradient(flareX, mainY, 0, flareX, mainY, 85);
      flareGrad.addColorStop(0, "rgba(255, 255, 220, 1)");
      flareGrad.addColorStop(0.3, "rgba(255, 140, 0, 0.85)");
      flareGrad.addColorStop(0.7, "rgba(220, 20, 0, 0.45)");
      flareGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = flareGrad;
      ctx.beginPath();
      ctx.arc(flareX, mainY, 85, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255, 80, 0, 0.9)";
      ctx.fillRect(flareX - 140, mainY - 2.5, 280, 5);
      ctx.fillStyle = "#FFF";
      ctx.fillRect(flareX - 70, mainY - 1, 140, 2);
      ctx.restore();
    }

    for (var t = trailParticles.length - 1; t >= 0; t--) {
      drawParticle(trailParticles[t]);
      if (updateParticle(trailParticles[t])) {
        trailParticles.splice(t, 1);
      }
    }

    var subY = 128;
    var pulseSub = Math.sin(frame * 0.08) * 4;

    ctx.save();
    ctx.font = "bold 12.5px Trebuchet MS, Arial Black, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 4;
    ctx.strokeText(SUB_TITLE, CW / 2, subY);

    ctx.shadowColor = "#FF3300";
    ctx.shadowBlur = 14 + pulseSub;
    ctx.fillStyle = "#FFDD00";
    ctx.fillText(SUB_TITLE, CW / 2, subY);
    ctx.restore();

    for (var p = particles.length - 1; p >= 0; p--) {
      drawParticle(particles[p]);
      if (updateParticle(particles[p])) {
        particles.splice(p, 1);
      }
    }

    requestAnimationFrame(render);
  }

  render();
});
</script>

</body>
</html>
