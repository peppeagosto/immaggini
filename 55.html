<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video con Neon Glow Potenziato</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 1308px;
      height: 486px;
    }
    .video-wrapper {
      position: absolute;
      width: 250px; /* <--- HO STRETTO QUI (prima era 290px) */
      height: 486px;
      top: 0;
      overflow: visible;
      z-index: 1;
      border-radius: 15px;
      box-shadow:
        0 0 12px #ff00ff,
        0 0 25px #00ffff,
        0 0 35px #ff00ff,
        0 0 50px #00ffff,
        0 0 70px #ff00ff;
      animation: neonPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes neonPulse {
      0% {
        box-shadow:
          0 0 10px #ff00ff,
          0 0 20px #00ffff,
          0 0 30px #ff00ff,
          0 0 45px #00ffff,
          0 0 65px #ff00ff;
      }
      50% {
        box-shadow:
          0 0 18px #ff00ff,
          0 0 35px #00ffff,
          0 0 45px #ff00ff,
          0 0 70px #00ffff,
          0 0 90px #ff00ff;
      }
      100% {
        box-shadow:
          0 0 12px #ff00ff,
          0 0 25px #00ffff,
          0 0 35px #ff00ff,
          0 0 50px #00ffff,
          0 0 70px #ff00ff;
      }
    }
    .video-wrapper video {
      width: 250px; /* <--- HO STRETTO ANCHE QUI (prima era 290px) */
      height: 486px;
      object-fit: cover; /* Se il video ti sembra troppo tagliato dentro, cambia 'cover' con 'fill' */
      border-radius: 15px;
      display: block;
      position: relative;
      z-index: 2;
    }
    
    /* Spostamenti leggermente verso l'interno */
    .left-wrapper {
      left: 15px; /* Spostato un po' verso destra */
    }
    .right-wrapper {
      right: 15px; /* Spostato un po' verso sinistra */
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="video-wrapper left-wrapper">
      <video id="videoLeft" autoplay loop muted playsinline>
        <source src="https://peppeagosto.github.io/immaggini/55.mp4" type="video/mp4" />
      </video>
    </div>

    <!-- FOTO PNG CENTRALE ELIMINATA -->

    <div class="video-wrapper right-wrapper">
      <video id="videoRight" autoplay loop muted playsinline>
        <source src="https://peppeagosto.github.io/immaggini/55.mp4" type="video/mp4" />
      </video>
    </div>

  </div>

  <script>
    // Rallenta i due video a 0.25x
    document.getElementById("videoLeft").playbackRate = 0.25;
    document.getElementById("videoRight").playbackRate = 0.25;
  </script>
</body>
</html>
