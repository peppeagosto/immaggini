<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EL CARTAIO ZAP</title>
    <!-- IMPORTAZIONE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --rb: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #f0f, #f00); }

        /* LA BASE INVINCIBILE CONTRO I BLOCCHI DI XAT */
        html {
            pointer-events: none !important;
            width: 100%;
            height: 100%;
        }

        body { 
            background: url('https://xatimg.com/image/0XdWhYwzoROm.png') no-repeat center center fixed; 
            background-size: cover;
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            pointer-events: none !important; 
        }

        /* TASTO ZAP (SBLOCCATO FORZATAMENTE) */
        #btn-zap {
            position: fixed;
            left: 40px; 
            top: 90px; 
            width: 250px;
            height: 60px;
            background: #000;
            border: 2px solid #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999999 !important;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            pointer-events: auto !important; /* Questo gli permette di ricevere il click */
        }

        .btn-text, #clicca-qui-text {
            background: var(--rb);
            -webkit-background-clip: text;
            color: transparent;
            text-transform: uppercase;
            font-weight: 900;
        }
        .btn-text { font-size: 11px; }
        #clicca-qui-text { font-size: 14px; animation: pulse 1.5s infinite; letter-spacing: 2px; margin-top: 2px; }

        @keyframes pulse { 
            0%, 100% { opacity: 1; transform: scale(1); } 
            50% { opacity: 0.7; transform: scale(0.95); } 
        }

        /* PANNELLO CHE SI APRE: IMMAGINE (QR) E LINK */
        #zap-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #25D366; 
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(37, 211, 102, 0.8);
            z-index: 9999998 !important;
            pointer-events: auto !important; /* Cliccabile */
        }

        .zap-title {
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        /* IMMAGINE (QR CODE BIANCO PER LA FOTOCAMERA) */
        .qr-code {
            width: 200px;
            height: 200px;
            background: #fff; 
            padding: 10px;
            border-radius: 10px;
            margin: 0 auto 15px auto;
            display: block;
        }

        /* LINK DIRETTO PER CHI NAVIGA DA CELLULARE */
        .btn-fallback {
            display: inline-block;
            background: #25D366;
            color: #000;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            margin-bottom: 15px;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-fallback:hover { background: #1ebe56; color: #fff; }

        #chiudi-zap {
            background: #222;
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        #chiudi-zap:hover { background: #f00; }

        /* CONTENITORI IN BASSO */
        .left-bottom-container, .right-bottom-container {
            position: fixed;
            bottom: 30px;
            z-index: 10;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }
        .left-bottom-container { left: 20%; transform: translateX(-50%); }
        .right-bottom-container { right: 20%; transform: translateX(50%); }

        /* TESTO FLUTTUANTE */
        .floating-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            background-size: 400% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowMove 6s linear infinite, wave 3s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(255,0,128,0.7));
            display: inline-block;
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-6px) rotate(-1deg); }
            75% { transform: translateY(6px) rotate(1deg); }
        }

        @keyframes rainbowMove {
            0% { background-position: 0% center; }
            100% { background-position: 400% center; }
        }

        /* NOTE MUSICALI */
        .musical-note { position: fixed; top: -10%; z-index: 1; user-select: none; pointer-events: none; animation: fall linear infinite; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
            10%, 90% { opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- TASTO CLICCABILE (ZAP) -->
    <div id="btn-zap">
        <div class="btn-text">FALAR NO ZAP</div>
        <div id="clicca-qui-text">CLIQUE AQUI</div>
    </div>

    <!-- IL PANNELLO CHE SI APRE: IMMAGINE + LINK -->
    <div id="zap-modal">
        <div class="zap-title">Escaneie o QR Code</div>
        
        <!-- IMMAGINE (QR CODE) -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fwa.me%2F5512983217941" alt="QR Code WhatsApp" class="qr-code">
        
        <!-- LINK (PULSANTE) -->
        <a href="https://wa.me/5512983217941" target="_top" class="btn-fallback">OU CLIQUE AQUI</a><br>
        
        <button id="chiudi-zap">FECHAR</button>
    </div>

    <!-- NOMI SUL FONDO -->
    <div class="left-bottom-container"><div class="floating-text">❤️ PRISCILLA ❤️</div></div>
    <div class="right-bottom-container"><div class="floating-text">❤️ MONTEIRO ❤️</div></div>

    <script>
        // LOGICA DEL CLICK: APRE IMMAGINE E LINK INVECE DELLA LOCANDINA DJ
        $('#btn-zap').on('click', function() {
            $('#zap-modal').fadeIn();
        });

        $('#chiudi-zap').on('click', function() {
            $('#zap-modal').fadeOut();
        });

        // SCRIPT NOTE MUSICALI
        const notes = ['♪', '♫', '♬', '♩', '♭', '♮', '♯'];
        const colors = ['#ff3366', '#ff9933', '#ffff33', '#33cc33', '#33cccc', '#3366ff', '#9933ff', '#ff33cc', '#00ffff', '#7fff00', '#ff1493', '#00ff7f'];
        const numberOfNotes = 35;

        for (let i = 0; i < numberOfNotes; i++) { createNote(); }

        function createNote() {
            const note = document.createElement('div');
            note.className = 'musical-note';
            note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
            note.style.left = Math.random() * 100 + 'vw';
            note.style.color = colors[Math.floor(Math.random() * colors.length)];
            note.style.fontSize = (Math.random() * 24 + 16) + 'px';
            const duration = Math.random() * 5 + 4;
            const delay = Math.random() * 5;
            note.style.animationDuration = duration + 's';
            note.style.animationDelay = delay + 's';
            note.style.filter = `drop-shadow(0 0 6px ${note.style.color})`;
            document.body.appendChild(note);
            setTimeout(() => { note.remove(); createNote(); }, (duration + delay) * 1000);
        }
    </script>

</body>
</html>
