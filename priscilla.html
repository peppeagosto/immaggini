<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EL CARTAIO - ZAP DIRETTO</title>
    <!-- IMPORTAZIONE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --rb: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #f0f, #f00); }

        body { 
            background: transparent; 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            overflow: hidden; 
            pointer-events: none; 
        }

        /* SFONDO IMMAGINE */
        .sfondo-xat {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -999; pointer-events: none;
        }

        /* ========= STILE BASE TASTI ========= */
        .btn-stile {
            position: fixed;
            width: 250px;
            height: 60px; 
            background: #000; /* Se lo vuoi completamente trasparente, cambia #000 in transparent */
            border: 2px solid #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999999 !important;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            pointer-events: auto !important; 
            text-decoration: none; /* Rimuove la sottolineatura del link */
        }
        
        /* TASTO ZAP A SINISTRA (PURO LINK) */
        #tasto-wapp { left: 40px; top: 90px; }

        /* TASTO PALINSESTO A DESTRA */
        #tasto-pali { right: 20px; top: 60px; }

        .btn-text {
            background: var(--rb); -webkit-background-clip: text; color: transparent;
            text-transform: uppercase; font-weight: 900; font-size: 11px;
        }
        .clicca-qui {
            background: var(--rb); -webkit-background-clip: text; color: transparent;
            text-transform: uppercase; font-weight: 900; font-size: 14px; 
            animation: pulse 1.5s infinite; letter-spacing: 2px; margin-top: 2px;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }

        /* ========= LOCANDINA PALINSESTO (UNICA FINESTRA RIMASTA) ========= */
        .pannello-nascosto {
            display: none; position: fixed; background: rgba(0, 0, 0, 0.95);
            border: 3px solid #333; border-radius: 15px; padding: 20px;
            box-shadow: 0 0 50px #000; z-index: 9999998 !important; pointer-events: auto !important;
        }

        #finestra-pali { right: 20px; top: 130px; width: 280px; padding: 10px; }
        .header { text-align: center; border-bottom: 2px solid #222; margin-bottom: 12px; padding-bottom: 8px; }
        #giorno-live { color: #ffff00; font-size: 14px; text-transform: uppercase; }
        .titolo, .testo-lama { background: var(--rb); -webkit-background-clip: text; color: transparent; font-weight: 900; text-transform: uppercase; }
        .titolo { font-size: 13px; }
        .slot { background: #0a0a0a; border: 1px solid #222; border-radius: 30px; margin-bottom: 6px; padding: 5px; display: flex; align-items: center; gap: 8px; }
        .ora { color: #0ff; font-size: 10px; width: 45px; text-align: center; font-weight: bold; }
        .foto { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #444; object-fit: cover; background: #222; transition: 0.3s; }
        .ruota-disco { animation: rotate-disco 2s linear infinite !important; border-color: #0f0 !important; box-shadow: 0 0 15px #0f0; }
        @keyframes rotate-disco { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .nome { color: #ff00ff; font-size: 10px; text-transform: uppercase; font-weight: 900; flex-grow: 1; display: flex; align-items: center; }
        .testo-lama { font-size: 13px; text-align: center; padding: 20px 5px; display: block; letter-spacing: 0.5px; line-height: 1.4; }
        .led-verde { width: 10px; height: 10px; background-color: #0f0; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 10px #0f0; animation: blink 0.8s infinite; }
        .led-rosso { width: 10px; height: 10px; background-color: #f00; border-radius: 50%; display: inline-block; margin-left: 10px; box-shadow: 0 0 8px #f00; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* TESTI IN BASSO E NOTE MUSICALI */
        .left-bottom-container, .right-bottom-container { position: fixed; bottom: 30px; z-index: 10; text-align: center; white-space: nowrap; pointer-events: none; }
        .left-bottom-container { left: 20%; transform: translateX(-50%); }
        .right-bottom-container { right: 20%; transform: translateX(50%); }
        .floating-text { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000); background-size: 400% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbowMove 6s linear infinite, wave 3s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(255,0,128,0.7)); display: inline-block; }
        @keyframes wave { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-6px) rotate(-1deg); } 75% { transform: translateY(6px) rotate(1deg); } }
        @keyframes rainbowMove { 0% { background-position: 0% center; } 100% { background-position: 400% center; } }
        .musical-note { position: fixed; top: -10%; z-index: 1; user-select: none; pointer-events: none; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; } 10%, 90% { opacity: 0.9; } 100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; } }
    </style>
</head>
<body>

    <!-- IMMAGINE DI SFONDO -->
    <img class="sfondo-xat" src="https://xatimg.com/image/0XdWhYwzoROm.png">

    <!-- TASTO WHATSAPP: ORA E' UN LINK DIRETTO SENZA FINESTRE/FOTO (target="_blank" apre una nuova scheda) -->
    <a href="https://wa.me/5512983217941" target="_blank" id="tasto-wapp" class="btn-stile">
        <div class="btn-text">FALAR NO ZAP</div>
        <div class="clicca-qui">CLIQUE AQUI</div>
    </a>

    <!-- TASTO PALINSESTO: APRE LA LOCANDINA -->
    <div id="tasto-pali" class="btn-stile" onclick="$('#finestra-pali').fadeToggle(200)">
        <div class="btn-text">PALINSESTO DE IL CARTAIO</div>
        <div class="clicca-qui">CLICCA QUI</div>
    </div>

    <!-- PANNELLO PALINSESTO -->
    <div id="finestra-pali" class="pannello-nascosto">
        <div class="header">
            <span id="giorno-live">---</span>
            <div class="titolo">DIRETTE RADIO LIVE</div>
        </div>
        <div id="lista-dj"></div>
    </div>

    <!-- NOMI IN BASSO -->
    <div class="left-bottom-container"><div class="floating-text">❤️ PRISCILLA ❤️</div></div>
    <div class="right-bottom-container"><div class="floating-text">❤️ MONTEIRO ❤️</div></div>

    <script>
        // SCRIPT PALINSESTO (DB E LOGICA)
        const giorni = ["DOMENICA", "LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ", "SABATO"];
        const img = [
            "https://xatimg.com/image/iQgCyJrXx59k.jpg", "https://xatimg.com/image/Pb7d1636URvg.jpg",
            "https://xatimg.com/image/iVWjQe7TNoGD.jpg", "https://xatimg.com/image/xownGDwnETzl.jpg",
            "https://xatimg.com/image/nwY3C0hFQkVZ.jpg", "https://xatimg.com/image/D5nl0rwtzO5q.jpg",
            "https://xatimg.com/image/ghXE2B3YgqbX.jpg", "https://xatimg.com/image/Ewyzp0L90szv.jpg",
            "https://xatimg.com/image/Uv2xKPe2ySt1.jpg", "https://xatimg.com/image/7gG8UEwtre1G.jpg"
        ];
        const databaseTurni = {
            "LUNEDÌ": [{h:18, n:"DJ CARLA", f:img[0]}, {h:19, n:"DJ SOFIA", f:img[1]}, {h:20, n:"DJ LUCIA", f:img[2]}, {h:21, n:"DJ GIULIA", f:img[3]}],
            "MARTEDÌ": [{h:17, n:"DJ MARCO", f:img[4]}, {h:18, n:"DJ ELENA", f:img[5]}, {h:19, n:"DJ NELLY", f:img[6]}, {h:20, n:"DJ SARA", f:img[7]}, {h:21, n:"DJ PAOLA", f:img[8]}],
            "MERCOLEDÌ": [{h:18, n:"DJ VALENTINA", f:img[9]}, {h:19, n:"DJ FABIO", f:img[0]}, {h:20, n:"DJ CHIARA", f:img[1]}, {h:21, n:"DJ MILENA", f:img[2]}],
            "GIOVEDÌ": [{h:17, n:"DJ MARTINA", f:img[3]}, {h:18, n:"DJ GIOVANNI", f:img[4]}, {h:19, n:"DJ FEDERICA", f:img[5]}, {h:20, n:"DJ ORCHIDEA", f:img[6]}, {h:21, n:"DJ BEATRICE", f:img[7]}],
            "VENERDÌ": [{h:18, n:"DJ CETTY", f:img[8]}, {h:19, n:"DJ ANNA", f:img[9]}, {h:20, n:"DJ PIERA", f:img[0]}, {h:21, n:"DJ SILVIA", f:img[1]}],
            "SABATO": [{h:17, n:"DJ CLAUDIA", f:img[2]}, {h:18, n:"DJ SIMONA", f:img[3]}, {h:19, n:"DJ STEFANY", f:img[4]}, {h:20, n:"DJ ROBERTO", f:img[5]}, {h:21, n:"DJ ALESSIA", f:img[6]}],
            "DOMENICA": "RIPOSO"
        };

        function aggiornaLive() {
            const d = new Date();
            const oggi = giorni[d.getDay()];
            let oraAttuale = d.getHours();
            $('#giorno-live').text(oggi);
            const container = $('#lista-dj').empty();
            const djsOggi = databaseTurni[oggi];
            const titoloLoc = $('.titolo');
            if (oggi === "DOMENICA") {
                titoloLoc.hide();
                container.append('<div class="testo-lama">BUONA DOMENICA DA<br>IL CARTAIO<br>DOMANI SI RIPARTE!</div>');
            } else {
                titoloLoc.show();
                if (Array.isArray(djsOggi)) {
                    djsOggi.forEach((dj) => {
                        let èLive = (oraAttuale === dj.h);
                        let classeGira = èLive ? "ruota-disco" : "";
                        let statusLed = èLive ? '<span class="led-verde"></span>' : (oraAttuale > dj.h) ? '<span class="led-rosso"></span>' : '';
                        container.append(`
                            <div class="slot">
                                <span class="ora">${dj.h}:00</span>
                                <img class="foto ${classeGira}" src="${dj.f}" onerror="this.src='https://via.placeholder.com/45/333/fff?text=DJ'">
                                <div class="nome">${dj.n} ${statusLed}</div>
                            </div>`);
                    });
                }
            }
        }
        setInterval(aggiornaLive, 10000);
        aggiornaLive();

        // SCRIPT NOTE MUSICALI
        const notes = ['♪', '♫', '♬', '♩', '♭', '♮', '♯'];
        const colors = ['#ff3366', '#ff9933', '#ffff33', '#33cc33', '#33cccc', '#3366ff', '#9933ff', '#ff33cc', '#00ffff', '#7fff00', '#ff1493', '#00ff7f'];
        for (let i = 0; i < 35; i++) { createNote(); }
        function createNote() {
            const note = document.createElement('div');
            note.className = 'musical-note';
            note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
            note.style.left = Math.random() * 100 + 'vw';
            note.style.color = colors[Math.floor(Math.random() * colors.length)];
            note.style.fontSize = (Math.random() * 24 + 16) + 'px';
            const duration = Math.random() * 5 + 4;
            const delay = Math.random() * 5;
            note.style.animationDuration = duration + 's';
            note.style.animationDelay = delay + 's';
            note.style.filter = `drop-shadow(0 0 6px ${note.style.color})`;
            document.body.appendChild(note);
            setTimeout(() => { note.remove(); createNote(); }, (duration + delay) * 1000);
        }
    </script>
</body>
</html>
