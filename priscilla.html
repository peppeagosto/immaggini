<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EL CARTAIO</title>
<!-- IMPORTAZIONE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
:root { --rb: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #f0f, #f00); }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    background: url('https://xatimg.com/image/0XdWhYwzoROm.png') no-repeat center center fixed;
    background-size: cover;
    overflow: hidden;
    font-family: 'Arial Black', sans-serif;
    pointer-events: none;
}

/* 
   IL SEGRETO È QUI:
   Spostato a DESTRA (right: 20px) sotto il palinsesto (top: 140px).
   Così schiviamo il riquadro invisibile della chat di xat a sinistra!
*/
#btn-zap {
    position: fixed;
    right: 20px; 
    top: 140px; 
    width: 250px;
    height: 60px;
    background: #000;
    border: 2px solid #fff;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999999;
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
    pointer-events: auto;
}

/* LINK PULITO PER NON FAR INTERVENIRE I BLOCCHI JAVASCRIPT */
.link-zap {
    text-decoration: none;
    pointer-events: auto;
}

.btn-text, #clicca-qui-text {
    background: var(--rb);
    -webkit-background-clip: text;
    color: transparent;
    text-transform: uppercase;
    font-weight: 900;
}
.btn-text { font-size: 11px; }
#clicca-qui-text { font-size: 14px; animation: pulse 1.5s infinite; letter-spacing: 2px; margin-top: 2px; }

@keyframes pulse { 
    0%, 100% { opacity: 1; transform: scale(1); } 
    50% { opacity: 0.7; transform: scale(0.95); } 
}

/* CONTENITORI IN BASSO */
.left-bottom-container {
    position: fixed;
    bottom: 30px;
    left: 20%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
}

.right-bottom-container {
    position: fixed;
    bottom: 30px;
    right: 20%;
    transform: translateX(50%);
    z-index: 10;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
}

/* TESTO FLUTTUANTE */
.floating-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
    background-size: 400% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowMove 6s linear infinite, wave 3s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,0,128,0.7));
    display: inline-block;
}

@keyframes wave {
    0% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-6px) rotate(-1deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(6px) rotate(1deg); }
    100% { transform: translateY(0) rotate(0deg); }
}

@keyframes rainbowMove {
    0% { background-position: 0% center; }
    100% { background-position: 400% center; }
}

/* NOTE MUSICALI */
.musical-note {
    position: fixed;
    top: -10%;
    z-index: 1;
    user-select: none;
    pointer-events: none;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
}
</style></head>
<body>

<!-- STRUTTURA DEL TASTO CORAZZATA -->
<a href="https://wa.me/5512983217941" target="_blank" class="link-zap">
    <div id="btn-zap">
        <div class="btn-text">FALAR NO ZAP</div>
        <div id="clicca-qui-text">CLIQUE AQUI</div>
    </div>
</a>

<div class="left-bottom-container">
    <div class="floating-text">❤️ PRISCILLA ❤️</div>
</div>
<div class="right-bottom-container">
    <div class="floating-text">❤️ MONTEIRO ❤️</div>
</div>

<script>
// SCRIPT NOTE MUSICALI
const notes = ['♪', '♫', '♬', '♩', '♭', '♮', '♯'];
const colors = ['#ff3366', '#ff9933', '#ffff33', '#33cc33', '#33cccc', '#3366ff', '#9933ff', '#ff33cc', '#00ffff', '#7fff00', '#ff1493', '#00ff7f'];
const numberOfNotes = 35;

for (let i = 0; i < numberOfNotes; i++) {
    createNote();
}

function createNote() {
    const note = document.createElement('div');
    note.className = 'musical-note';
    note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
    note.style.left = Math.random() * 100 + 'vw';
    note.style.color = colors[Math.floor(Math.random() * colors.length)];
    note.style.fontSize = (Math.random() * 24 + 16) + 'px';
    const duration = Math.random() * 5 + 4;
    const delay = Math.random() * 5;
    note.style.animationDuration = duration + 's';
    note.style.animationDelay = delay + 's';
    note.style.filter = `drop-shadow(0 0 6px ${note.style.color})`;
    document.body.appendChild(note);
    setTimeout(() => {
        note.remove();
        createNote();
    }, (duration + delay) * 1000);
}
</script>

</body></html>
