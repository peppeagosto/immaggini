<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL CARTAIO</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #f0f9ff 0%, #d4eeff 40%, #b8e2fb 75%, #9fd2f3 100%);
    font-family: sans-serif;
}

/* =========================================================
   LASTRA DI VETRO MASSICCIA E CREDIBILE (STILE VETRO TEMPERATO)
   ========================================================= */
.real-glass-slab {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    bottom: 14px;
    border-radius: 36px;
    pointer-events: none;
    z-index: 99999;
    overflow: hidden;

    /* Tinta cristallina ultra trasparente: non toglie nitidezza */
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(200, 235, 255, 0.04) 40%,
        rgba(255, 255, 255, 0.08) 100%
    );

    /* Bordo spesso molato a filo lucido (come il box d'esempio ma raffinato) */
    border: 5px solid rgba(255, 255, 255, 0.7);

    /* Profondità ottica dello spessore del cristallo */
    box-shadow:
        /* Spigolo vivo lucido in alto e a sinistra */
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        /* Riflesso interno diffuso tipico del vetro spesso */
        inset 0 0 25px rgba(255, 255, 255, 0.45),
        /* Tonalità acquamarina di spessore sui bordi */
        inset 0 0 45px rgba(0, 210, 255, 0.15),
        /* Ombra scura sul lato opposto per dare corpo al vetro */
        inset -2px -2px 6px rgba(0, 45, 80, 0.25),
        /* Ombra esterna che stacca la lastra dal display */
        0 15px 40px rgba(0, 70, 120, 0.25);
}

/* FASCIO DI RIFLESSO SPECCHIATO DINAMICO SUL VETRO */
.glass-reflection-strip {
    position: absolute;
    top: -60%;
    left: -60%;
    width: 220%;
    height: 220%;
    background: linear-gradient(
        50deg,
        transparent 38%,
        rgba(255, 255, 255, 0.04) 44%,
        rgba(255, 255, 255, 0.28) 48%,
        rgba(255, 255, 255, 0.55) 50%,
        rgba(255, 255, 255, 0.18) 52%,
        rgba(255, 255, 255, 0.02) 56%,
        transparent 62%
    );
    pointer-events: none;
    mix-blend-mode: screen;
    animation: glass-shimmer 9s ease-in-out infinite alternate;
    transition: transform 0.12s ease-out;
}

@keyframes glass-shimmer {
    0%   { transform: translate(-4%, -4%); }
    100% { transform: translate(4%, 4%); }
}

/* =========================================================
   VELI ARCOBALENO LATERALI QUASI TRASPARENTI (PERGAMENA)
   ========================================================= */
.veil {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 320px;
    pointer-events: none;
    z-index: 2;
    opacity: 0.35;
    mix-blend-mode: screen;
    filter: blur(14px);
}

.veil-left {
    left: -20px;
    background: linear-gradient(
        180deg,
        rgba(255, 182, 193, 0.28) 0%,
        rgba(255, 223, 186, 0.25) 20%,
        rgba(255, 255, 186, 0.22) 40%,
        rgba(186, 255, 201, 0.25) 60%,
        rgba(186, 225, 255, 0.28) 80%,
        rgba(227, 186, 255, 0.25) 100%
    );
    border-radius: 40px;
}

.veil-right {
    right: -20px;
    background: linear-gradient(
        180deg,
        rgba(227, 186, 255, 0.25) 0%,
        rgba(186, 225, 255, 0.28) 20%,
        rgba(186, 255, 201, 0.25) 40%,
        rgba(255, 255, 186, 0.22) 60%,
        rgba(255, 223, 186, 0.25) 80%,
        rgba(255, 182, 193, 0.28) 100%
    );
    border-radius: 40px;
}

/* =========================================================
   SCINTILLII E LUCCICHII DI SFONDO
   ========================================================= */
.sparkles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.sparkle {
    position: absolute;
    width: 22px;
    height: 22px;
    background: radial-gradient(circle, #ffffff 30%, rgba(255, 255, 255, 0.9) 60%, transparent 75%);
    clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
    filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 14px #00f2fe) drop-shadow(0 0 20px #e0f2fe);
    animation: shine-diamond 2.8s infinite ease-in-out;
}

.glow-dot {
    position: absolute;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 10px #ffffff, 0 0 18px #00f2fe, 0 0 25px #00b4d8;
    animation: float-glow 3.5s infinite ease-in-out alternate;
}

.s1  { top: 10%; left: 22%; animation-delay: 0s; transform: scale(1.1); }
.s2  { top: 22%; left: 48%; animation-delay: 0.6s; transform: scale(1.6); }
.s3  { top: 14%; left: 74%; animation-delay: 1.2s; transform: scale(1.3); }
.s4  { top: 38%; left: 32%; animation-delay: 1.8s; transform: scale(0.9); }
.s5  { top: 48%; left: 66%; animation-delay: 0.3s; transform: scale(1.5); }
.s6  { top: 72%; left: 24%; animation-delay: 1.5s; transform: scale(1.2); }
.s7  { top: 82%; left: 50%; animation-delay: 2.1s; transform: scale(1.0); }
.s8  { top: 70%; left: 78%; animation-delay: 0.9s; transform: scale(1.7); }
.s9  { top: 32%; left: 88%; animation-delay: 2.4s; transform: scale(1.1); }
.s10 { top: 58%; left: 14%; animation-delay: 0.5s; transform: scale(1.4); }
.s11 { top: 6%;  left: 58%; animation-delay: 1.7s; transform: scale(1.2); }
.s12 { top: 88%; left: 36%; animation-delay: 1.1s; transform: scale(1.3); }
.s13 { top: 44%; left: 52%; animation-delay: 2.7s; transform: scale(1.8); }

.g1 { width: 5px; height: 5px; top: 18%; left: 38%; animation-delay: 0.2s; }
.g2 { width: 7px; height: 7px; top: 28%; left: 60%; animation-delay: 1.4s; }
.g3 { width: 6px; height: 6px; top: 62%; left: 42%; animation-delay: 0.8s; }
.g4 { width: 4px; height: 4px; top: 78%; left: 68%; animation-delay: 2.2s; }
.g5 { width: 8px; height: 8px; top: 52%; left: 20%; animation-delay: 1.9s; }
.g6 { width: 5px; height: 5px; top: 84%; left: 84%; animation-delay: 0.5s; }

@keyframes shine-diamond {
    0%   { transform: scale(0.1) rotate(0deg); opacity: 0.05; }
    50%  { transform: scale(1.35) rotate(45deg); opacity: 1; }
    100% { transform: scale(0.1) rotate(90deg); opacity: 0.05; }
}

@keyframes float-glow {
    0%   { transform: translateY(0px) scale(0.7); opacity: 0.3; }
    50%  { transform: translateY(-8px) scale(1.3); opacity: 1; }
    100% { transform: translateY(0px) scale(0.7); opacity: 0.3; }
}

/* =========================================================
   CONTENITORI BOX IMMAGINE CON GLOW
   ========================================================= */
.box-img {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 14px;
    border: 2px solid #00f2fe;
    box-shadow: 0 0 15px #00f2fe, 0 0 35px #00c4df, 0 0 60px rgba(0, 242, 254, 0.4);
    overflow: hidden;
    z-index: 10;
}

.box-left { left: 24px; }
.box-right { right: 24px; }

.box-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* PICCOLO TESTO "anto" IN BASSO A DESTRA */
.anto-badge {
    position: absolute;
    bottom: 10px;
    right: 12px;
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    text-shadow: 0 0 4px #ffffff, 0 0 10px #00f2fe, 0 0 16px #0096c7;
    pointer-events: none;
    z-index: 12;
    text-transform: lowercase;
    letter-spacing: 0.5px;
}

/* TESTO CON OMBRA TURCHESE (RADIO ZANO) */
.img-text {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 6px #fff, 0 0 12px #00f2fe, 0 0 20px #0096c7;
    pointer-events: none;
    animation: wave 3s ease-in-out infinite;
}

@keyframes wave {
    0%   { transform: translateY(0) rotate(0deg); }
    25%  { transform: translateY(-4px) rotate(-1deg); }
    50%  { transform: translateY(0) rotate(0deg); }
    75%  { transform: translateY(4px) rotate(1deg); }
    100% { transform: translateY(0) rotate(0deg); }
}
</style>
</head>
<body>

<!-- LASTRA DI VETRO SPESSA FRONTALE (STILE CRISTALLO TEMPERATO) -->
<div class="real-glass-slab">
    <div class="glass-reflection-strip" id="glassReflect"></div>
</div>

<!-- VELI ARCOBALENO TRASPARENTI EFFETTO PERGAMENA -->
<div class="veil veil-left"></div>
<div class="veil veil-right"></div>

<!-- CHICCHE LUCIDE & LUCCICHII -->
<div class="sparkles-container">
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>
    <div class="sparkle s5"></div>
    <div class="sparkle s6"></div>
    <div class="sparkle s7"></div>
    <div class="sparkle s8"></div>
    <div class="sparkle s9"></div>
    <div class="sparkle s10"></div>
    <div class="sparkle s11"></div>
    <div class="sparkle s12"></div>
    <div class="sparkle s13"></div>

    <div class="glow-dot g1"></div>
    <div class="glow-dot g2"></div>
    <div class="glow-dot g3"></div>
    <div class="glow-dot g4"></div>
    <div class="glow-dot g5"></div>
    <div class="glow-dot g6"></div>
</div>

<!-- BOX SINISTRO (Con piccolo "anto" in basso a destra) -->
<div class="box-img box-left">
    <img src="https://xatimg.com/image/SAsHphNMESPA.jpg" alt="Antonia">
    <div class="anto-badge">anto</div>
</div>

<!-- BOX DESTRO (Radio Zano) -->
<div class="box-img box-right">
    <img src="https://xatimg.com/image/vIui5MFncQcN.jpg" alt="Radio Zano">
    <div class="img-text">Radio Zano</div>
</div>

<script>
// Riflesso reattivo: muovendo il cursore, la lucentezza scivola naturalmente sul vetro
const reflect = document.getElementById('glassReflect');
window.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 35;
    const y = (e.clientY / window.innerHeight - 0.5) * 35;
    reflect.style.transform = `translate(${x}px, ${y}px)`;
});
</script>

</body>
</html>
