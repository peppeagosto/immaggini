<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUONE FESTE</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #141229 0%, #06060d 65%, #000000 100%);
    font-family: 'Arial Black', Impact, sans-serif;
}

/* Canvas per le scie luminose arcobaleno del puntatore */
#trail-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10000;
}

/* Contenitore Testo 3D Luminoso */
.stage-3d {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    perspective: 900px;
    z-index: 50;
    pointer-events: none;
    text-align: center;
    width: 60%;
}

.text-3d {
    font-size: clamp(38px, 6vw, 96px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 5px;
    color: #ffffff;
    display: inline-block;
    transform-style: preserve-3d;
    animation: float3D 4.5s ease-in-out infinite, neonCycle 6s linear infinite;
    text-shadow:
        0 1px 0 #d6e9ff,
        0 2px 0 #a8d4ff,
        0 3px 0 #79beff,
        0 4px 0 #4aa8ff,
        0 5px 0 #1e90ff,
        0 6px 0 #0066cc,
        0 7px 0 #004999,
        0 8px 0 #002e66,
        0 10px 18px rgba(0, 0, 0, 0.85),
        0 0 18px rgba(0, 212, 255, 0.95),
        0 0 40px rgba(0, 170, 255, 0.85),
        0 0 80px rgba(140, 0, 255, 0.75);
}

@keyframes float3D {
    0%, 100% {
        transform: rotateX(12deg) rotateY(-12deg) translateY(0px) scale(1);
    }
    50% {
        transform: rotateX(-8deg) rotateY(12deg) translateY(-12px) scale(1.04);
    }
}

@keyframes neonCycle {
    0%   { filter: hue-rotate(0deg) brightness(1.05); }
    50%  { filter: hue-rotate(180deg) brightness(1.2); }
    100% { filter: hue-rotate(360deg) brightness(1.05); }
}

/* Box Video Destra e Sinistra con bordo 6px arcobaleno + glow */
.video-box {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 20px;
    z-index: 9999;
}

.video-left { left: 12px; }
.video-right { right: 12px; }

/* Glow esterno sfumato arcobaleno */
.video-box::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 24px;
    background: linear-gradient(
        45deg,
        #ff0000, #ff7300, #fffb00, #48ff00,
        #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000
    );
    background-size: 300% 300%;
    animation: rainbowFlow 4s linear infinite;
    filter: blur(18px);
    opacity: 0.9;
    z-index: 1;
}

/* Bordo netto da 6px sfumato arcobaleno */
.video-box::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(
        45deg,
        #ff0000, #ff7300, #fffb00, #48ff00,
        #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000
    );
    background-size: 300% 300%;
    animation: rainbowFlow 4s linear infinite;
    z-index: 2;
}

/* Contenitore interno del video (lascia esattamente 6px di bordo) */
.video-inner {
    position: absolute;
    inset: 6px;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    z-index: 3;
}

.video-inner video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

@keyframes rainbowFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
</style>
</head>
<body>

<canvas id="trail-canvas"></canvas>

<div class="stage-3d">
    <div class="text-3d">BUONE FESTE</div>
</div>

<div class="video-box video-left">
    <div class="video-inner">
        <video src="https://i.imgur.com/RvT2bRh.mp4" autoplay loop muted playsinline></video>
    </div>
</div>

<div class="video-box video-right">
    <div class="video-inner">
        <video src="https://i.imgur.com/RvT2bRh.mp4" autoplay loop muted playsinline></video>
    </div>
</div>

<script>
const canvas = document.getElementById('trail-canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const particles = [];
const trailPoints = [];
let hue = 0;

function addPoint(x, y) {
    trailPoints.push({ x, y, hue, alpha: 1 });
    if (trailPoints.length > 28) trailPoints.shift();

    for (let i = 0; i < 3; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 10,
            y: y + (Math.random() - 0.5) * 10,
            vx: (Math.random() - 0.5) * 1.8,
            vy: (Math.random() - 0.5) * 1.8,
            size: Math.random() * 7 + 3,
            hue: (hue + Math.random() * 40) % 360,
            alpha: 1,
            decay: Math.random() * 0.025 + 0.02
        });
    }
}

window.addEventListener('mousemove', (e) => {
    addPoint(e.clientX, e.clientY);
});

window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
        addPoint(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

function animate() {
    ctx.clearRect(0, 0, width, height);
    hue = (hue + 2.5) % 360;

    ctx.globalCompositeOperation = 'lighter';

    for (let i = 1; i < trailPoints.length; i++) {
        const prev = trailPoints[i - 1];
        const curr = trailPoints[i];
        curr.alpha -= 0.032;

        if (curr.alpha > 0) {
            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(curr.x, curr.y);
            ctx.strokeStyle = `hsla(${curr.hue}, 100%, 60%, ${curr.alpha * 0.85})`;
            ctx.lineWidth = Math.max(1, (i / trailPoints.length) * 14);
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20;
            ctx.shadowColor = `hsl(${curr.hue}, 100%, 60%)`;
            ctx.stroke();
        }
    }

    while (trailPoints.length > 0 && trailPoints[0].alpha <= 0) {
        trailPoints.shift();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        p.size *= 0.97;

        if (p.alpha <= 0 || p.size <= 0.4) {
            particles.splice(i, 1);
            continue;
        }

        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.2);
        grad.addColorStop(0, `hsla(${p.hue}, 100%, 75%, ${p.alpha})`);
        grad.addColorStop(0.5, `hsla(${p.hue}, 100%, 55%, ${p.alpha * 0.5})`);
        grad.addColorStop(1, `hsla(${p.hue}, 100%, 50%, 0)`);

        ctx.shadowBlur = 0;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
        ctx.fill();
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
