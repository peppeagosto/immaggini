<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>saracino</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        height: 100%;
        font-family: sans-serif;
    }

    /* VIDEO MP4 CENTRALE DI SFONDO */
    .bg-video {
        position: fixed;
        top: 50%;
        left: 50%;
        min-width: 100vw;
        min-height: 100vh;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translate(-50%, -50%) scale(1.1) translateX(5%);
        z-index: 1;
        opacity: 0.85;
    }

    /* I DUE BAGLIORI (2 GLOW) AMBIENTALI */
    .glow-bg {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 2;
        opacity: 0.6;
    }
    .glow-1 {
        top: -10%; left: -10%;
        width: 50vh; height: 50vh;
        background: #ff0000;
    }
    .glow-2 {
        bottom: -10%; right: -10%;
        width: 50vh; height: 50vh;
        background: #0055ff;
    }

    /* 2. BOX VIDEO CON BORDI ARCOBALENO */
    .video-wrapper {
        position: fixed;
        width: 240px;
        height: 520px;
        top: 50%;
        transform: translateY(-50%);
        border-radius: 24px;
        padding: 8px;
        background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
        background-size: 300% 300%;
        animation: rainbowBG 4s ease infinite;
        z-index: 9999;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    .video-left { left: 15px; }
    .video-right { right: 15px; }

    @keyframes rainbowBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .video-inner {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        background: #000;
    }

    .video-inner video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
</style>
</head>
<body>

<!-- Video MP4 Centrale di Sfondo -->
<video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
    <source src="https://i.imgur.com/4Wr7VZi.mp4" type="video/mp4">
</video>

<!-- I due bagliori ambientali -->
<div class="glow-bg glow-1"></div>
<div class="glow-bg glow-2"></div>

<!-- Video Sinistra -->
<div class="video-wrapper video-left">
    <div class="video-inner">
        <video class="side-video" autoplay loop muted playsinline>
            <source src="https://i.imgur.com/tJDKSCU.mp4" type="video/mp4">
        </video>
    </div>
</div>

<!-- Video Destra -->
<div class="video-wrapper video-right">
    <div class="video-inner">
        <video class="side-video" autoplay loop muted playsinline>
            <source src="https://i.imgur.com/tJDKSCU.mp4" type="video/mp4">
        </video>
    </div>
</div>

</body>
</html>
