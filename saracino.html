<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>saracino</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        height: 100%;
        font-family: sans-serif;
    }

    /* VIDEO MP4 CENTRALE DI SFONDO */
    .bg-video {
        position: fixed;
        top: 50%;
        left: 50%;
        min-width: 100vw;
        min-height: 100vh;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translate(-50%, -50%) scale(1.1) translateX(5%);
        z-index: 1;
        opacity: 0.85;
    }

    /* I DUE BAGLIORI (2 GLOW) AMBIENTALI */
    .glow-bg {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 2;
        opacity: 0.6;
    }
    .glow-1 {
        top: -10%; left: -10%;
        width: 50vh; height: 50vh;
        background: #ff0000;
    }
    .glow-2 {
        bottom: -10%; right: -10%;
        width: 50vh; height: 50vh;
        background: #0055ff;
    }

    /* 2. BOX VIDEO CON BORDI ARCOBALENO */
    .video-wrapper {
        position: fixed;
        width: 240px;
        height: 520px;
        top: 50%;
        transform: translateY(-50%);
        border-radius: 24px;
        padding: 8px;
        background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
        background-size: 300% 300%;
        animation: rainbowBG 4s ease infinite;
        z-index: 9999;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    .video-left { left: 15px; }
    .video-right { right: 15px; }

    @keyframes rainbowBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .video-inner {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        background: #000;
    }

    .video-inner video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* TESTO FLUTTUANTE ARCOBALENO SU VIDEO LATERALI */
    .video-text {
        position: absolute;
        bottom: 12px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 24px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s linear infinite, floatSide 4s ease-in-out infinite;
        pointer-events: none;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
    }

    /* 3. TESTO CHE SI MUOVE PER LO SCHERMO */
    .moving-x {
        position: fixed;
        top: 0; left: 0;
        width: max-content;
        z-index: 9998;
        pointer-events: none;
        animation: moveX 9s linear infinite alternate;
    }
    .moving-y {
        animation: moveY 6s ease-in-out infinite alternate;
        padding: 20px;
    }

    .xat-text {
        font-size: 45px;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
        background: linear-gradient(90deg, #ff0000, #ffcc00, #ff0000);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.9)) drop-shadow(0 0 25px rgba(255, 165, 0, 0.9));
        animation: shine 3s linear infinite;
    }

    /* PULSANTE ASCOLTA IL DRAGO TOGGLE (ON / OFF) */
    #toggleAudioBtn {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        padding: 12px 26px;
        font-size: 16px;
        font-weight: 900;
        text-transform: uppercase;
        color: #fff;
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid #ff3333;
        border-radius: 50px;
        cursor: pointer;
        outline: none;
        transition: all 0.25s ease;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        animation: floatBtn 3s ease-in-out infinite;
        user-select: none;
    }

    #toggleAudioBtn:hover {
        background-color: #ff0000;
        color: #fff;
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
        border-color: #fff;
    }

    #toggleAudioBtn.active {
        border-color: #00ff66;
        box-shadow: 0 0 20px rgba(0, 255, 102, 0.7);
        color: #00ff66;
    }

    #toggleAudioBtn.active:hover {
        background-color: #00ff66;
        color: #000;
    }

    /* Animazioni */
    @keyframes shine { to { background-position: 200% center; } }
    
    @keyframes floatSide {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
    }

    @keyframes floatBtn {
        0%, 100% { transform: translateX(-50%) translateY(0px); }
        50% { transform: translateX(-50%) translateY(-8px); }
    }

    @keyframes moveX {
        0% { transform: translateX(0); }
        100% { transform: translateX(calc(100vw - 100%)); }
    }
    @keyframes moveY {
        0% { transform: translateY(0); }
        100% { transform: translateY(calc(100vh - 100%)); }
    }
</style>
</head>
<body>

<!-- Video MP4 Centrale di Sfondo -->
<video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
    <source src="https://i.imgur.com/4Wr7VZi.mp4" type="video/mp4">
</video>

<!-- I due bagliori ambientali -->
<div class="glow-bg glow-1"></div>
<div class="glow-bg glow-2"></div>

<!-- Testo LA XAT DRAGO ROSSO -->
<div class="moving-x">
    <div class="moving-y">
        <div class="xat-text">LA XAT DRAGO ROSSO</div>
    </div>
</div>

<!-- Video Sinistra: SARACINO -->
<div class="video-wrapper video-left">
    <div class="video-inner">
        <video class="side-video" autoplay loop muted playsinline>
            <source src="https://i.imgur.com/tJDKSCU.mp4" type="video/mp4">
        </video>
        <div class="video-text">Kialillo</div>
    </div>
</div>

<!-- Video Destra: PEPPE -->
<div class="video-wrapper video-right">
    <div class="video-inner">
        <video class="side-video" autoplay loop muted playsinline>
            <source src="https://i.imgur.com/tJDKSCU.mp4" type="video/mp4">
        </video>
        <div class="video-text">Drago</div>
    </div>
</div>

<!-- Pulsante Toggle Audio (8s Max) -->
<button id="toggleAudioBtn">Ascolta il Drago [OFF]</button>

<script>
    const bgVideo = document.getElementById('bgVideo');
    const toggleBtn = document.getElementById('toggleAudioBtn');
    let autoMuteTimer = null;

    function disattivaAudio() {
        bgVideo.muted = true;
        toggleBtn.classList.remove('active');
        toggleBtn.textContent = 'Ascolta il Drago [OFF]';
        if (autoMuteTimer) {
            clearTimeout(autoMuteTimer);
            autoMuteTimer = null;
        }
    }

    function attivaAudio() {
        bgVideo.muted = false;
        bgVideo.play().catch(() => {});
        toggleBtn.classList.add('active');
        toggleBtn.textContent = 'Audio Drago [ON]';

        // Auto-spegnimento dopo 8 secondi
        autoMuteTimer = setTimeout(() => {
            disattivaAudio();
        }, 8000);
    }

    toggleBtn.addEventListener('click', () => {
        if (bgVideo.muted) {
            attivaAudio();
        } else {
            disattivaAudio();
        }
    });
</script>

</body>
</html>
