<!DOCTYPE html>
<html lang="it" class="bg-transparent">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroller Foto Marquee</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style type="text/css">
    html, body {
      background-color: transparent !important;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 100%;
      height: 100%;
      pointer-events: auto !important;
      user-select: none;
    }

    /* Area Marquee a tutta larghezza protetta */
    .marquee-container-full {
      width: 100% !important;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      height: 220px;
      overflow: hidden;
      position: relative;
      background: transparent !important;
      pointer-events: auto !important;
    }

    /* Traccia continua a 60fps */
    .zoomin-track {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 220px;
      width: max-content;
      will-change: transform;
      cursor: pointer;
      pointer-events: auto !important;
    }

    .zoomin-track img {
      height: var(--card-height, 160px);
      width: var(--card-width, 250px);
      margin: 0 4px;
      vertical-align: middle;
      border-radius: 12px;
      object-fit: cover;
      cursor: pointer !important;
      box-sizing: border-box;
      flex-shrink: 0;
      pointer-events: auto !important;

      /* Bordo sfumato arcobaleno fine a riposo 3.5px */
      border: var(--rainbow-width, 3.5px) solid transparent;
      background: 
        linear-gradient(rgba(10, 15, 29, 0.95), rgba(10, 15, 29, 0.95)) padding-box,
        linear-gradient(135deg, 
          rgba(255, 0, 90, var(--rainbow-opacity, 0.9)) 0%, 
          rgba(255, 140, 0, var(--rainbow-opacity, 0.9)) 18%, 
          rgba(255, 230, 0, var(--rainbow-opacity, 0.9)) 36%, 
          rgba(0, 255, 140, var(--rainbow-opacity, 0.9)) 54%, 
          rgba(0, 210, 255, var(--rainbow-opacity, 0.9)) 72%, 
          rgba(150, 0, 255, var(--rainbow-opacity, 0.9)) 88%, 
          rgba(255, 0, 130, var(--rainbow-opacity, 0.9)) 100%) border-box;

      box-shadow: 
        0 10px 24px -6px rgba(0, 0, 0, 0.85),
        0 0 calc(var(--rainbow-glow, 8px)) rgba(0, 210, 255, calc(var(--rainbow-opacity, 0.9) * 0.45)),
        0 0 calc(var(--rainbow-glow, 14px)) rgba(255, 0, 130, calc(var(--rainbow-opacity, 0.9) * 0.35));

      filter: brightness(var(--photo-brightness, 120%)) contrast(var(--photo-contrast, 105%)) drop-shadow(0 0 var(--photo-glow, 3px) rgba(56, 189, 248, 0.35));
      transform: scale(var(--beat-scale, 1));

      /* Transizione dolce a 2 secondi */
      -webkit-transition: width 2s ease, height 2s ease, transform 0.25s ease, border 0.25s ease;
      -moz-transition: width 2s ease, height 2s ease, transform 0.25s ease, border 0.25s ease;
      -ms-transition: width 2s ease, height 2s ease, transform 0.25s ease, border 0.25s ease;
      transition: width 2s ease, height 2s ease, transform 0.25s ease, border 0.25s ease;
    }

    /* Zoom dolce su Hover senza scatti del layout */
    .zoomin-track img:hover {
      width: var(--hover-width, 310px);
      height: var(--hover-height, 198px);
      box-shadow: 
        0 16px 32px -6px rgba(0, 0, 0, 0.95), 
        0 0 calc(var(--rainbow-glow, 8px) + 8px) rgba(0, 210, 255, 0.75),
        0 0 calc(var(--rainbow-glow, 14px) + 12px) rgba(255, 0, 130, 0.65);
    }

    #discoFlashOverlay {
      pointer-events: none !important;
      transition: opacity 0.05s ease-out;
    }

    #particleCanvas {
      pointer-events: none !important;
    }

    /* Lightbox sicuro per iframe: display none quando chiuso per non bloccare click */
    #photoLightbox {
      display: none;
      pointer-events: none !important;
    }
    #photoLightbox.is-active {
      display: flex !important;
      pointer-events: auto !important;
    }

    #bannerSatellite {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

<body class="selection:bg-cyan-500 selection:text-slate-950">

  <!-- Canvas Particelle & Flash Beat -->
  <canvas id="particleCanvas" width="800" height="220" class="fixed inset-0 w-full h-[220px] object-cover pointer-events-none opacity-0 transition-opacity duration-500 z-10"></canvas>
  <div id="discoFlashOverlay" class="fixed inset-0 h-[220px] bg-cyan-400 opacity-0 pointer-events-none z-20"></div>

  <!-- Banner Notifiche Satellitari Fluttuante -->
  <div id="bannerSatellite" class="fixed top-2 left-1/2 -translate-x-1/2 z-30 opacity-0 pointer-events-none px-4 py-1.5 rounded-full bg-slate-950/90 border border-cyan-500/50 shadow-xl backdrop-blur-xl text-xs font-mono text-cyan-300 font-bold">
    Notifica Satellite
  </div>

  <!-- ======================================================== -->
  <!-- SCROLLER CONTINUO A TUTTA LARGHEZZA                     -->
  <!-- ======================================================== -->
  <div class="marquee-container-full" id="marqueeContainer">
    <div class="zoomin-track" id="mainTrack">
      <!-- Set A: Le tue 8 foto originali -->
      <img src="https://xatimg.com/image/grjOikS35f4E.jpg" alt="Foto 1" border="0" onclick="openPhotoLightbox(this.src, 'Foto 1')" />
      <img src="https://xatimg.com/image/w5DGP9TLYyak.jpg" alt="Foto 2" border="0" onclick="openPhotoLightbox(this.src, 'Foto 2')" />
      <img src="https://xatimg.com/image/wHeqwnmUCRy3.jpg" alt="Foto 3" border="0" onclick="openPhotoLightbox(this.src, 'Foto 3')" />
      <img src="https://xatimg.com/image/0P7xHqyxOWYt.jpg" alt="Foto 4" border="0" onclick="openPhotoLightbox(this.src, 'Foto 4')" />
      <img src="https://xatimg.com/image/lZPsw43H8IbK.jpg" alt="Foto 5" border="0" onclick="openPhotoLightbox(this.src, 'Foto 5')" />
      <img src="https://xatimg.com/image/VLUYcC0g6Jjv.jpg" alt="Foto 6" border="0" onclick="openPhotoLightbox(this.src, 'Foto 6')" />
      <img src="https://xatimg.com/image/grjOikS35f4E.jpg" alt="Foto 7" border="0" onclick="openPhotoLightbox(this.src, 'Foto 7')" />
      <img src="https://xatimg.com/image/VLUYcC0g6Jjv.jpg" alt="Foto 8" border="0" onclick="openPhotoLightbox(this.src, 'Foto 8')" />

      <!-- Set B: Clone per scorrimento infinito bidirezionale -->
      <img src="https://xatimg.com/image/grjOikS35f4E.jpg" alt="Foto 1" border="0" onclick="openPhotoLightbox(this.src, 'Foto 1')" />
      <img src="https://xatimg.com/image/w5DGP9TLYyak.jpg" alt="Foto 2" border="0" onclick="openPhotoLightbox(this.src, 'Foto 2')" />
      <img src="https://xatimg.com/image/wHeqwnmUCRy3.jpg" alt="Foto 3" border="0" onclick="openPhotoLightbox(this.src, 'Foto 3')" />
      <img src="https://xatimg.com/image/0P7xHqyxOWYt.jpg" alt="Foto 4" border="0" onclick="openPhotoLightbox(this.src, 'Foto 4')" />
      <img src="https://xatimg.com/image/lZPsw43H8IbK.jpg" alt="Foto 5" border="0" onclick="openPhotoLightbox(this.src, 'Foto 5')" />
      <img src="https://xatimg.com/image/VLUYcC0g6Jjv.jpg" alt="Foto 6" border="0" onclick="openPhotoLightbox(this.src, 'Foto 6')" />
      <img src="https://xatimg.com/image/grjOikS35f4E.jpg" alt="Foto 7" border="0" onclick="openPhotoLightbox(this.src, 'Foto 7')" />
      <img src="https://xatimg.com/image/VLUYcC0g6Jjv.jpg" alt="Foto 8" border="0" onclick="openPhotoLightbox(this.src, 'Foto 8')" />
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- MODALE LIGHTBOX (ISOLATA E NON BLOCCANTE)               -->
  <!-- ======================================================== -->
  <div id="photoLightbox" class="fixed inset-0 z-50 items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-300 opacity-0">
    <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-30 pointer-events-auto">
      <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-700/80 px-4 py-2 rounded-2xl backdrop-blur-xl">
        <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">GALLERIA</span>
        <h3 id="lightboxTitle" class="text-sm font-bold text-white tracking-tight">Foto Selezionata</h3>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center bg-slate-900/90 border border-slate-700/80 rounded-2xl p-1 backdrop-blur-xl">
          <button type="button" id="zoomOutBtn" class="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-xl transition" title="Riduci Zoom (-)">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>
            </svg>
          </button>
          <span id="zoomLevelDisplay" class="px-2 text-xs font-mono font-bold text-cyan-400 min-w-[54px] text-center">100%</span>
          <button type="button" id="zoomInBtn" class="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-xl transition" title="Aumenta Zoom (+)">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
            </svg>
          </button>
          <button type="button" id="zoomResetBtn" class="px-2.5 py-1 text-[11px] font-mono text-slate-300 hover:text-white hover:bg-slate-800 rounded-xl transition ml-1">
            Reset
          </button>
        </div>

        <button type="button" id="closeLightboxBtn" class="p-2.5 rounded-2xl bg-slate-900/90 hover:bg-red-500/80 text-slate-300 hover:text-white border border-slate-700/80 backdrop-blur-xl transition" title="Chiudi (ESC)">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Viewport trascinabile con pan e zoom -->
    <div id="lightboxViewport" class="w-full h-full flex items-center justify-center overflow-hidden relative cursor-grab active:cursor-grabbing select-none">
      <img id="lightboxImg" src="" alt="Foto ingrandita" class="max-w-[90vw] max-h-[85vh] object-contain rounded-2xl shadow-2xl transition-transform duration-75 select-none pointer-events-none will-change-transform">
    </div>

    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 px-5 py-2 rounded-2xl bg-slate-900/90 border border-slate-800/80 backdrop-blur-xl text-center pointer-events-none z-30">
      <p id="lightboxDescription" class="text-xs text-slate-200 font-medium"></p>
      <span class="text-[10px] text-slate-400 font-mono mt-0.5 block">Trascina con il mouse per muovere &bull; Rotellina per zoomare &bull; ESC per chiudere</span>
    </div>
  </div>

  <script>
    // Riferimenti DOM Principali
    const mainTrack = document.getElementById('mainTrack');
    const bannerSatellite = document.getElementById('bannerSatellite');
    const particleCanvas = document.getElementById('particleCanvas');
    const discoFlash = document.getElementById('discoFlashOverlay');
    const ctx = particleCanvas.getContext('2d');

    // Motore Scorrimento Continuo a 60 FPS
    let currentOffset = 0;
    let currentDirection = -1; // -1 = DX -> SX, +1 = SX -> DX
    let scrollSpeed = 1.8;
    let isPaused = false;
    let isHovered = false;

    function animateMarquee() {
      if (!isPaused && !isHovered) {
        currentOffset += currentDirection * scrollSpeed;
        const halfWidth = mainTrack.scrollWidth / 2;

        if (halfWidth > 0) {
          if (currentOffset <= -halfWidth) {
            currentOffset += halfWidth;
          } else if (currentOffset >= 0) {
            currentOffset -= halfWidth;
          }
        }
        mainTrack.style.transform = `translate3d(${currentOffset}px, 0, 0)`;
      }
      requestAnimationFrame(animateMarquee);
    }

    mainTrack.addEventListener('mouseenter', () => { isHovered = true; });
    mainTrack.addEventListener('mouseleave', () => { isHovered = false; });

    // Funzioni di regolazione dello Scroller
    function setDirection(dir) {
      currentDirection = (dir === 'right') ? 1 : -1;
    }

    function toggleDirection() {
      currentDirection = (currentDirection === -1) ? 1 : -1;
    }

    function setSpeed(val) {
      scrollSpeed = parseFloat(val);
    }

    function setPlayState(paused) {
      isPaused = paused;
    }

    function applyCardDimensions(widthVal) {
      const heightVal = Math.round(widthVal * 0.64);
      const hoverW = Math.round(widthVal * 1.24);
      const hoverH = Math.round(heightVal * 1.24);

      document.documentElement.style.setProperty('--card-width', `${widthVal}px`);
      document.documentElement.style.setProperty('--card-height', `${heightVal}px`);
      document.documentElement.style.setProperty('--hover-width', `${hoverW}px`);
      document.documentElement.style.setProperty('--hover-height', `${hoverH}px`);
    }

    function applyRainbowBorder(val) {
      const borderThickness = (3.5 + (val / 100) * 12.5).toFixed(1);
      const opacity = (0.35 + (val / 100) * 0.65).toFixed(2);
      const glowPx = Math.round(6 + (val / 100) * 18);

      document.documentElement.style.setProperty('--rainbow-width', `${borderThickness}px`);
      document.documentElement.style.setProperty('--rainbow-opacity', opacity);
      document.documentElement.style.setProperty('--rainbow-glow', `${glowPx}px`);
    }

    function applyBrightness(val) {
      document.documentElement.style.setProperty('--photo-brightness', `${val}%`);
      const contrastVal = Math.min(100 + (val - 100) * 0.15, 135);
      const glowVal = Math.max(0, Math.round((val - 100) * 0.07));
      document.documentElement.style.setProperty('--photo-contrast', `${contrastVal}%`);
      document.documentElement.style.setProperty('--photo-glow', `${glowVal}px`);
    }

    function showSatelliteNotification(text) {
      bannerSatellite.textContent = text;
      bannerSatellite.classList.remove('opacity-0', 'pointer-events-none');
      bannerSatellite.classList.add('opacity-100');
      setTimeout(() => {
        bannerSatellite.classList.remove('opacity-100');
        bannerSatellite.classList.add('opacity-0', 'pointer-events-none');
      }, 3500);
    }

    let isDiscoMode = false;
    let explosionInterval = null;
    let particles = [];
    const pColors = ['#00f2ff', '#ff00c8', '#fffb00', '#48ff00', '#ffffff'];

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * particleCanvas.width;
        this.y = Math.random() * particleCanvas.height;
        this.size = Math.random() * 4 + 2;
        this.speedX = (Math.random() - 0.5) * 3;
        this.speedY = (Math.random() - 0.5) * 3;
        this.color = pColors[Math.floor(Math.random() * pColors.length)];
      }
      update(boost) {
        this.x += this.speedX * (1 + boost * 2.5);
        this.y += this.speedY * (1 + boost * 2.5);
        if (this.x > particleCanvas.width || this.x < 0 || this.y > particleCanvas.height || this.y < 0) this.reset();
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 75; i++) particles.push(new Particle());

    function renderParticlesLoop() {
      if (isDiscoMode) {
        ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        particles.forEach(p => { p.update(0.3); p.draw(); });
      }
      requestAnimationFrame(renderParticlesLoop);
    }
    renderParticlesLoop();

    // COMUNICAZIONE TRAMITE BROADCASTCHANNEL E POSTMESSAGE
    const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('xat_marquee_sync') : null;

    function handleIncomingCommand(msg) {
      if (!msg || !msg.type) return;

      switch (msg.type) {
        case 'TOGGLE_PLAY':
          isPaused = (msg.isPaused !== undefined) ? msg.isPaused : !isPaused;
          break;
        case 'TOGGLE_DIRECTION':
          toggleDirection();
          break;
        case 'SET_SPEED':
          if (msg.value !== undefined) setSpeed(msg.value);
          break;
        case 'SET_SIZE':
          if (msg.value !== undefined) applyCardDimensions(parseInt(msg.value));
          break;
        case 'SET_BORDER':
          if (msg.value !== undefined) applyRainbowBorder(parseInt(msg.value));
          break;
        case 'SET_BRIGHTNESS':
          if (msg.value !== undefined) applyBrightness(parseInt(msg.value));
          break;
        case 'BEAT_PULSE':
          if (msg.scale !== undefined) {
            document.documentElement.style.setProperty('--beat-scale', msg.scale);
          }
          if (msg.flash) {
            discoFlash.style.opacity = '0.7';
            setTimeout(() => { discoFlash.style.opacity = '0'; }, 35);
          }
          break;
        case 'TRIGGER_SATELLITE':
          if (msg.satellite === 'disco') {
            isDiscoMode = msg.active;
            particleCanvas.style.opacity = isDiscoMode ? '0.75' : '0';
          } else if (msg.satellite === 'esplosione') {
            if (msg.active) {
              const hot = ['#FF0000', '#FF4500', '#FF8C00', '#FFA500', '#FFD700', '#FF0080', '#FF1493', '#FFFFFF'];
              if (explosionInterval) clearInterval(explosionInterval);
              explosionInterval = setInterval(() => {
                const chosen = hot[Math.floor(Math.random() * hot.length)];
                document.documentElement.style.setProperty('--photo-glow', '12px');
                document.querySelectorAll('.zoomin-track img').forEach(el => { el.style.borderColor = chosen; });
              }, 400);
            } else {
              if (explosionInterval) { clearInterval(explosionInterval); explosionInterval = null; }
              document.documentElement.style.setProperty('--photo-glow', '3px');
            }
          }
          if (msg.bannerText) showSatelliteNotification(msg.bannerText);
          break;
      }
    }

    if (syncChannel) {
      syncChannel.onmessage = (event) => handleIncomingCommand(event.data);
    }

    window.addEventListener('message', (event) => {
      try {
        const msg = (typeof event.data === 'string') ? JSON.parse(event.data) : event.data;
        handleIncomingCommand(msg);
      } catch (e) {}
    });

    const photoLightbox = document.getElementById('photoLightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxDescription = document.getElementById('lightboxDescription');
    const lightboxViewport = document.getElementById('lightboxViewport');
    const closeLightboxBtn = document.getElementById('closeLightboxBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');

    let currentZoom = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function refreshLightboxTransform() {
      lightboxImg.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${currentZoom})`;
      zoomLevelDisplay.textContent = `${Math.round(currentZoom * 100)}%`;
    }

    function resetZoomState() {
      currentZoom = 1;
      offsetX = 0;
      offsetY = 0;
      refreshLightboxTransform();
    }

    function openPhotoLightbox(src, titleText) {
      lightboxImg.src = src;
      lightboxTitle.textContent = titleText;
      lightboxDescription.textContent = `${titleText} - Vista alta definizione`;
      resetZoomState();

      photoLightbox.classList.add('is-active');
      setTimeout(() => photoLightbox.classList.remove('opacity-0'), 10);
    }

    function closeLightbox() {
      photoLightbox.classList.add('opacity-0');
      setTimeout(() => {
        photoLightbox.classList.remove('is-active');
        lightboxImg.src = '';
        resetZoomState();
      }, 200);
    }

    closeLightboxBtn.addEventListener('click', closeLightbox);

    zoomInBtn.addEventListener('click', () => {
      currentZoom = Math.min(currentZoom + 0.3, 4.0);
      refreshLightboxTransform();
    });

    zoomOutBtn.addEventListener('click', () => {
      currentZoom = Math.max(currentZoom - 0.3, 0.6);
      if (currentZoom <= 1) { offsetX = 0; offsetY = 0; }
      refreshLightboxTransform();
    });

    zoomResetBtn.addEventListener('click', resetZoomState);

    lightboxViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const step = e.deltaY < 0 ? 0.2 : -0.2;
      currentZoom = Math.min(Math.max(currentZoom + step, 0.6), 4.5);
      if (currentZoom <= 1) { offsetX = 0; offsetY = 0; }
      refreshLightboxTransform();
    }, { passive: false });

    lightboxViewport.addEventListener('mousedown', (e) => {
      if (e.target !== lightboxViewport && e.target !== lightboxImg) return;
      isDragging = true;
      dragStartX = e.clientX - offsetX;
      dragStartY = e.clientY - offsetY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      offsetX = e.clientX - dragStartX;
      offsetY = e.clientY - dragStartY;
      refreshLightboxTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    lightboxViewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX - offsetX;
        dragStartY = e.touches[0].clientY - offsetY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      offsetX = e.touches[0].clientX - dragStartX;
      offsetY = e.touches[0].clientY - dragStartY;
      refreshLightboxTransform();
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && photoLightbox.classList.contains('is-active')) {
        closeLightbox();
      }
    });

    // Inizializzazione standard
    applyCardDimensions(250);
    applyBrightness(120);
    applyRainbowBorder(0);
    setSpeed(1.8);
    requestAnimationFrame(animateMarquee);
  </script>
</body>
</html>
