<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sfondi Multipli Diablo Iframe</title>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <style>
        /* Impostazioni pagina */
        body {
            background-image: linear-gradient(109.6deg, rgba(48,207,208,1) 11.2%, rgba(51,8,103,1) 92.5%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            transition: background-image 0.5s ease-in-out;
            cursor: crosshair; 
        }

        /* IL PALLINO MAGICO IN ALTO A DESTRA */
        .but {
            z-index: 1000;
            position: absolute;
            top: 15px;    /* Distanza dall'alto */
            right: 15px;  /* Distanza da destra */
            
            width: 12px;  /* Dimensione del cerchietto */
            height: 12px;
            background-color: #ff0000;
            border-radius: 50%; /* Lo rende un cerchio perfetto */
            
            cursor: pointer;
            
            /* Animazione pulsante del LED */
            animation: ledFlash 0.8s infinite alternate;
            transition: transform 0.2s ease;
        }

        /* Quando ci passi sopra si ingrandisce un pelo per far capire che è cliccabile */
        .but:hover {
            transform: scale(1.5);
            background-color: #ff3333;
        }

        /* Animazione bagliore rosso */
        @keyframes ledFlash {
            0% {
                box-shadow: 0 0 2px #ff0000, 0 0 5px #ff0000;
                opacity: 0.6;
            }
            100% {
                box-shadow: 0 0 8px #ff0000, 0 0 15px #ff0000;
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Il testo ora è un "title" (tooltip) che compare al passaggio del mouse -->
    <div class="but" onclick="Bgs()" title="DIABLO.. GUARDA I MIEI SFONDI MULTIPLI"></div>

    <script>
        let count = 0;

        const backgrounds = [
            'linear-gradient(110.6deg, #00ffff 7%, #0080ff 100%)',
            'url(https://xatimg.com/image/wT30KBIIZ5ua.png)',
            'url(https://xatimg.com/image/93tPKKkEvBot.png)',
            'url(https://xatimg.com/image/dN2mTGssWyrP.png)',
            'url(https://xatimg.com/image/BgyRwjsii8wV.png)',
            'url(https://xatimg.com/image/4Stapy06Udhe.png)',
            'url(https://xatimg.com/image/m4bNGCPB0btz.png)',
            'url(https://xatimg.com/image/R5EShFDtKQIO.png)',
            'linear-gradient(70.6deg, rgba(255,255,0,1) 11.2%, rgba(255,100,0,1) 92.5%)'
        ];

        function Bgs() {
            $('body').css({
                'background-image': backgrounds[count],
                'background-repeat': 'no-repeat',
                'background-size': 'cover',
                'background-position': 'center'
            });

            count++;
            
            if (count >= backgrounds.length) {
                count = 0;
            }
        }
    </script>

</body>
</html>
