<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sfondo Particelle 4px</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    });

    const colors = [
      "#ff0055", "#ff00ff", "#00ffff", "#00ff66",
      "#ffff00", "#ff7700", "#9900ff", "#ffffff", "#0099ff"
    ];

    const TOTAL_PARTICLES = 1500;
    const RADIUS = 2; // 4px di diametro
    let particles = [];

    function initParticles() {
      particles = [];
      for (let i = 0; i < TOTAL_PARTICLES; i++) {
        // Circa la metà si muove, l'altra metà rimane completamente ferma
        const isMoving = Math.random() < 0.5;
        const speed = isMoving ? 0.4 + Math.random() * 0.8 : 0;
        const angle = Math.random() * Math.PI * 2;

        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: isMoving ? Math.cos(angle) * speed : 0,
          vy: isMoving ? Math.sin(angle) * speed : 0,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function animate() {
      ctx.fillStyle = "#050508";
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        // Rimbalzo ai bordi per quelle in movimento
        if (p.x < RADIUS) { p.x = RADIUS; p.vx *= -1; }
        else if (p.x > width - RADIUS) { p.x = width - RADIUS; p.vx *= -1; }

        if (p.y < RADIUS) { p.y = RADIUS; p.vy *= -1; }
        else if (p.y > height - RADIUS) { p.y = height - RADIUS; p.vy *= -1; }

        ctx.beginPath();
        ctx.arc(p.x, p.y, RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    initParticles();
    animate();
  </script>
</body>
</html>
