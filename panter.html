<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SYNC - EL CARTAIO</title>
    
    <style>
        /* ==========================================
           1. RESET TOTALE MARGINI & FULLSCREEN NO SPASI
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --rainbow: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            --accent: #00f2ff;
            --btn-grad: linear-gradient(to right, #00f2ff, #ff00c8);
            --c1: #00ff00;
            --c2: #004400;
        }

        html, body {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: #000;
            font-family: 'Arial Black', sans-serif;
            cursor: crosshair;
            z-index: 999999;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .wrapper-full {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            position: relative;
        }

        /* SFONDO DINAMICO COPRE 100% */
        .bg-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0, 255, 0, 0.3) 0%, rgba(0, 50, 0, 0.7) 100%);
            z-index: 1;
            pointer-events: none;
            transition: background 1.5s ease-in-out;
        }

        /* BARRA PALLINE TEMI IN ALTO A TUTTA LARGHEZZA */
        .theme-nav {
            position: fixed;
            top: 15px;
            left: 0;
            width: 100vw;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 999999;
            padding: 0 10px;
            pointer-events: auto;
        }

        .theme-nav span {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #fff 0%, var(--c1) 40%, var(--c2) 100%);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 -2px 5px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
        }

        .theme-nav span:hover {
            transform: scale(1.3) translateY(-3px);
            box-shadow: 0 12px 30px var(--c1), inset 0 -2px 5px rgba(0,0,0,0.5);
            border-color: #fff;
        }

        /* SCHERMATA CENTRALE FULL WIDTH */
        .stage-area {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            padding: 20px;
        }

        /* CHASSIS CHE OCCUPA TUTTA LA LARGHEZZA */
        .main-chassis {
            position: relative; 
            width: 100vw; 
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            background: radial-gradient(circle at center, #1a1a20 0%, #050505 100%);
            border-radius: 0px; 
            padding: 60px 20px 20px 20px;
            display: grid; 
            grid-template-columns: 200px 1fr 200px; 
            gap: 15px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 30px var(--accent), inset 0 0 50px #000;
            z-index: 100;
            pointer-events: auto;
        }

        .main-chassis::after {
            content: ''; position: absolute; inset: 0px;
            padding: 3px; background: var(--rainbow); background-size: 400%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; animation: rb-move 8s linear infinite;
            z-index: -1;
        }

        .display-top {
            grid-column: 1 / 4; height: 65px; background: rgba(0,0,0,0.9);
            border: 2px solid var(--accent); border-radius: 12px;
            overflow: hidden; position: relative; display: flex; align-items: center;
        }

        .marquee-box { display: flex; width: 100%; white-space: nowrap; animation: bounce-scroll 10s ease-in-out infinite alternate; }
        
        .rainbow-text {
            font-size: 28px; font-weight: 900; text-transform: uppercase;
            background: var(--rainbow); background-size: 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rb-move 3s linear infinite; padding: 0 50px;
        }

        @keyframes bounce-scroll { 0% { transform: translateX(55%); } 100% { transform: translateX(-55%); } }

        .box { background: rgba(255,255,255,0.03); border: 1.5px solid var(--accent); border-radius: 10px; padding: 12px; text-align: center; }
        .box h4 { margin: 0; font-size: 10px; color: #bf953f; }
        
        .box span { 
            font-size: 12px; font-weight: bold; display: block; margin-top: 3px; 
            background: var(--btn-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }

        .turntable { position: relative; display: flex; justify-content: center; align-items: center; }
        .vinyl { width: 260px; height: 260px; border-radius: 50%; border: 6px solid #0a0a0a; box-shadow: 0 0 30px var(--accent); overflow: hidden; background: #000; z-index: 5; }
        #album-art { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .arm {
            position: absolute; width: 110px; height: 260px; right: 15%; top: 20px;
            background: url('https://xatimg.com/image/XJhVjJdCs2bN.gif'); background-size: contain;
            background-repeat: no-repeat; transform-origin: top right;
            transform: rotate(-25deg); transition: 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95); z-index: 100;
        }

        .woofer-pro {
            width: 85px; height: 85px; border-radius: 50%;
            background: #080808; border: 3px solid #222;
            box-shadow: 0 0 15px var(--accent);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        .cone {
            width: 65px; height: 65px; border-radius: 50%;
            background: repeating-radial-gradient(circle, #111 0, #111 4px, #000 5px, #000 7px);
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px #000;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .woofer-pro::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px dotted var(--accent);
            opacity: 0.6;
        }

        .cap { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle, #333, #000); border: 1px solid #444; box-shadow: 0 0 10px var(--accent); z-index: 10; }

        .control-bar { grid-column: 1 / 4; display: flex; align-items: center; justify-content: space-around; background: rgba(0,0,0,0.9); border-radius: 40px; padding: 8px 25px; border: 2px solid var(--accent); }

        .btn { 
            background: var(--btn-grad); 
            border: none; 
            padding: 10px 30px; 
            border-radius: 8px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 14px; 
            color: #fff; 
            text-shadow: 0 0 5px #000;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--accent); }

        input[type=range] { -webkit-appearance: none; width: 180px; height: 8px; background: var(--btn-grad); border-radius: 5px; box-shadow: 0 0 10px var(--accent); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #fff; border-radius: 50%; cursor: pointer; border: 2px solid var(--accent); }

        @keyframes rb-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* EFFETTO PUNTATORE */
        .scia-lettera {
            position: fixed;
            font-size: 20px;
            font-weight: 900;
            pointer-events: none;
            z-index: 1000000;
            transform: translate(-50%, -50%);
            animation: dissolvenzaLettera 0.8s ease-out forwards;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 0 10px currentColor;
        }

        @keyframes dissolvenzaLettera {
            0% { transform: translate(-50%, -50%) scale(1.5) translateY(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.5) translateY(-30px); opacity: 0; }
        }

        /* PARTICELLE DI SFONDO */
        .particle {
            position: absolute;
            bottom: -20px;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 15px #fff;
            animation: rise linear infinite;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(2); opacity: 0; }
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

    <div class="wrapper-full">
        <div class="bg-overlay" id="overlay"></div>

        <!-- PALLINE TEMI SFONDO -->
        <div class="theme-nav">
            <span style="--c1:#00ff00; --c2:#004400;" onclick="applyTheme('rgba(0,255,0,0.3)','rgba(0,50,0,0.7)', '#00ff00')"></span> 
            <span style="--c1:#0000ff; --c2:#000033;" onclick="applyTheme('rgba(0,0,255,0.3)','rgba(0,0,50,0.7)', '#0000ff')"></span> 
            <span style="--c1:#ff0000; --c2:#440000;" onclick="applyTheme('rgba(255,0,0,0.3)','rgba(50,0,0,0.7)', '#ff0000')"></span> 
            <span style="--c1:#00ffff; --c2:#004444;" onclick="applyTheme('rgba(0,255,255,0.3)','rgba(0,50,50,0.7)', '#00ffff')"></span> 
            <span style="--c1:#ff00ff; --c2:#440044;" onclick="applyTheme('rgba(255,0,255,0.3)','rgba(50,50,50,0.7)', '#ff00ff')"></span> 
            <span style="--c1:#ffff00; --c2:#444400;" onclick="applyTheme('rgba(255,255,0,0.3)','rgba(50,50,0,0.7)', '#ffff00')"></span>
            <span style="--c1:#ffffff; --c2:#333333;" onclick="applyTheme('rgba(255,255,255,0.3)','rgba(50,50,50,0.4)', '#ffffff')"></span>
            <span style="--c1:#ff8800; --c2:#442200;" onclick="applyTheme('rgba(255,136,0,0.3)','rgba(100,50,0,0.7)', '#ff8800')"></span>
            <span style="--c1:#8800ff; --c2:#220044;" onclick="applyTheme('rgba(136,0,255,0.3)','rgba(50,0,100,0.7)', '#8800ff')"></span>
            <span style="--c1:#00ff88; --c2:#004422;" onclick="applyTheme('rgba(0,255,136,0.3)','rgba(0,100,50,0.7)', '#00ff88')"></span>
            <span style="--c1:#4b0082; --c2:#1a0033;" onclick="applyTheme('rgba(75,0,130,0.3)','rgba(0,0,0,0.8)', '#4b0082')"></span>
            <span style="--c1:#adff2f; --c2:#223300;" onclick="applyTheme('rgba(173,255,47,0.3)','rgba(50,70,0,0.7)', '#adff2f')"></span>
            <span style="--c1:#ffa07a; --c2:#441111;" onclick="applyTheme('rgba(255,160,122,0.3)','rgba(80,30,30,0.7)', '#ffa07a')"></span>
            <span style="--c1:#7fffd4; --c2:#003322;" onclick="applyTheme('rgba(127,255,212,0.3)','rgba(30,80,60,0.7)', '#7fffd4')"></span>
            <span style="--c1:#ffd700; --c2:#332200;" onclick="applyTheme('rgba(255,215,0,0.3)','rgba(0,0,0,0.8)', '#ffd700')"></span>
        </div>

        <div class="stage-area">
            <!-- CHASSIS PLAYER NEON SYNC FULLSCREEN -->
            <div class="main-chassis" id="player">
                <div class="display-top">
                    <div class="marquee-box">
                        <span id="scroll-text" class="rainbow-text">EL CARTAIO - TOTAL NEON SYNC</span>
                    </div>
                </div>
                
                <div class="side-panel" style="display:flex; flex-direction:column; gap:12px; justify-content:center;">
                    <div class="box"><h4>CLOCK</h4><span id="clock">00:00:00</span></div>
                    <div class="box"><h4>SINGER</h4><span id="artist">---</span></div>
                    <div class="box"><h4>SONG</h4><span id="song">---</span></div>
                </div>

                <div class="turntable">
                    <div class="vinyl" id="v-box"><img id="album-art" src="https://xatimg.com/image/or3rbqD5I3rS.png" alt="Cover"></div>
                    <div id="arm" class="arm"></div>
                </div>

                <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                    <div class="side-panel" style="display:flex; flex-direction:column; gap:12px; justify-content:center; flex-grow:1;">
                        <div class="box"><h4>CITY</h4><span id="city">...</span></div>
                        <div class="box"><h4>USER</h4><span id="ip" style="font-size:9px;">...</span></div>
                        <div class="box"><h4>SHIELD</h4><span id="shield-text" style="color:#48ff00; font-size:9px; background:none; -webkit-text-fill-color: initial;">ENCRYPTED</span></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 10px; justify-content: center;">
                        <div style="width:22px; height:22px; border-radius:50%; background:#00f2ff; cursor:pointer; border:1px solid white;" onclick="setT('#00f2ff')"></div>
                        <div style="width:22px; height:22px; border-radius:50%; background:#ff00c8; cursor:pointer; border:1px solid white;" onclick="setT('#ff00c8')"></div>
                        <div style="width:22px; height:22px; border-radius:50%; background:var(--rainbow); background-size:200%; cursor:pointer; border:1px solid white;" onclick="setT('rb')"></div>
                    </div>
                </div>

                <div class="control-bar">
                    <div class="woofer-pro" id="wl"><div class="cone"><div class="cap"></div></div></div>
                    <button class="btn" onclick="play()">PLAY</button>
                    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
                    <button class="btn" onclick="stop()">STOP</button>
                    <div class="woofer-pro" id="wr"><div class="cone"><div class="cap"></div></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGICA SFONDO E PUNTATORE ---
        let coloreSciaMouse = '#00ff00';
        const testoScia = ["I", "L", " ", "C", "A", "R", "T", "A", "I", "O"];
        let indiceLettera = 0;
        let ultimoX = 0;
        let ultimoY = 0;

        function applyTheme(topColor, bottomColor, glowColor) {
            const bg = document.getElementById('overlay');
            bg.style.background = `linear-gradient(to bottom, ${topColor} 0%, ${bottomColor} 100%)`;
            coloreSciaMouse = glowColor;
            document.documentElement.style.setProperty('--accent', glowColor);
        }

        document.addEventListener('mousemove', function(e) {
            const dist = Math.hypot(e.clientX - ultimoX, e.clientY - ultimoY);
            if (dist > 15) {
                ultimoX = e.clientX;
                ultimoY = e.clientY;

                const el = document.createElement('div');
                el.className = 'scia-lettera';
                el.innerText = testoScia[indiceLettera];
                el.style.left = e.clientX + 'px';
                el.style.top = e.clientY + 'px';
                el.style.color = coloreSciaMouse;
                
                document.body.appendChild(el);
                setTimeout(() => { el.remove(); }, 800);

                indiceLettera = (indiceLettera + 1) % testoScia.length;
            }
        });

        function createParticles() {
            const particleCount = 40;
            const body = document.querySelector('body');
            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 4 + 3) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                body.appendChild(particle);
            }
        }
        createParticles();

        // --- LOGICA PLAYER NEON SYNC ---
        const _Z = "ylkruiq5e4fvv";
        const p = new Audio("https://stream.zeno.fm/" + _Z);
        p.crossOrigin = "anonymous";
        let ctx, aly, dat;

        function play() {
            if(!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                aly = ctx.createAnalyser();
                const s = ctx.createMediaElementSource(p);
                s.connect(aly); aly.connect(ctx.destination);
                aly.fftSize = 64; dat = new Uint8Array(aly.frequencyBinCount);
                loop();
            }
            p.play(); ctx.resume();
            document.getElementById('album-art').style.animation = "spin 4s linear infinite";
            document.getElementById('arm').style.transform = "rotate(15deg)";
        }

        function stop() {
            p.pause();
            document.getElementById('album-art').style.animation = "none";
            document.getElementById('arm').style.transform = "rotate(-25deg)";
        }

        function loop() {
            requestAnimationFrame(loop);
            if(!p.paused) {
                aly.getByteFrequencyData(dat);
                let b = dat[2]/60;
                document.getElementById('wl').style.transform = `scale(${1 + b*0.15})`;
                document.getElementById('wr').style.transform = `scale(${1 + b*0.15})`;
            }
        }

        function setT(c) {
            if(c==='rb') { 
                document.getElementById('player').style.animation = "rb-move 4s linear infinite"; 
            } else { 
                document.documentElement.style.setProperty('--accent', c); 
                document.getElementById('player').style.animation = "none"; 
                coloreSciaMouse = c;
            }
        }

        async function sync() {
            try {
                const r = await fetch("https://zenoplay.zenomedia.com/api/zenofm/nowplaying/"+_Z+"?t="+Date.now());
                const d = await r.json();
                if(d.title) {
                    document.getElementById('scroll-text').innerText = "EL CARTAIO - " + d.title.toUpperCase();
                    document.getElementById('artist').innerText = (d.artist || "EL CARTAIO").toUpperCase();
                    document.getElementById('song').innerText = (d.title.split('-')[1] || d.title).toUpperCase();
                    
                    if(d.artwork) {
                        document.getElementById('album-art').src = d.artwork;
                    } else {
                        const search = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(d.title)}&entity=song&limit=1`);
                        const res = await search.json();
                        if(res.results.length > 0) {
                            document.getElementById('album-art').src = res.results[0].artworkUrl100.replace('100x100', '600x600');
                        }
                    }
                }
            } catch(e) {}
        }
        setInterval(sync, 15000); sync();

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
            document.getElementById('city').innerText = d.city;
            document.getElementById('ip').innerText = d.ip;
        });

        document.getElementById('vol').oninput = function() { p.volume = this.value; };
    </script>
</body>
</html>
