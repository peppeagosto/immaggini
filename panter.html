<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SYNC FRAME - EL CARTAIO</title>
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --rainbow: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            --accent: #00f2ff;
            --btn-grad: linear-gradient(to right, #00f2ff, #ff00c8);
            --c1: #00ff00;
            --c2: #004400;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: #050508;
            font-family: 'Arial Black', sans-serif;
            cursor: crosshair;
            -webkit-user-select: none;
            user-select: none;
        }

        .frame-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            position: relative;
        }

        /* BARRA TEMI */
        .theme-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            width: fit-content;
            margin: 0 auto;
        }

        .theme-nav span {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #fff 0%, var(--c1) 40%, var(--c2) 100%);
            border: 1px solid rgba(255,255,255,0.6);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .theme-nav span:hover {
            transform: scale(1.3);
            border-color: #fff;
        }

        /* CHASSIS DEL PLAYER PER FRAME */
        .main-chassis {
            position: relative; 
            width: 100%;
            height: calc(100vh - 45px);
            background: radial-gradient(circle at center, #121218 0%, #050508 100%);
            border-radius: 12px; 
            padding: 12px;
            display: grid; 
            grid-template-columns: 160px 1fr 160px; 
            gap: 10px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent), inset 0 0 15px #000;
        }

        .display-top {
            grid-column: 1 / 4; 
            height: 42px; 
            background: #000;
            border: 1.5px solid var(--accent); 
            border-radius: 8px;
            overflow: hidden; 
            position: relative; 
            display: flex; 
            align-items: center;
        }

        .marquee-box { display: flex; width: 100%; white-space: nowrap; animation: bounce-scroll 10s ease-in-out infinite alternate; }
        
        .rainbow-text {
            font-size: 18px; font-weight: 900; text-transform: uppercase;
            background: var(--rainbow); background-size: 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rb-move 3s linear infinite; padding: 0 20px;
        }

        @keyframes bounce-scroll { 0% { transform: translateX(30%); } 100% { transform: translateX(-30%); } }

        .box { background: rgba(255,255,255,0.03); border: 1px solid var(--accent); border-radius: 6px; padding: 5px; text-align: center; }
        .box h4 { margin: 0; font-size: 8px; color: #bf953f; }
        
        .box span { 
            font-size: 10px; font-weight: bold; display: block; margin-top: 2px; 
            color: #00f2ff;
            text-shadow: 0 0 5px rgba(0,242,255,0.5);
        }

        .turntable { position: relative; display: flex; justify-content: center; align-items: center; }
        .vinyl { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #111; box-shadow: 0 0 15px var(--accent); overflow: hidden; background: #000; z-index: 5; }
        #album-art { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .arm {
            position: absolute; width: 65px; height: 150px; right: 10%; top: 5px;
            background: url('https://xatimg.com/image/XJhVjJdCs2bN.gif') no-repeat center/contain;
            transform-origin: top right;
            transform: rotate(-25deg); transition: 1.2s ease; z-index: 10;
        }

        .woofer-pro {
            width: 48px; height: 48px; border-radius: 50%;
            background: #080808; border: 2px solid #222;
            box-shadow: 0 0 8px var(--accent);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        .cone {
            width: 34px; height: 34px; border-radius: 50%;
            background: repeating-radial-gradient(circle, #111 0, #111 4px, #000 5px, #000 7px);
            display: flex; align-items: center; justify-content: center;
        }

        .cap { width: 10px; height: 10px; border-radius: 50%; background: #333; border: 1px solid #444; box-shadow: 0 0 4px var(--accent); }

        .control-bar { 
            grid-column: 1 / 4; 
            display: flex; 
            align-items: center; 
            justify-content: space-around; 
            background: #000; 
            border-radius: 20px; 
            padding: 5px 12px; 
            border: 1.5px solid var(--accent); 
        }

        .btn { 
            background: var(--btn-grad); border: none; padding: 5px 16px; border-radius: 5px; 
            font-weight: 900; cursor: pointer; font-size: 11px; color: #fff; 
            box-shadow: 0 0 6px rgba(0, 242, 255, 0.4); transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 10px var(--accent); }

        input[type=range] { -webkit-appearance: none; width: 100px; height: 4px; background: var(--btn-grad); border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer; border: 1.5px solid var(--accent); }

        @keyframes rb-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* SCIA MOUSE */
        .scia-lettera {
            position: fixed; font-size: 14px; font-weight: 900; pointer-events: none;
            z-index: 10000; transform: translate(-50%, -50%);
            animation: dissolvenzaLettera 0.8s ease-out forwards;
            text-shadow: 0 0 5px currentColor;
        }

        @keyframes dissolvenzaLettera {
            0% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.3) translateY(-15px); opacity: 0; }
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

    <div class="frame-container">
        <!-- BARRA TEMI -->
        <div class="theme-nav">
            <span style="--c1:#00ff00; --c2:#004400;" onclick="applyTheme('#00ff00')"></span> 
            <span style="--c1:#0000ff; --c2:#000033;" onclick="applyTheme('#0000ff')"></span> 
            <span style="--c1:#ff0000; --c2:#440000;" onclick="applyTheme('#ff0000')"></span> 
            <span style="--c1:#00ffff; --c2:#004444;" onclick="applyTheme('#00ffff')"></span> 
            <span style="--c1:#ff00ff; --c2:#440044;" onclick="applyTheme('#ff00ff')"></span> 
            <span style="--c1:#ffff00; --c2:#444400;" onclick="applyTheme('#ffff00')"></span>
            <span style="--c1:#ffffff; --c2:#333333;" onclick="applyTheme('#ffffff')"></span>
            <span style="--c1:#ff8800; --c2:#442200;" onclick="applyTheme('#ff8800')"></span>
            <span style="--c1:#8800ff; --c2:#220044;" onclick="applyTheme('#8800ff')"></span>
        </div>

        <!-- PLAYER -->
        <div class="main-chassis" id="player">
            <div class="display-top">
                <div class="marquee-box">
                    <span id="scroll-text" class="rainbow-text">EL CARTAIO - TOTAL NEON SYNC</span>
                </div>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:6px; justify-content:center;">
                <div class="box"><h4>CLOCK</h4><span id="clock">00:00:00</span></div>
                <div class="box"><h4>SINGER</h4><span id="artist">---</span></div>
                <div class="box"><h4>SONG</h4><span id="song">---</span></div>
            </div>

            <div class="turntable">
                <div class="vinyl" id="v-box"><img id="album-art" src="https://xatimg.com/image/or3rbqD5I3rS.png" alt="Cover"></div>
                <div id="arm" class="arm"></div>
            </div>

            <div style="display: flex; gap: 5px; justify-content: center; align-items: center;">
                <div style="display:flex; flex-direction:column; gap:6px; justify-content:center; flex-grow:1;">
                    <div class="box"><h4>CITY</h4><span id="city">...</span></div>
                    <div class="box"><h4>USER</h4><span id="ip" style="font-size:8px;">...</span></div>
                    <div class="box"><h4>SHIELD</h4><span id="shield-text" style="color:#48ff00; font-size:8px;">ENCRYPTED</span></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <div style="width:16px; height:16px; border-radius:50%; background:#00f2ff; cursor:pointer; border:1px solid white;" onclick="setT('#00f2ff')"></div>
                    <div style="width:16px; height:16px; border-radius:50%; background:#ff00c8; cursor:pointer; border:1px solid white;" onclick="setT('#ff00c8')"></div>
                    <div style="width:16px; height:16px; border-radius:50%; background:var(--rainbow); background-size:200%; cursor:pointer; border:1px solid white;" onclick="setT('rb')"></div>
                </div>
            </div>

            <div class="control-bar">
                <div class="woofer-pro" id="wl"><div class="cone"><div class="cap"></div></div></div>
                <button class="btn" onclick="play()">PLAY</button>
                <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
                <button class="btn" onclick="stop()">STOP</button>
                <div class="woofer-pro" id="wr"><div class="cone"><div class="cap"></div></div></div>
            </div>
        </div>
    </div>

    <script>
        let coloreSciaMouse = '#00ff00';
        const testoScia = ["I", "L", " ", "C", "A", "R", "T", "A", "I", "O"];
        let indiceLettera = 0, ultimoX = 0, ultimoY = 0;

        function applyTheme(glowColor) {
            coloreSciaMouse = glowColor;
            document.documentElement.style.setProperty('--accent', glowColor);
        }

        document.addEventListener('mousemove', function(e) {
            const dist = Math.hypot(e.clientX - ultimoX, e.clientY - ultimoY);
            if (dist > 18) {
                ultimoX = e.clientX; ultimoY = e.clientY;
                const el = document.createElement('div');
                el.className = 'scia-lettera';
                el.innerText = testoScia[indiceLettera];
                el.style.left = e.clientX + 'px';
                el.style.top = e.clientY + 'px';
                el.style.color = coloreSciaMouse;
                document.body.appendChild(el);
                setTimeout(() => { el.remove(); }, 800);
                indiceLettera = (indiceLettera + 1) % testoScia.length;
            }
        });

        // PLAYER LOGICA
        const _Z = "ylkruiq5e4fvv";
        const p = new Audio("https://stream.zeno.fm/" + _Z);
        p.crossOrigin = "anonymous";
        let ctx, aly, dat;

        function play() {
            if(!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                aly = ctx.createAnalyser();
                const s = ctx.createMediaElementSource(p);
                s.connect(aly); aly.connect(ctx.destination);
                aly.fftSize = 64; dat = new Uint8Array(aly.frequencyBinCount);
                loop();
            }
            p.play(); ctx.resume();
            document.getElementById('album-art').style.animation = "spin 4s linear infinite";
            document.getElementById('arm').style.transform = "rotate(15deg)";
        }

        function stop() {
            p.pause();
            document.getElementById('album-art').style.animation = "none";
            document.getElementById('arm').style.transform = "rotate(-25deg)";
        }

        function loop() {
            requestAnimationFrame(loop);
            if(!p.paused) {
                aly.getByteFrequencyData(dat);
                let b = dat[2]/60;
                document.getElementById('wl').style.transform = `scale(${1 + b*0.15})`;
                document.getElementById('wr').style.transform = `scale(${1 + b*0.15})`;
            }
        }

        function setT(c) {
            if(c==='rb') { 
                document.getElementById('player').style.animation = "rb-move 4s linear infinite"; 
            } else { 
                document.documentElement.style.setProperty('--accent', c); 
                document.getElementById('player').style.animation = "none"; 
                coloreSciaMouse = c;
            }
        }

        async function sync() {
            try {
                const r = await fetch("https://zenoplay.zenomedia.com/api/zenofm/nowplaying/"+_Z+"?t="+Date.now());
                const d = await r.json();
                if(d.title) {
                    document.getElementById('scroll-text').innerText = "EL CARTAIO - " + d.title.toUpperCase();
                    document.getElementById('artist').innerText = (d.artist || "EL CARTAIO").toUpperCase();
                    document.getElementById('song').innerText = (d.title.split('-')[1] || d.title).toUpperCase();
                    
                    if(d.artwork) {
                        document.getElementById('album-art').src = d.artwork;
                    } else {
                        const search = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(d.title)}&entity=song&limit=1`);
                        const res = await search.json();
                        if(res.results.length > 0) {
                            document.getElementById('album-art').src = res.results[0].artworkUrl100.replace('100x100', '600x600');
                        }
                    }
                }
            } catch(e) {}
        }
        setInterval(sync, 15000); sync();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
            document.getElementById('city').innerText = d.city;
            document.getElementById('ip').innerText = d.ip;
        });

        document.getElementById('vol').oninput = function() { p.volume = this.value; };
    </script>
</body>
</html>
