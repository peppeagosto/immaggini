<!DOCTYPE html>
<html lang="it">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>EL DIABLO - Particle Trail</title>
    
    <style type="text/css">
        /* RESET BASE */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        /* Schermo intero, sfondo nero profondo */
        html, body {
            overflow: hidden !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: #000 !important;
            margin: 0 !important;
            padding: 0 !important;
            cursor: crosshair; /* Cursore a mirino per precisione */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- IL CANVAS PER LE PARTICELLE --- */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Sotto il testo */
        }

        /* --- IL TESTO "EL DIABLO" (Stile Foto) --- */
        .main-title-container {
            position: fixed;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10; /* Sopra le particelle */
            
            /* --- REGOLAZIONE POSIZIONE QUI --- */
            /* top: 50% sarebbe il centro perfetto. */
            /* Aggiungiamo 'transform' per spostarlo poco più giù. */
            top: 50%; 
            transform: translateY(20%); /* Sposta verso il basso del 20% dell'altezza dello schermo */
            /* Puoi cambiare 20% in 15% (meno giù) o 30% (più giù) */
        }

        .diablo-text {
            font-size: 8vw; /* Grande come nella foto */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            white-space: nowrap;
            user-select: none; /* Non selezionabile */

            /* --- EFFETTO RAINBOW/FIRE (Trasparenza testo) --- */
            background: linear-gradient(to right, 
                #FF0000 0%,   /* Rosso */
                #FF7F00 15%,  /* Arancione */
                #FFFF00 30%,  /* Giallo */
                #00FF00 50%,  /* Verde */
                #0000FF 65%,  /* Blu */
                #4B0082 80%,  /* Indaco */
                #9400D3 100%  /* Viola */
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Animazione del ciclo colori */
            animation: rainbow-anim 5s linear infinite;

            /* --- EFFETTO NEON GLOW (Bagliore) --- */
            /* Più drop-shadow sovrapposti creano l'effetto neon intenso */
            filter: 
                drop-shadow(0 0 10px rgba(255, 100, 0, 0.9))  /* Bagliore fuoco centrale */
                drop-shadow(0 0 20px rgba(255, 0, 255, 0.7))  /* Bagliore magenta esterno */
                drop-shadow(0 0 40px rgba(0, 255, 255, 0.5)); /* Bagliore cyan diffuso */
        }

        /* Animazione per far scorrere il gradient rainbow */
        @keyframes rainbow-anim { 
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

    <!-- Canvas per disegnare le particelle dello sfondo -->
    <canvas id="particleCanvas"></canvas>

    <!-- Contenitore fisserò per il testo -->
    <div class="main-title-container">
        <!-- Il testo neon rainbow, tutto subito, fisserò poco più giù -->
        <h1 class="diablo-text">EL DIABLO</h1>
    </div>

    <script>
        // --- LOGICA CANVAS E PARTICELLE MULTICOLORE (SCIA LUNGA) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        // Imposta dimensioni canvas a schermo intero
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Opzionale: pulisci il canvas al resize
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Prima impostazione

        let particles = [];
        let hue = 0; // Per il ciclo dei colori HSL

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                // Velocità casuale per l'espansione (movimento caotico foto)
                this.vx = (Math.random() - 0.5) * 5; // Espansione orizzontale
                this.vy = (Math.random() - 0.5) * 5; // Espansione verticale
                this.radius = Math.random() * 4 + 1.5; // Dimensione particella casuale
                this.color = color;
                this.opacity = 1;
                // Decay molto lento per mantenere la scia "lungissima"
                this.decay = Math.random() * 0.008 + 0.003; 
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity; // Trasparenza della particella
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // --- BAGLIORE SULLA SINGOLA PARTICELLA ---
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.opacity -= this.decay; // La particella sfuma lentamente
                
                // Rallenta leggermente nel tempo (attrito)
                this.vx *= 0.98;
                this.vy *= 0.98;
            }
        }

        function createTrail(x, y) {
            // Crea un gruppo di particelle ad ogni movimento per densità
            const density = 8; 
            for (let i = 0; i < density; i++) {
                // Ciclo dei colori HSL per l'effetto multicolore della scia
                hue = (hue + 0.5) % 360; 
                const color = `hsl(${hue}, 100%, 65%)`; // HSL stabile e luminoso
                
                // Posizione iniziale leggermente randomizzata intorno al cursore
                const startX = x + (Math.random() - 0.5) * 10;
                const startY = y + (Math.random() - 0.5) * 10;

                particles.push(new Particle(startX, startY, color));
            }
        }

        // Ciclo di animazione principale
        function animate() {
            requestAnimationFrame(animate);

            // --- LOGICA CHIAVE PER LA SCIA LUNGA E PERSISTENTE ---
            // Non puliamo il canvas, ma disegniamo un rettangolo nero semi-trasparente.
            // Questo fa sì che le vecchie particelle rimangano visibili più a lungo svanendo lentamente.
            ctx.fillStyle = 'rgba(0, 0, 0, 0.04)'; // Più basso questo valore, più lunga la scia
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Disegna e aggiorna le particelle
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Rimuovi particelle quando diventano invisibili
                if (particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            
            // Limita il numero massimo di particelle per evitare lag
            if (particles.length > 7000) {
                particles.splice(0, 200);
            }
        }
        animate(); // Avvia l'animazione

        // --- CATTURA MOVIMENTO MOUSE ---
        document.body.addEventListener('mousemove', function(e) {
            createTrail(e.clientX, e.clientY);
        });

        // --- SUPPORTO TOUCH PER MOBILE ---
        document.body.addEventListener('touchmove', function(e) {
            // e.preventDefault(); // Previene lo scroll su alcuni dispositivi
            const touch = e.touches[0];
            createTrail(touch.clientX, touch.clientY);
        });

    </script>
</body>
</html>
