<!DOCTYPE html>
<html lang="it">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>EL DIABLO - Particle Trail MAX</title>
    
    <style type="text/css">
        /* RESET BASE */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        /* --- FORZATURA TOTALE SCHERMO INTERO (Bypassa i 999px) --- */
        html, body {
            overflow: hidden !important;
            /* Usiamo vw/vh e position fixed per ignorare i limiti dell'editor xat */
            width: 100vw !important;
            height: 100vh !important;
            min-width: 100vw !important;
            min-height: 100vh !important;
            position: fixed !important; 
            top: 0 !important;
            left: 0 !important;
            background-color: #000 !important;
            margin: 0 !important;
            padding: 0 !important;
            cursor: crosshair;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            z-index: 999999 !important; /* Assicura che stia sopra tutto su xat */
        }

        /* --- IL CANVAS PER LE PARTICELLE (Sfondo totale) --- */
        #particleCanvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
        }

        /* --- IL TESTO "EL DIABLO" AGGRESSIVO E MASSICCIO --- */
        .main-title-container {
            position: fixed !important;
            left: 0 !important;
            width: 100vw !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important; /* Centra anche verticalmente */
            height: 100vh !important; /* Usa tutta l'altezza dello schermo */
            top: 0 !important;
            z-index: 10 !important;
            pointer-events: none; /* Le particelle ignorano il testo e passano sotto */
            
            /* --- POSIZIONAMENTO (Poco più giù) --- */
            /* Ora che è centrato verticalmente con flex, usiamo translateY per abbassarlo */
            transform: translateY(15%) !important; 
        }

        .diablo-text {
            /* DIMENSIONE ESAGERATA (Aumentata da 8vw a 12vw) */
            font-size: 12vw !important; 
            font-weight: 900 !important;
            text-transform: uppercase !important;
            letter-spacing: -10px !important; /* Lettere quasi sovrapposte per aggressività */
            white-space: nowrap !important;
            user-select: none !important;

            /* --- EFFETTO RAINBOW/FIRE (Ciclo colori) --- */
            background: linear-gradient(to right, 
                #FF0000 0%,   /* Rosso */
                #FF7F00 15%,  /* Arancione */
                #FFFF00 30%,  /* Giallo */
                #00FF00 50%,  /* Verde */
                #0000FF 65%,  /* Blu */
                #4B0082 80%,  /* Indaco */
                #9400D3 100%  /* Viola */
            ) !important;
            background-size: 200% auto !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            
            animation: rainbow-anim 4s linear infinite !important; /* Più veloce */

            /* --- EFFETTO NEON GLOW VIOLENTO (Aura pompata) --- */
            filter: 
                drop-shadow(0 0 5px #fff) /* Cuore bianco per intensità */
                drop-shadow(0 0 15px rgba(255, 100, 0, 1))  /* Fuoco intenso */
                drop-shadow(0 0 30px rgba(255, 0, 255, 1))  /* Magenta violento */
                drop-shadow(0 0 60px rgba(0, 255, 255, 0.8)) /* Cyan diffuso esagerato */
                drop-shadow(0 0 100px rgba(255, 0, 0, 0.5)) !important; /* Aura rossa finale */
        }

        /* Animazione per far scorrere il gradient rainbow */
        @keyframes rainbow-anim { 
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

    </style>
</head>
<!-- Blocchiamo click destro e selezione per un look più "app" -->
<body oncontextmenu="return false;" onselectstart="return false;">

    <!-- Canvas per disegnare le particelle dello sfondo -->
    <canvas id="particleCanvas"></canvas>

    <!-- Contenitore fisserò per il testo -->
    <div class="main-title-container">
        <!-- Il testo neon rainbow, tutto subito, massiccio e pompato -->
        <h1 class="diablo-text">EL DIABLO</h1>
    </div>

    <script>
        // --- LOGICA CANVAS E PARTICELLE ESAGERATE (SCIA PESANTE) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        // Imposta dimensioni canvas a schermo intero reale
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas); // Forza il resize al caricamento
        resizeCanvas(); 

        let particles = [];
        let hue = 0; // Per il ciclo dei colori HSL

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                // Velocità aumentata per espansione più rapida e caotica
                this.vx = (Math.random() - 0.5) * 8; 
                this.vy = (Math.random() - 0.5) * 8;
                // DIMENSIONE MASSIMA AUMENTATA
                this.radius = Math.random() * 6 + 2.5; 
                this.color = color;
                this.opacity = 1;
                // Decay leggermente più veloce per gestire l'aumento di particelle
                this.decay = Math.random() * 0.012 + 0.005; 
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // --- BAGLIORE SULLA SINGOLA PARTICELLA POMPATO ---
                ctx.shadowBlur = 25; // Molto più sfocato e luminoso
                ctx.shadowColor = this.color;
                
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.opacity -= this.decay; 
                
                // Attrito ridotto per farle viaggiare più lontano
                this.vx *= 0.985;
                this.vy *= 0.985;
            }
        }

        function createTrail(x, y) {
            // DENSITÀ AUMENTATA (Più particelle per ogni movimento)
            const density = 15;  
            for (let i = 0; i < density; i++) {
                hue = (hue + 0.8) % 360; 
                const color = `hsl(${hue}, 100%, 70%)`; // Più luminose (70% leggerezza)
                
                // Area di spawn iniziale più grande intorno al cursore
                const startX = x + (Math.random() - 0.5) * 15;
                const startY = y + (Math.random() - 0.5) * 15;

                particles.push(new Particle(startX, startY, color));
            }
        }

        // Ciclo di animazione principale
        function animate() {
            requestAnimationFrame(animate);

            // --- LOGICA PERSISTENZA SCIA (Ancora più lunga) ---
            // Abbassiamo l'opacità del rettangolo nero di sfondo per mantenere le scie più a lungo
            ctx.fillStyle = 'rgba(0, 0, 0, 0.03)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            
            // Limite particelle aumentato per gestire la densità maggiore
            if (particles.length > 10000) {
                particles.splice(0, 500);
            }
        }
        animate(); 

        // --- CATTURA MOVIMENTO MOUSE SU BODY TOTALE ---
        document.body.addEventListener('mousemove', function(e) {
            createTrail(e.clientX, e.clientY);
        });

        // --- SUPPORTO TOUCH ESAGERATO ---
        document.body.addEventListener('touchmove', function(e) {
            const touch = e.touches[0];
            createTrail(touch.clientX, touch.clientY);
        });

    </script>
</body>
</html>
