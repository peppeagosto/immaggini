<html lang="pt-PT">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>il cartaio:</title>
    
    <!-- Librerie per il Player e le Icone -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style type="text/css">
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        /* Forza il body ad uscire dai margini di xat e coprire tutto lo schermo */
        html, body {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: #000; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            cursor: crosshair;
            z-index: 999999;
        }

        .bg-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0, 255, 0, 0.3) 0%, rgba(0, 50, 0, 0.7) 100%);
            z-index: 1;
            pointer-events: none;
            transition: background 1.5s ease-in-out;
        }

        .stage-area {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* BARRA DELLE PALLINE (TEMI) IN ALTO */
        .theme-nav {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            z-index: 9999;
            padding: 0 10px;
        }

        .theme-nav span {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #fff 0%, var(--c1) 40%, var(--c2) 100%);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 -2px 5px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
        }

        .theme-nav span:hover {
            transform: scale(1.3) translateY(-5px);
            box-shadow: 0 12px 30px var(--c1), inset 0 -2px 5px rgba(0,0,0,0.5);
            border-color: #fff;
        }

        /* 📻 CONTENITORE PLAYER - POSIZIONATO LEGGERMENTE SOTTO LE PALLINE */
        .player-bar {
            position: absolute;
            top: 75px; /* Posizionato subito sotto i 25px delle palline */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            height: 55px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid var(--theme-color, #00ff00);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 0 20px var(--theme-color, rgba(0, 255, 0, 0.5));
            z-index: 9998;
            backdrop-filter: blur(5px);
            transition: border-color 0.5s, box-shadow 0.5s;
        }

        .player-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--theme-color, #00ff00);
            border: 2px solid #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 0 10px var(--theme-color, #00ff00);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .player-btn:hover { 
            transform: scale(1.1); 
        }

        .player-info {
            flex-grow: 1;
            margin: 0 15px;
            overflow: hidden;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        .player-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            text-shadow: 0 0 8px var(--theme-color, #00ff00);
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 13px;
            flex-shrink: 0;
        }

        .volume-box input[type=range] {
            width: 70px;
            accent-color: var(--theme-color, #00ff00);
            cursor: pointer;
        }

        /* SCRITTA CENTRALE TRASCINABILE */
        .center-title {
            font-size: 5vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 0 10px 20px rgba(0,0,0,1);
            white-space: nowrap;
            z-index: 50; 
            cursor: grab; 
            user-select: none; 
            position: absolute; 
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .center-title:active {
            cursor: grabbing; 
        }

        .rainbow {
            background: linear-gradient(to right, #FF0000, #FF00FF, #0000FF, #00FFFF, #00FF00, #FFFF00, #FF0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-anim 4s linear infinite;
        }

        @keyframes rainbow-anim { to { background-position: 200% center; } }

        .scia-magica {
            position: fixed;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            animation: dissolvenzaScia 0.6s linear forwards;
            mix-blend-mode: screen;
        }

        @keyframes dissolvenzaScia {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
        }

        .particle {
            position: absolute;
            bottom: -20px;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 15px #fff;
            animation: rise linear infinite;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(2); opacity: 0; }
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

    <div class="bg-overlay" id="overlay"></div>

    <div class="stage-area">
        <!-- BARRA PALLINE TEMI -->
        <div class="theme-nav">
            <span style="--c1:#00ff00; --c2:#004400;" onclick="applyTheme('rgba(0,255,0,0.3)','rgba(0,50,0,0.7)', '#00ff00')"></span> 
            <span style="--c1:#0000ff; --c2:#000033;" onclick="applyTheme('rgba(0,0,255,0.3)','rgba(0,0,50,0.7)', '#0000ff')"></span> 
            <span style="--c1:#ff0000; --c2:#440000;" onclick="applyTheme('rgba(255,0,0,0.3)','rgba(50,0,0,0.7)', '#ff0000')"></span> 
            <span style="--c1:#00ffff; --c2:#004444;" onclick="applyTheme('rgba(0,255,255,0.3)','rgba(0,50,50,0.7)', '#00ffff')"></span> 
            <span style="--c1:#ff00ff; --c2:#440044;" onclick="applyTheme('rgba(255,0,255,0.3)','rgba(50,0,50,0.7)', '#ff00ff')"></span> 
            <span style="--c1:#ffff00; --c2:#444400;" onclick="applyTheme('rgba(255,255,0,0.3)','rgba(50,50,0,0.7)', '#ffff00')"></span>
            <span style="--c1:#ffffff; --c2:#333333;" onclick="applyTheme('rgba(255,255,255,0.3)','rgba(50,50,50,0.4)', '#ffffff')"></span>
            <span style="--c1:#ff8800; --c2:#442200;" onclick="applyTheme('rgba(255,136,0,0.3)','rgba(100,50,0,0.7)', '#ff8800')"></span>
            <span style="--c1:#8800ff; --c2:#220044;" onclick="applyTheme('rgba(136,0,255,0.3)','rgba(50,0,100,0.7)', '#8800ff')"></span>
            <span style="--c1:#00ff88; --c2:#004422;" onclick="applyTheme('rgba(0,255,136,0.3)','rgba(0,100,50,0.7)', '#00ff88')"></span>
            <span style="--c1:#4b0082; --c2:#1a0033;" onclick="applyTheme('rgba(75,0,130,0.3)','rgba(0,0,0,0.8)', '#4b0082')"></span>
            <span style="--c1:#adff2f; --c2:#223300;" onclick="applyTheme('rgba(173,255,47,0.3)','rgba(50,70,0,0.7)', '#adff2f')"></span>
            <span style="--c1:#ffa07a; --c2:#441111;" onclick="applyTheme('rgba(255,160,122,0.3)','rgba(80,30,30,0.7)', '#ffa07a')"></span>
            <span style="--c1:#7fffd4; --c2:#003322;" onclick="applyTheme('rgba(127,255,212,0.3)','rgba(30,80,60,0.7)', '#7fffd4')"></span>
            <span style="--c1:#ffd700; --c2:#332200;" onclick="applyTheme('rgba(255,215,0,0.3)','rgba(0,0,0,0.8)', '#ffd700')"></span>
        </div>

        <!-- 🎧 CONTENITORE PLAYER POSIZIONATO SOTTO LE PALLINE -->
        <div class="player-bar" id="player-container">
            <div class="player-btn" onclick="togglePlay()">
                <i class="fas fa-play" id="play-icon"></i>
            </div>
            <div class="player-info">
                <div class="player-title" id="track-title">RADIO IN ATTESA...</div>
            </div>
            <div class="volume-box">
                <i class="fas fa-volume-high"></i>
                <input type="range" id="volume-control" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
            </div>
        </div>

        <div class="center-title rainbow" id="draggable-text">IL CARTAIO</div>
    </div>

    <!-- AUDIO PLAYER -->
    <audio id="audio" crossorigin="anonymous"></audio>

    <script>
        const radioID = 'ylkruiq5e4fvv';
        const audio = document.getElementById("audio");
        let isPlaying = false;
        let last_song = "";
        let coloreSciaMouse = '#00ff00';

        // Cambia tema sia dello sfondo che del player in base alla pallina cliccata
        function applyTheme(topColor, bottomColor, glowColor) {
            const bg = document.getElementById('overlay');
            bg.style.background = `linear-gradient(to bottom, ${topColor} 0%, ${bottomColor} 100%)`;
            coloreSciaMouse = glowColor;

            // Aggiorna il colore del bordo e del bottone del player
            document.documentElement.style.setProperty('--theme-color', glowColor);
        }

        // Funzione Play / Pause del Player
        function togglePlay() {
            if (!isPlaying) {
                audio.src = "https://stream.zeno.fm/" + radioID;
                audio.load();
                audio.play();
                isPlaying = true;
                $('#play-icon').removeClass('fa-play').addClass('fa-pause');
            } else {
                audio.pause();
                isPlaying = false;
                $('#play-icon').removeClass('fa-pause').addClass('fa-play');
            }
        }

        function setVolume(val) {
            audio.volume = val;
        }

        // Aggiornamento automatico del titolo del brano in riproduzione
        async function updateMeta() {
            try {
                const r = await fetch(`https://zenoplay.zenomedia.com/api/zenofm/nowplaying/${radioID}?t=${Date.now()}`);
                const d = await r.json();
                if (d.title) {
                    $('#track-title').text("🎵 " + d.title.toUpperCase());
                }
            } catch (e) {}
        }
        setInterval(updateMeta, 10000); 
        updateMeta();

        // Scia magica al passaggio del mouse
        document.addEventListener('mousemove', function(e) {
            const scia = document.createElement('div');
            scia.className = 'scia-magica';
            scia.style.left = e.clientX + 'px';
            scia.style.top = e.clientY + 'px';
            scia.style.background = `radial-gradient(circle, #ffffff 10%, ${coloreSciaMouse} 60%, transparent 100%)`;
            scia.style.boxShadow = `0 0 10px ${coloreSciaMouse}, 0 0 20px ${coloreSciaMouse}`;
            
            document.body.appendChild(scia);
            setTimeout(() => { scia.remove(); }, 600);
        });

        // Gestione drag del titolo
        const testoDrag = document.getElementById('draggable-text');
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        testoDrag.addEventListener('mousedown', function(e) {
            isDragging = true;
            const rect = testoDrag.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            
            testoDrag.style.position = 'fixed';
            testoDrag.style.transform = 'none';
            testoDrag.style.left = rect.left + 'px';
            testoDrag.style.top = rect.top + 'px';
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                testoDrag.style.left = (e.clientX - offsetX) + 'px';
                testoDrag.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });

        // Generazione particelle di sfondo
        function createParticles() {
            const particleCount = 40;
            const body = document.querySelector('body');
            
            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 4 + 3) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                body.appendChild(particle);
            }
        }
        createParticles();
    </script>
</body>
</html>
