<!DOCTYPE html>
<html lang="en" style="--vh: 5.99px;">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EL DIABLO & 666 - Fire & Lightning Rings</title>
<style>
:root {
  --bg: #070103;
  --sky-deep: #050002;
  --sky-fire: #220306;
  --sky-core: #54060c;
  --sky-blaze: #941708;
  --sigil-w: clamp(150px, 26vw, 430px);
  --sigil-top: 28%;
  --flock-every: 55;
  --flock-hold: 9;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

@keyframes fx-ltr { from { transform: translateX(-15vw); } to { transform: translateX(115vw); } }
@keyframes fx-rtl { from { transform: translateX(115vw); } to { transform: translateX(-15vw); } }
@keyframes cloud-drift { from { transform: translateY(-10px) scale(0.98); } to { transform: translateY(10px) scale(1.02); } }
@keyframes ring-spin { to { transform: rotate(360deg); } }
@keyframes sigil-float { from { transform: translateY(-1.5vh); } to { transform: translateY(1.5vh); } }
@keyframes lava-surge {
  0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 8px #ff3b00); }
  50% { opacity: 1; filter: drop-shadow(0 0 24px #ff9400) drop-shadow(0 0 45px #ff2200); }
}
@keyframes text-heat {
  0%, 100% { filter: drop-shadow(0 0 8px #ff2a00); }
  50% { filter: drop-shadow(0 0 22px #ff8800) drop-shadow(0 0 38px #ff0000); }
}

.scene {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: calc(var(--vh, 1vh) * 100);
  height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 100%, rgba(255, 60, 0, 0.45) 0%, rgba(140, 10, 0, 0.25) 35%, transparent 75%),
    linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-fire) 30%, var(--sky-core) 62%, var(--sky-blaze) 82%, #1a0104 100%);
  font-family: 'Cinzel', Georgia, serif;
}

/* GIF Sfondo */
.bg-gif {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.28;
  mix-blend-mode: screen;
  pointer-events: none;
  z-index: 4;
}

.layer { position: absolute; inset: 0; pointer-events: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
canvas.sky { z-index: 1; }
canvas.fx { z-index: 6; }
canvas.embers { z-index: 12; }

/* Nuvole vulcaniche */
.clouds { z-index: 3; }
.cl { position: absolute; left: 0; will-change: transform; }
.cl svg { display: block; width: 100%; height: auto; }

/* Nebbia */
.fog {
  position: absolute;
  left: -20%;
  width: 140%;
  pointer-events: none;
}
.fog.back {
  bottom: 6%;
  height: 35%;
  z-index: 7;
  background:
    radial-gradient(ellipse 35% 45% at 20% 70%, rgba(220, 45, 0, 0.32), transparent 70%),
    radial-gradient(ellipse 40% 40% at 70% 75%, rgba(180, 20, 0, 0.28), transparent 70%);
  animation: fx-ltr 42s ease-in-out infinite alternate;
}
.fog.front {
  bottom: -4%;
  height: 25%;
  z-index: 10;
  background:
    radial-gradient(ellipse 30% 50% at 35% 85%, rgba(255, 90, 0, 0.22), transparent 70%),
    radial-gradient(ellipse 35% 50% at 80% 85%, rgba(255, 60, 0, 0.2), transparent 70%);
  animation: fx-rtl 36s ease-in-out infinite alternate;
}

/* Spuntoni vulcanici laterali */
.spires {
  position: absolute;
  bottom: 0;
  z-index: 8;
  height: 94%;
  aspect-ratio: 6/10;
  max-width: 42vw;
}
.spires svg { width: 100%; height: 100%; display: block; }
.spires.left { left: -2.5vw; }
.spires.right { right: -2.5vw; height: 86%; transform: scaleX(-1); }

/* Suolo lavico */
.lava-ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 14%;
  z-index: 9;
}
.lava-ground svg { width: 100%; height: 100%; display: block; }
.lava-hot { animation: lava-surge 4s ease-in-out infinite alternate; }

/* Sigilli SX (EL DIABLO) e DX (666) */
.sigil {
  position: absolute;
  top: var(--sigil-top);
  width: var(--sigil-w);
  aspect-ratio: 1;
  z-index: 14;
  pointer-events: none;
  animation: sigil-float 6.5s ease-in-out infinite alternate;
}
.sigil.left { left: 0.5vw; }
.sigil.right { right: 0.5vw; animation-delay: -3.2s; }

.sigil .aura {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 140%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 80, 0, 0.42), rgba(160, 10, 0, 0.2) 42%, transparent 70%);
}
.sigil .ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 95%;
  aspect-ratio: 1;
  margin: -47.5% 0 0 -47.5%;
  opacity: 0.8;
}
.sigil .ring svg {
  width: 100%;
  height: 100%;
  display: block;
  animation: ring-spin 90s linear infinite;
}
.sigil.right .ring svg { animation-direction: reverse; }

.sigil-inner {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sigil .mark {
  position: relative;
  display: block;
  width: 88%;
  height: auto;
  overflow: visible;
  animation: text-heat 3.5s ease-in-out infinite alternate;
  z-index: 5;
}

/* Canvas scariche e fiamme sui bordi del cerchio */
.ring-fx-canvas {
  position: absolute;
  inset: -15%;
  width: 130%;
  height: 130%;
  pointer-events: none;
  z-index: 20;
}

@media (max-aspect-ratio: 3/4) {
  :root {
    --sigil-w: clamp(120px, 30vw, 250px);
    --sigil-top: 22%;
  }
  .sigil.left { left: 0vw; }
  .sigil.right { right: 0vw; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ashCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a080d"></stop>
      <stop offset=".5" stop-color="#240205"></stop>
      <stop offset="1" stop-color="#0a0002"></stop>
    </linearGradient>

    <linearGradient id="infernoFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffce8"></stop>
      <stop offset="25%" stop-color="#ffb733"></stop>
      <stop offset="55%" stop-color="#ff3a00"></stop>
      <stop offset="85%" stop-color="#b80005"></stop>
      <stop offset="100%" stop-color="#420002"></stop>
    </linearGradient>

    <filter id="glowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"></feGaussianBlur>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"></feGaussianBlur>
    </filter>
  </defs>
</svg>

<div class="scene" id="scene">
  <canvas class="sky" id="sky" width="1360" height="599"></canvas>
  <div class="layer clouds" id="clouds"></div>
  
  <img class="bg-gif" src="https://xatimg.com/image/9PnzgWEmjDFh.gif" alt="inferno-gif">

  <canvas class="fx" id="fx" width="1360" height="599"></canvas>
  <div class="fog back"></div>

  <div class="spires left"><svg viewBox="0 0 600 1000" id="spL"></svg></div>
  <div class="spires right"><svg viewBox="0 0 600 1000" id="spR"></svg></div>

  <div class="lava-ground"><svg viewBox="0 0 1600 120" preserveAspectRatio="none" id="lava"></svg></div>
  <div class="fog front"></div>
  <canvas class="embers" id="embers" width="1360" height="599"></canvas>

  <div class="sigil left" id="sigilL">
    <div class="sigil-inner">
      <canvas class="ring-fx-canvas" id="rfL"></canvas>
    </div>
  </div>

  <div class="sigil right" id="sigilR">
    <div class="sigil-inner">
      <canvas class="ring-fx-canvas" id="rfR"></canvas>
    </div>
  </div>
</div>

<script>
(function () {
  var CONFIG = { flock: 120, clouds: 6, speed: 1, embers: 65 };
  var rnd = function (a, b) { return a + Math.random() * (b - a); };

  function setVH() { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
  setVH();
  addEventListener('resize', setVH);

  var scene = document.getElementById('scene');
  var paused = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  var RING = (function () {
    var s = '<svg viewBox="-140 -140 280 280">' +
      '<circle r="128" fill="none" stroke="#ff3a00" stroke-width="1.2" stroke-dasharray="4 6" opacity=".85"/>' +
      '<circle r="115" fill="none" stroke="#ff9400" stroke-width=".6" opacity=".6"/>' +
      '<polygon points="0,-128 110,64 -110,64" fill="none" stroke="#ff2600" stroke-width=".7" opacity=".4"/>' +
      '<polygon points="0,128 110,-64 -110,-64" fill="none" stroke="#ff2600" stroke-width=".7" opacity=".4"/>';
    for (var i = 0; i < 24; i++) {
      var a = i / 24 * Math.PI * 2, r = 121, x = Math.cos(a) * r, y = Math.sin(a) * r;
      s += '<path d="M' + x.toFixed(1) + ' ' + y.toFixed(1) + ' l3 -5 l3 5z" fill="#ff7700" opacity=".85" transform="rotate(' + (a * 180 / Math.PI + 90).toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
    }
    return s + '</svg>';
  })();

  function textSigil(txt, fontSize, letterSpacing, fill, stroke, strokeWidth, filter) {
    var filt = filter ? ' filter="' + filter + '"' : '';
    return '<text x="160" y="52" text-anchor="middle" dominant-baseline="central" ' +
      'font-family="Cinzel, Georgia, serif" font-weight="900" font-size="' + fontSize + '" letter-spacing="' + letterSpacing + '" ' +
      'fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '"' + filt + '>' + txt + '</text>';
  }

  function buildMark(txt, fontSize, letterSpacing) {
    return '<div class="aura"></div><div class="ring">' + RING + '</div>' +
      '<svg class="mark" viewBox="0 0 320 100">' +
        '<g>' + textSigil(txt, fontSize, letterSpacing, 'none', '#ff1a00', 16, 'url(#glowHeavy)') + '</g>' +
        '<g>' + textSigil(txt, fontSize, letterSpacing, '#120002', '#120002', 8, '') + '</g>' +
        '<g>' + textSigil(txt, fontSize, letterSpacing, 'url(#infernoFire)', 'url(#infernoFire)', 2.5, '') + '</g>' +
        '<g opacity=".9">' + textSigil(txt, fontSize, letterSpacing, '#fff4b8', 'none', 0, 'url(#glowSoft)') + '</g>' +
      '</svg>';
  }

  var innerL = document.querySelector('#sigilL .sigil-inner');
  var innerR = document.querySelector('#sigilR .sigil-inner');
  innerL.insertAdjacentHTML('beforeend', buildMark('EL DIABLO', '33', '4px'));
  innerR.insertAdjacentHTML('beforeend', buildMark('666', '48', '8px'));

  // Controller Fiamme e Lampi Rotanti continuo e infinito
  function createRingVortexController(canvasId, reverseDirection) {
    var cvs = document.getElementById(canvasId);
    var ctx = cvs.getContext('2d');
    var ringBolts = [], ringSparks = [], ringAngle = 0;
    var cachedW = 0, cachedH = 0;

    function resizeCanvas() {
      var rect = cvs.getBoundingClientRect();
      var w = Math.round(rect.width) || 240;
      var h = Math.round(rect.height) || 240;
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      if (w !== cachedW || h !== cachedH) {
        cachedW = w;
        cachedH = h;
        cvs.width = w * dpr;
        cvs.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    setTimeout(resizeCanvas, 60);
    addEventListener('resize', resizeCanvas);

    function spawnBolt(cx, cy, baseR) {
      if (ringBolts.length > 12) return;
      var a0 = ringAngle + rnd(-1.2, 1.2);
      var span = rnd(0.5, 1.4) * (reverseDirection ? -1 : 1);
      var a1 = a0 + span;

      var segments = [];
      var steps = Math.floor(rnd(6, 10));
      for (var i = 0; i <= steps; i++) {
        var t = i / steps;
        var curA = a0 + (a1 - a0) * t;
        var r = baseR + rnd(-12, 12);
        segments.push({
          x: cx + Math.cos(curA) * r,
          y: cy + Math.sin(curA) * r
        });
      }

      ringBolts.push({
        segments: segments,
        life: 1.0,
        decay: rnd(0.045, 0.085),
        color: Math.random() < 0.6 ? '#ffffff' : (Math.random() < 0.5 ? '#7df9ff' : '#00e5ff'),
        width: rnd(1.8, 3.4),
        glow: Math.random() < 0.5 ? '#00f0ff' : '#ff3300'
      });
    }

    function spawnFlame(cx, cy, baseR) {
      if (ringSparks.length > 60) return;
      var a = ringAngle + rnd(-Math.PI, Math.PI);
      ringSparks.push({
        a: a,
        r: baseR + rnd(-10, 10),
        vr: rnd(-0.4, 0.8),
        va: rnd(0.02, 0.06) * (reverseDirection ? -1 : 1),
        sz: rnd(3, 7),
        life: 1.0,
        decay: rnd(0.02, 0.045),
        color: Math.random() < 0.35 ? '#ff2a00' : (Math.random() < 0.7 ? '#ff9400' : '#ffe875')
      });
    }

    function updateAndDraw() {
      if (!cachedW || !cachedH) resizeCanvas();
      var w = cachedW, h = cachedH;
      if (!w || !h) return;

      var cx = w / 2;
      var cy = h / 2;
      var baseR = (w / 2) * 0.72;

      ctx.clearRect(0, 0, w, h);

      // Angolo normalizzato per evitare overflow
      ringAngle += (reverseDirection ? -0.05 : 0.05);
      if (ringAngle > Math.PI * 2) ringAngle -= Math.PI * 2;
      if (ringAngle < -Math.PI * 2) ringAngle += Math.PI * 2;

      if (Math.random() < 0.45) spawnBolt(cx, cy, baseR);
      if (Math.random() < 0.25) spawnBolt(cx, cy, baseR);
      for (var f = 0; f < 3; f++) spawnFlame(cx, cy, baseR);

      // Disegna fiamme
      for (var s = ringSparks.length - 1; s >= 0; s--) {
        var sp = ringSparks[s];
        sp.life -= sp.decay;
        sp.a += sp.va;
        sp.r += sp.vr;
        if (sp.life <= 0) { ringSparks.splice(s, 1); continue; }

        var px = cx + Math.cos(sp.a) * sp.r;
        var py = cy + Math.sin(sp.a) * sp.r;

        ctx.save();
        ctx.globalAlpha = Math.max(0, sp.life);
        ctx.fillStyle = sp.color;
        ctx.shadowColor = sp.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(px, py, sp.sz * sp.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Disegna fulmini
      for (var i = ringBolts.length - 1; i >= 0; i--) {
        var b = ringBolts[i];
        b.life -= b.decay;
        if (b.life <= 0) { ringBolts.splice(i, 1); continue; }

        ctx.save();
        ctx.globalAlpha = Math.max(0, b.life);

        ctx.strokeStyle = b.glow;
        ctx.lineWidth = b.width * 2.5;
        ctx.shadowColor = b.glow;
        ctx.shadowBlur = 16;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'bevel';

        ctx.beginPath();
        for (var j = 0; j < b.segments.length; j++) {
          var p = b.segments[j];
          if (j === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        ctx.strokeStyle = b.color;
        ctx.lineWidth = b.width;
        ctx.stroke();
        ctx.restore();
      }
    }
    return { update: updateAndDraw };
  }

  var rfLeft = createRingVortexController('rfL', false);
  var rfRight = createRingVortexController('rfR', true);

  // Spuntoni vulcanici laterali
  var SHARDS = [[60,150,980,-30],[170,110,760,40],[250,90,560,-20],[330,70,400,30],[110,70,620,-60],[400,50,260,10],[20,90,520,20],[460,40,170,-12],[210,46,330,-50]];
  function buildSpires(svg) {
    var s = '';
    SHARDS.forEach(function (sh, i) {
      var x = sh[0], w = sh[1], hgt = sh[2], lean = sh[3], tx = x + lean, ty = 1000 - hgt;
      var mx = x + w * .12 + lean * .4, my = 1000 - hgt * .55;
      s += '<path d="M' + (x - w / 2) + ' 1010 L' + mx + ' ' + my + ' L' + tx + ' ' + ty + ' L' + (x + w / 2) + ' 1010Z" fill="#080002"/>';
      s += '<path d="M' + tx + ' ' + ty + ' L' + (x + w / 2) + ' 1010 L' + (x + w * .18) + ' 1010 L' + (mx + w * .06) + ' ' + (my + 40) + 'Z" fill="#240206"/>';
      s += '<path d="M' + tx + ' ' + ty + ' L' + (x + w / 2) + ' 1010" stroke="#7a0e16" stroke-width="2" opacity=".8"/>';
      if (i < 6) {
        var vx = x + rnd(-w * .15, w * .1), vy = 1010, d = 'M' + vx.toFixed(0) + ' ' + vy;
        for (var k = 0; k < 6; k++) { vx += (tx - vx) * .16 + rnd(-8, 8); vy -= hgt * .09; d += ' L' + vx.toFixed(0) + ' ' + vy.toFixed(0); }
        s += '<g fill="none" stroke-linecap="round" stroke-linejoin="round">' +
             '<path d="' + d + '" stroke="#ff2600" stroke-width="10" filter="url(#glowHeavy)" opacity=".8"/>' +
             '<path d="' + d + '" stroke="#ffaa00" stroke-width="2.6"/>' +
             '</g>';
      }
    });
    svg.innerHTML = s;
  }
  buildSpires(document.getElementById('spL'));
  buildSpires(document.getElementById('spR'));

  // Crepe vulcaniche del suolo
  (function () {
    function crack(x0, y0, len, dir) {
      var d = 'M' + x0 + ' ' + y0, x = x0, y = y0;
      for (var i = 0; i < 9; i++) {
        x += dir * rnd(len * .06, len * .14);
        y += rnd(-10, 10);
        y = Math.max(20, Math.min(115, y));
        d += ' L' + x.toFixed(0) + ' ' + y.toFixed(0);
      }
      return d;
    }
    var paths = [crack(0, 65, 520, 1), crack(30, 95, 380, 1), crack(1600, 70, 520, -1), crack(1560, 100, 400, -1), crack(150, 110, 220, 1), crack(1440, 110, 240, -1)];
    var s = '<g class="lava-hot" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      '<g stroke="#ff2200" stroke-width="14" filter="url(#glowHeavy)" opacity=".85">' + paths.map(function (p) { return '<path d="' + p + '"/>'; }).join('') + '</g>' +
      '<g stroke="#ff8400" stroke-width="4.5">' + paths.map(function (p) { return '<path d="' + p + '"/>'; }).join('') + '</g>' +
      '<g stroke="#fff2b0" stroke-width="1.4">' + paths.map(function (p) { return '<path d="' + p + '"/>'; }).join('') + '</g></g>';
    document.getElementById('lava').innerHTML = s;
  })();

  // Nuvole vulcaniche
  var CLOUD = 'M20 62 C 0 62, 0 40, 22 40 C 22 22, 50 14, 64 30 C 72 8, 112 6, 120 28 C 132 16, 162 20, 162 42 C 186 40, 196 62, 174 64 Z';
  var cloudBox = document.getElementById('clouds');
  function spawnCloud(initial) {
    var dur = rnd(60, 95) / CONFIG.speed, dir = Math.random() < .5 ? 'fx-ltr' : 'fx-rtl';
    var outer = document.createElement('div');
    outer.className = 'cl';
    outer.style.top = rnd(-2, 25) + '%';
    outer.style.width = rnd(15, 28) + 'vw';
    outer.style.transform = dir === 'fx-ltr' ? 'translateX(-15vw)' : 'translateX(115vw)';
    outer.style.animation = dir + ' ' + dur + 's linear ' + (initial ? -rnd(0, dur) : rnd(0, 10)) + 's 1 forwards';
    var inner = document.createElement('div'), b = rnd(8, 14);
    inner.style.opacity = rnd(.55, .85);
    inner.style.animation = 'cloud-drift ' + b + 's ease-in-out ' + (-rnd(0, b)) + 's infinite alternate';
    inner.innerHTML = '<svg viewBox="0 0 200 70"><path d="' + CLOUD + '" fill="url(#ashCloud)"/><path d="M28 40 C 30 26, 50 20, 62 32 M72 22 C 84 12, 108 12, 116 28" stroke="#ff5100" stroke-opacity=".4" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
    if (Math.random() < .5) inner.firstChild.style.transform = 'scaleX(-1)';
    outer.appendChild(inner);
    outer.addEventListener('animationend', function (e) { if (e.target !== outer) return; outer.remove(); spawnCloud(false); });
    cloudBox.appendChild(outer);
  }
  for (var c = 0; c < CONFIG.clouds; c++) spawnCloud(true);

  // Flock "EL DIABLO" in cielo
  var GLYPH = [];
  (function () {
    var offCanvas = document.createElement('canvas');
    offCanvas.width = 360; offCanvas.height = 70;
    var octx = offCanvas.getContext('2d');
    octx.font = 'bold 36px monospace';
    octx.fillStyle = '#fff';
    octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.fillText('EL DIABLO', 180, 35);
    
    var imgData = octx.getImageData(0, 0, 360, 70).data, validPoints = [];
    for (var y = 0; y < 70; y += 3) {
      for (var x = 0; x < 360; x += 3) {
        if (imgData[(y * 360 + x) * 4 + 3] > 128) validPoints.push({ x: x, y: y });
      }
    }
    var step = validPoints.length / CONFIG.flock;
    for (var i = 0; i < CONFIG.flock; i++) {
      var p = validPoints[Math.min(validPoints.length - 1, Math.floor(i * step))];
      GLYPH.push({ x: p.x, y: p.y });
    }
    GLYPH.sort(function (a, b) { return a.x - b.x; });
  })();

  // Canvases
  var sky = document.getElementById('sky'), sctx = sky.getContext('2d');
  var fx = document.getElementById('fx'), fctx = fx.getContext('2d');
  var em = document.getElementById('embers'), ectx = em.getContext('2d');
  var W, H, stars = [], embers = [], flock = [], sources = [];
  var formT = 0, form = 0, nextForm = 6, holdLeft = 0;

  function newEmber(initial) {
    var src = sources[Math.floor(Math.random() * sources.length)];
    var x = rnd(src.x0, src.x1), y = initial ? rnd(src.y0 - H * .35, src.y1) : rnd(src.y0, src.y1);
    return { x: x, y: y, vy: rnd(20, 50), amp: rnd(8, 26), ph: rnd(0, 6.28), r: rnd(.9, 2.4), life: initial ? rnd(0, 6) : 0, max: rnd(4.5, 9) };
  }
  function measureSources() {
    sources = [{ x0: 0, x1: W * .35, y0: H * .88, y1: H }, { x0: W * .65, x1: W, y0: H * .88, y1: H }, { x0: W * .4, x1: W * .6, y0: H * .82, y1: H }];
    ['sigilL', 'sigilR'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        var r = el.getBoundingClientRect();
        sources.push({ x0: r.left + r.width * .1, x1: r.right - r.width * .1, y0: r.top + r.height * .2, y1: r.bottom });
      }
    });
  }
  function glyphLayout() {
    var gw = 360, gh = 70, s = Math.min(W * .48 / gw, H * .14 / gh);
    return { s: s, ox: W / 2 - gw * s / 2, oy: H * .03 };
  }
  function wanderTarget(b, t) {
    return { x: W * (.5 + .52 * Math.sin(t * b.a + b.p1)), y: H * (.03 + .22 * (.5 + .5 * Math.sin(t * b.b + b.p2))) };
  }
  function initFlock() {
    flock = [];
    for (var i = 0; i < GLYPH.length; i++) {
      var b = { a: rnd(.025, .07), b: rnd(.05, .12), p1: rnd(0, 6.28), p2: rnd(0, 6.28), fp: rnd(0, 6.28), fs: rnd(9, 13), sz: rnd(.8, 1.2), dir: 1, vx: 0, vy: 0 };
      var w = wanderTarget(b, clock); b.x = w.x; b.y = w.y;
      flock.push(b);
    }
  }
  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    [[sky, sctx], [fx, fctx], [em, ectx]].forEach(function (c) { c[0].width = W * dpr; c[0].height = H * dpr; c[1].setTransform(dpr, 0, 0, dpr, 0, 0); });
    stars = []; var n = Math.min(220, Math.round(W * H / 8500));
    for (var i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.pow(Math.random(), 1.6) * H * .55, r: rnd(.35, 1.4), b: rnd(.3, .9), sp: rnd(.3, 1.1), ph: rnd(0, 6.28) });
    measureSources();
    embers = []; for (var k = 0; k < CONFIG.embers; k++) embers.push(newEmber(true));
    if (!flock.length) initFlock();
    draw(clock, 0);
  }

  var SPR = document.createElement('canvas'); SPR.width = SPR.height = 64;
  (function () {
    var c = SPR.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,250,220,1)');
    g.addColorStop(.2, 'rgba(255,170,40,.95)');
    g.addColorStop(.48, 'rgba(255,50,0,.45)');
    g.addColorStop(1, 'rgba(150,0,0,0)');
    c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  })();

  var clock = 0;
  function draw(t, dt) {
    sctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], a = s.b * (.6 + .4 * Math.sin(t * s.sp + s.ph));
      sctx.globalAlpha = a; sctx.fillStyle = '#ffc8a8';
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill();
    }
    sctx.globalAlpha = 1;

    if (dt > 0) {
      nextForm -= dt;
      if (nextForm <= 0 && holdLeft <= 0) { holdLeft = FLOCK_HOLD; nextForm = FLOCK_EVERY; }
      if (holdLeft > 0) holdLeft -= dt;
      formT += ((holdLeft > 0 ? 1 : 0) - formT) * Math.min(1, dt * .8);
    }
    form = formT * formT * (3 - 2 * formT);

    // Pipistrelli
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,' + (dt > 0 ? .22 : 1) + ')'; fctx.fillRect(0, 0, W, H);
    fctx.globalCompositeOperation = 'lighter';
    var g = glyphLayout();
    if (form > .02) {
      var cx = g.ox + 180 * g.s, cy = g.oy + 35 * g.s, rr = 210 * g.s;
      var grd = fctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      grd.addColorStop(0, 'rgba(255,80,0,' + (.08 * form) + ')');
      grd.addColorStop(.5, 'rgba(180,20,0,' + (.03 * form) + ')');
      grd.addColorStop(1, 'rgba(100,0,0,0)');
      fctx.fillStyle = grd; fctx.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    var batSize = Math.max(10, Math.min(26, 17 * g.s));
    for (var k = 0; k < flock.length; k++) {
      var b = flock[k], wt = wanderTarget(b, t), gp = GLYPH[b.slot != null ? b.slot : k];
      var fxp = g.ox + gp.x * g.s + Math.sin(t * 1.6 + b.p1) * 1.5, fyp = g.oy + gp.y * g.s + Math.cos(t * 1.9 + b.p2) * 1.5;
      var tx = wt.x + (fxp - wt.x) * form, ty = wt.y + (fyp - wt.y) * form;
      if (dt > 0) {
        var k1 = .9 + 3.2 * form, c1 = 1.6 + 2.6 * form;
        b.vx += ((tx - b.x) * k1 - b.vx * c1) * dt; b.vy += ((ty - b.y) * k1 - b.vy * c1) * dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (Math.abs(b.vx) > 4) b.dir += ((b.vx > 0 ? 1 : -1) - b.dir) * Math.min(1, dt * 4);
        b.fp += dt * b.fs * (1 - .35 * form);
      }
      var flick = .75 + .25 * Math.sin(b.fp * .7), sz = batSize * b.sz * (.7 + .5 * form) * flick;
      fctx.globalAlpha = .45 + .55 * form;
      fctx.drawImage(SPR, b.x - sz / 2, b.y - sz / 2, sz, sz);
    }
    fctx.globalAlpha = 1; fctx.globalCompositeOperation = 'source-over';

    // Braci vulcaniche
    ectx.clearRect(0, 0, W, H);
    for (var e = 0; e < embers.length; e++) {
      var m = embers[e]; m.life += dt; m.y -= m.vy * dt;
      if (m.life > m.max) { embers[e] = newEmber(false); continue; }
      var p = m.life / m.max, al = Math.sin(p * Math.PI) * .9, x = m.x + Math.sin(t * .8 + m.ph) * m.amp;
      ectx.globalAlpha = al * .35; ectx.fillStyle = '#ff2b00'; ectx.beginPath(); ectx.arc(x, m.y, m.r * 3.8, 0, 6.283); ectx.fill();
      ectx.globalAlpha = al; ectx.fillStyle = '#ffba59'; ectx.beginPath(); ectx.arc(x, m.y, m.r, 0, 6.283); ectx.fill();
    }
    ectx.globalAlpha = 1;

    // Rendering continuo fiamme e lampi rotanti
    rfLeft.update();
    rfRight.update();
  }

  function assignSlots() {
    var idx = flock.map(function (b, i) { return i; }).sort(function (a, b) { return flock[a].x - flock[b].x; });
    idx.forEach(function (fi, n) { flock[fi].slot = n; });
  }

  var last = 0;
  function loop(now) {
    var dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
    if (!paused) {
      if (holdLeft <= 0 && nextForm - dt * CONFIG.speed <= 0) assignSlots();
      clock += dt * CONFIG.speed; draw(clock, dt * CONFIG.speed);
    }
    requestAnimationFrame(loop);
  }
  addEventListener('resize', resize);
  resize(); requestAnimationFrame(loop);
  if (paused) scene.classList.add('paused');
})();
</script>
</body>
</html>
