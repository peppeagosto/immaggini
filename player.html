<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova del Nove</title>
    <style>
        body {
            background-color: #cc0000; /* Sfondo Rosso */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 40px 80px;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            background-color: white;
            color: black;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <button id="bottone-test" onclick="cliccato()">CLICCAMI!</button>

    <script>
        function cliccato() {
            // Se clicca, cambia tutto in Verde
            document.body.style.backgroundColor = "#28a745";
            document.getElementById("bottone-test").innerText = "IL CLICK FUNZIONA!";
            document.getElementById("bottone-test").style.backgroundColor = "black";
            document.getElementById("bottone-test").style.color = "white";
        }
    </script>

</body>
</html>
