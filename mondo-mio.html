    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      font-family: 'Orbitron', sans-serif;
    }

    /* Totalmente nascosto finché non digiti la password */
    #globo-master-wrapper {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #globe-container {
      width: 380px;
      height: 380px;
      border: 2px solid #00ffea;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 234, 0.6);
      background: radial-gradient(circle, #1c2526, #0a0a1a);
      overflow: hidden;
      position: absolute;
      top: 50%;
      left: 45%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #globe-container canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
    }

    .label {
      position: absolute;
      font-weight: bold;
      font-size: 11px;
      text-shadow: 0 0 4px black;
      white-space: nowrap;
      color: #00ff00;
      background: rgba(0, 0, 0, 0.7);
      padding: 2px 5px;
      border-radius: 3px;
      border: 1px solid rgba(0, 255, 234, 0.4);
      z-index: 1000;
    }

    #datario {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 5px black;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 15px;
      border-radius: 8px;
      white-space: nowrap;
      color: #00ffea;
      z-index: 10000;
    }

    #visitor-list {
      position: fixed;
      right: 15px;
      top: 40px;
      width: 260px;
      max-height: 520px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ffea;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0, 255, 234, 0.3);
      padding: 10px;
      overflow-y: auto;
      color: #00ff00;
      font-size: 12px;
      z-index: 1000;
    }

    #visitor-list::-webkit-scrollbar {
      width: 5px;
    }
    #visitor-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.5);
    }
    #visitor-list::-webkit-scrollbar-thumb {
      background: #00ffea;
      border-radius: 3px;
    }

    #visitor-list h3 {
      margin: 0 0 8px 0;
      color: #00ffea;
      text-align: center;
      text-transform: uppercase;
      font-size: 14px;
    }

    #visitor-count {
      margin: 4px 0 8px 0;
      color: #ff00ff;
      text-align: center;
      font-weight: bold;
    }

    #visitor-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #visitor-list li {
      margin-bottom: 5px;
      padding: 4px 6px;
      background: rgba(0, 255, 234, 0.1);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #visitor-list li span.timestamp {
      color: #ffff00;
      font-size: 11px;
      margin-left: 6px;
    }

    #riepilogo-visite {
      margin-top: 10px;
      border-top: 1px solid #00ffaa;
      padding-top: 8px;
      font-weight: bold;
      color: #00ffaa;
      font-size: 11px;
    }

    .btn-reset {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 6px 0;
      background: rgba(255, 0, 60, 0.2);
      border: 1px solid #ff0055;
      color: #ff3366;
      border-radius: 5px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 4px #ff0055;
    }

    .btn-reset:hover {
      background: rgba(255, 0, 60, 0.5);
      color: #fff;
    }
  </style>
</head>
