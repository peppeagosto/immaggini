<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Video + Faretti</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 1308px;
      height: 520px;
    }

    /* --- STRUTTURA FARETTI (TRUSS) --- */
    .truss-horizontal {
      position: absolute;
      top: 55px; /* Abbassato da 14px a 55px per evitare il taglio superiore */
      width: 260px;
      height: 34px;
      background: 
        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.08) 10px, rgba(255,255,255,0.08) 12px),
        repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.08) 10px, rgba(255,255,255,0.08) 12px),
        linear-gradient(to bottom, #2a2a35, #111116, #2a2a35);
      border-top: 3px solid #555;
      border-bottom: 3px solid #555;
      box-shadow: 0 0 15px rgba(0,0,0,0.9);
      z-index: 10;
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      padding: 0 4px;
      border-radius: 6px;
    }

    /* Posizionamento barre faretti */
    .truss-left-top { left: 10px; }
    .truss-right-top { right: 10px; }

    /* SINGOLO FARETTO */
    .spotlight-head {
      position: relative;
      width: 30px;
      height: 25px;
      background: linear-gradient(135deg, #444, #151515);
      border-radius: 6px;
      border: 2px solid #666;
      box-shadow: inset 0 0 6px #000, 0 3px 6px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spotlight-lens {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }

    /* COLORI FARETTI */
    .c-cyan   { background: #00f2fe; box-shadow: 0 0 16px #00f2fe; }
    .c-pink   { background: #ff007f; box-shadow: 0 0 16px #ff007f; }
    .c-green  { background: #00ff88; box-shadow: 0 0 16px #00ff88; }
    .c-orange { background: #ffaa00; box-shadow: 0 0 16px #ffaa00; }

    /* FASCI DI LUCE (BEAMS) */
    .beam {
      position: absolute;
      left: calc(50% - 30px);
      top: 14px;
      width: 60px;
      height: 420px;
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: screen;
      filter: blur(4px);
      opacity: 0.85;
      transform-origin: top center;
      clip-path: polygon(48% 0, 0 100%, 100% 100%, 52% 0);
    }

    .beam-cyan   { background: linear-gradient(to bottom, rgba(0,242,254,0.95), rgba(0,242,254,0.25) 60%, transparent); }
    .beam-pink   { background: linear-gradient(to bottom, rgba(255,0,127,0.95), rgba(255,0,127,0.25) 60%, transparent); }
    .beam-green  { background: linear-gradient(to bottom, rgba(0,255,136,0.95), rgba(0,255,136,0.25) 60%, transparent); }
    .beam-orange { background: linear-gradient(to bottom, rgba(255,170,0,0.95), rgba(255,170,0,0.25) 60%, transparent); }

    /* ANIMAZIONI MOVIMENTO FARETTI */
    .truss-left-top .beam-1 { animation: sweepWave1 3.2s ease-in-out infinite alternate; }
    .truss-left-top .beam-2 { animation: sweepWave2 2.7s ease-in-out infinite alternate 0.2s; }
    .truss-left-top .beam-3 { animation: sweepWave3 3.6s ease-in-out infinite alternate 0.5s; }
    .truss-left-top .beam-4 { animation: sweepWave4 2.9s ease-in-out infinite alternate 0.1s; }

    .truss-right-top .beam-1 { animation: sweepWave4 3.1s ease-in-out infinite alternate 0.3s; }
    .truss-right-top .beam-2 { animation: sweepWave3 2.8s ease-in-out infinite alternate 0.6s; }
    .truss-right-top .beam-3 { animation: sweepWave2 3.4s ease-in-out infinite alternate 0.1s; }
    .truss-right-top .beam-4 { animation: sweepWave1 2.6s ease-in-out infinite alternate 0.4s; }

    @keyframes sweepWave1 {
      0%   { transform: rotate(-32deg); }
      50%  { transform: rotate(5deg); }
      100% { transform: rotate(28deg); }
    }
    @keyframes sweepWave2 {
      0%   { transform: rotate(30deg); }
      50%  { transform: rotate(-8deg); }
      100% { transform: rotate(-26deg); }
    }
    @keyframes sweepWave3 {
      0%   { transform: rotate(-24deg); }
      50%  { transform: rotate(12deg); }
      100% { transform: rotate(34deg); }
    }
    @keyframes sweepWave4 {
      0%   { transform: rotate(28deg); }
      50%  { transform: rotate(-15deg); }
      100% { transform: rotate(-35deg); }
    }

    /* --- WRAPPER VIDEO --- */
    .video-wrapper {
      position: absolute;
      top: 95px; /* Abbassato da 58px a 95px sotto la barra dei faretti */
      width: 260px;
      height: 400px; /* Ridimensionato per non toccare il fondo della finestra */
      border: 3px solid #333; 
      border-radius: 12px;
      z-index: 1;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .left-video { left: 10px; }
    .right-video { right: 10px; }

    /* --- CUORE FLUTTUANTE "DELFIN" --- */
    .floating-heart {
      position: absolute;
      width: 76px;
      height: 70px;
      z-index: 30;
      pointer-events: none;
      animation: floatAround 18s ease-in-out infinite alternate;
    }

    .floating-heart svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.85)) drop-shadow(0 0 20px rgba(255, 0, 127, 0.45));
      animation: heartPulse 1.5s ease-in-out infinite;
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    @keyframes floatAround {
      0%   { left: 30px;   top: 50px;  transform: rotate(-10deg); }
      18%  { left: 610px;  top: 400px; transform: rotate(12deg); }
      36%  { left: 1200px; top: 60px;  transform: rotate(-8deg); }
      54%  { left: 960px;  top: 380px; transform: rotate(14deg); }
      72%  { left: 320px;  top: 140px; transform: rotate(-12deg); }
      88%  { left: 50px;   top: 400px; transform: rotate(8deg); }
      100% { left: 1180px; top: 400px; transform: rotate(-6deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- CUORE FLUTTUANTE CON TESTO DELFIN -->
  <div class="floating-heart">
    <svg viewBox="0 0 100 90">
      <defs>
        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff1493" />
          <stop offset="50%" stop-color="#ff007f" />
          <stop offset="100%" stop-color="#aa0055" />
        </linearGradient>
      </defs>
      <path d="M 50,26 A 21,21 0 0,0 8,26 C 8,50 36,70 50,84 C 64,70 92,50 92,26 A 21,21 0 0,0 50,26 Z" 
            fill="url(#heartGrad)" 
            stroke="#ffffff" 
            stroke-width="1.8" />
      <text x="50" y="44" 
            font-family="'Segoe UI', Roboto, sans-serif" 
            font-size="13" 
            font-weight="900" 
            fill="#ffffff" 
            text-anchor="middle" 
            dominant-baseline="middle"
            letter-spacing="1px">
        Delfin
      </text>
    </svg>
  </div>

  <!-- FARETTI SINISTRA -->
  <div class="truss-horizontal truss-left-top">
    <div class="spotlight-head">
      <div class="spotlight-lens c-cyan"></div>
      <div class="beam beam-cyan beam-1"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-pink"></div>
      <div class="beam beam-pink beam-2"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-green"></div>
      <div class="beam beam-green beam-3"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-orange"></div>
      <div class="beam beam-orange beam-4"></div>
    </div>
  </div>

  <!-- VIDEO SINISTRA -->
  <div class="video-wrapper left-video">
    <video autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/bosnia4.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- FARETTI DESTRA -->
  <div class="truss-horizontal truss-right-top">
    <div class="spotlight-head">
      <div class="spotlight-lens c-cyan"></div>
      <div class="beam beam-cyan beam-1"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-pink"></div>
      <div class="beam beam-pink beam-2"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-green"></div>
      <div class="beam beam-green beam-3"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-orange"></div>
      <div class="beam beam-orange beam-4"></div>
    </div>
  </div>

  <!-- VIDEO DESTRA -->
  <div class="video-wrapper right-video">
    <video autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/bosnia4.mp4" type="video/mp4" />
    </video>
  </div>
</div>

</body>
</html>
