<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Party Glow Ultra + Stage Spotlights</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #040407;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      position: relative;
      width: 1308px;
      height: 520px;
      background: radial-gradient(circle at 50% 30%, rgba(20, 15, 45, 0.7), #040407 80%);
      border-radius: 20px;
      overflow: hidden;
    }
    /* --- FASCI DI LUCE GLOBALI DI SOTTOFONDO --- */
    .disco-light {
      position: absolute;
      top: 0;
      width: 2px;
      height: 900px;
      z-index: 1;
      pointer-events: none;
      transform-origin: top center;
      animation: discoRotate 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      filter: blur(4px);
    }
    @keyframes discoRotate {
      0% { transform: rotate(0deg) translateX(-50%); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: rotate(360deg) translateX(-50%); opacity: 0; }
    }
    /* --- STRUTTURA FARETTI ORIZZONTALE (TRUSS) --- */
    .truss-horizontal {
      position: absolute;
      width: 210px;
      height: 34px;
      background: 
        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.08) 10px, rgba(255,255,255,0.08) 12px),
        repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.08) 10px, rgba(255,255,255,0.08) 12px),
        linear-gradient(to bottom, #2a2a35, #111116, #2a2a35);
      border-top: 3px solid #555;
      border-bottom: 3px solid #555;
      box-shadow: 0 0 15px rgba(0,0,0,0.9);
      z-index: 8;
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      padding: 0 4px;
    }
    /* Faretti allineati più verso l'esterno */
    .truss-left-top {
      top: 30px;
      left: 8px;
    }
    .truss-right-top {
      top: 30px;
      right: 8px;
    }
    /* SINGOLO FARETTO */
    .spotlight-head {
      position: relative;
      width: 32px;
      height: 26px;
      background: linear-gradient(135deg, #444, #151515);
      border-radius: 6px;
      border: 2px solid #666;
      box-shadow: inset 0 0 6px #000, 0 3px 6px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spotlight-lens {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }
    /* COLORI FARETTI */
    .c-cyan   { background: #00f2fe; box-shadow: 0 0 16px #00f2fe; }
    .c-pink   { background: #ff007f; box-shadow: 0 0 16px #ff007f; }
    .c-green  { background: #00ff88; box-shadow: 0 0 16px #00ff88; }
    .c-orange { background: #ffaa00; box-shadow: 0 0 16px #ffaa00; }
    /* FASCI DI LUCE (BEAMS) */
    .beam {
      position: absolute;
      left: calc(50% - 25px);
      top: 14px;
      width: 50px;
      height: 500px;
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: screen;
      filter: blur(4px);
      opacity: 0.85;
      transform-origin: top center;
      clip-path: polygon(48% 0, 0 100%, 100% 100%, 52% 0);
    }
    .beam-cyan   { background: linear-gradient(to bottom, rgba(0,242,254,0.95), rgba(0,242,254,0.25) 60%, transparent); }
    .beam-pink   { background: linear-gradient(to bottom, rgba(255,0,127,0.95), rgba(255,0,127,0.25) 60%, transparent); }
    .beam-green  { background: linear-gradient(to bottom, rgba(0,255,136,0.95), rgba(0,255,136,0.25) 60%, transparent); }
    .beam-orange { background: linear-gradient(to bottom, rgba(255,170,0,0.95), rgba(255,170,0,0.25) 60%, transparent); }
    /* ANIMAZIONI MOVIMENTO */
    .truss-left-top .beam-1 { animation: sweepWave1 3.2s ease-in-out infinite alternate; }
    .truss-left-top .beam-2 { animation: sweepWave2 2.7s ease-in-out infinite alternate 0.2s; }
    .truss-left-top .beam-3 { animation: sweepWave3 3.6s ease-in-out infinite alternate 0.5s; }
    .truss-left-top .beam-4 { animation: sweepWave4 2.9s ease-in-out infinite alternate 0.1s; }
    .truss-right-top .beam-1 { animation: sweepWave4 3.1s ease-in-out infinite alternate 0.3s; }
    .truss-right-top .beam-2 { animation: sweepWave3 2.8s ease-in-out infinite alternate 0.6s; }
    .truss-right-top .beam-3 { animation: sweepWave2 3.4s ease-in-out infinite alternate 0.1s; }
    .truss-right-top .beam-4 { animation: sweepWave1 2.6s ease-in-out infinite alternate 0.4s; }
    @keyframes sweepWave1 {
      0%   { transform: rotate(-32deg); }
      50%  { transform: rotate(5deg); }
      100% { transform: rotate(28deg); }
    }
    @keyframes sweepWave2 {
      0%   { transform: rotate(30deg); }
      50%  { transform: rotate(-8deg); }
      100% { transform: rotate(-26deg); }
    }
    @keyframes sweepWave3 {
      0%   { transform: rotate(-24deg); }
      50%  { transform: rotate(12deg); }
      100% { transform: rotate(34deg); }
    }
    @keyframes sweepWave4 {
      0%   { transform: rotate(28deg); }
      50%  { transform: rotate(-15deg); }
      100% { transform: rotate(-35deg); }
    }
    /* --- VIDEO LATERALI CUFFIE --- */
    video.side-video {
      position: absolute;
      top: 70px;
      width: 210px;
      height: 430px;
      object-fit: cover;
      border-radius: 20px;
      z-index: 3;
      border: 4px solid transparent;
      background: 
        linear-gradient(#050508, #050508) padding-box,
        linear-gradient(var(--angle), #00f2fe, #ff007f, #00ff88, #ffaa00, #00f2fe) border-box;
      animation: 
        rotateGradient 3s linear infinite,
        partyGlow 2s ease-in-out infinite alternate;
    }
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes rotateGradient {
      to { --angle: 360deg; }
    }
    @keyframes partyGlow {
      0% {
        box-shadow: 
          0 0 15px rgba(0, 242, 254, 0.4),
          0 0 35px rgba(255, 0, 127, 0.3),
          0 0 65px rgba(0, 255, 136, 0.2);
        transform: scale(1);
      }
      100% {
        box-shadow: 
          0 0 25px rgba(255, 0, 127, 0.6),
          0 0 55px rgba(0, 242, 254, 0.5),
          0 0 90px rgba(255, 170, 0, 0.4);
        transform: scale(1.02);
      }
    }
    /* Video posizionati più verso l'esterno */
    .left-video { left: 8px; }
    .right-video { right: 8px; }
  </style>
</head>
<body>
<div class="container" id="party-container">
  <div class="truss-horizontal truss-left-top">
    <div class="spotlight-head">
      <div class="spotlight-lens c-cyan"></div>
      <div class="beam beam-cyan beam-1"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-pink"></div>
      <div class="beam beam-pink beam-2"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-green"></div>
      <div class="beam beam-green beam-3"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-orange"></div>
      <div class="beam beam-orange beam-4"></div>
    </div>
  </div>

  <video class="side-video left-video" autoplay loop muted playsinline>
    <source src="https://peppeagosto.github.io/immaggini/cuffie1.mp4" type="video/mp4" />
  </video>
  <video class="side-video right-video" autoplay loop muted playsinline>
    <source src="https://peppeagosto.github.io/immaggini/cuffie1.mp4" type="video/mp4" />
  </video>

  <div class="truss-horizontal truss-right-top">
    <div class="spotlight-head">
      <div class="spotlight-lens c-cyan"></div>
      <div class="beam beam-cyan beam-1"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-pink"></div>
      <div class="beam beam-pink beam-2"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-green"></div>
      <div class="beam beam-green beam-3"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-orange"></div>
      <div class="beam beam-orange beam-4"></div>
    </div>
  </div>
</div>
<script>
  function createLights() {
    const container = document.getElementById('party-container');
    const colors = ['#00f2fe', '#ff007f', '#00ff88', '#ffaa00'];

    setInterval(() => {
      const light = document.createElement('div');
      light.className = 'disco-light';

      const randomX = Math.random() * 100;
      light.style.left = randomX + '%';

      const color = colors[Math.floor(Math.random() * colors.length)];
      light.style.background = `linear-gradient(to bottom, transparent, ${color}, transparent)`;
      light.style.boxShadow = `0 0 20px ${color}`;

      container.appendChild(light);
      setTimeout(() => {
        light.remove();
      }, 2500);
    }, 180);
  }
  createLights();
</script>
</body>
</html>
