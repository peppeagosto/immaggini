<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Party Glow Ultra + Player Sbloccato</title>
  <style>
    :root {
      --red: #ff2810;
      --flame: #ff5e1a;
      --gold: #ffd66e;
      --neon-blue: #00f2fe;
      --neon-purple: #9d4edd;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #040407;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      position: relative;
      width: 1308px;
      height: 520px;
      background: radial-gradient(circle at 50% 30%, rgba(20, 15, 45, 0.7), #040407 80%);
      border-radius: 20px;
      overflow: hidden;
    }

    /* FASCI DI LUCE GLOBALI DI SOTTOFONDO */
    .disco-light {
      position: absolute;
      top: 0;
      width: 2px;
      height: 900px;
      z-index: 1;
      pointer-events: none !important;
      transform-origin: top center;
      animation: discoRotate 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      filter: blur(4px);
    }

    @keyframes discoRotate {
      0% { transform: rotate(0deg) translateX(-50%); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: rotate(360deg) translateX(-50%); opacity: 0; }
    }

    /* STRUTTURA FARETTI ORIZZONTALE (TRUSS) */
    .truss-horizontal {
      position: absolute;
      width: 210px;
      height: 34px;
      background: 
        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.08) 10px, rgba(255,255,255,0.08) 12px),
        repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.08) 10px, rgba(255,255,255,0.08) 12px),
        linear-gradient(to bottom, #2a2a35, #111116, #2a2a35);
      border-top: 3px solid #555;
      border-bottom: 3px solid #555;
      box-shadow: 0 0 15px rgba(0,0,0,0.9);
      z-index: 3;
      pointer-events: none !important;
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      padding: 0 4px;
    }

    .truss-left-top {
      top: 30px;
      left: 8px;
    }

    .truss-right-top {
      top: 30px;
      right: 8px;
    }

    .spotlight-head {
      position: relative;
      width: 32px;
      height: 26px;
      background: linear-gradient(135deg, #444, #151515);
      border-radius: 6px;
      border: 2px solid #666;
      box-shadow: inset 0 0 6px #000, 0 3px 6px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none !important;
    }

    .spotlight-lens {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }

    .c-cyan   { background: #00f2fe; box-shadow: 0 0 16px #00f2fe; }
    .c-pink   { background: #ff007f; box-shadow: 0 0 16px #ff007f; }
    .c-green  { background: #00ff88; box-shadow: 0 0 16px #00ff88; }
    .c-orange { background: #ffaa00; box-shadow: 0 0 16px #ffaa00; }

    /* FASCI DI LUCE (BEAMS) */
    .beam {
      position: absolute;
      left: calc(50% - 25px);
      top: 14px;
      width: 50px;
      height: 500px;
      pointer-events: none !important;
      z-index: 2;
      mix-blend-mode: screen;
      filter: blur(4px);
      opacity: 0.85;
      transform-origin: top center;
      clip-path: polygon(48% 0, 0 100%, 100% 100%, 52% 0);
    }

    .beam-cyan   { background: linear-gradient(to bottom, rgba(0,242,254,0.95), rgba(0,242,254,0.25) 60%, transparent); }
    .beam-pink   { background: linear-gradient(to bottom, rgba(255,0,127,0.95), rgba(255,0,127,0.25) 60%, transparent); }
    .beam-green  { background: linear-gradient(to bottom, rgba(0,255,136,0.95), rgba(0,255,136,0.25) 60%, transparent); }
    .beam-orange { background: linear-gradient(to bottom, rgba(255,170,0,0.95), rgba(255,170,0,0.25) 60%, transparent); }

    .truss-left-top .beam-1 { animation: sweepWave1 3.2s ease-in-out infinite alternate; }
    .truss-left-top .beam-2 { animation: sweepWave2 2.7s ease-in-out infinite alternate 0.2s; }
    .truss-left-top .beam-3 { animation: sweepWave3 3.6s ease-in-out infinite alternate 0.5s; }
    .truss-left-top .beam-4 { animation: sweepWave4 2.9s ease-in-out infinite alternate 0.1s; }

    .truss-right-top .beam-1 { animation: sweepWave4 3.1s ease-in-out infinite alternate 0.3s; }
    .truss-right-top .beam-2 { animation: sweepWave3 2.8s ease-in-out infinite alternate 0.6s; }
    .truss-right-top .beam-3 { animation: sweepWave2 3.4s ease-in-out infinite alternate 0.1s; }
    .truss-right-top .beam-4 { animation: sweepWave1 2.6s ease-in-out infinite alternate 0.4s; }

    @keyframes sweepWave1 {
      0%   { transform: rotate(-32deg); }
      50%  { transform: rotate(5deg); }
      100% { transform: rotate(28deg); }
    }
    @keyframes sweepWave2 {
      0%   { transform: rotate(30deg); }
      50%  { transform: rotate(-8deg); }
      100% { transform: rotate(-26deg); }
    }
    @keyframes sweepWave3 {
      0%   { transform: rotate(-24deg); }
      50%  { transform: rotate(12deg); }
      100% { transform: rotate(34deg); }
    }
    @keyframes sweepWave4 {
      0%   { transform: rotate(28deg); }
      50%  { transform: rotate(-15deg); }
      100% { transform: rotate(-35deg); }
    }

    /* VIDEO LATERALI CUFFIE */
    video.side-video {
      position: absolute;
      top: 70px;
      width: 210px;
      height: 430px;
      object-fit: cover;
      border-radius: 20px;
      z-index: 2;
      pointer-events: none !important;
      border: 4px solid transparent;
      background: 
        linear-gradient(#050508, #050508) padding-box,
        linear-gradient(var(--angle), #00f2fe, #ff007f, #00ff88, #ffaa00, #00f2fe) border-box;
      animation: 
        rotateGradient 3s linear infinite,
        partyGlow 2s ease-in-out infinite alternate;
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes rotateGradient {
      to { --angle: 360deg; }
    }

    @keyframes partyGlow {
      0% {
        box-shadow: 
          0 0 15px rgba(0, 242, 254, 0.4),
          0 0 35px rgba(255, 0, 127, 0.3),
          0 0 65px rgba(0, 255, 136, 0.2);
        transform: scale(1);
      }
      100% {
        box-shadow: 
          0 0 25px rgba(255, 0, 127, 0.6),
          0 0 55px rgba(0, 242, 254, 0.5),
          0 0 90px rgba(255, 170, 0, 0.4);
        transform: scale(1.02);
      }
    }

    .left-video { left: 8px; }
    .right-video { right: 8px; }

    /* =========================================================
       --- PLAYER CENTRALE: SBLOCCATO E CLICCABILE (z-index 9999) ---
       ========================================================= */
    .master-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto !important;
    }

    .play-area {
      width: 480px;
      height: 480px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* Disattiva tutto l'anello esterno vuoto */
    }

    .custom-bg-video-box {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      overflow: hidden;
      z-index: 2;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.85);
      pointer-events: none !important;
    }

    .custom-bg-video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .album-art-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      z-index: 3;
      pointer-events: none !important;
    }
    .album-art-layer.show-cover {
      opacity: 1;
    }

    .custom-bg-video-box::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.45) 100%);
      pointer-events: none !important;
      z-index: 4;
    }

    .glow-core {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,45,20,0.45) 0%, rgba(255,140,40,0.18) 45%, transparent 72%);
      filter: blur(35px);
      animation: glowPulse 3.5s ease-in-out infinite;
      pointer-events: none !important;
      z-index: 1;
    }
    @keyframes glowPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.6; }
      50% { transform: scale(1.18); opacity: 1; }
    }

    #visualizer-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none !important;
    }

    .ring-orbit-ext-rotator {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotateRing 14s linear infinite;
      pointer-events: none !important;
      z-index: 6;
    }
    @keyframes rotateRing {
      to { transform: rotate(360deg); }
    }

    .ring-orbit-ext {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid transparent;
      border-top-color: var(--red);
      border-right-color: var(--gold);
      border-bottom-color: var(--neon-blue);
      border-left-color: rgba(0, 242, 254, 0.5);
      filter: drop-shadow(0 0 14px var(--neon-blue)) drop-shadow(0 0 8px rgba(255, 214, 110, 0.6));
      pointer-events: none !important;
      will-change: transform, filter;
      transition: transform 0.06s ease-out;
    }

    .ring-dashed {
      position: absolute;
      width: 405px;
      height: 405px;
      border-radius: 50%;
      border: 8px dashed rgba(255, 94, 26, 0.85);
      animation: rotateReverse 18s linear infinite;
      filter: drop-shadow(0 0 10px rgba(255, 94, 26, 0.7));
      pointer-events: none !important;
      z-index: 6;
    }
    @keyframes rotateReverse {
      to { transform: rotate(-360deg); }
    }

    .circular-svg-title {
      position: absolute;
      width: 395px;
      height: 395px;
      z-index: 7;
      pointer-events: none !important;
      animation: rotateRing 26s linear infinite;
    }
    .circular-svg-title text {
      font-size: 12.5px;
      font-weight: 900;
      letter-spacing: 4.5px;
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 1.2px;
      paint-order: stroke fill;
      filter: drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 12px #ff6600);
      text-transform: uppercase;
    }

    .stars-orbit {
      position: absolute;
      inset: 0;
      z-index: 8;
      animation: starsOrbit 22s linear infinite;
      pointer-events: none !important;
    }
    @keyframes starsOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .star-glyph {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 16px;
      line-height: 1;
      color: var(--star-col);
      text-shadow: 0 0 6px var(--star-col), 0 0 14px var(--star-col);
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-185px);
      animation: starFlicker var(--shine-time) ease-in-out infinite;
      animation-delay: var(--delay);
      pointer-events: none !important;
    }
    .star-glyph:nth-child(1){ --angle:0deg; --star-col:#ffd700; --shine-time:2.2s; --delay:.1s; }
    .star-glyph:nth-child(2){ --angle:45deg; --star-col:#ff2d55; --shine-time:2.8s; --delay:.4s; }
    .star-glyph:nth-child(3){ --angle:90deg; --star-col:#00f2fe; --shine-time:2.4s; --delay:.8s; }
    .star-glyph:nth-child(4){ --angle:135deg; --star-col:#d066ff; --shine-time:3.0s; --delay:1.1s; }
    .star-glyph:nth-child(5){ --angle:180deg; --star-col:#ffffff; --shine-time:2.5s; --delay:1.4s; }
    .star-glyph:nth-child(6){ --angle:225deg; --star-col:#ff8c42; --shine-time:2.1s; --delay:1.8s; }
    .star-glyph:nth-child(7){ --angle:270deg; --star-col:#4af6a2; --shine-time:2.9s; --delay:2.1s; }
    .star-glyph:nth-child(8){ --angle:315deg; --star-col:#ff5ee0; --shine-time:2.6s; --delay:2.4s; }

    @keyframes starFlicker {
      0%, 100% { opacity: 0.35; transform: translate(-50%,-50%) rotate(var(--angle)) translateY(-185px) scale(0.8); }
      50% { opacity: 1; transform: translate(-50%,-50%) rotate(var(--angle)) translateY(-185px) scale(1.3); }
    }

    /* IL DISCO INTERATTIVO: CLIC ATTIVO AL 100% */
    .player-disc-frame {
      position: relative;
      z-index: 10000 !important;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      padding: 4px;
      background: transparent;
      cursor: pointer !important;
      pointer-events: auto !important;
      transition: all 0.3s ease-in-out;
    }

    .player-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer !important;
      pointer-events: auto !important;
    }

    .core-content {
      position: relative;
      z-index: 10001 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 90%;
      opacity: 0.95;
      cursor: pointer !important;
      pointer-events: auto !important;
      transition: opacity 0.4s ease;
    }

    .btn-play-icon {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 32px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 214, 110, 0.5);
      margin-bottom: 8px;
      cursor: pointer !important;
      pointer-events: auto !important;
      transition: all 0.2s ease;
    }
    .player-disc-frame:hover .btn-play-icon {
      transform: scale(1.1);
      background: rgba(255, 40, 16, 0.65);
      border-color: #ffd66e;
      box-shadow: 0 0 25px rgba(255, 40, 16, 0.9);
    }

    .player-disc-frame.is-playing .core-content {
      opacity: 0;
      pointer-events: none;
    }

    .player-disc-frame.is-playing:hover .core-content {
      opacity: 0.85;
      pointer-events: auto !important;
    }

    .marquee-box {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      pointer-events: none;
      mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
    }
    .marquee-content {
      display: inline-block;
      color: #ffd66e;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 
        -1px -1px 0 #000, 
         1px -1px 0 #000, 
        -1px  1px 0 #000, 
         1px  1px 0 #000,
         0 0 10px rgba(0,0,0,0.95);
      animation: scrollMarquee 9s linear infinite;
    }
    @keyframes scrollMarquee {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

<div class="container" id="party-container">

  <!-- FARETTI TRUSS SINISTRA -->
  <div class="truss-horizontal truss-left-top">
    <div class="spotlight-head">
      <div class="spotlight-lens c-cyan"></div>
      <div class="beam beam-cyan beam-1"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-pink"></div>
      <div class="beam beam-pink beam-2"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-green"></div>
      <div class="beam beam-green beam-3"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-orange"></div>
      <div class="beam beam-orange beam-4"></div>
    </div>
  </div>

  <!-- VIDEO SINISTRA -->
  <video class="side-video left-video" autoplay loop muted playsinline>
    <source src="https://peppeagosto.github.io/immaggini/cuffie1.mp4" type="video/mp4" />
  </video>

  <!-- ================= PLAYER CENTRALE SBLOCCATO ================= -->
  <div class="master-container">
    <div class="play-area">
      
      <!-- Box Video + Cover -->
      <div class="custom-bg-video-box">
        <video id="bg-video" loop playsinline preload="auto">

      <div class="ring-dashed"></div>

      <svg class="circular-svg-title" viewBox="0 0 400 400">
        <path id="circlePath" fill="none" d="M 200, 200 m -155, 0 a 155,155 0 1,1 310,0 a 155,155 0 1,1 -310,0"/>
        <text>
          <textPath href="#circlePath" id="svg-title-text" startOffset="0%">
            ✦ ON AIR • CARICAMENTO TITOLO IN CORSO • ASCOLTA LA MUSICA ✦
          </textPath>
        </text>
      </svg>

      <div class="stars-orbit">
        <span class="star-glyph">✦</span>
        <span class="star-glyph">✦</span>
        <span class="star-glyph">✦</span>
        <span class="star-glyph">✦</span>
        <span class="star-glyph">✦</span>
        <span class="star-glyph">✦</span>
        <span class="star-glyph">✦</span>
        <span class="star-glyph">✦</span>
      </div>

      <!-- CUORE INTERATTIVO CLICCABILE -->
      <div class="player-disc-frame" id="disc-frame" onclick="togglePlayback()">
        <div class="player-core" id="player-core">
          <div class="core-content">
            <div class="btn-play-icon" id="ctrl-icon">▶</div>
            <div class="marquee-box">
              <div class="marquee-content" id="inner-song-title">PREMI PLAY PER ASCOLTARE</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <!-- ================= FINE PLAYER CENTRALE ================= -->

  <!-- VIDEO DESTRA -->
  <video class="side-video right-video" autoplay loop muted playsinline>
    <source src="https://peppeagosto.github.io/immaggini/cuffie1.mp4" type="video/mp4" />
  </video>

  <!-- FARETTI TRUSS DESTRA -->
  <div class="truss-horizontal truss-right-top">
    <div class="spotlight-head">
      <div class="spotlight-lens c-cyan"></div>
      <div class="beam beam-cyan beam-1"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-pink"></div>
      <div class="beam beam-pink beam-2"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-green"></div>
      <div class="beam beam-green beam-3"></div>
    </div>
    <div class="spotlight-head">
      <div class="spotlight-lens c-orange"></div>
      <div class="beam beam-orange beam-4"></div>
    </div>
  </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  function createLights() {
    const container = document.getElementById('party-container');
    const colors = ['#00f2fe', '#ff007f', '#00ff88', '#ffaa00'];

    setInterval(() => {
      const light = document.createElement('div');
      light.className = 'disco-light';

      const randomX = Math.random() * 100;
      light.style.left = randomX + '%';

      const color = colors[Math.floor(Math.random() * colors.length)];
      light.style.background = `linear-gradient(to bottom, transparent, ${color}, transparent)`;
      light.style.boxShadow = `0 0 20px ${color}`;

      container.appendChild(light);
      setTimeout(() => {
        light.remove();
      }, 2500);
    }, 180);
  }
  createLights();

  // MOTORE STREAMING AUDIO
  const STATS_URL = "https://stm2.srvif.com:7198/stats?sid=1&json=1&callback=?";
  const STREAM_URL = "https://stm2.srvif.com:7198/;";

  const audio = new Audio();
  audio.crossOrigin = "anonymous";
  audio.src = STREAM_URL;
  audio.volume = 0;

  const bgVideo = document.getElementById("bg-video");
  const coverLayer = document.getElementById("album-cover-art");

  let audioCtx, analyser, sourceNode, dataArray;
  let isPlaying = false;
  let currentSong = "";
  let latestCoverUrl = "";
  let introTimer = null;
  let isIntroFinished = false;

  const canvas = document.getElementById("visualizer-canvas");
  const ctx = canvas.getContext("2d");
  const dancingRing = document.getElementById("dancing-ring");

  function resizeCanvas() {
    canvas.width = 480;
    canvas.height = 480;
  }
  resizeCanvas();

  function initAudioVisualizer() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.8;
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        console.warn("AudioContext limit o CORS fallback:", e);
      }
    }
  }

  function drawSpectrum() {
    requestAnimationFrame(drawSpectrum);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const baseRadius = 142; 
    const barsCount = 64;

    let bassEnergy = 0;

    if (analyser && isPlaying && dataArray) {
      analyser.getByteFrequencyData(dataArray);

      let bassSum = 0;
      const bassBins = Math.min(8, dataArray.length);
      for (let b = 0; b < bassBins; b++) {
        bassSum += dataArray[b];
      }
      bassEnergy = bassSum / bassBins;
    }

    if (isPlaying) {
      if (bassEnergy === 0) {
        const t = Date.now() / 180;
        bassEnergy = (Math.sin(t) * 0.5 + 0.5) * 160 + (Math.cos(t * 1.5) * 0.5 + 0.5) * 50;
      }
      
      const scaleVal = 1 + (bassEnergy / 255) * 0.09;
      const glowVal = 14 + (bassEnergy / 255) * 16;
      dancingRing.style.transform = `scale(${scaleVal})`;
      dancingRing.style.filter = `drop-shadow(0 0 ${glowVal}px var(--neon-blue)) drop-shadow(0 0 ${glowVal / 2}px rgba(255, 214, 110, 0.8))`;
    } else {
      dancingRing.style.transform = "scale(1)";
      dancingRing.style.filter = "drop-shadow(0 0 14px var(--neon-blue)) drop-shadow(0 0 8px rgba(255, 214, 110, 0.6))";
    }

    for (let i = 0; i < barsCount; i++) {
      const rad = (Math.PI * 2 / barsCount) * i;
      let val = (isPlaying && dataArray && dataArray[i % dataArray.length] > 0) 
        ? dataArray[i % dataArray.length] 
        : (Math.sin(Date.now() / 350 + i) * 8 + 12);
      
      const barLen = Math.max(4, (val / 255) * 45);

      const x1 = centerX + Math.cos(rad) * baseRadius;
      const y1 = centerY + Math.sin(rad) * baseRadius;
      const x2 = centerX + Math.cos(rad) * (baseRadius + barLen);
      const y2 = centerY + Math.sin(rad) * (baseRadius + barLen);

      const hue = (i * 5 + Date.now() / 30) % 360;
      ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.shadowBlur = 10;
      ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }

  function togglePlayback() {
    initAudioVisualizer();

    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (!isPlaying) {
      isPlaying = true;
      $("#ctrl-icon").text("⏸");
      $("#disc-frame").addClass("is-playing");

      // 1. Ripristino video mp4
      bgVideo.currentTime = 0;
      bgVideo.muted = false;
      bgVideo.volume = 1;
      bgVideo.play().catch(e => console.log("Video play:", e));

      // 2. Avvio stream audio (parte a 0)
      audio.volume = 0;
      audio.play().catch(err => {
        console.error("Errore play radio:", err);
        // Fallback riproduzione diretta
        audio.volume = 1;
        audio.play();
      });

      $(coverLayer).removeClass("show-cover");
      isIntroFinished = false;

      // 3. Timer transizione 9 secondi
      clearTimeout(introTimer);
      introTimer = setTimeout(() => {
        if (!isPlaying) return;

        isIntroFinished = true;
        bgVideo.muted = true;
        $(audio).animate({ volume: 1.0 }, 400);

        if (latestCoverUrl) {
          coverLayer.style.backgroundImage = `url('${latestCoverUrl}')`;
          $(coverLayer).addClass("show-cover");
        }
      }, 9000);

    } else {
      isPlaying = false;
      clearTimeout(introTimer);
      audio.pause();
      bgVideo.pause();
      $("#ctrl-icon").text("▶");
      $("#disc-frame").removeClass("is-playing");
      $(coverLayer).removeClass("show-cover");
    }
  }

  function updateMetadata() {
    $.getJSON(STATS_URL, (res) => {
      if (res && res.songtitle) {
        const rawTitle = res.songtitle.trim();

        if (rawTitle !== currentSong) {
          currentSong = rawTitle;
          const cleanTitle = rawTitle.toUpperCase();

          $("#inner-song-title").text(cleanTitle);
          $("#svg-title-text").text(`✦ ON AIR: ${cleanTitle} • ASCOLTA ORA ✦`);

          const itunesSearch = "https://itunes.apple.com/search?term=" + encodeURIComponent(rawTitle) + "&media=music&limit=1&callback=?";
          $.getJSON(itunesSearch, (data) => {
            if (data.results && data.results.length > 0) {
              latestCoverUrl = data.results[0].artworkUrl100.replace('100x100', '800x800');
              
              if (isPlaying && isIntroFinished) {
                coverLayer.style.backgroundImage = `url('${latestCoverUrl}')`;
                $(coverLayer).addClass("show-cover");
              }
            } else {
              latestCoverUrl = "";
              $(coverLayer).removeClass("show-cover");
            }
          });
        }
      }
    });
  }

  $(document).ready(() => {
    updateMetadata();
    drawSpectrum();
    setInterval(updateMetadata, 12000);
  });
</script>
