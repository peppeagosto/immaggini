<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>EL DIABLO</title>
<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1308px;
  height: 484px;
  background: radial-gradient(circle at center, rgba(255, 235, 238, 0.4) 0%, rgba(255, 205, 210, 0.15) 70%, transparent 100%);
  border-radius: 24px;
}

.media-wrapper {
  position: absolute;
  width: 270px;
  height: 484px;
  overflow: hidden;
  z-index: 1;
  background: transparent;
  border-radius: 20px;
}

.left { left: 0; }
.right { right: 0; }

.media-wrapper::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 4px;
  border-radius: 20px;
  background: conic-gradient(
    red, orange, yellow, lime, cyan, blue, violet, red
  );
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  filter: drop-shadow(0 0 10px rgba(255, 0, 255, .7));
  pointer-events: none;
  z-index: 3;
}

.side-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
  -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 75%, rgba(0,0,0,0.3) 100%);
  mask-image: radial-gradient(circle, rgba(0,0,0,1) 75%, rgba(0,0,0,0.3) 100%);
}

.video-text {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 25px;
  font-family: Trebuchet MS, sans-serif;
  font-weight: bold;
  z-index: 4;
  background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowText 3s linear infinite;
  text-transform: uppercase;
}

@keyframes rainbowText {
  0% { background-position: 0%; }
  100% { background-position: 100%; }
}

.center-area {
  position: absolute;
  left: 270px;
  right: 270px;
  top: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 0;
}

.center-box {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  filter: drop-shadow(0 0 25px rgba(255, 0, 0, .6));
}

.css-heart {
  position: relative;
  width: 140px;
  height: 140px;
  background-color: #ff0000;
  transform: rotate(-45deg);
  animation: heartBeat 1.5s infinite ease-in-out;
  box-shadow: 0 0 30px #ff0000;
}

.css-heart::before,
.css-heart::after {
  content: "";
  position: absolute;
  width: 140px;
  height: 140px;
  background-color: #ff0000;
  border-radius: 50%;
}

.css-heart::before {
  top: -70px;
  left: 0;
}

.css-heart::after {
  top: 0;
  left: 70px;
}

@keyframes heartBeat {
  0%, 100% { transform: rotate(-45deg) scale(1); }
  30% { transform: rotate(-45deg) scale(1.15); }
  45% { transform: rotate(-45deg) scale(1.05); }
  60% { transform: rotate(-45deg) scale(1.2); }
}

.center-title {
  position: absolute;
  font-size: 32px;
  font-family: Trebuchet MS, sans-serif;
  font-weight: 900;
  letter-spacing: 3px;
  color: #ff1e1e;
  text-transform: uppercase;
  text-shadow:
    0 0 10px #ff0000,
    0 0 20px #ff0000,
    0 0 30px #ff0000,
    0 2px 5px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  white-space: nowrap;
  animation: moveFourSides 10s linear infinite;
}

@keyframes moveFourSides {
  0%, 100% {
    top: 20px;
    left: 20px;
    transform: translate(0, 0);
  }
  25% {
    top: 20px;
    left: calc(100% - 220px);
    transform: translate(0, 0);
  }
  50% {
    top: calc(100% - 60px);
    left: calc(100% - 220px);
    transform: translate(0, 0);
  }
  75% {
    top: calc(100% - 60px);
    left: 20px;
    transform: translate(0, 0);
  }
}
</style>
</head>
<body>

<div class="container">
    <!-- Foto Sinistra -->
    <div class="media-wrapper left">
        <img class="side-img" src="https://xatimg.com/image/jEX5p8xZ2vpb.jpg" alt="Foto Sinistra">
        <div class="video-text">amore2015</div>
    </div>

    <!-- Foto Destra -->
    <div class="media-wrapper right">
        <img class="side-img" src="https://xatimg.com/image/UKvoJlJd4NuE.jpg" alt="Foto Destra">
        <div class="video-text">live</div>
    </div>

    <!-- Area Centrale -->
    <div class="center-area">
        <div class="center-box">
            <div class="css-heart"></div>
            <div class="center-title">amore 2015</div>
        </div>
    </div>
</div>

</body>
</html>
