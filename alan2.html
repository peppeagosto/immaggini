<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Modificato con Sfondo Centrale Delicato</title>
<style>
body{
  margin:0;
  /* Lo sfondo del body rimane trasparente per permettere allo sfondo della container di vedersi */
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.container{
  position:relative;
  width:1308px;
  height:484px;
  /* APPLICAZIONE DELLO SFONDO ACQUERELLO ALLA CONTAINER */
  /* Questo copre tutto lo spazio *dietro* le immagini, eliminando il bianco */
  /* Utilizziamo linear-gradient e background-blend-mode per schiarire l'immagine */
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), /* Sovrapposizione bianca semi-trasparente per schiarire */
    url('https://xatimg.com/image/91B5sOjRzL8q.jpg'); /* L'immagine acquerello originale */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  /* blend-mode overlay per un effetto delicato */
  background-blend-mode: overlay; 
  
  border-radius: 20px; /* Opzionale, per abbinare i bordi */
  box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Opzionale, per dare profondità */
}

/* ===== CONTENITORE IMMAGINI SIDE ===== */
.video-wrapper{
  position:absolute;
  width:270px;
  height:484px;
  overflow:hidden;
  z-index:1; /* Sopra lo sfondo della container */
  background:transparent;
  border-radius:20px;
}
.left{left:0}
.right{right:0}

/* ===== BORDI ARCOBALENO (Invariati) ===== */
.video-wrapper::before{
  content:"";
  position:absolute;
  inset:0;
  padding:4px;
  border-radius:20px;
  background:conic-gradient(
    red,orange,yellow,lime,cyan,blue,violet,red
  );
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  filter:drop-shadow(0 0 10px rgba(255,0,255,.7));
  pointer-events:none;
}

/* ===== IMMAGINI (Invariate) ===== */
.side-image{
  width:100%;
  height:100%;
  object-fit: cover;
  border-radius:16px;
  display:block;
}

/* ===== AREA CENTRALE (Invariata) ===== */
.center-area{
  position:absolute;
  left:280px; /* Spazio per la foto sx + margine */
  right:280px; /* Spazio per la foto dx + margine */
  top:0;
  bottom:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:0; /* Sotto le foto side, ma lo sfondo è gestito dalla container */
}
</style></head><body>
<div class="container">
  
  <!-- Foto Sinistra (sx) -->
  <div class="video-wrapper left">
    <img class="side-image" src="https://xatimg.com/image/n5igPisDWDXf.jpg" alt="Foto Sinistra">
  </div>

  <!-- Foto Destra (dx) -->
  <div class="video-wrapper right">
    <img class="side-image" src="https://xatimg.com/image/RmhiTt7Guaug.jpg" alt="Foto Destra">
  </div>

  <!-- Area centrale (ora mostra lo sfondo della container) -->
  <div class="center-area">
    <!-- Puoi inserire testo o altri elementi qui se vuoi -->
  </div>
</div>
</body></html>
