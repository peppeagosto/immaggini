<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Modificato</title>
<style>
body{  margin:0;  background:transparent;  display:flex;  justify-content:center;  align-items:center;  height:100vh;  overflow:hidden;}.container{  position:relative;  width:1308px;  height:484px;} /*[cite: 1] */

/* ===== CONTENITORE IMMAGINI SIDE ===== */
.video-wrapper{  position:absolute;  width:270px;  height:484px;  overflow:hidden;  z-index:1;  background:transparent;  border-radius:20px;}.left{left:0}.right{right:0} /*[cite: 1] */

/* ===== BORDI ARCOBALENO ===== */
.video-wrapper::before{  content:"";  position:absolute;  inset:0;  padding:4px;  border-radius:20px;  background:conic-gradient(    red,orange,yellow,lime,cyan,blue,violet,red  );  -webkit-mask:    linear-gradient(#fff 0 0) content-box,    linear-gradient(#fff 0 0);  -webkit-mask-composite:xor;  mask-composite:exclude;  filter:drop-shadow(0 0 10px rgba(255,0,255,.7));  pointer-events:none;} /*[cite: 1] */

/* ===== IMMAGINI ===== */
.side-image{  
  width:100%;  
  height:100%;  
  /* object-fit: cover fa riempire tutto lo spazio disponibile senza alterare o distorcere la foto */
  object-fit: cover;  
  border-radius:16px;  
  display:block;
}

/* ===== AREA CENTRALE ===== */
.center-area{  
  position:absolute;  
  left:280px;  
  right:280px;  
  top:0;  
  bottom:0;  
  display:flex;  
  justify-content:center;  
  align-items:center;  
  z-index:0;
} /*[cite: 1] */
</style></head><body>
<div class="container">
  
  <!-- Foto Sinistra (sx) -->
  <div class="video-wrapper left">    
    <img class="side-image" src="https://xatimg.com/image/n5igPisDWDXf.jpg" alt="Foto Sinistra">
  </div>

  <!-- Foto Destra (dx - ora riempie tutto lo spazio senza alterarsi) -->
  <div class="video-wrapper right">    
    <img class="side-image" src="https://xatimg.com/image/RmhiTt7Guaug.jpg" alt="Foto Destra">
  </div>

  <!-- Area centrale vuota -->
  <div class="center-area">    
  </div>
</div>
</body></html>
