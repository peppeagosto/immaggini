!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radar XAT - Peppe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="margin:0; background:#111; overflow:hidden;">

<div style="display: flex; width: 100vw; height: 100vh; background: #111; box-sizing: border-box; color: #00ffcc; font-family: monospace;">
    <!-- Mappa (OCCUPA TUTTO LO SPAZIO POSSIBILE A SINISTRA) -->
    <div style="flex: 1; height: 100%; position: relative;">
        <div style="position: absolute; top: 8px; left: 8px; z-index: 1000; background: rgba(0,0,0,0.8); padding: 3px 8px; border-radius: 3px; color: #00ffcc; font-size: 11px; border: 1px solid #00ffcc55; width: 160px; overflow: hidden;">
            <marquee scrollamount="3">>> RADAR ATTIVO >> RICERCA IN CORSO >></marquee>
        </div>
        <div id="map" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Colonna Controlli a destra (Compatta e senza spazi neri vuoti) -->
    <div style="width: 240px; height: 100%; display: flex; flex-direction: column; gap: 6px; background: #151515; padding: 6px; border-left: 1px solid #333; box-sizing: border-box;">
        <!-- Player Radio Mini -->
        <div style="background: #1c1c1c; padding: 6px; border-radius: 4px; border: 1px solid #00ffcc44;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <div id="art-gambe" style="width: 35px; height: 35px; background: #000 url('https://xatimg.com/image/bgXxdAXNQBW6.png') center/cover no-repeat; border-radius: 3px; flex-shrink: 0;"></div>
                <div style="overflow: hidden; flex: 1;">
                    <div style="font-size: 8px; color: #00ffcc;">IN ONDA:</div>
                    <div id="title-gambe" style="font-size: 10px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold;">Caricamento...</div>
                </div>
            </div>
            <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button id="playBtn" style="background:#007bff; color:#fff; border:none; padding: 3px 6px; border-radius:3px; cursor:pointer; font-size: 10px; font-weight:bold;">▶ PLAY</button>
                <input type="range" id="volControl" min="0" max="1" step="0.05" value="0.8" style="flex:1; cursor:pointer; height: 14px;">
            </div>
        </div>

        <!-- Modulo Cerca Località -->
        <div style="display: flex; gap: 3px;">
            <input type="text" id="searchInput" placeholder="Cerca località..." style="flex: 1; padding: 5px; border-radius: 3px; border: 1px solid #444; background: #222; color: #fff; font-size: 11px; outline: none;">
            <button id="searchBtn" style="padding: 5px 8px; background: #007bff; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold;">Vai</button>
        </div>

        <!-- Contatore Visite -->
        <div style="background: #222; padding: 5px 8px; border-left: 3px solid #28a745; font-size: 11px;">VISITE: <span id="visitCount" style="font-weight: bold;">0</span></div>
        
        <!-- Lista Visitatori -->
        <div id="visitorList" style="flex: 1; background: #1a1a1a; padding: 6px; border-radius: 3px; border: 1px solid #333; overflow-y: auto;">
            <div style="font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 4px;">Ultimi Visitatori:</div>
        </div>
    </div>
</div>

<audio id="radio-stream" crossorigin="anonymous" src="https://stm2.srvif.com:7198/stream"></audio>

<script>
    var map = L.map('map').setView([41.9, 12.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' }).addTo(map);

    fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
            let citta = data.city || "Roma";
            let lat = data.latitude || 41.9;
            let lon = data.longitude || 12.5;
            let bandiera = "🇮🇹";
            if (data.country_code) {
                bandiera = data.country_code.toUpperCase().replace(/./g, char => String.fromCodePoint(127397 + char.charCodeAt(0)));
            }
            let stringaVisitatore = citta + " " + bandiera;

            let visitatori = JSON.parse(localStorage.getItem('xat_visitatori_salvati')) || [];
            visitatori.unshift({ nome: stringaVisitatore, lat: lat, lon: lon });
            if (visitatori.length > 10) visitatori = visitatori.slice(0, 10);
            localStorage.setItem('xat_visitatori_salvati', JSON.stringify(visitatori));
            aggiornaInterfaccia(visitatori);
        })
        .catch(() => {
            let visitatori = JSON.parse(localStorage.getItem('xat_visitatori_salvati')) || [];
            visitatori.unshift({ nome: "Roma 🇮🇹", lat: 41.9, lon: 12.5 });
            if (visitatori.length > 10) visitatori = visitatori.slice(0, 10);
            localStorage.setItem('xat_visitatori_salvati', JSON.stringify(visitatori));
            aggiornaInterfaccia(visitatori);
        });

    function aggiornaInterfaccia(lista) {
        const listDiv = document.getElementById('visitorList');
        listDiv.innerHTML = '<div style="font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 4px;">Ultimi Visitatori:</div>';
        
        lista.forEach((v, index) => {
            listDiv.innerHTML += '<div style="color: #00ffcc; font-size: 11px; margin-bottom: 2px;">• ' + v.nome + '</div>';
            if (v.lat && v.lon) {
                L.marker([v.lat, v.lon]).addTo(map).bindPopup(v.nome);
                if (index === 0) map.setView([v.lat, v.lon], 6);
            }
        });
        document.getElementById('visitCount').innerText = lista.length;
    }

    document.getElementById('searchBtn').addEventListener('click', function() {
        var query = document.getElementById('searchInput').value;
        if(!query) return;
        
        fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query))
            .then(res => res.json())
            .then(data => {
                if(data && data.length > 0) {
                    var lat = data[0].lat;
                    var lon = data[0].lon;
                    var nomeCitta = data[0].display_name.split(',')[0];
                    map.setView([lat, lon], 10);
                    L.marker([lat, lon]).addTo(map).bindPopup(nomeCitta).openPopup();
                }
            });
    });

    $('#playBtn').click(function() {
        let audio = document.getElementById('radio-stream');
        if (audio.paused) { audio.play(); $(this).text('❚❚'); } else { audio.pause(); $(this).text('▶'); }
    });

    $('#volControl').on('input', function() {
        document.getElementById('radio-stream').volume = $(this).val();
    });
    
    setInterval(() => {
        $.getJSON("https://stm2.srvif.com:7198/stats?sid=1&json=1&callback=?", function(data) {
            $('#title-gambe').text(data.songtitle || "In linea");
        });
    }, 10000);
</script>
</body>
</html>
