<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title> Live </title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #050505; 
            font-family: monospace;
        }
        #canvas-3d { width: 100%; height: 100%; }
        #schermata-blocco {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            color: #ff0033;
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

    <!-- Schermata di sicurezza iniziale -->
    <div id="schermata-blocco">
        <h1 style="text-shadow: 0 0 10px #ff0033;">AREA PROTETTA - EL DIABLO</h1>
        <p style="color: #fff; margin-bottom: 20px;">Inserisci la chiave di accesso riservata:</p>
        <input type="password" id="chiaveInput" placeholder="******" style="padding: 10px; background: #111; border: 1px solid #ff0033; color: #fff; text-align: center; font-size: 18px; outline: none;">
        <br>
        <button onclick="verificaAccesso()" style="padding: 10px 20px; background: #ff0033; color: #fff; border: none; cursor: pointer; font-weight: bold;">ACCEDI</button>
    </div>

    <!-- Contenitore del tuo script principale (inizialmente nascosto) -->
    <div id="canvas-3d" style="display:none;"></div>

    <!-- Librerie grafiche e database -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // CAMBIA QUI LA TUA PASSWORD SEGRETA (es. metti quella che preferisci tra le virgolette)
        const passwordSegreta = "eldiablo2026"; 

        function verificaAccesso() {
            let inserito = document.getElementById("chiaveInput").value;
            
            if (inserito === passwordSegreta) {
                // Password corretta: rimuove la schermata di blocco e mostra il tuo layout
                document.getElementById("schermata-blocco").style.display = "none";
                document.getElementById("canvas-3d").style.display = "block";
                
                // --- INIZIO CODICE DEL TUO GLOBO / TRACKER ---
                console.log("Benvenuto El Diablo. Sistema avviato con successo.");
                // ---------------------------------------------
                
            } else {
                // Password errata: scatta il blocco totale con firma
                document.getElementById("schermata-blocco").innerHTML = `
                    <h1 style='font-size: 40px; text-shadow: 0 0 20px #ff0033;'>ACCESSO NEGATO</h1>
                    <p style='color: #fff; font-size: 18px;'>Tentativo di effrazione registrato.</p>
                    <h3 style='color: #00ffff; margin-top: 20px;'>PROPRIETÀ DI EL DIABLO - IL CARTAIO</h3>
                `;
            }
        }
    </script>
</body>
</html>
