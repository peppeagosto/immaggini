<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>EL DIABLO</title>
<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Arial Black', Impact, sans-serif;
  color: white;
}

.container {
  position: relative;
  width: 1308px;
  height: 484px;
}

/* ===== VIDEO LATERALI (9:16) ===== */
.video-wrapper {
  position: absolute;
  width: 270px;
  height: 484px;
  overflow: hidden;
  z-index: 1;
  background: transparent;
  border-radius: 20px;
}
.left { left: 0; }
.right { right: 0; }

.side-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
}

/* ===== AREA CENTRALE TRASPARENTE ===== */
.center-area {
  position: absolute;
  left: 340px;  
  right: 340px; 
  top: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2; 
  background: transparent;
}

.center-box {
  position: relative;
  width: 100%;
  height: 420px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: transparent;
}

/* ===== EFFETTO TESTO TAGLIATO (KNIFE CUT) FLUTTUANTE ===== */
.diablo-cut-container {
  position: relative;
  font-size: 70px;
  text-transform: uppercase;
  font-weight: 900;
  letter-spacing: 3px;
  user-select: none;
  z-index: 3;
  /* Animazione per far fluttuare il testo tagliato */
  animation: floatText 3s ease-in-out infinite alternate;
}

/* Testo base nascosto per dare la dimensione */
.diablo-hidden {
  opacity: 0;
}

/* Metà SOPRA (Rossa) */
.diablo-top {
  position: absolute;
  top: 0;
  left: 0;
  color: #ff0000;
  clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
  text-shadow: 0 0 15px #ff0000;
  z-index: 2;
}

/* Metà SOTTO (Blu Elettrico) */
.diablo-bottom {
  position: absolute;
  top: 0;
  left: 0;
  color: #00ffff;
  clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
  text-shadow: 0 0 15px #00ffff;
  z-index: 1;
}

/* LA LAMA DEL COLTELLO */
.knife-line {
  position: absolute;
  top: 50%;
  left: -5%;
  width: 110%;
  height: 3px;
  background-color: #ffffff;
  box-shadow: 0 0 10px #ffffff, 0 0 5px #00ffff;
  transform: translateY(-50%);
  z-index: 10;
}

/* ===== EMOJI FLUTTUANTI ===== */
.floating-emoji {
  position: absolute;
  font-size: 45px;
  user-select: none;
  filter: drop-shadow(0 0 10px #ff0000) drop-shadow(0 0 15px #00ffff);
  animation: floatEmoji 2.5s ease-in-out infinite alternate;
}

/* Posizionamento emoji */
.emoji-1 { top: 20px; left: 30px; animation-delay: 0s; }
.emoji-2 { top: 30px; right: 40px; animation-delay: 0.5s; }
.emoji-3 { bottom: 30px; left: 50px; animation-delay: 1s; }
.emoji-4 { bottom: 20px; right: 30px; animation-delay: 1.5s; }
.emoji-5 { top: 160px; left: 10px; animation-delay: 0.8s; font-size: 35px; }
.emoji-6 { bottom: 130px; right: 10px; animation-delay: 1.2s; font-size: 35px; }

/* ===== ANIMAZIONI FLUTTUANTI ===== */
@keyframes floatText {
  0% {
    transform: translateY(0px) rotate(0deg);
  }
  100% {
    transform: translateY(-15px) rotate(1deg);
  }
}

@keyframes floatEmoji {
  0% {
    transform: translateY(0px) rotate(0deg);
  }
  100% {
    transform: translateY(-20px) rotate(-5deg);
  }
}
</style>
</head>
<body>

<div class="container">

  <!-- VIDEO SINISTRO (9:16) -->
  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/baby.mp4" type="video/mp4">
    </video>
  </div>

  <!-- AREA CENTRALE CON TESTO TAGLIATO ED EMOJI FLUTTUANTI -->
  <div class="center-area">
    <div class="center-box">
      
      <!-- EMOJI FLUTTUANTI -->
      <span class="floating-emoji emoji-1">💀</span>
      <span class="floating-emoji emoji-2">😡</span>
      <span class="floating-emoji emoji-3">😡</span>
      <span class="floating-emoji emoji-4">💀</span>
      <span class="floating-emoji emoji-5">💀</span>
      <span class="floating-emoji emoji-6">😡</span>

      <!-- TESTO EL DIABLO TAGLIATO -->
      <div class="diablo-cut-container">
        <div class="knife-line"></div>
        <span class="diablo-hidden">EL DIABLO</span>
        <span class="diablo-top">EL DIABLO</span>
        <span class="diablo-bottom">EL DIABLO</span>
      </div>

    </div>
  </div>

  <!-- VIDEO DESTRO (9:16) -->
  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/baby.mp4" type="video/mp4">
    </video>
  </div>

</div>

</body>
</html>
