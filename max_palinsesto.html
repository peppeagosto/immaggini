<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>radiobluemoon2026</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body { 
        background: transparent; 
        margin: 0;
        display: flex; 
        justify-content: center; 
        align-items: center;
        min-height: 100vh; 
        font-family: sans-serif; 
        overflow: hidden;
    }

    .nvidia-skin { 
        width: 800px; 
        height: 465px; 
        border-radius: 20px;
        border: 15px solid #0055ff;
        position: relative; 
        overflow: hidden; 
        background: radial-gradient(circle at center, #0a1931 0%, #030712 100%);
        box-shadow: 0 0 35px rgba(0, 85, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.3);
        animation: electricGlow 4s linear infinite;
        transition: border-color 0.3s ease;
    }

    @keyframes electricGlow {
        0% { border-color: #0055ff;
        box-shadow: 0 0 35px rgba(0, 85, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.3);
        }
        50% { border-color: #00f2fe;
        box-shadow: 0 0 50px rgba(0, 242, 254, 0.8), inset 0 0 25px rgba(0, 242, 254, 0.4);
        }
        100% { border-color: #0055ff;
        box-shadow: 0 0 35px rgba(0, 85, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.3);
        }
    }

    #starfield {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    .dj-max-text {
        position: absolute;
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 1.2rem;
        font-weight: 900;
        color: rgba(0, 242, 254, 0.8);
        text-shadow: 0 0 8px #0055ff, 0 0 15px #0ff;
        letter-spacing: 2px;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        animation: dropAndFloat 10s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    .t-sx-top { left: 90px; top: 40px; animation-delay: 0s; }
    .t-sx-bot { left: 90px; bottom: 100px; animation-delay: 0.5s; }
    .t-dx-top { right: 90px; top: 40px; animation-delay: 0.2s; }
    .t-dx-bot { right: 90px; bottom: 100px; animation-delay: 0.7s; }

    @keyframes dropAndFloat {
        0% { transform: translateY(-50px); opacity: 0; filter: blur(5px); }
        15%, 20% { transform: translateY(0); opacity: 1; filter: blur(0px); text-shadow: 0 0 15px #0ff, 0 0 30px #0055ff; }
        45% { transform: translateY(-8px); text-shadow: 0 0 8px #0055ff; }
        70% { transform: translateY(6px); text-shadow: 0 0 12px #0ff; }
        85% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(30px); opacity: 0; filter: blur(5px); }
    }

    .box-video { 
        width: 100%;
        height: 100%;
        object-fit: cover; 
        position: absolute; 
        z-index: 3; 
        mix-blend-mode: screen; 
        opacity: 0.9;
    }
    
    .menu-side { 
        position: absolute;
        top: 25px;
        display: flex; flex-direction: column; 
        gap: 12px; z-index: 100; align-items: center;
    }
    .left-menu { left: 25px; }
    .right-menu { right: 25px; }
    
    .btn-wrapper { display: flex; flex-direction: column; align-items: center; }

    .circle-btn { 
        width: 38px;
        height: 38px;
        border-radius: 50%; 
        background: rgba(0, 0, 0, 0.8); 
        color: #0ff; border: 2px solid #0ff;
        cursor: pointer; display: flex;
        align-items: center; justify-content: center;
        font-size: 12px; 
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        transition: all 0.3s ease;
    }
    .circle-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 15px #0ff; }
    
    .btn-label { color: #0ff; font-size: 7px; text-transform: uppercase; margin-top: 4px; cursor: default; transition: color 0.3s; text-align: center; max-width: 65px; line-height: 8px; }

    .central-controls { 
        position: absolute;
        bottom: 25px; left: 50%;
        transform: translateX(-50%); 
        display: flex; gap: 20px; z-index: 100; align-items: center;
    }
    .control-btn { 
        padding: 10px 25px;
        background: rgba(0, 0, 0, 0.8);
        color: #0ff; border: 2px solid #0ff;
        border-radius: 20px; cursor: pointer;
        font-family: sans-serif;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        transition: all 0.3s ease;
    }
    .control-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 15px #0ff; }

    .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 200px; height: 4px;
        background: rgba(0, 255, 255, 0.3);
        border-radius: 2px; outline: none; cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        transition: all 0.3s ease;
    }
    .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px;
        height: 14px; border-radius: 50%;
        background: #0ff; border: 2px solid #030712;
        box-shadow: 0 0 12px #0ff, 0 0 20px #0ff;
        transition: transform 0.2s ease;
    }
    .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
    
    #info-panel { 
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%); 
        width: 360px; 
        max-height: 380px;
        background: rgba(0,0,0,0.95);
        border: 2px solid #0ff; z-index: 200; display: none;
        color: #0ff; padding: 15px; text-align: center; 
        border-radius: 12px; 
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
    }

    #panel-close-btn {
        position: absolute;
        top: 8px;
        right: 10px;
        width: 20px;
        height: 20px;
        background: #ff0055;
        color: #fff;
        border-radius: 50%;
        font-size: 13px;
        font-weight: bold;
        line-height: 18px;
        cursor: pointer;
        display: none;
        border: 1px solid #fff;
    }
    
    .cover-img { 
        width: 150px;
        height: 150px; border-radius: 50%;
        border: 3px solid #0ff; margin-top: 15px; display: block; 
        object-fit: cover; margin-left: auto; margin-right: auto;
        transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
    }

    /* PALINSESTO */
    .pali-container {
        max-height: 290px;
        overflow-y: auto;
        margin-top: 10px;
        padding-right: 5px;
    }
    .pali-container::-webkit-scrollbar { width: 5px; }
    .pali-container::-webkit-scrollbar-thumb { background: #0ff; border-radius: 4px; }
    .slot-dj {
        background: #080f1d;
        border: 1px solid #0055ff;
        border-radius: 25px;
        margin-bottom: 6px;
        padding: 5px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
    }
    .slot-ora { color: #00f2fe; font-size: 11px; font-weight: bold; width: 45px; text-align: center; }
    .slot-foto { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #0055ff; object-fit: cover; background: #000; }
    .slot-nome { color: #fff; font-size: 11px; font-weight: 900; flex-grow: 1; display: flex; align-items: center; }
    .ruota-disco { animation: spin 2s linear infinite !important; border-color: #0f0 !important; box-shadow: 0 0 10px #0f0; }
    .led-verde { width: 8px; height: 8px; background-color: #0f0; border-radius: 50%; display: inline-block; margin-left: 8px; box-shadow: 0 0 8px #0f0; animation: blink 0.8s infinite; }
    .led-rosso { width: 8px; height: 8px; background-color: #f00; border-radius: 50%; display: inline-block; margin-left: 8px; box-shadow: 0 0 6px #f00; }
    
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="nvidia-skin" id="skinBox">
    <canvas id="starfield"></canvas>

    <div class="dj-max-text t-sx-top">DJ MAX</div>
    <div class="dj-max-text t-sx-bot">DJ ROBERTA</div>
    <div class="dj-max-text t-dx-top">DJ MAX</div>
    <div class="dj-max-text t-dx-bot">DJ ROBERTA</div>

    <video class="box-video" id="mainVideo" loop playsinline>
        <source src="https://i.imgur.com/HgWM3vt.mp4" type="video/mp4">
    </video>

    <div class="menu-side left-menu">
        <div class="btn-wrapper" onclick="updateCity()"><button class="circle-btn">1</button><div class="btn-label">Città</div></div>
        <div class="btn-wrapper" onclick="updateWeather()"><button class="circle-btn">2</button><div class="btn-label">Meteo</div></div>
        <div class="btn-wrapper" onclick="showDate()"><button class="circle-btn">3</button><div class="btn-label">Datario</div></div>
        <div class="btn-wrapper" onclick="showHoroscope()"><button class="circle-btn">4</button><div class="btn-label">Oroscopo</div></div>
        <div class="btn-wrapper" onclick="getRealTimeListeners()"><button class="circle-btn">5</button><div class="btn-label">Ascolti</div></div>
    </div>

    <div class="menu-side right-menu">
        <div class="btn-wrapper" onclick="getRealTimeTitle()"><button class="circle-btn">6</button><div class="btn-label">Titoli</div></div>
        <div class="btn-wrapper" onclick="showCover()"><button class="circle-btn">7</button><div class="btn-label">Cover</div></div>
        <div class="btn-wrapper" onclick="showPalinsesto()"><button class="circle-btn">8</button><div class="btn-label">Palinsesto</div></div>
        <div class="btn-wrapper" onclick="toggleBoom()"><button class="circle-btn">9</button><div class="btn-label">Boom</div></div>
        <div class="btn-wrapper" onclick="openCustomLink()"><button class="circle-btn">10</button><div class="btn-label">Sito</div></div>
    </div>

    <div id="info-panel" onclick="handlePanelClick(event)">
        <div id="panel-close-btn" onclick="closePanel()">×</div>
        <h3 id="panel-title">Info</h3>
        <div id="panel-content"></div>
    </div>

    <div class="central-controls">
        <button class="control-btn" id="pBtn">PLAY</button>
        <input type="range" class="volume-slider" id="vSlider" min="0" max="100" value="100">
        <button class="control-btn" id="stopBtn">STOP</button>
    </div>
</div>

<audio id="audio"></audio>

<script>
    const audioStream = document.getElementById('audio');
    const mainVideo = document.getElementById('mainVideo');
    const volumeSlider = document.getElementById('vSlider');
    const panel = document.getElementById('info-panel');
    const title = document.getElementById('panel-title');
    const content = document.getElementById('panel-content');
    const closeBtn = document.getElementById('panel-close-btn');

    let isBoomMode = false;
    let currentActiveButton = null;
    let panelTimer = null;
    let timerSigla = null;
    let currentCity = "";
    let currentLat = null;
    let currentLon = null;
    let animationBoomId = null;
    let wavePhase = 0;

    /* ====================================================================
       CONFIGURAZIONE 10 DJ - MODIFICA NOMI E FOTO QUI SOTTO
       ==================================================================== */
    const turniDJ = [
        { h: 7,  hFine: 9,  n: "DJ MATRIX",      f: "https://xatimg.com/image/iQgCyJrXx59k.jpg" },
        { h: 9,  hFine: 11, n: "DJ SHADOW",      f: "https://xatimg.com/image/Pb7d1636URvg.jpg" },
        { h: 11, hFine: 13, n: "DJ VIPER",       f: "https://xatimg.com/image/iVWjQe7TNoGD.jpg" },
        { h: 13, hFine: 15, n: "DJ KOBRA",       f: "https://xatimg.com/image/xownGDwnETzl.jpg" },
        { h: 15, hFine: 17, n: "DJ PHANTOM",     f: "https://xatimg.com/image/nwY3C0hFQkVZ.jpg" },
        { h: 17, hFine: 18, n: "DJ LADY MOON",   f: "https://xatimg.com/image/D5nl0rwtzO5q.jpg" },
        { h: 18, hFine: 20, n: "DJ CYBER",       f: "https://xatimg.com/image/ghXE2B3YgqbX.jpg" },
        { h: 20, hFine: 21, n: "DJ GALAXY",      f: "https://xatimg.com/image/Ewyzp0L90szv.jpg" },
        { h: 21, hFine: 22, n: "DJ FLASH",       f: "https://xatimg.com/image/Uv2xKPe2ySt1.jpg" },
        { h: 22, hFine: 24, n: "DJ NIGHTMARE",   f: "https://xatimg.com/image/7gG8UEwtre1G.jpg" }
    ];

    function showPalinsesto() {
        if (panel.style.display === 'block' && currentActiveButton === 'btn8') { closePanel(); return; }
        if (panelTimer) clearTimeout(panelTimer);

        const giorni = ["DOMENICA", "LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ", "SABATO"];
        const d = new Date();
        const oggi = giorni[d.getDay()];
        const oraAttuale = d.getHours();

        title.innerHTML = `PALINSESTO - <span style="color:#00f2fe;">${oggi}</span>`;
        closeBtn.style.display = 'block';

        let html = '<div class="pali-container">';
        turniDJ.forEach(dj => {
            let èLive = (oraAttuale >= dj.h && oraAttuale < dj.hFine);
            let classeGira = èLive ? "ruota-disco" : "";
            let statusLed = èLive ? '<span class="led-verde"></span>' : (oraAttuale >= dj.hFine) ? '<span class="led-rosso"></span>' : '';
            let oraLabel = String(dj.h).padStart(2, '0') + ":00";

            html += `
                <div class="slot-dj">
                    <span class="slot-ora">${oraLabel}</span>
                    <img class="slot-foto ${classeGira}" src="${dj.f}" onerror="this.src='https://via.placeholder.com/34/000/0ff?text=DJ'">
                    <div class="slot-nome">${dj.n} ${statusLed}</div>
                </div>`;
        });
        html += '</div>';

        content.innerHTML = html;
        panel.style.display = 'block';
        currentActiveButton = 'btn8';
    }

    function handlePanelClick(e) {
        if (currentActiveButton === 'btn8') return;
        closePanel();
    }

    function updateBoomDance() {
        if (!isBoomMode) {
            const cover = document.querySelector('.cover-img');
            if (cover) {
                cover.style.transform = "scale(1)";
                cover.style.boxShadow = "none";
            }
            cancelAnimationFrame(animationBoomId);
            return;
        }

        const cover = document.querySelector('.cover-img');
        if (cover && !audioStream.paused && audioStream.src !== "") {
            wavePhase += 0.28;
            let pulseFactor = Math.sin(wavePhase) * Math.cos(wavePhase * 0.6);
            let kickEffect = pulseFactor > 0.25 ? pulseFactor : 0; 
            let currentScale = 1 + (kickEffect * 0.16);
            let neonIntensity = kickEffect * 35;

            cover.style.transform = `scale(${currentScale})`;
            cover.style.boxShadow = `0 0 ${12 + neonIntensity}px #0ff, 0 0 ${neonIntensity}px #0055ff`;
        } else if (cover) {
            cover.style.transform = "scale(1)";
            cover.style.boxShadow = "none";
        }

        animationBoomId = requestAnimationFrame(updateBoomDance);
    }

    function avviaPlayer() {
        audioStream.src = "https://sp3.server89.com:7023/;";
        audioStream.volume = 0.02;
        audioStream.play().catch(e => console.log("Riproduzione bloccata:", e));

        mainVideo.muted = false;
        mainVideo.volume = 1.0;
        mainVideo.play().catch(e => console.log("Riproduzione bloccata:", e));
        timerSigla = setTimeout(() => {
            audioStream.volume = volumeSlider.value / 100;
            mainVideo.volume = 0.0;
            mainVideo.muted = true;
            timerSigla = null;
        }, 8000);
        document.removeEventListener('click', avviaPlayer);
    }
    document.addEventListener('click', avviaPlayer, { once: true });

    document.getElementById("pBtn").onclick = () => {
        if (timerSigla) clearTimeout(timerSigla);
        timerSigla = null;
        mainVideo.muted = true;
        mainVideo.volume = 0.0;
        audioStream.src = "https://sp3.server89.com:7023/;";
        audioStream.load();
        audioStream.volume = volumeSlider.value / 100;
        audioStream.play();
    };

    document.getElementById("stopBtn").onclick = () => {
        if (timerSigla) clearTimeout(timerSigla);
        timerSigla = null;
        audioStream.pause();
        audioStream.src = "";
        mainVideo.muted = true;
        mainVideo.volume = 0.0;
        if(isBoomMode) toggleBoom();
    };

    if (volumeSlider) {
        volumeSlider.oninput = function() {
            let vol = this.value / 100;
            if (timerSigla && !mainVideo.muted) {
                mainVideo.volume = vol;
            } else {
                audioStream.volume = vol;
            }
        };
    }

    function startPanelTimer() {
        closeBtn.style.display = 'none';
        if (panelTimer) clearTimeout(panelTimer);
        panelTimer = setTimeout(() => { closePanel(); }, 5000);
    }

    function closePanel() {
        panel.style.display = 'none';
        closeBtn.style.display = 'none';
        currentActiveButton = null;
        if (panelTimer) clearTimeout(panelTimer);
    }

    function ottieniCoordinateReali(successCallback, failCallback) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
    
                    $.getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${currentLat}&longitude=${currentLon}&localityLanguage=it`, function(geoData) {
                        if (geoData && geoData.city) {
                            currentCity = geoData.city.toUpperCase();
                        } else if (geoData && geoData.locality) {
                            currentCity = geoData.locality.toUpperCase();
                        } else {
                            currentCity = "ONLINE";
                        }
                        if(successCallback) successCallback();
                    }).fail(function() {
                        ottieniPosizioneTramiteIP(successCallback, failCallback);
                    });
                },
                function(error) {
                    ottieniPosizioneTramiteIP(successCallback, failCallback);
                },
                { enableHighAccuracy: true, timeout: 4000 }
            );
        } else {
            ottieniPosizioneTramiteIP(successCallback, failCallback);
        }
    }

    function ottieniPosizioneTramiteIP(successCallback, failCallback) {
        $.getJSON('https://ipapi.co/json/', function(ipData) {
            if (ipData && ipData.city) {
                currentCity = ipData.city.toUpperCase();
                currentLat = ipData.latitude;
                currentLon = ipData.longitude;
                if(successCallback) successCallback();
            } else {
                currentCity = "ONLINE";
                if(failCallback) failCallback();
            }
        }).fail(function() {
            currentCity = "ONLINE";
            if(failCallback) failCallback();
        });
    }

    function updateCity() {
        if (panel.style.display === 'block' && currentActiveButton === 'btn1') { closePanel(); return; }
        title.innerText = "LOCALIZZAZIONE";
        content.innerText = "Rilevamento coordinate in corso...";
        panel.style.display = 'block';
        currentActiveButton = 'btn1';
        ottieniCoordinateReali(
            function() { content.innerText = "La tua città:\n" + currentCity; },
            function() { content.innerText = "Posizione non rilevabile.\nStato: ONLINE"; }
        );
        startPanelTimer();
    }

    function updateWeather() {
        if (panel.style.display === 'block' && currentActiveButton === 'btn2') { closePanel(); return; }
        title.innerText = "METEO LIVE";
        content.innerText = "Sincronizzazione posizione meteo...";
        panel.style.display = 'block';
        currentActiveButton = 'btn2';
        function eseguiMeteo() {
            $.getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current_weather=true`, function(data) {
                if (data && data.current_weather) {
                    let temp = Math.round(data.current_weather.temperature);
                    let code = data.current_weather.weathercode;
            
                    let statoCielo = "Sereno";
                    if (code >= 1 && code <= 3) statoCielo = "Poco Nuvoloso";
                    if (code >= 45 && code <= 48) statoCielo = "Nebbia";
                    if (code >= 51 && code <= 67) statoCielo = "Pioggia";
                    if (code >= 71 && code <= 77) statoCielo = "Neve";
                    if (code >= 80 && code <= 82) statoCielo = "Rovesci di Pioggia";
                    if (code >= 95) statoCielo = "Temporale";
          
                    content.innerText = "Città: " + currentCity + "\nTemperatura: " + temp + "°C\nCielo: " + statoCielo.toUpperCase();
                } else {
                    content.innerText = "Dati meteo momentaneamente non disponibili.";
                }
            }).fail(function() { content.innerText = "Errore di connessione ai server meteo."; });
        }
        ottieniCoordinateReali(function() { eseguiMeteo(); }, function() { content.innerText = "Impossibile calcolare il meteo attuale."; });
        startPanelTimer();
    }

    function showDate() {
        if (panel.style.display === 'block' && currentActiveButton === 'btn3') { closePanel(); return; }
        title.innerText = "DATARIO";
        content.innerText = new Date().toLocaleString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }).toUpperCase();
        panel.style.display = 'block';
        currentActiveButton = 'btn3';
        startPanelTimer();
    }

    function showHoroscope() {
        if (panel.style.display === 'block' && currentActiveButton === 'btn4') { closePanel(); return; }
        title.innerText = "OROSCOPO DEL GIORNO: GEMELLI";
        const oggi = new Date();
        const calcoloGiorno = oggi.getDate() + oggi.getMonth() + (oggi.getFullYear() % 10);
        const previsioniGemelli = [
            "Oggi la Luna illumina il tuo settore creativo. Spazio a nuove idee e progetti radiofonici!",
            "Mercurio favorisce i contatti e le pubbliche relazioni. Ottimo momento per lanciare nuovi format.",
            "Una sferzata di energia positiva investe il tuo segno. Fidati del tuo intuito musicale.",
            "Giornata ideale per staccare la spina dalle preoccupazioni e ricaricarsi con dell'ottima musica.",
            "Venere protegge le tue comunicazioni affettive. Un messaggio inaspettato ti cambierà la serata.",
            "Fidati del ritmo oggi, le stelle consigliano pazienza nelle decisioni importanti. Ascolta il cuore.",
            "Creatività e comunicazione al top! Oggi la tua voce e le tue idee lasceranno il segno ovunque.",
            "Giove protegge le tue intuizioni artistiche. Splendi in consolle e nei tuoi progetti!"
        ];
        const indiceFrase = calcoloGiorno % previsioniGemelli.length;
        const fraseDelGiorno = previsioniGemelli[indiceFrase];
        content.innerHTML = `<span style="font-style: italic;">"${fraseDelGiorno}"</span><br><br><div style="font-size:10px; color:#00f2fe;">Previsione astrale del: ${oggi.toLocaleDateString('it-IT')}</div>`;
        panel.style.display = 'block';
        currentActiveButton = 'btn4';
        startPanelTimer();
    }

    function getRealTimeListeners() {
        if (panel.style.display === 'block' && currentActiveButton === 'btn5') { closePanel(); return; }
        title.innerText = "ASCOLTI LIVE";
        $.getJSON("https://sp3.server89.com:7023/stats?json=1&sid=1&callback=?", function(data) {
            let utenti = data.currentlisteners ? data.currentlisteners : "0";
            content.innerText = "ASCOLTATORI CORRENTI: " + utenti;
        }).fail(function() { content.innerText = "ASCOLTATORI CORRENTI: DATI NON DISPONIBILI"; });
        panel.style.display = 'block';
        currentActiveButton = 'btn5';
        startPanelTimer();
    }

    function openCustomLink() { window.open("https://radiobluemoon.altervista.org/", "_blank"); }

    function getRealTimeTitle() {
        if (panel.style.display === 'block' && currentActiveButton === 'btn6') { closePanel(); return; }
        title.innerText = "STREAM";
        content.innerText = "Lettura dati dallo stream...";
        panel.style.display = 'block';
        currentActiveButton = 'btn6';
        
        $.getJSON("https://sp3.server89.com:7023/stats?json=1&sid=1&callback=?", function(data) {
            if(data && data.songtitle) {
                content.innerText = "BRANO: " + data.songtitle.toUpperCase();
            } else {
                content.innerText = "BRANO: IN ONDA...";
            }
        }).fail(function() { 
            content.innerText = "BRANO: RADIO BLUE MOON"; 
        });
        startPanelTimer();
    }

    function toggleBoom() {
        isBoomMode = !isBoomMode;
        if (isBoomMode) {
            updateBoomDance();
        } else {
            cancelAnimationFrame(animationBoomId);
            const cover = document.querySelector('.cover-img');
            if (cover) {
                cover.style.transform = "scale(1)";
                cover.style.boxShadow = "none";
            }
        }
    }

    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        const container = document.querySelector('.nvidia-skin');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const numStars = 120;
    const stars = [];
    const speed = 3;
    const colors = ['#ffffff', '#00f2fe', '#4facfe', '#0055ff', '#a1c4fd'];
    for (let i = 0; i < numStars; i++) {
        stars.push({
            x: Math.random() * canvas.width - canvas.width / 2,
            y: Math.random() * canvas.height - canvas.height / 2,
            z: Math.random() * canvas.width,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 1.5 + 0.5
        });
    }

    function animateStars() {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        for (let i = 0; i < numStars; i++) {
            let star = stars[i];
            star.z -= speed;
            if (star.z <= 0) {
                star.z = canvas.width;
                star.x = Math.random() * canvas.width - cx;
                star.y = Math.random() * canvas.height - cy;
            }
            const px = (star.x / star.z) * cx + cx;
            const py = (star.y / star.z) * cy + cy;
            const size = (1 - star.z / canvas.width) * star.size * 2.5;
            if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                ctx.beginPath();
                ctx.arc(px, py, size, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.fill();
            }
        }
        requestAnimationFrame(animateStars);
    }
    animateStars();

    function showCover() {
        title.innerText = "COPERTINA";
        let fallbackImg = "https://xatimg.com/image/O6AxfgWk5Tma.png";
        content.innerText = "Caricamento copertina...";
        panel.style.display = 'block';
        currentActiveButton = 'btn7';
        
        $.getJSON("https://sp3.server89.com:7023/stats?json=1&sid=1&callback=?", function(radioData) {
            let canzone = radioData.songtitle ? radioData.songtitle : "";
            if (!canzone || canzone === "In onda...") {
                content.innerHTML = 'Ora in onda:<br><img src="' + fallbackImg + '" class="cover-img"><br><div style="margin-top:10px; color:#0ff; font-size:12px;">Radio Blue Moon</div>';
                if (isBoomMode) updateBoomDance(); 
                return;
            }
            $.ajax({
                url: "https://itunes.apple.com/search",
                dataType: "jsonp",
                data: { term: canzone, media: "music", limit: 1 },
                success: function(itunesData) {
                    let imgUrl = fallbackImg;
                    if (itunesData.results && itunesData.results.length > 0) {
                        imgUrl = itunesData.results[0].artworkUrl100.replace("100x100bb.jpg", "400x400bb.jpg");
                    }
                    content.innerHTML = 'Ora in onda:<br><img src="' + imgUrl + '" class="cover-img" onerror="this.src=\'' + fallbackImg + '\'"><br><div style="margin-top:10px; color:#0ff; font-size:12px;">BRANO: ' + canzone.toUpperCase() + '</div>';
                    if (isBoomMode) updateBoomDance(); 
                },
                error: function() {
                    content.innerHTML = 'Ora in onda:<br><img src="' + fallbackImg + '" class="cover-img"><br><div style="margin-top:10px; color:#0ff; font-size:12px;">BRANO: ' + canzone.toUpperCase() + '</div>';
                    if (isBoomMode) updateBoomDance(); 
                }
            });
        }).fail(function() {
            content.innerHTML = 'Ora in onda:<br><img src="' + fallbackImg + '" class="cover-img"><br><div style="margin-top:10px; color:#0ff; font-size:12px;">Radio Blue Moon</div>';
            if (isBoomMode) updateBoomDance();
        });
    }
</script>
</body>
</html>
