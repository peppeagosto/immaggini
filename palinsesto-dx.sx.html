<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --rb: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #f0f, #f00); }
        
        body { 
            background: transparent; 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;
            padding: 60px 20px 20px 20px;
            pointer-events: none; 
            box-sizing: border-box;
        }

        /* Box visibili al passaggio del mouse */
        .box-sx, .box-dx { 
            width: 250px; 
            pointer-events: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            opacity: 0; 
            transition: opacity 0.5s ease-in-out;
        }

        .box-sx:hover, .box-dx:hover { opacity: 1; }
        .box-dx { align-items: flex-end; }

        .btn-custom {
            width: 220px; height: 55px; background: #000; border: 2px solid #fff; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 15px rgba(255,255,255,0.3); z-index: 9999;
        }

        .btn-text { background: var(--rb); -webkit-background-clip: text; color: transparent; text-transform: uppercase; font-weight: 900; font-size: 10px; }
        .btn-sub, #clicca-qui-text { background: var(--rb); -webkit-background-clip: text; color: transparent; text-transform: uppercase; font-weight: 900; font-size: 13px; animation: pulse 1.5s infinite; letter-spacing: 1px; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }

        #locandina { 
            width: 230px; background: #000; border: 3px solid #333; border-radius: 12px; padding: 8px; 
            box-shadow: 0 0 50px #000; display: none; z-index: 9998; margin-top: 10px;
            pointer-events: auto;
        }

        /* PARTICELLE EFFETTI */
        .particle { 
            position: fixed; 
            bottom: -100px; 
            z-index: 1; 
            pointer-events: none; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .smile-img { object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0 10px rgba(255,255,255,0.8)); }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* STILE PALINSESTO */
        .header { text-align: center; border-bottom: 2px solid #222; margin-bottom: 10px; padding-bottom: 5px; }
        #giorno-live { color: #ffff00; font-size: 12px; text-transform: uppercase; text-align: center; display: block; }
        .titolo { background: var(--rb); -webkit-background-clip: text; color: transparent; font-weight: 900; text-transform: uppercase; font-size: 11px; text-align: center; }
        .slot { background: #0a0a0a; border: 1px solid #222; border-radius: 25px; margin-bottom: 5px; padding: 4px; display: flex; align-items: center; gap: 6px; }
        .ora { color: #0ff; font-size: 9px; width: 35px; text-align: center; font-weight: bold; }
        .foto { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #444; object-fit: cover; background: #222; }
        .ruota-disco { animation: rotate-disco 2s linear infinite !important; border-color: #0f0 !important; box-shadow: 0 0 10px #0f0; }
        @keyframes rotate-disco { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .nome { color: #ff00ff; font-size: 9px; text-transform: uppercase; font-weight: 900; flex-grow: 1; display: flex; align-items: center; }
        .led-verde { width: 8px; height: 8px; background-color: #0f0; border-radius: 50%; display: inline-block; margin-left: 5px; box-shadow: 0 0 8px #0f0; animation: blink 0.8s infinite; }
        .led-rosso { width: 8px; height: 8px; background-color: #f00; border-radius: 50%; display: inline-block; margin-left: 5px; box-shadow: 0 0 8px #f00; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .testo-lama { background: var(--rb); -webkit-background-clip: text; color: transparent; font-weight: 900; text-transform: uppercase; font-size: 11px; text-align: center; padding: 15px 5px; display: block; }
    </style>
</head>
<body>

    <div class="box-sx">
        <div id="btn-anim" class="btn-custom">
            <div class="btn-text">EFFETTI XAT</div>
            <div class="btn-sub">EFFETTI: ON</div>
        </div>
    </div>

    <div class="box-dx">
        <div id="btn-pali" class="btn-custom">
            <div class="btn-text">PALINSESTO DE IL CARTAIO</div>
            <div id="clicca-qui-text">CLICCA QUI</div>
        </div>
        <div id="locandina">
            <div class="header">
                <span id="giorno-live">---</span>
                <div class="titolo" id="titolo-locandina">DIRETTE RADIO LIVE</div>
            </div>
            <div id="lista-dj"></div>
        </div>
    </div>

<script>
    // URL DEL TUO PANNELLO ADMIN (JSON SALVATO)
    const URL_PANNELLO = "INSERISCI_QUI_LINK_JSON_ADMIN_PANEL"; 
    
    const defaultImg = "https://images.unsplash.com/photo-1571266028243-3716f02d2d2e?w=100&auto=format&fit=crop&q=80";
    
    // LOGICA EFFETTI XAT
    const smiles = [
        "https://raw.githubusercontent.com/eamxat/Images/refs/heads/main/a_(maniac)_80.webp",
        "https://xat.com/images/smoticons/u/crazypianist.png",
        "https://xat.com/images/smoticons/u/getlucky.png",
        "https://xat.com/images/smoticons/u/goldstar.png",
        "https://xat.com/images/smoticons/u/彈.png",
        "https://xat.com/images/smoticons/u/shades.png",
        "https://xat.com/images/smoticons/u/fame.png",
        "https://xat.com/images/smoticons/u/heart.png",
        "https://raw.githubusercontent.com/eamxat/Images/refs/heads/main/hi.webp"
    ];
    const colors = ["#ff0000", "#ff00ff", "#00ffff", "#ffff00", "#ff8800", "#00ff00", "#ffffff"];
    const extras = ["❤", "⭐", "🎵", "✨"]; 

    let activeEffects = true;
    let effectInterval;

    function startParticles() { effectInterval = setInterval(generateParticle, 350); }

    $(document).ready(function() {
        startParticles();
        caricaPalinsestoDalPannello();
    });

    $('#btn-anim').click(function() {
        activeEffects = !activeEffects;
        if(activeEffects) {
            $(this).find('.btn-sub').text('EFFETTI: ON');
            startParticles();
        } else {
            $(this).find('.btn-sub').text('EFFETTI: OFF');
            clearInterval(effectInterval);
        }
    });

    function generateParticle() {
        const rand = Math.random();
        const p = document.createElement('div');
        p.className = 'particle';
        const chosenColor = colors[Math.floor(Math.random() * colors.length)];
        if (rand < 0.4) { 
            const img = document.createElement('img');
            img.src = smiles[Math.floor(Math.random() * smiles.length)];
            img.className = 'smile-img'; img.width = 70;
            p.appendChild(img);
        } else {
            const symbol = extras[Math.floor(Math.random() * extras.length)];
            p.innerHTML = symbol;
            p.style.color = chosenColor;
            p.style.fontSize = '50px';
            p.style.filter = `drop-shadow(0 0 5px #000) drop-shadow(0 0 15px ${chosenColor})`;
        }
        p.style.left = Math.random() * 90 + 'vw';
        p.style.animation = `floatUp ${Math.random()*3+4}s linear forwards`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 7000);
    }

    $('#btn-pali').on('click', function() { $('#locandina').fadeToggle(); });

    // CARICAMENTO E SINCRONIZZAZIONE DAL PANNELLO
    const giorni = ["DOMENICA", "LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ", "SABATO"];
    let databaseTurni = {};

    function caricaPalinsestoDalPannello() {
        $.getJSON(URL_PANNELLO + '?t=' + new Date().getTime(), function(data) {
            databaseTurni = data;
            aggiornaLive();
        }).fail(function() {
            console.log("In attesa dei dati dal pannello Admin...");
        });
    }

    function aggiornaLive() {
        const d = new Date(); 
        const oggi = giorni[d.getDay()]; 
        let oraAttuale = d.getHours();
        
        $('#giorno-live').text(oggi); 
        const container = $('#lista-dj').empty();
        const djsOggi = databaseTurni[oggi]; 
        const titoloLoc = $('#titolo-locandina');

        if (oggi === "DOMENICA" || djsOggi === "RIPOSO") {
            titoloLoc.hide(); 
            container.append('<div class="testo-lama">BUONA DOMENICA DA<br>IL CARTAIO<br>DOMANI SI RIPARTE!</div>');
        } else if (Array.isArray(djsOggi)) {
            titoloLoc.show();
            djsOggi.forEach((dj) => {
                let èLive = (oraAttuale === dj.h);
                let classeGira = èLive ? "ruota-disco" : "";
                let statusLed = èLive ? '<span class="led-verde"></span>' : (oraAttuale > dj.h) ? '<span class="led-rosso"></span>' : '';
                let fotoUrl = dj.f ? dj.f : defaultImg;

                container.append(`
                    <div class="slot">
                        <span class="ora">${dj.h}:00</span>
                        <img class="foto ${classeGira}" src="${fotoUrl}" onerror="this.src='${defaultImg}'">
                        <div class="nome">${dj.n} ${statusLed}</div>
                    </div>`);
            });
        }
    }

    // Controlla nuovi turni dal pannello ogni 10 secondi
    setInterval(caricaPalinsestoDalPannello, 10000);
</script>
</body>
</html>
