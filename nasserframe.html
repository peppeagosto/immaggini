<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>RadioHiTFm - INFERNAL FLAMES</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
    user-select: none;
  }
  #canvas-container {
    width: 750px;
    height: 180px;
    margin: 0 auto;
    position: relative;
  }
  canvas {
    display: block;
    background: transparent !important;
    cursor: pointer;
  }
  .controls {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99;
  }
  .btn-reset {
    background: linear-gradient(135deg, #2b0000 0%, #b30000 50%, #ff3700 100%);
    color: #fff;
    border: 1px solid #ff5500;
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 900;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 55, 0, 0.9), inset 0 0 6px rgba(255, 180, 0, 0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s ease;
  }
  .btn-reset:hover {
    background: linear-gradient(135deg, #4d0000 0%, #ff2200 50%, #ffd700 100%);
    color: #000;
    box-shadow: 0 0 22px rgba(255, 60, 0, 1), 0 0 35px rgba(255, 215, 0, 0.8);
    transform: scale(1.05);
  }
</style>
</head>
<body>
<div id="canvas-container">
  <canvas id="canvas" width="750" height="150"></canvas>
  <div class="controls">
    <button class="btn-reset" id="resetBtn">🔥 NASSER</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CW = 750;
const CH = 150;
const MAIN_TITLE = "RadioHiTFm";
const SUB_TITLE = "Sιмтє νιвяαт̦ια. Ƭяᾰιєѕ̦тє мυzιcα.";

// Bandiera rumena da link xatimg
const flagImg = new Image();
flagImg.crossOrigin = "anonymous";
flagImg.src = "https://xatimg.com/image/XxflN83Hu3oL.gif";

const colors = ["#FF1100", "#FF4500", "#FF7700", "#FF0033", "#FFAA00", "#FFD700", "#FFF275"];
const MUSIC_NOTES = ["♪", "♫", "♬", "♩"];

let particles = [];
let trailParticles = [];
let selectedLetterIndex = null;

// Particelle a forma di note musicali
class MusicParticle {
  constructor(x, y, color, speed, life, isFlame = false) {
    this.x = x + (Math.random() * 22 - 11);
    this.y = y + (Math.random() * 12 - 6);
    const ang = isFlame ? (-Math.PI / 2 + (Math.random() * 0.7 - 0.35)) : (Math.random() * Math.PI * 2);
    const spd = isFlame ? (Math.random() * 2.6 + 1.2) : (Math.random() * 3.5 + 1.2) * speed;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd - (isFlame ? 1.5 : 0.4);
    this.color = color;
    this.size = Math.random() * (isFlame ? 14 : 11) + 10;
    this.alpha = 1;
    this.decay = Math.random() * 0.024 + (life || 0.016);
    this.note = MUSIC_NOTES[Math.floor(Math.random() * MUSIC_NOTES.length)];
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.12;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.size *= 0.978;
    this.rotation += this.rotSpeed;
    this.alpha -= this.decay;
    return this.alpha <= 0 || this.size <= 3;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.font = `900 ${Math.round(this.size)}px 'Arial', sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = this.color;
    ctx.shadowColor = "#FF3300";
    ctx.shadowBlur = 9;
    ctx.fillText(this.note, 0, 0);
    ctx.restore();
  }
}

function spawnBurst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push(new MusicParticle(x, y, color, 1.5, 0.022));
  }
}

function spawnFlames(x, y, count) {
  for (let i = 0; i < count; i++) {
    const randomCol = colors[Math.floor(Math.random() * colors.length)];
    trailParticles.push(new MusicParticle(x, y, randomCol, 1.0, 0.025, true));
  }
}

// Calcolo posizionamento titolo RadioHiTFm + Bandiera
ctx.font = "900 52px 'Impact', 'Arial Black', sans-serif";
const letterSpacing = 12;
const flagW = 46;
const flagH = 30;
const flagGap = 16;

let charData = [];
let textTotalW = 0;

for (let i = 0; i < MAIN_TITLE.length; i++) {
  const w = ctx.measureText(MAIN_TITLE[i]).width;
  textTotalW += w + (i < MAIN_TITLE.length - 1 ? letterSpacing : 0);
}

const fullHeaderWidth = textTotalW + flagGap + flagW;
let startX = (CW - fullHeaderWidth) / 2;

for (let i = 0; i < MAIN_TITLE.length; i++) {
  const ch = MAIN_TITLE[i];
  const w = ctx.measureText(ch).width;
  charData.push({
    id: i,
    char: ch,
    targetX: startX,
    currentX: startX,
    w: w,
    col: colors[i % colors.length],
    jumpY: 0,
    isSpace: ch === ' '
  });
  startX += w + letterSpacing;
}

const mainY = 52;
let flagTargetX = startX + flagGap;
let flagCurrentX = flagTargetX;
let flagJumpY = 0;

// Clic per swap lettere e scuotimento bandiera
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  // Clic sulla bandiera rumena
  if (Math.abs(clickX - (flagCurrentX + flagW / 2)) < flagW / 2 + 8 && Math.abs(clickY - mainY) < flagH / 2 + 10) {
    flagJumpY = -24;
    spawnBurst(flagCurrentX + flagW / 2, mainY, "#FFDD00", 25);
    return;
  }

  for (let i = 0; i < charData.length; i++) {
    const c = charData[i];
    if (c.isSpace) continue;

    const charCenterX = c.currentX + c.w / 2;
    if (Math.abs(clickX - charCenterX) < c.w / 2 + 8 && Math.abs(clickY - mainY) < 38) {
      c.jumpY = -24;
      spawnBurst(charCenterX, mainY, "#FF3300", 25);

      if (selectedLetterIndex === null) {
        selectedLetterIndex = i;
      } else if (selectedLetterIndex === i) {
        selectedLetterIndex = null;
      } else {
        const first = charData[selectedLetterIndex];
        const second = c;

        const tempX = first.targetX;
        first.targetX = second.targetX;
        second.targetX = tempX;

        first.jumpY = -26;
        second.jumpY = -26;

        spawnBurst(first.currentX + first.w / 2, mainY, "#FF0033", 30);
        spawnBurst(second.currentX + second.w / 2, mainY, "#FFDD00", 30);

        selectedLetterIndex = null;
      }
      break;
    }
  }
});

// Reset Posizioni con pulsante NASSER
document.getElementById("resetBtn").addEventListener("click", () => {
  let currentStartX = (CW - fullHeaderWidth) / 2;
  for (let i = 0; i < charData.length; i++) {
    const c = charData[i];
    c.targetX = currentStartX;
    c.jumpY = -20;
    spawnBurst(c.currentX + c.w / 2, mainY, "#FF4500", 20);
    currentStartX += c.w + letterSpacing;
  }
  flagTargetX = currentStartX + flagGap;
  flagJumpY = -20;
  spawnBurst(flagCurrentX + flagW / 2, mainY, "#FFDD00", 20);
  selectedLetterIndex = null;
});

let state = "BUILD";
let stateTime = 0;
let revealed = 0;
let lastRevealTime = 0;
const revealInterval = 120;
let sweepProgress = 0;

function animate(time) {
  ctx.clearRect(0, 0, CW, CH);

  if (state === "BUILD") {
    if (time - lastRevealTime > revealInterval) {
      if (revealed < MAIN_TITLE.length) {
        revealed++;
        lastRevealTime = time;
        const cur = charData[revealed - 1];
        if (!cur.isSpace) {
          spawnBurst(cur.currentX + cur.w / 2, mainY, "#FF1100", 20);
        }
      } else if (revealed === MAIN_TITLE.length) {
        revealed++;
        lastRevealTime = time;
        spawnBurst(flagCurrentX + flagW / 2, mainY, "#FFDD00", 24);
      } else {
        state = "FLARE_SWEEP";
        stateTime = time;
        sweepProgress = 0;
      }
    }
  } else if (state === "FLARE_SWEEP") {
    const elapsed = time - stateTime;
    sweepProgress = elapsed / 1000;
    if (sweepProgress >= 1) {
      state = "GLOW_PULSE";
      stateTime = time;
    }
  } else if (state === "GLOW_PULSE") {
    if (time - stateTime > 5500) {
      revealed = 0;
      state = "BUILD";
      lastRevealTime = time;
    }
  }

  // 1. TITOLO: RadioHiTFm
  ctx.font = "900 52px 'Impact', 'Arial Black', sans-serif";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  const numLettersToShow = Math.min(revealed, MAIN_TITLE.length);

  for (let i = 0; i < numLettersToShow; i++) {
    const c = charData[i];
    if (c.isSpace) continue;

    c.currentX += (c.targetX - c.currentX) * 0.12;
    c.jumpY *= 0.88;

    const wave = Math.sin(time * 0.007 + i * 0.7) * 3 + c.jumpY;
    const yPos = mainY + wave;

    if (Math.random() < 0.45) {
      spawnFlames(c.currentX + c.w / 2, yPos + 22, 1);
    }

    if (selectedLetterIndex === i) {
      ctx.save();
      ctx.strokeStyle = "#FFDD00";
      ctx.lineWidth = 2.5;
      ctx.shadowColor = "#FF3300";
      ctx.shadowBlur = 16;
      ctx.strokeRect(c.currentX - 4, yPos - 30, c.w + 8, 60);
      ctx.restore();
    }

    // Aura scura infuocata
    ctx.save();
    ctx.shadowColor = "#FF0000";
    ctx.shadowBlur = 18 + Math.sin(time * 0.01 + i) * 5;
    ctx.strokeStyle = "#380000";
    ctx.lineWidth = 6;
    ctx.strokeText(c.char, c.currentX, yPos);
    ctx.restore();

    // Contorno di fiamma
    ctx.save();
    ctx.strokeStyle = "#FF2200";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#FF5500";
    ctx.shadowBlur = 10;
    ctx.strokeText(c.char, c.currentX, yPos);
    ctx.restore();

    // Gradiente lettere
    const grad = ctx.createLinearGradient(c.currentX, yPos - 26, c.currentX, yPos + 26);
    grad.addColorStop(0, "#FFFFFF");
    grad.addColorStop(0.25, "#FFF099");
    grad.addColorStop(0.6, "#FF8800");
    grad.addColorStop(1, "#FF1A00");

    ctx.save();
    ctx.fillStyle = grad;
    ctx.fillText(c.char, c.currentX, yPos);
    ctx.restore();
  }

  // BANDIERA RUMENA (mostrata alla fine di Fm)
  if (revealed > MAIN_TITLE.length) {
    flagCurrentX += (flagTargetX - flagCurrentX) * 0.12;
    flagJumpY *= 0.88;
    const flagWave = Math.sin(time * 0.007 + MAIN_TITLE.length * 0.7) * 3 + flagJumpY;
    const flagYPos = mainY + flagWave - (flagH / 2);

    if (Math.random() < 0.4) {
      spawnFlames(flagCurrentX + flagW / 2, flagYPos + flagH, 1);
    }

    ctx.save();
    ctx.shadowColor = "#FF5500";
    ctx.shadowBlur = 14;

    if (flagImg.complete && flagImg.naturalWidth > 0) {
      ctx.drawImage(flagImg, flagCurrentX, flagYPos, flagW, flagH);
    } else {
      ctx.fillStyle = "#002B7F";
      ctx.fillRect(flagCurrentX, flagYPos, flagW / 3, flagH);
      ctx.fillStyle = "#FCD116";
      ctx.fillRect(flagCurrentX + flagW / 3, flagYPos, flagW / 3, flagH);
      ctx.fillStyle = "#CE1126";
      ctx.fillRect(flagCurrentX + (flagW / 3) * 2, flagYPos, flagW / 3, flagH);
    }

    ctx.strokeStyle = "rgba(255, 100, 0, 0.8)";
    ctx.lineWidth = 2;
    ctx.strokeRect(flagCurrentX, flagYPos, flagW, flagH);
    ctx.restore();
  }

  // 2. FASCIO DI FUOCO E NOTE
  if (state === "FLARE_SWEEP" && sweepProgress <= 1) {
    const flareX = (CW + 160) * sweepProgress - 80;
    spawnFlames(flareX - 10, mainY + (Math.random() * 26 - 13), 3);

    ctx.save();
    const flareGrad = ctx.createRadialGradient(flareX, mainY, 0, flareX, mainY, 70);
    flareGrad.addColorStop(0, "rgba(255, 255, 220, 1)");
    flareGrad.addColorStop(0.3, "rgba(255, 140, 0, 0.85)");
    flareGrad.addColorStop(0.7, "rgba(220, 20, 0, 0.45)");
    flareGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

    ctx.fillStyle = flareGrad;
    ctx.beginPath();
    ctx.arc(flareX, mainY, 70, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 80, 0, 0.9)";
    ctx.fillRect(flareX - 120, mainY - 2, 240, 4);
    ctx.fillStyle = "#FFF";
    ctx.fillRect(flareX - 60, mainY - 1, 120, 2);
    ctx.restore();
  }

  // Disegno scia particelle musicali
  for (let i = trailParticles.length - 1; i >= 0; i--) {
    trailParticles[i].draw(ctx);
    if (trailParticles[i].update()) {
      trailParticles.splice(i, 1);
    }
  }

  // 3. SLOGAN SOTTOSTANTE
  const subY = 114;
  const pulseSub = Math.sin(time * 0.006) * 4;

  ctx.save();
  ctx.font = "bold 15px 'Trebuchet MS', 'Segoe UI', Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.strokeStyle = "#000000";
  ctx.lineWidth = 4;
  ctx.strokeText(SUB_TITLE, CW / 2, subY);

  ctx.shadowColor = "#FF4400";
  ctx.shadowBlur = 10 + pulseSub;
  ctx.fillStyle = "#FFDD00";
  ctx.fillText(SUB_TITLE, CW / 2, subY);
  ctx.restore();

  // 4. PARTICELLE ESPLOSIONE MUSICALE
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].draw(ctx);
    if (particles[i].update()) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
