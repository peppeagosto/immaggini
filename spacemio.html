<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EL DIABLO</title>

<!-- Google Fonts per tipografia Cyber / High-Tech della Radio -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<!-- jQuery richiesto dallo script della radio per $.getJSON (Shoutcast + iTunes API) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
/* ============================================================
   ألوان الثيم الافتتاحية — الجافاسكربت بيغيّرها بزرار الألوان
   ============================================================ */
:root{
  --bg:        #1d0410;
  --bg-soft:   #2a0718;
  --card:      rgba(255,255,255,.07);
  --card-line: rgba(255,255,255,.16);
  --accent:    #ff5f9e;
  --accent-2:  #ffc2dc;
  --text:      #fff3f8;
  --muted:     rgba(255,243,248,.62);
  --shadow:    rgba(255, 95, 158, .45);
  --bob-speed: 3.2s;
  --img-glow:  rgba(255, 95, 158, .55);
  --radius:    26px;
  
  /* Variabili per la Radio */
  --neon-cyan: #00f3ff;
  --neon-pink: #ff00a0;
  --neon-purple: #9d00ff;
  --neon-lime: #00ff88;
  --neon-amber: #ffaa00;
  --bg-dark: #070810;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:clamp(16px, 4vw, 44px);
  padding-bottom:118px;
  transition:background .7s ease, color .7s ease;
  overflow-x:hidden;
}
body::before, body::after{
  content:""; position:fixed; border-radius:50%;
  filter:blur(90px); opacity:.35; pointer-events:none; z-index:0;
  transition:background .7s ease;
}
body::before{ width:420px; height:420px; background:var(--accent);  top:-120px; left:-100px; }
body::after { width:380px; height:380px; background:var(--accent-2); bottom:-140px; right:-90px; }
.page-snow{
  position:fixed; inset:0;
  width:100%; height:100%;
  z-index:3;
  display:block;
  pointer-events:none;
}
.wrap{
  position:relative; z-index:1;
  max-width:1180px; margin:0 auto;
  display:grid; grid-template-columns:minmax(320px, .85fr) 1.15fr;
  gap:26px; align-items:start;
}
.card{
  background:var(--bg-soft);
  border:1px solid var(--card-line);
  border-radius:var(--radius);
  padding:26px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
  transition:background .7s ease, border-color .7s ease;
}
.cover-banner{
  position:relative; display:block;
  grid-column:1 / -1;
  height:clamp(320px, 46vw, 540px);
  border-radius:var(--radius); overflow:hidden;
  border:none;
  box-shadow:0 0 46px var(--img-glow),
             0 28px 64px rgba(0,0,0,.55);
  cursor:default;
  transition:box-shadow .7s ease; will-change:transform;
  animation:bob var(--bob-speed) cubic-bezier(.45, 0, .55, 1) infinite;
}
.cover-banner img, .cover-banner video{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .6s ease;
  animation:breathe 16s ease-in-out infinite;
}
@keyframes breathe{ 0%, 100%{ scale:1 } 50%{ scale:1.05 } }
.cover-banner:hover img, .cover-banner:hover video{ transform:scale(1.075); }
.cover-banner::before{
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,.2) 50%, transparent 58%);
  background-size:220% 100%;
  animation:shine 5.5s linear infinite;
}
.cover-banner video{ object-position:center 22%; }
.cover-banner::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(to top, var(--bg) 3%, rgba(0,0,0,.25) 38%, transparent 70%);
}
.cover-text{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  padding:16px 26px; text-align:center;
}
.hero-id{ display:none; }
.hero{ text-align:center; }
.avatar-ring{
  position:relative;
  width:132px; height:132px; margin:0 auto 16px;
  border-radius:50%; padding:5px; cursor:default;
  overflow:hidden;
  background:conic-gradient(from 180deg, var(--accent), var(--accent-2), var(--accent));
  box-shadow:0 0 32px var(--shadow), 0 18px 34px var(--img-glow);
  transition:background .7s ease, box-shadow .7s ease; will-change:transform;
  animation:bob var(--bob-speed) cubic-bezier(.45, 0, .55, 1) infinite;
}
.avatar-ring img, .avatar-ring video{
  width:100%; height:100%; border-radius:50%;
  object-fit:cover; display:block;
  background:var(--bg-soft);
  transition:transform .6s ease;
  animation:breathe 16s ease-in-out infinite;
}
.avatar-ring::before{
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none; border-radius:50%;
  background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,.2) 50%, transparent 58%);
  background-size:220% 100%;
  animation:shine 5.5s linear infinite;
}
.avatar-ring:hover img, .avatar-ring:hover video{ transform:scale(1.09); }
.name{
  font-size:clamp(30px, 5vw, 50px);
  font-weight:800; letter-spacing:2px; line-height:1.05;
  text-transform:uppercase;
  background:linear-gradient(95deg, var(--accent-2), var(--accent) 55%, var(--accent-2));
  background-size:220% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 26px var(--shadow);
  animation:shine 5.5s linear infinite, bob var(--bob-speed) cubic-bezier(.45, 0, .55, 1) infinite;
}
@keyframes shine{ from{ background-position:0% 50%; } to{ background-position:220% 50%; } }
@keyframes bob{ 0%, 100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
.tagline{
  margin-top:8px; color:var(--muted);
  font-size:14px; letter-spacing:5px; text-transform:uppercase;
}
.status-chip{
  display:inline-flex; align-items:center; gap:9px;
  margin-top:14px; padding:9px 18px; cursor:pointer;
  border-radius:999px; user-select:none;
  border:1px solid var(--card-line);
  background:var(--bg-soft);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  font-size:12px; letter-spacing:3px; text-transform:uppercase;
  color:var(--text);
  transition:background .7s ease, border-color .7s ease;
}
.status-dot{ position:relative; flex:none; width:10px; height:10px; border-radius:50%;
  background:#37e08d; box-shadow:0 0 14px #37e08d; }
.status-dot::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:1px solid #37e08d; animation:pulse 1.9s ease-out infinite;
}
@keyframes pulse{ 0%{transform:scale(.55); opacity:.95} 100%{transform:scale(2.2); opacity:0} }
.social-dock{
  position:fixed; left:50%; bottom:20px;
  transform:translateX(-50%);
  z-index:46;
  animation:glide 5s ease-in-out infinite;
}
@keyframes glide{
  0%,100%{ transform:translate(calc(-50% - 11px)) }
  50%    { transform:translate(calc(-50% + 11px)) }
}
.socials{
  position:relative; overflow:hidden;
  display:flex; justify-content:space-between; align-items:center;
  gap:14px; padding:11px 16px;
  border-radius:999px;
  border:1px solid var(--card-line);
  background:var(--card);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 44px rgba(0,0,0,.45), 0 0 26px var(--shadow);
  transition:background .7s ease, border-color .7s ease, box-shadow .7s ease;
}
.socials::after{
  content:""; position:absolute; top:0; bottom:0; width:45%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
  transform:translateX(-160%) skewX(-18deg);
  animation:sweep 3.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sweep{ 0%{transform:translateX(-160%) skewX(-18deg)} 60%,100%{transform:translateX(320%) skewX(-18deg)} }
.soc{
  width:44px; height:44px; border-radius:50%;
  flex:none; display:grid; place-items:center;
  border:1px solid var(--card-line);
  background:rgba(255,255,255,.08);
  color:var(--text);
  cursor:pointer;
  user-select:none;
  transition:transform .2s ease, background .35s ease, color .35s ease, box-shadow .35s ease;
}
.soc svg{ width:21px; height:21px; display:block; }
.soc:hover{
  transform:translateY(-5px) scale(1.08);
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:var(--bg-soft);
  box-shadow:0 12px 26px var(--shadow);
}
.player{ margin-top:26px; }
.section-title{
  font-size:12px; letter-spacing:3px; text-transform:uppercase;
  color:var(--muted); margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.section-title::after{ content:""; flex:1; height:1px; background:var(--card-line); }
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:14px;
}
.tile{
  position:relative; aspect-ratio:3/4; border-radius:20px; overflow:hidden;
  border:1px solid var(--card-line); cursor:pointer; background:var(--bg-soft);
  box-shadow:0 14px 30px var(--img-glow);
  transition:transform .25s ease, box-shadow .45s ease;
}
.tile:hover{ transform:translateY(-5px) scale(1.02); box-shadow:0 26px 54px var(--img-glow); }
.tile img{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .5s ease;
}
.tile:hover img{ transform:scale(1.07); }
.tile .cap{
  position:absolute; left:0; right:0; bottom:0; padding:10px 12px; z-index:3;
  font-size:11.5px; letter-spacing:.5px;
  background:linear-gradient(to top, rgba(0,0,0,.72), transparent);
  opacity:0; transform:translateY(8px); transition:.3s ease;
}
.tile:hover .cap{ opacity:1; transform:translateY(0); }
.tile video.reel{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:2; display:block;
}
.tile .badge{
  position:absolute; top:10px; left:10px; z-index:4;
  width:30px; height:30px; border-radius:50%;
  display:grid; place-items:center; font-size:11px;
  background:rgba(0,0,0,.45); color:#fff;
  border:1px solid var(--card-line);
}
.lightbox{
  position:fixed; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:16px;
  background:rgba(8,2,6,.82); backdrop-filter:blur(10px);
  padding:24px;
}
.lightbox.open{ display:flex; animation:fade .25s ease; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.lb-frame{
  border-radius:22px; overflow:hidden;
  border:1px solid var(--card-line);
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 70px var(--img-glow);
  line-height:0;
}
.lb-frame img{
  max-width:min(88vw, 520px); max-height:70vh;
  object-fit:cover; display:block;
}
.lightbox .lb-cap{ font-size:14px; letter-spacing:1px; color:var(--text); }
.lb-btn{
  position:absolute; z-index:12; width:46px; height:46px; border-radius:50%;
  border:1px solid var(--card-line); background:rgba(255,255,255,.1);
  color:var(--text); font-size:18px; cursor:pointer; display:grid; place-items:center;
  transition:background .2s ease, transform .15s ease;
}
.lb-btn:hover{ background:var(--accent); color:var(--bg-soft); transform:scale(1.07); }
.lb-close{ top:22px; right:22px; }
.lb-prev{ left:18px; top:50%; transform:translateY(-50%); }
.lb-next{ right:18px; top:50%; transform:translateY(-50%); }
.lb-prev:hover,.lb-next:hover{ transform:translateY(-50%) scale(1.07); }
.dock{
  position:fixed; bottom:20px;
  z-index:45; display:flex; flex-direction:column-reverse; align-items:center; gap:8px;
}
.dock-left{ left:20px; }
.dock-right{ right:20px; }
.dock-btn{
  width:56px; height:56px; border-radius:50%; cursor:pointer;
  border:1px solid var(--card-line);
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:var(--bg-soft);
  display:grid; place-items:center;
  box-shadow:0 12px 30px var(--shadow), 0 0 0 5px rgba(0,0,0,.14);
  transition:transform .2s ease, box-shadow .4s ease, background .7s ease;
}
.dock-btn svg{ width:24px; height:24px; display:block; }
.dock-btn:hover{ transform:translateY(-3px) scale(1.06); }
.dock-btn:active{ transform:scale(.95); }
.dock-cap{
  font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase;
  color:var(--muted);
  padding:4px 9px; border-radius:999px;
  border:1px solid var(--card-line); background:var(--card);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  white-space:nowrap;
}
.eq{ display:flex; align-items:flex-end; gap:3px; height:18px; }
.eq i{
  width:3px; height:4px; border-radius:2px; display:block;
  background:var(--accent); opacity:.55;
  animation:eq 1s ease-in-out infinite; animation-play-state:paused;
}
.eq i:nth-child(2){ animation-delay:.18s }
.eq i:nth-child(3){ animation-delay:.36s }
.eq i:nth-child(4){ animation-delay:.54s }
body.playing .eq i{ opacity:1; animation-play-state:running; }
@keyframes eq{ 0%,100%{height:4px} 50%{height:17px} }
.swatch{
  width:22px; height:22px; border-radius:50%;
  border:2px solid var(--bg-soft);
  background:var(--accent-2);
  box-shadow:0 0 0 2px var(--accent);
}

/* ==========================================================================
   STILI DELLA RADIO INTEGRATA
   ========================================================================== */

/* Wrapper responsivo per centrare il widget 750x122 su ogni schermo */
.stage-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin-top: 20px;
}

#barWrap {
  position: relative;
  width: 100%;
  max-width: 750px;
  height: 122px;
  border-radius: 22px;
  background: rgba(10, 12, 26, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  overflow: hidden;
  box-shadow:
    0 18px 45px rgba(0, 0, 0, 0.8),
    inset 0 0 22px rgba(0, 243, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  transition: box-shadow 0.4s ease, transform 0.3s ease, filter 0.4s ease;
  z-index: 1;
}

/* Bordo Neon RGB Animato (Controllato dal Cerchietto 3 - RGB) */
#barWrap::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 22px;
  padding: 2px;
  background: linear-gradient(
    90deg,
    #00f3ff,
    #ff00a0,
    #ffe600,
    #00ff88,
    #9d00ff,
    #00f3ff
  );
  background-size: 300% 300%;
  animation: rgbFlow 6s linear infinite;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 4;
}

#barWrap.rgb-on::before {
  opacity: 0.85;
}

#barWrap.is-active.rgb-on {
  box-shadow:
    0 0 32px rgba(0, 243, 255, 0.32),
    0 0 60px rgba(255, 0, 160, 0.22),
    inset 0 0 28px rgba(0, 243, 255, 0.16);
}

/* Onda Aurora Colorata di Sfondo (Controllata dal Cerchietto 5 - AUR) */
.aurora-layer {
  position: absolute;
  inset: -40%;
  background:
    radial-gradient(circle at 20% 50%, rgba(0, 243, 255, 0.22), transparent 45%),
    radial-gradient(circle at 55% 30%, rgba(255, 0, 160, 0.20), transparent 50%),
    radial-gradient(circle at 85% 70%, rgba(0, 255, 136, 0.18), transparent 45%);
  filter: blur(22px);
  animation: auroraWave 10s ease-in-out infinite alternate;
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
  z-index: 0;
}

#barWrap.aurora-on .aurora-layer {
  opacity: 1;
}

#barWrap.is-active.aurora-on .aurora-layer {
  animation-duration: 5s;
  opacity: 1;
}

/* Effetto Chroma Hyper-Shift (Controllato dal Cerchietto 6 - CHR) */
#barWrap.chroma-on {
  animation: chromaCycle 5s linear infinite;
}

/* Canvas Particelle (750x122) in background (Controllato dal Cerchietto 1 - PT) */
#particleCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 750px;
  height: 122px;
  pointer-events: none;
  z-index: 1;
  opacity: 1;
  transition: opacity 0.4s ease;
}

#barWrap.hide-particles #particleCanvas {
  opacity: 0;
}

/* SEZIONE SINISTRA: COVER + PULSANTE PLAY/PAUSE */
.left-section {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

#coverBox {
  position: relative;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  padding: 4px;
  background: linear-gradient(135deg, #00f3ff, #ff00a0, #00ff88);
  background-size: 200% 200%;
  animation: rgbFlow 4s linear infinite;
  box-shadow: 0 0 18px rgba(0, 243, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}

#barWrap:not(.rgb-on) #coverBox {
  background: rgba(255, 255, 255, 0.18);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

#coverBox.spinning {
  box-shadow:
    0 0 24px rgba(0, 243, 255, 0.65),
    0 0 38px rgba(255, 0, 160, 0.45);
}

#main-cover {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #090b16;
  animation: spinVinyl 9s linear infinite;
  animation-play-state: paused;
}

/* La cover gira quando è in riproduzione (.spinning) E il Cerchietto 4 (ROT) è ON */
#barWrap.rot-on #coverBox.spinning #main-cover {
  animation-play-state: running;
}

/* Pulsante Play / Pause */
#playBtn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid rgba(0, 243, 255, 0.7);
  background: radial-gradient(circle at 30% 30%, #192447, #090d1c);
  color: #00f3ff;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow:
    0 0 15px rgba(0, 243, 255, 0.35),
    inset 0 0 10px rgba(0, 243, 255, 0.25);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  outline: none;
}

#playBtn:hover {
  transform: scale(1.1);
  border-color: #ff00a0;
  color: #ffffff;
  box-shadow:
    0 0 22px rgba(255, 0, 160, 0.75),
    inset 0 0 14px rgba(0, 243, 255, 0.5);
}

#playBtn:active {
  transform: scale(0.95);
}

#barWrap.is-active #playBtn {
  border-color: #00ff88;
  color: #00ff88;
  box-shadow:
    0 0 20px rgba(0, 255, 136, 0.6),
    inset 0 0 12px rgba(0, 255, 136, 0.3);
  animation: pulseBtn 2s infinite;
}

/* SEZIONE CENTRALE: BADGE LIVE + 6 CERCHIETTI TOGGLE + MARQUEE SCROLLER CSS */
.center-section {
  position: relative;
  z-index: 3;
  flex: 1;
  min-width: 0;
  margin: 0 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}

.top-control-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* Badge LIVE / STANDBY */
#badgeLive {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 11px;
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: rgba(255, 255, 255, 0.6);
  transition: all 0.35s ease;
  flex-shrink: 0;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #6c757d;
  transition: all 0.35s ease;
}

#badgeLive.on {
  background: rgba(255, 0, 85, 0.16);
  border-color: rgba(255, 0, 100, 0.75);
  color: #ffffff;
  box-shadow: 0 0 16px rgba(255, 0, 100, 0.45);
}

#badgeLive.on .live-dot {
  background: #ff0055;
  box-shadow: 0 0 10px #ff0055, 0 0 18px #ff0055;
  animation: blinkLive 1.1s infinite alternate;
}

/* I 6 CERCHIETTI TOGGLE ON/OFF */
.toggles-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(5, 7, 16, 0.65);
  padding: 4px 9px;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.09);
}

.circle-toggle {
  position: relative;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.22);
  background: radial-gradient(circle at 35% 30%, #1e2238, #0b0d19);
  color: rgba(255, 255, 255, 0.4);
  font-family: 'Orbitron', sans-serif;
  font-size: 8px;

}

/* Micro LED luminoso dentro ogni cerchietto */
.circle-toggle .led-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  margin-bottom: 1px;
  transition: all 0.25s ease;
}

.circle-toggle:hover {
  transform: translateY(-2px) scale(1.08);
  border-color: rgba(255, 255, 255, 0.6);
  color: #fff;
}

/* Stato ON personalizzato per ciascuno dei 6 cerchietti */
.circle-toggle.active[data-color="cyan"] {
  border-color: #00f3ff; color: #00f3ff;
  box-shadow: 0 0 12px rgba(0, 243, 255, 0.55), inset 0 0 8px rgba(0, 243, 255, 0.25);
}
.circle-toggle.active[data-color="cyan"] .led-dot {
  background: #00f3ff; box-shadow: 0 0 6px #00f3ff;
}

.circle-toggle.active[data-color="pink"] {
  border-color: #ff00a0; color: #ff77cd;
  box-shadow: 0 0 12px rgba(255, 0, 160, 0.55), inset 0 0 8px rgba(255, 0, 160, 0.25);
}
.circle-toggle.active[data-color="pink"] .led-dot {
  background: #ff00a0; box-shadow: 0 0 6px #ff00a0;
}

.circle-toggle.active[data-color="lime"] {
  border-color: #00ff88; color: #00ff88;
  box-shadow: 0 0 12px rgba(0, 255, 136, 0.55), inset 0 0 8px rgba(0, 255, 136, 0.25);
}
.circle-toggle.active[data-color="lime"] .led-dot {
  background: #00ff88; box-shadow: 0 0 6px #00ff88;
}

.circle-toggle.active[data-color="amber"] {
  border-color: #ffaa00; color: #ffcc4d;
  box-shadow: 0 0 12px rgba(255, 170, 0, 0.55), inset 0 0 8px rgba(255, 170, 0, 0.25);
}
.circle-toggle.active[data-color="amber"] .led-dot {
  background: #ffaa00; box-shadow: 0 0 6px #ffaa00;
}

.circle-toggle.active[data-color="purple"] {
  border-color: #b84dff; color: #d599ff;
  box-shadow: 0 0 12px rgba(184, 77, 255, 0.55), inset 0 0 8px rgba(184, 77, 255, 0.25);
}
.circle-toggle.active[data-color="purple"] .led-dot {
  background: #b84dff; box-shadow: 0 0 6px #b84dff;
}

.circle-toggle.active[data-color="rainbow"] {
  border-color: #ffe600; color: #ffffff;
  box-shadow: 0 0 14px rgba(255, 230, 0, 0.65), inset 0 0 8px rgba(255, 0, 160, 0.45);
}
.circle-toggle.active[data-color="rainbow"] .led-dot {
  background: #ffe600; box-shadow: 0 0 6px #ffe600;
}

/* Tooltip elegante sopra i cerchietti */
.circle-toggle::after {
  content: attr(data-label);
  position: absolute;
  bottom: 31px;
  left: 50%;
  transform: translateX(-50%) scale(0.85);
  background: rgba(8, 10, 22, 0.95);
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid rgba(0, 243, 255, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease;
  z-index: 20;
}

.circle-toggle:hover::after {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

/* MARQUEE SCROLLER CSS (#trackInfo + @keyframes scorriIntero) */
.marquee-box {
  position: relative;
  width: 100%;
  height: 36px;
  border-radius: 10px;
  background: rgba(4, 6, 15, 0.78);
  border: 1px solid rgba(0, 243, 255, 0.22);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  overflow: hidden;
  padding-left: 34px;
}

/* Icona nota musicale fissa a sinistra dello scroller */
.marquee-icon {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 32px;
  background: linear-gradient(180deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 160, 0.2));
  border-right: 1px solid rgba(0, 243, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #00f3ff;
  font-size: 14px;
  z-index: 2;
  box-shadow: 4px 0 12px rgba(0, 0, 0, 0.6);
}

.marquee-viewport {
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
}

#trackInfo {

  font-weight: 700;

  background-size: 200% auto;

  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 12px rgba(0, 243, 255, 0.35);

  will-change: transform;
}

.right-section {

.eq-wrap {

  justify-content: flex-end;
  overflow: hidden;

#eqCanvas {

  pointer-events: none;
  transition: opacity 0.3s ease;
}

#barWrap.hide-eq .eq-off-badge {
  opacity: 1;

/* Slider Volume della Radio */
.volume-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: rgba(5, 7, 16, 0.65);
  padding: 5px 10px;

}

.vol-icon {
  font-size: 13px;
  color: #00f3ff;
  text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
}

#volumeControl {

  appearance: none;
  width: 100%;
  height: 5px;
  border-radius: 5px;
  background: linear-gradient(90deg, #00f3ff 0%, #ff00a0 100%);
  outline: none;
  cursor: pointer;
}

#volumeControl::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid #00f3ff;
  box-shadow: 0 0 10px #00f3ff;
  cursor: pointer;
  transition: transform 0.15s ease;
}

#volumeControl::-webkit-slider-thumb:hover {
  transform: scale(1.25);
  border-color: #ff00a0;
  box-shadow: 0 0 12px #ff00a0;
}

.vol-pct {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: #00f3ff;
  min-width: 30px;
  text-align: right;
}

/* ==========================================================================
   KEYFRAMES & ANIMAZIONI RADIO
   ========================================================================== */
@keyframes scorriIntero {
  0% {
    transform: translateX(310px);
  }
  100% {
    transform: translateX(-105%);
  }
}

@keyframes spinVinyl {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

@keyframes rgbFlow {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes auroraWave {
  0% {
    transform: translate(-6%, -6%) rotate(0deg) scale(1);
  }
  50% {
    transform: translate(6%, 8%) rotate(8deg) scale(1.08);
  }
  100% {
    transform: translate(-3%, 4%) rotate(-6deg) scale(0.96);
  }
}

@keyframes chromaCycle {
  0% {
    filter: hue-rotate(0deg);
  }
  100% {
    filter: hue-rotate(360deg);
  }
}

@keyframes blinkLive {
  0% {
    opacity: 0.45;
    transform: scale(0.9);
  }
  100% {
    opacity: 1;
    transform: scale(1.2);
  }
}

@keyframes pulseBtn {
  0%, 100% {
    box-shadow: 0 0 16px rgba(0, 255, 136, 0.5), inset 0 0 10px rgba(0, 255, 136, 0.25);
  }
  50% {

function applyTheme(i){
  const t = CONFIG.themes[i];
  root.style.setProperty("--bg",        t.bg);

  root.style.setProperty("--card",      t.card);

  accentRGB = hexToRgb(t.accent);
}
function hexToRgb(hex){
  const h = hex.replace("#","");
  const v = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const n = parseInt(v, 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgba(hex, a){ const c = hexToRgb(hex); return `rgba(${c.r}, ${c.g}, ${c.b}, ${a})`; }

$("themeBtn").addEventListener("click", () => {

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (CONFIG.pageSnow.on && !reduceMotion){
  const cfg   = CONFIG.pageSnow;
  const cv    = $("pageSnow");
  const ctx   = cv.getContext("2d");
  const rnd   = (a, b) => a + Math.random() * (b - a);
  let vw = 0, vh = 0, parts = [], last = performance.now();

  const spawn = (anywhere) => {
    const up = Math.random() < cfg.rise;
    return {
      x: Math.random() * vw,
      y: anywhere ? Math.random() * vh : (up ? vh + 8 : -8),
      r: rnd(.9, 2.6) * cfg.size,
      vy: rnd(14, 34) * (up ? -1 : 1) * cfg.speed,
      sway: rnd(6, 20),
      phase: Math.random() * Math.PI * 2,
      alpha: rnd(.5, 1) * cfg.alpha,
      tinted: Math.random() < .5,
      up
    };
  };
  function sizeVeil(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth; vh = window.innerHeight;
    cv.width = vw * dpr; cv.height = vh * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(cfg.min, Math.min(cfg.max, Math.round(vw * vh / cfg.density)));
    parts = Array.from({ length: n }, () => spawn(true));
  }
  function drawVeil(now){
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    ctx.clearRect(0, 0, vw, vh);
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      p.phase += dt * 1.9;
      p.y += p.vy * dt;
      const x = p.x + Math.sin(p.phase) * p.sway;
      const a = p.alpha * (.78 + .22 * Math.sin(p.phase * 2.4));
      const rgb = p.tinted ? `${accentRGB.r}, ${accentRGB.g}, ${accentRGB.b}` : "255, 255, 255";
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 3.2, 0, 6.2832);
      ctx.fillStyle = `rgba(${rgb}, ${a * .1})`; ctx.fill();
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 1.9, 0, 6.2832);
      ctx.fillStyle = `rgba(${rgb}, ${a * .26})`; ctx.fill();
      ctx.shadowColor = `rgba(${rgb}, ${Math.min(1, a * 1.1)})`;
      ctx.shadowBlur = p.r * 5;
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = `rgba(${rgb}, ${a})`; ctx.fill();
      ctx.shadowBlur = 0;
      if ((p.up && p.y < -12) || (!p.up && p.y > vh + 12)) parts[i] = spawn(false);
    }
    requestAnimationFrame(drawVeil);
  }
  window.addEventListener("resize", sizeVeil);
  sizeVeil();
  requestAnimationFrame(drawVeil);
}

pCanvas.width = 750;
pCanvas.height = 122;

let isP = false;
let currentTrack = "";
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let dataArray = null;

aud.volume = volumeControl.value;
volumeControl.addEventListener("input", (e) => {
  aud.volume = e.target.value;
});

let particles = [];
for (let i = 0; i < 30; i++) {
  particles.push({
    x: Math.random() * pCanvas.width,
    y: Math.random() * pCanvas.height,
    radius: Math.random() * 2 + 1,
    speedX: (Math.random() - 0.5) * 1.2,
    speedY: (Math.random() - 0.5) * 1.2,
    hue: Math.random() * 360,
    alpha: Math.random() * 0.7 + 0.3
  });
}

function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  if (isP) {
    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.hue = (p.hue + 0.6) % 360;
      if (p.x < 0 || p.x > pCanvas.width) p.speedX *= -1;
      if (p.y < 0 || p.y > pCanvas.height) p.speedY *= -1;

      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      pCtx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.alpha})`;
      pCtx.shadowBlur = 8;
      pCtx.shadowColor = `hsl(${p.hue}, 100%, 50%)`;
      pCtx.fill();
    });
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

function initWebAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.82;

    try {
      sourceNode = audioCtx.createMediaElementSource(aud);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch (e) {}

    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
  }
}

const numBars = 22;
let smoothHeights = new Array(numBars).fill(2);

function renderEqualizer() {
  eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
  const barWidth = 6;
  const barGap = 4;
  const totalW = numBars * (barWidth + barGap);
  const startX = eqCanvas.width - totalW;

  if (isP && analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < 16; i++) sum += dataArray[i];

    for (let i = 0; i < numBars; i++) {
      let targetH = 2;
      if (sum > 0) {
        const freqIndex = Math.floor(i * (dataArray.length / numBars));
        const val = dataArray[freqIndex] || 0;
        targetH = Math.max(2, (val / 255) * eqCanvas.height);
      } else {
        const t = Date.now() * 0.006;
        const wave = Math.sin(t + i * 0.45) * Math.cos(t * 0.7 + i * 0.2);
        targetH = Math.max(2, ((wave + 1) / 2) * (eqCanvas.height - 3) + 2);
      }

      smoothHeights[i] += (targetH - smoothHeights[i]) * 0.35;
      const h = smoothHeights[i];
      const x = startX + i * (barWidth + barGap);
      const y = eqCanvas.height - h;

      const hue = (i / numBars) * 320;
      eqCtx.fillStyle = `hsl(${hue}, 100%, 60%)`;
      eqCtx.shadowBlur = 6;
      eqCtx.shadowColor = `hsl(${hue}, 100%, 50%)`;

      eqCtx.beginPath();
      eqCtx.roundRect(x, y, barWidth, h, [2, 2, 0, 0]);
      eqCtx.fill();
    }
  } else {
    for (let i = 0; i < numBars; i++) {
      smoothHeights[i] += (2 - smoothHeights[i]) * 0.2;
      const x = startX + i * (barWidth + barGap);
      const y = eqCanvas.height - smoothHeights[i];
      eqCtx.fillStyle = "rgba(255, 255, 255, 0.15)";
      eqCtx.shadowBlur = 0;
      eqCtx.beginPath();
      eqCtx.roundRect(x, y, barWidth, smoothHeights[i], [2, 2, 0, 0]);
      eqCtx.fill();
    }
  }
  requestAnimationFrame(renderEqualizer);
}
renderEqualizer();

function toggleRadioPlay() {
  initWebAudio();

    audioCtx.resume();
  }

  if (!isP) {

    aud.src = S_URL + "&_t=" + Date.now();

      setRadioPlayUI(true);

      aud.removeAttribute("crossorigin");
      aud.src = S_URL + "&_t=" + Date.now();
      aud.play().then(() => {
        setRadioPlayUI(true);
      }).catch(() => resetPlayerUI());

    resetPlayerUI();
  }
}

let lbList = CONFIG.images;
let openIndex = 0;
let lbRaw = false;

function buildGallery(){
  $("gallery").innerHTML = "";
  CONFIG.images.forEach((img, i) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `<img src="${img.src}" alt="${img.caption || ""}" loading="lazy">`
                   + (img.caption ? `<div class="cap">${img.caption}</div>` : "")
                   + (img.video ? '<span class="badge">&#9654;</span>' : "");
    if (img.video){
      let reel = null;
      const makeReel = () => {
        reel = document.createElement("video");
        reel.className = "reel";
        reel.src = img.video;
        reel.muted = true; reel.loop = true; reel.autoplay = true;
        reel.setAttribute("playsinline", "");
        tile.appendChild(reel);
      };
      tile.addEventListener("mouseenter", () => { if (!reel) makeReel(); });
      tile.addEventListener("mouseleave", () => { if (reel) reel.pause(); });
      tile.addEventListener("click", () => {
        if (!reel) { makeReel(); return; }
        reel.paused ? reel.play().catch(() => {}) : reel.pause();
      });
    } else {
      tile.addEventListener("click", () => openLightbox(i));
    }
    $("gallery").appendChild(tile);
  });
}
function showLightbox(list, i, raw){
  lbList = list;
  openIndex = i;
  lbRaw = !!raw;
  const item = list[i];
  $("lbImage").src = item.src;
  $("lbImage").alt = item.caption || "";
  $("lbCaption").textContent = item.caption || "";
  $("lightbox").classList.toggle("raw", lbRaw);
  $("lightbox").classList.add("open");
}
function openLightbox(i){ showLightbox(CONFIG.images, i); }

function closeLightbox(){ $("lightbox").classList.remove("open"); }
function stepLightbox(dir){
  showLightbox(lbList, (openIndex + dir + lbList.length) % lbList.length, lbRaw);
}
$("lbClose").addEventListener("click", closeLightbox);
$("lbPrev").addEventListener("click", () => stepLightbox(-1));
$("lbNext").addEventListener("click", () => stepLightbox(1));
$("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) closeLightbox(); });
document.addEventListener("keydown", (e) => {
  if (!$("lightbox").classList.contains("open")) return;
  if (e.key === "Escape")     closeLightbox();
  if (e.key === "ArrowLeft")  stepLightbox(-1);
  if (e.key === "ArrowRight") stepLightbox(1);
});

buildGallery();
</script>

<canvas id="magicTrail" style="position:fixed; top:0; left:0; pointer-events:none; z-index:9999;"></canvas>
<script>
  const trCanvas = document.getElementById('magicTrail');
  const trCtx = trCanvas.getContext('2d');
  let trW = window.innerWidth;
  let trH = window.innerHeight;
  trCanvas.width = trW;
  trCanvas.height = trH;

  window.addEventListener('resize', () => {
    trW = window.innerWidth;
    trH = window.innerHeight;
    trCanvas.width = trW;
    trCanvas.height = trH;
  });

  const trailArr = [];
  let globalHue = 0;

  window.addEventListener('mousemove', (e) => {
    trailArr.push({ x: e.clientX, y: e.clientY, life: 1 });
  });

  function drawTrail() {
    trCtx.clearRect(0, 0, trW, trH);
    globalHue = (globalHue + 4) % 360; // Velocità cambio colore arcobaleno

    for (let i = 0; i < trailArr.length; i++) {
      let p = trailArr[i];
      p.life -= 0.03; // Velocità di dissolvenza scia (più basso = scia più lunga)

      if (p.life <= 0) {
        trailArr.splice(i, 1);
        i--;
        continue;
      }

      trCtx.beginPath();
      let radius = 14 * p.life; // Grandezza massima pallino sfumato
      trCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      trCtx.fillStyle = `hsla(${(globalHue + i * 2) % 360}, 100%, 55%, ${p.life})`;
      trCtx.shadowBlur = 12;
      trCtx.shadowColor = `hsl(${(globalHue + i * 2) % 360}, 100%, 50%)`;
      trCtx.fill();
    }
    requestAnimationFrame(drawTrail);
  }
  drawTrail();
</script>
