
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EL DIABLO</title>

<!-- Google Fonts per tipografia Cyber / High-Tech della Radio -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<!-- jQuery richiesto dallo script della radio -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
:root{
  --bg:        #150000;
  --bg-soft:   #1e0000;
  --card:      rgba(30,0,0,.4);
  --card-line: rgba(255,0,0,.4);
  --accent:    #ff0000;
  --accent-2:  #ff4d4d;
  --text:      #ffffff;
  --muted:     rgba(255,255,255,.62);
  --shadow:    rgba(255,0,0,.7);
  --bob-speed: 3.2s;
  --img-glow:  rgba(255,0,0,.9);
  --radius:    26px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:clamp(16px, 4vw, 44px);
  padding-bottom:60px;
  overflow-x:hidden;
}

body::before, body::after{
  content:""; position:fixed; border-radius:50%;
  filter:blur(100px); opacity:.45; pointer-events:none; z-index:0;
  transition:background .7s ease;
}
body::before{ width:420px; height:420px; background:var(--accent);  top:-120px; left:-100px; }
body::after { width:380px; height:380px; background:var(--accent-2); bottom:-140px; right:-90px; }

/* Cenere / Neve Infernale di sfondo */
.page-snow{
  position:fixed; inset:0;
  width:100%; height:100%;
  z-index:3; display:block; pointer-events:none;
}

.wrap{
  position:relative; z-index:1;
  max-width:800px; margin:0 auto;
  display:flex; flex-direction:column;
  gap:30px; align-items:center;
}

.cover-banner{
  position:relative; display:block;
  width:100%;
  height:clamp(280px, 56vh, 480px);
  border-radius:var(--radius); overflow:hidden;
  border:1px solid var(--card-line);
  box-shadow: 0 0 30px var(--shadow), 0 0 60px var(--shadow), 0 0 100px var(--img-glow), 0 28px 64px rgba(0,0,0,.9);
  cursor:default;
  transition:box-shadow .7s ease, border-color .7s ease;
  animation:bob var(--bob-speed) cubic-bezier(.45, 0, .55, 1) infinite;
}
.cover-banner img, .cover-banner video{
  width:100%; height:100%; object-fit:cover; display:block;
  animation:breathe 16s ease-in-out infinite;
}
@keyframes breathe{ 0%, 100%{ scale:1 } 50%{ scale:1.05 } }
.cover-banner::before{
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,.2) 50%, transparent 58%);
  background-size:220% 100%;
  animation:shine 5.5s linear infinite;
}
@keyframes shine{ from{ background-position:0% 50%; } to{ background-position:220% 50%; } }
.cover-banner video{ object-position:center 22%; }
.cover-banner::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(to top, var(--bg) 3%, rgba(0,0,0,.25) 38%, transparent 70%);
}
.cover-text{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  padding:16px 26px; text-align:center;
}

@keyframes fuoco {
  0%, 100% { text-shadow: 0 -2px 4px var(--text), 0 -6px 12px var(--accent-2), 0 -10px 20px var(--accent), 0 -14px 30px var(--accent); }
  25% { text-shadow: 0 -1px 3px var(--text), 0 -5px 10px var(--accent-2), 0 -12px 22px var(--accent), 0 -16px 35px var(--accent); }
  50% { text-shadow: 0 -3px 6px var(--text), 0 -8px 15px var(--accent-2), 0 -15px 25px var(--accent), 0 -20px 40px var(--accent); }
  75% { text-shadow: 0 -2px 5px var(--text), 0 -7px 13px var(--accent-2), 0 -11px 23px var(--accent), 0 -15px 33px var(--accent); }
}
.name{
  font-size:clamp(30px, 5vw, 50px); font-weight:900; letter-spacing:3px; line-height:1.05; text-transform:uppercase;
  color: #fff; animation: fuoco 1.5s ease-in-out infinite alternate;
}
.tagline{
  margin-top:10px; font-size:15px; font-weight:900; letter-spacing:4px; text-transform:uppercase;
  color: var(--accent-2); animation: fuoco 1.2s ease-in-out infinite alternate-reverse;
}
@keyframes bob{ 0%, 100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }

.status-chip{
  display:inline-flex; align-items:center; gap:9px; margin-top:14px; padding:9px 18px; cursor:default;
  border-radius:999px; user-select:none; border:1px solid var(--card-line); background:var(--bg-soft);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--text);
  box-shadow: 0 0 10px var(--shadow); transition:box-shadow .7s ease, background .7s ease, border-color .7s ease;
}
.status-chip:hover { box-shadow: 0 0 15px var(--shadow), 0 0 25px var(--shadow); }
.status-dot{ position:relative; flex:none; width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent); }
.status-dot::after{
  content:""; position:absolute; inset:-4px; border-radius:50%; border:1px solid var(--accent); animation:pulse 1.9s ease-out infinite;
}
@keyframes pulse{ 0%{transform:scale(.55); opacity:.95} 100%{transform:scale(2.2); opacity:0} }

.dock{ position:fixed; bottom:20px; z-index:45; display:flex; flex-direction:column-reverse; align-items:center; gap:8px; }
.dock-right{ right:20px; }
.dock-btn{
  width:56px; height:56px; border-radius:50%; cursor:pointer; border:1px solid var(--card-line);
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--bg-soft); display:grid; place-items:center;
  box-shadow: 0 0 15px var(--shadow), 0 0 25px var(--shadow), 0 0 5px rgba(0,0,0,.5);
  transition:transform .2s ease, box-shadow .4s ease, background .7s ease, border-color .7s ease;
}
.dock-btn:hover{ transform:translateY(-3px) scale(1.06); box-shadow: 0 0 20px var(--shadow), 0 0 40px var(--shadow), 0 0 60px var(--img-glow); }
.dock-btn:active{ transform:scale(.95); }
.dock-cap{
  font-size:10px; letter-spacing:1.4px; text-transform:uppercase; font-weight: bold; color:var(--text);
  padding:4px 9px; border-radius:999px; border:1px solid var(--card-line); background:var(--bg-soft);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); white-space:nowrap; box-shadow: 0 0 15px var(--shadow);
  transition: background .7s ease, border-color .7s ease;
}
.swatch{ width:22px; height:22px; border-radius:50%; border:2px solid var(--bg-soft); background:var(--accent-2); box-shadow:0 0 0 2px var(--accent); transition: background .7s ease, box-shadow .7s ease; }

.stage-wrapper { position: relative; width: 100%; display: flex; justify-content: center; }

/* FIX LARGHEZZA CONTROLLER PER TABLET */
#barWrap {
  position: relative; width: 750px; flex-shrink: 0; height: 122px; border-radius: 22px; background: rgba(10, 0, 0, 0.88);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; overflow: hidden; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.8), inset 0 0 22px rgba(255, 0, 0, 0.1);
  border: 1px solid rgba(255, 0, 0, 0.15); transition: box-shadow 0.4s ease, border-color 0.4s ease; z-index: 1;
}

@keyframes animaPulse {
  0%, 100% { box-shadow: 0 0 15px rgba(255,0,0,0.3), inset 0 0 10px rgba(255,0,0,0.1); border-color: rgba(255,0,0,0.2); }
  50% { box-shadow: 0 0 45px rgba(255,0,0,0.9), inset 0 0 25px rgba(255,0,0,0.6); border-color: rgba(255,0,0,0.9); }
}
#barWrap.anima-on { animation: animaPulse 1.2s infinite ease-in-out; }

.nebbia-layer {
  position: absolute; inset: -50%;
  background: radial-gradient(circle at 30% 50%, rgba(200, 0, 0, 0.2), transparent 50%), radial-gradient(circle at 70% 60%, rgba(100, 0, 0, 0.25), transparent 50%);
  filter: blur(25px); opacity: 0; transition: opacity 0.5s ease; pointer-events: none; z-index: 0;
}
#barWrap.neb-on .nebbia-layer { opacity: 1; animation: nebbiaMove 8s ease-in-out infinite alternate; }
@keyframes nebbiaMove { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.2) translate(4%, -4%); } }

#particleCanvas { position: absolute; top: 0; left: 0; width: 750px; height: 122px; pointer-events: none; z-index: 1; opacity: 1; transition: opacity 0.4s ease; }
#barWrap.hide-lap #particleCanvas { opacity: 0; }

.left-section { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#coverBox {
  position: relative; width: 90px; height: 90px; border-radius: 50%; padding: 4px;
  background: linear-gradient(135deg, #ff0000, #ff6600, #ff0055); background-size: 200% 200%;
  box-shadow: 0 0 18px rgba(255, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; transition: box-shadow 0.35s ease;
}
#coverBox.spinning { box-shadow: 0 0 30px rgba(255, 50, 0, 0.8), 0 0 45px rgba(255, 0, 0, 0.6); }
#main-cover {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #090000; animation: spinVinyl 9s linear infinite; animation-play-state: paused;
}
.is-active #coverBox.spinning #main-cover { animation-play-state: running; }

/* Tasto Play */
#playBtn {
  width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255, 0, 0, 0.7);
  background: radial-gradient(circle at 30% 30%, #3a0000, #110000); color: #ff3333; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(255, 0, 0, 0.3); transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); outline: none;
}
#playBtn:hover { transform: scale(1.1); border-color: #ff5500; color: #ffffff; box-shadow: 0 0 25px rgba(255, 85, 0, 0.8), inset 0 0 15px rgba(255, 0, 0, 0.5); }
#playBtn:active { transform: scale(0.95); }
#barWrap.is-active #playBtn { border-color: #ff2200; color: #ff2200; box-shadow: 0 0 25px rgba(255, 34, 0, 0.7), inset 0 0 15px rgba(255, 34, 0, 0.4); animation: pulseBtn 2s infinite; }

.center-section { position: relative; z-index: 3; flex: 1; min-width: 0; margin: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.top-control-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#badgeLive {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 30px; background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15); font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: rgba(255, 255, 255, 0.6);
  transition: all 0.35s ease; flex-shrink: 0;
}
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #6c757d; transition: all 0.35s ease; }
#badgeLive.on { background: rgba(255, 0, 0, 0.2); border-color: rgba(255, 0, 0, 0.8); color: #ffffff; box-shadow: 0 0 16px rgba(255, 0, 0, 0.5); }
#badgeLive.on .live-dot { background: #ff0000; box-shadow: 0 0 10px #ff0000, 0 0 18px #ff0000; animation: blinkLive 1.1s infinite alternate; }

.toggles-bar { display: flex; align-items: center; gap: 7px; background: rgba(15, 0, 0, 0.65); padding: 4px 9px; border-radius: 30px; border: 1px solid rgba(255, 0, 0, 0.15); }
.circle-toggle {
  position: relative; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.15); text-decoration: none;
  background: radial-gradient(circle at 35% 30%, #2a0000, #0a0000); color: rgba(255, 255, 255, 0.4); font-family: 'Orbitron', sans-serif; font-size: 8px;
  font-weight: 700; letter-spacing: 0.3px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); outline: none;
}
.circle-toggle .led-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); margin-bottom: 2px; transition: all 0.25s ease; }
.circle-toggle:hover { transform: translateY(-2px) scale(1.08); border-color: rgba(255, 0, 0, 0.8); color: #fff; }

.circle-toggle.active[data-color="fire"] { border-color: #ff5500; color: #ff9900; box-shadow: 0 0 15px rgba(255, 85, 0, 0.6), inset 0 0 8px rgba(255, 85, 0, 0.3); }
.circle-toggle.active[data-color="fire"] .led-dot { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
.circle-toggle.active[data-color="blood"] { border-color: #ff0000; color: #ff3333; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6), inset 0 0 8px rgba(255, 0, 0, 0.3); }
.circle-toggle.active[data-color="blood"] .led-dot { background: #ff0000; box-shadow: 0 0 8px #ff0000; }
.circle-toggle.active[data-color="demon"] { border-color: #cc0000; color: #ff6666; box-shadow: 0 0 15px rgba(204, 0, 0, 0.7), inset 0 0 8px rgba(204, 0, 0, 0.4); }
.circle-toggle.active[data-color="demon"] .led-dot { background: #ff0000; box-shadow: 0 0 8px #ff0000; }
.circle-toggle.active[data-color="amber"] { border-color: #ffcc00; color: #ffee88; box-shadow: 0 0 15px rgba(255, 204, 0, 0.6), inset 0 0 8px rgba(255, 204, 0, 0.3); }
.circle-toggle.active[data-color="amber"] .led-dot { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }

.circle-toggle::after {
  content: attr(data-label); position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%) scale(0.85); background: rgba(15, 0, 0, 0.95);
  color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700; white-space: nowrap; padding: 3px 8px; border-radius: 6px;
  border: 1px solid rgba(255, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: all 0.2s ease; z-index: 20; box-shadow: 0 0 10px rgba(255,0,0,0.5);
}
.circle-toggle:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }

.marquee-box {
  position: relative; width: 100%; height: 36px; border-radius: 10px; background: rgba(15, 0, 0, 0.78); border: 1px solid rgba(255, 50, 0, 0.3);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9); display: flex; align-items: center; overflow: hidden; padding-left: 34px;
}
.marquee-icon {
  position: absolute; left: 0; top: 0; bottom: 0; width: 32px; background: linear-gradient(180deg, rgba(255, 0, 0, 0.3), rgba(150, 0, 0, 0.1));
  border-right: 1px solid rgba(255, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; color: #ff4444; font-size: 14px; z-index: 2; box-shadow: 4px 0 12px rgba(0, 0, 0, 0.8);
}
.marquee-viewport {
  width: 100%; overflow: hidden; white-space: nowrap; position: relative;
  mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
}
#trackInfo {
  display: inline-block; white-space: nowrap; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.4px;
  background: linear-gradient(90deg, #ffffff, #ffcc00, #ff4400, #ff0000, #ffffff); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(255, 50, 0, 0.5); animation: scorriIntero 18s linear infinite; will-change: transform;
}
.right-section { position: relative; z-index: 3; width: 220px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 9px; }
.eq-wrap {
  position: relative; width: 220px; height: 46px; background: rgba(15, 0, 0, 0.6); border-radius: 9px; border: 1px solid rgba(255, 0, 0, 0.15);
  padding: 3px 0; display: flex; align-items: flex-end; justify-content: flex-end; overflow: hidden;
}
#eqCanvas { width: 220px; height: 40px; display: block; }
.volume-row {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(15, 0, 0, 0.7); padding: 5px 10px;
  border-radius: 20px; border: 1px solid rgba(255, 0, 0, 0.15);
}
.vol-icon { font-size: 13px; color: #ff4444; text-shadow: 0 0 8px rgba(255, 0, 0, 0.8); }
#volumeControl {
  -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 5px; background: linear-gradient(90deg, #ffaa00 0%, #ff0000 100%); outline: none; cursor: pointer;
}
#volumeControl::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; border: 2px solid #ff0000; box-shadow: 0 0 12px #ff0000; cursor: pointer; transition: transform 0.15s ease;
}
#volumeControl::-webkit-slider-thumb:hover { transform: scale(1.25); border-color: #ffaa00; box-shadow: 0 0 15px #ffaa00; }
.vol-pct { font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; color: #ff4444; min-width: 30px; text-align: right; }

@keyframes scorriIntero { 0% { transform: translateX(310px); } 100% { transform: translateX(-105%); } }
@keyframes spinVinyl { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes blinkLive { 0% { opacity: 0.45; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.2); } }
@keyframes pulseBtn { 0%, 100% { box-shadow: 0 0 20px rgba(255, 34, 0, 0.6), inset 0 0 12px rgba(255, 34, 0, 0.3); } 50% { box-shadow: 0 0 35px rgba(255, 34, 0, 0.9), inset 0 0 20px rgba(255, 34, 0, 0.5); } }

/* SCALING DINAMICO FIXATO */
@media (max-width: 800px) { 
  #barWrap { 
    transform: scale(calc((100vw - 32px) / 750)); 
    transform-origin: top center; 
    margin-bottom: calc(122px * ((100vw - 32px) / 750) - 122px); 
  } 
}
@media (max-width: 640px) {
  .dock-btn{ width:46px; height:46px; } 
  .dock-cap{ display:none; } 
  .dock-right{ right:12px; bottom:14px; } 
}
@media (prefers-reduced-motion: reduce){ .status-dot::after{ animation:none; } }
</style>
</head>
<body>


<canvas id="pageSnow" class="page-snow"></canvas>


<div class="dock dock-right">
  <button class="dock-btn" id="themeBtn" title="Cambia colori e sfondo" aria-label="Cambia colori">
    <span class="swatch"></span>
  </button>
  <span class="dock-cap" id="themeLabel">Rosso Sangue</span>
</div>


<div class="wrap">
  <!-- BANNER VIDEO & TESTI -->
  <div class="cover-banner">
    <img data-photo src="" alt="Foto Copertina" />
    <div class="cover-text">
      <h1 class="name" data-name>Name</h1>
      <p class="tagline" data-tagline>Tagline</p>
      <div class="status-chip" data-status>
        <span class="status-dot"></span><span class="status-text">Online</span>
      </div>
    </div>
  </div>


  <div class="stage-wrapper">
    <div id="barWrap" class="anima-on neb-on">
      <div class="nebbia-layer"></div>
      <canvas id="particleCanvas"></canvas>
      
      <div class="left-section">
        <div id="coverBox">
          <img id="main-cover" src="https://xatimg.com/image/aqqnLNOz5gQe.png" alt="Cover Live" />
        </div>
        <button id="playBtn" title="Play / Pause Stream">▶</button>
      </div>
      
      <div class="center-section">
        <div class="top-control-row">
          <div id="badgeLive">
            <span class="live-dot"></span>
            <span id="liveStatus">STANDBY</span>
          </div>
          <!-- 3 EFFETTI + 1 LINK XAT ITALIA_GHOST -->
          <div class="toggles-bar" aria-label="Effetti e Xat">
            <!-- Tasti Effetti Visivi -->
            <button type="button" class="circle-toggle active" data-toggle="lap" data-color="fire" data-label="Lapilli: ON"><span class="led-dot"></span>LAP</button>
            <button type="button" class="circle-toggle active" data-toggle="neb" data-color="blood" data-label="Nebbia: ON"><span class="led-dot"></span>NEB</button>
            <button type="button" class="circle-toggle active" data-toggle="ani" data-color="demon" data-label="Anima: ON"><span class="led-dot"></span>ANI</button>
            
            <a href="https://xat.com/ITALIA_GHOST" target="_blank" class="circle-toggle active" data-color="amber" data-label="La mia Xat"><span class="led-dot"></span>XAT</a>
          </div>
        </div>
        <div class="marquee-box">
          <div class="marquee-icon">♫</div>
          <div class="marquee-viewport">
            <div id="trackInfo">PREMI PLAY PER ASCOLTARE LA DIRETTA STREAMING...</div>
          </div>
        </div>
      </div>
      
      <div class="right-section">
        <div class="eq-wrap">
          
          <canvas id="eqCanvas" width="220" height="40"></canvas>
        </div>
        <div class="volume-row">
          <span class="vol-icon" id="volIcon">🔊</span>
          <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.85" />
          <span class="vol-pct" id="volPct">85%</span>
        </div>
      </div>
    </div>
  </div>
  

</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>

const CONFIG = {
  name:    "EL DIABLO",
  tagline: "QUI SEI ALL'INFERNO COMANDA EL DIABLO",
  profilePhoto: "https://xatimg.com/image/aqqnLNOz5gQe.png",

  // Il tuo Video Sigla 
  coverVideo: {
    on: true,
    src: "https://i.imgur.com/kpWuypl.mp4",
    poster: ""
  },
  status: { on: true, onlineText: "Online · su xat" },
  pageSnow: { on: true, density: 14000, speed: .5, size: 1.1, rise: .12, alpha: .55, min: 18, max: 55 },

  // I Temi che appariranno quando clicchi il pulsante a destra!
  themes: [

let themeIndex = 0;
let accentRGB = { r:255, g:0, b:0 }; 

function applyTheme(i){
  const t = CONFIG.themes[i];
  root.style.setProperty("--bg",        t.bg);
  root.style.setProperty("--bg-soft",   t.bg);
  root.style.setProperty("--card",      t.card);
  root.style.setProperty("--card-line", t.line);
  root.style.setProperty("--accent",    t.accent);
  root.style.setProperty("--accent-2",  t.accent2);
  root.style.setProperty("--text",      t.text);
  root.style.setProperty("--muted",     rgba(t.text, .62));
  root.style.setProperty("--shadow",    t.shadow);
  root.style.setProperty("--img-glow",  t.glow);
  
  const lbl = $("themeLabel");
  if(lbl) lbl.textContent = t.label;
  
  accentRGB = hexToRgb(t.accent);
}
function hexToRgb(hex){
  const h = hex.replace("#","");
  const v = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const n = parseInt(v, 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgba(hex, a){ const c = hexToRgb(hex); return `rgba(${c.r}, ${c.g}, ${c.b}, ${a})`; }

if(tBtn){
  tBtn.addEventListener("click", () => {

// Effetto Cenere / Neve Infernale Sfondo Pagina
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (CONFIG.pageSnow.on && !reduceMotion){
  const cfg   = CONFIG.pageSnow;
  const cv    = $("pageSnow");
  const ctx   = cv.getContext("2d");
  const rnd   = (a, b) => a + Math.random() * (b - a);
  let vw = 0, vh = 0, parts = [], last = performance.now();

  const spawn = (anywhere) => {
    const up = Math.random() < cfg.rise;
    return {
      x: Math.random() * vw, y: anywhere ? Math.random() * vh : (up ? vh + 8 : -8),
      r: rnd(.9, 2.6) * cfg.size, vy: rnd(14, 34) * (up ? -1 : 1) * cfg.speed,
      sway: rnd(6, 20), phase: Math.random() * Math.PI * 2,
      alpha: rnd(.5, 1) * cfg.alpha, tinted: Math.random() < .5, up
    };
  };
  function sizeVeil(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth; vh = window.innerHeight;
    cv.width = vw * dpr; cv.height = vh * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(cfg.min, Math.min(cfg.max, Math.round(vw * vh / cfg.density)));
    parts = Array.from({ length: n }, () => spawn(true));
  }
  function drawVeil(now){
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    ctx.clearRect(0, 0, vw, vh);
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      p.phase += dt * 1.9; p.y += p.vy * dt;
      const x = p.x + Math.sin(p.phase) * p.sway;
      const a = p.alpha * (.78 + .22 * Math.sin(p.phase * 2.4));
      const rgb = p.tinted ? `${accentRGB.r}, ${accentRGB.g}, ${accentRGB.b}` : "255, 255, 255";
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 3.2, 0, 6.2832);
      ctx.fillStyle = `rgba(${rgb}, ${a * .1})`; ctx.fill();
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 1.9, 0, 6.2832);
      ctx.fillStyle = `rgba(${rgb}, ${a * .26})`; ctx.fill();
      ctx.shadowColor = `rgba(${rgb}, ${Math.min(1, a * 1.1)})`; ctx.shadowBlur = p.r * 5;
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = `rgba(${rgb}, ${a})`; ctx.fill(); ctx.shadowBlur = 0;
      if ((p.up && p.y < -12) || (!p.up && p.y > vh + 12)) parts[i] = spawn(false);
    }
    requestAnimationFrame(drawVeil);
  }
  window.addEventListener("resize", sizeVeil);
  sizeVeil();
  requestAnimationFrame(drawVeil);
}


const S_URL = "https://stm2.srvif.com:7198/;type=mp3"; 
const defaultCover = "https://xatimg.com/image/aqqnLNOz5gQe.png";

const aud = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const trackInfo = document.getElementById("trackInfo");
const mCover = document.getElementById("main-cover");
const coverBox = document.getElementById("coverBox");
const barWrap = document.getElementById("barWrap");
const badgeLive = document.getElementById("badgeLive");
const liveStatus = document.getElementById("liveStatus");
const volumeControl = document.getElementById("volumeControl");
const eqCanvas = document.getElementById("eqCanvas");
const eqCtx = eqCanvas.getContext("2d");
const pCanvas = document.getElementById("particleCanvas");
const pCtx = pCanvas.getContext("2d");

pCanvas.width = 750;
pCanvas.height = 122;

let isP = false;
let isIntroPlaying = false;
let introDone = false; 
let currentTrack = "";
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let dataArray = null;

aud.volume = volumeControl.value;
volumeControl.addEventListener("input", (e) => { 
  aud.volume = e.target.value; 
  const sigla = document.getElementById("siglaVideo");
  if(sigla && isIntroPlaying) sigla.volume = e.target.value;
});

let particles = [];
for (let i = 0; i < 45; i++) {
  particles.push({
    x: Math.random() * pCanvas.width, 
    y: Math.random() * pCanvas.height,
    radius: Math.random() * 2.5 + 0.5, 
    speedY: Math.random() * 1.5 + 0.5, 
    angle: Math.random() * Math.PI * 2, 
    alpha: Math.random() * 0.8 + 0.2
  });
}

function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  if ((isP || isIntroPlaying) && !barWrap.classList.contains("hide-lap")) {
    particles.forEach(p => {
      p.y -= p.speedY; 
      p.x += Math.sin(p.angle) * 0.5; 
      p.angle += 0.05;
      if (p.y < 0) { p.y = pCanvas.height + 10; p.x = Math.random() * pCanvas.width; }
      
      const hue = Math.floor(Math.random() * 40) + 10; 
      pCtx.beginPath(); pCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      pCtx.fillStyle = `hsla(${hue}, 100%, 55%, ${p.alpha})`;
      pCtx.shadowBlur = 10; pCtx.shadowColor = `hsl(${hue}, 100%, 50%)`; pCtx.fill();
    });
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

function initWebAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64; analyser.smoothingTimeConstant = 0.82;
    try {
      sourceNode = audioCtx.createMediaElementSource(aud);
      sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
    } catch (e) {}
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }
}

const numBars = 22;
let smoothHeights = new Array(numBars).fill(2);

function renderEqualizer() {
  eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
  const barWidth = 6, barGap = 4, totalW = numBars * (barWidth + barGap);
  const startX = eqCanvas.width - totalW;

  if ((isP || isIntroPlaying) && analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0; for (let i = 0; i < 16; i++) sum += dataArray[i];

    for (let i = 0; i < numBars; i++) {
      let targetH = 2;
      if (sum > 0) {
        const freqIndex = Math.floor(i * (dataArray.length / numBars));
        targetH = Math.max(2, ((dataArray[freqIndex] || 0) / 255) * eqCanvas.height);
      } else {
        const t = Date.now() * 0.006, wave = Math.sin(t + i * 0.45) * Math.cos(t * 0.7 + i * 0.2);
        targetH = Math.max(2, ((wave + 1) / 2) * (eqCanvas.height - 3) + 2);
      }
      smoothHeights[i] += (targetH - smoothHeights[i]) * 0.35;
      const h = smoothHeights[i], x = startX + i * (barWidth + barGap), y = eqCanvas.height - h;
      
      let hue = (h / eqCanvas.height) * 55; 
      let sat = "100%";
      let light = "50%";
      
      eqCtx.fillStyle = `hsl(${hue}, ${sat}, ${light})`; 
      eqCtx.shadowBlur = 8; 
      eqCtx.shadowColor = `hsl(${hue}, 100%, 50%)`;
      eqCtx.beginPath(); eqCtx.roundRect(x, y, barWidth, h, [2, 2, 0, 0]); eqCtx.fill();
    }
  } else {
    for (let i = 0; i < numBars; i++) {
      smoothHeights[i] += (2 - smoothHeights[i]) * 0.2;
      const x = startX + i * (barWidth + barGap), y = eqCanvas.height - smoothHeights[i];
      eqCtx.fillStyle = "rgba(255, 255, 255, 0.15)"; eqCtx.shadowBlur = 0;
      eqCtx.beginPath(); eqCtx.roundRect(x, y, barWidth, smoothHeights[i], [2, 2, 0, 0]); eqCtx.fill();
    }
  }
  requestAnimationFrame(renderEqualizer);
}
renderEqualizer();

function toggleRadioPlay() {
  initWebAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  
  if (!isP && !isIntroPlaying) {
    if (!introDone) {
      playIntro(); 
    } else {
      startRadioStream(); 
    }
  } else {
    stopAll(); 
  }
}

function playIntro() {
  const sigla = document.getElementById("siglaVideo");
  if (sigla) {
    isIntroPlaying = true;
    
    // FIX TABLET: Ferma temporaneamente e forza la rimozione del muto!
    sigla.pause();
    sigla.removeAttribute("muted");
    sigla.muted = false;
    sigla.volume = volumeControl.value;
    sigla.currentTime = 0; 
    sigla.loop = false; 
    
    sigla.play().then(() => {
      playBtn.innerHTML = "⏸";
      coverBox.classList.add("spinning"); barWrap.classList.add("is-active");
      badgeLive.classList.add("on"); 
      liveStatus.textContent = "INTRO";
      trackInfo.textContent = "ASCOLTANDO LA SIGLA INIZIALE...";
      trackInfo.style.animation = "scorriIntero 8s linear infinite"; 
      document.body.classList.add("playing");
      
      sigla.onended = () => {
        if(!isIntroPlaying) return; 
        isIntroPlaying = false;
        introDone = true;
        
        // Finito l'intro, rimettiamo in muto e facciamo ripartire il loop visivo
        sigla.muted = true; 
        sigla.setAttribute("muted", "");
        sigla.loop = true;  
        sigla.play().catch(()=>{});
        
        startRadioStream();
      };
      
      // LA LOGICA DEI 9 SECONDI ESATTI (9000 millisecondi)
      setTimeout(() => {
        if (isIntroPlaying) sigla.onended();
      }, 9000); 
      
    }).catch(err => {
      isIntroPlaying = false;
      introDone = true;
      startRadioStream();
    });
  } else {
    introDone = true;
    startRadioStream();
  }
}

function startRadioStream() {
  isP = true;
  trackInfo.style.animation = "scorriIntero 18s linear infinite";
  aud.src = S_URL + "&_t=" + Date.now();
  aud.play().then(() => {
    setRadioPlayUI(true);
  }).catch(() => {
    aud.removeAttribute("crossorigin");
    aud.src = S_URL + "&_t=" + Date.now();
    aud.play().then(() => setRadioPlayUI(true)).catch(() => resetPlayerUI());
  });
  updateMetadata();
}

function stopAll() {
  isP = false;
  isIntroPlaying = false;
  aud.pause();
  aud.src = "";
  
  const sigla = document.getElementById("siglaVideo");
  if (sigla) {
    // Ritorna silenzioso come sfondo
    sigla.muted = true;
    sigla.setAttribute("muted", "");
    sigla.loop = true;
    sigla.play().catch(()=>{});
    introDone = true; 
  }
  resetPlayerUI();
}

function setRadioPlayUI(playing) {
    if(playing) {
      playBtn.innerHTML = "⏸";
      coverBox.classList.add("spinning"); barWrap.classList.add("is-active");
      badgeLive.classList.add("on"); liveStatus.textContent = "ON AIR";
      document.body.classList.add("playing");
    } else {
      resetPlayerUI();
    }
}

function resetPlayerUI() {
  playBtn.innerHTML = "▶";
  coverBox.classList.remove("spinning"); barWrap.classList.remove("is-active");
  badgeLive.classList.remove("on"); liveStatus.textContent = "STANDBY";
  document.body.classList.remove("playing");
  if(currentTrack) trackInfo.textContent = currentTrack;
}

playBtn.addEventListener("click", toggleRadioPlay);

mCover.onerror = function() { if (this.src !== defaultCover) this.src = defaultCover; };

function updateMetadata() {
  if (isIntroPlaying) return; 
  $.getJSON("https://stm2.srvif.com:7198/stats?sid=1&json=1&callback=?", function(data) {
    if (data && data.songtitle) {
      const title = data.songtitle.toUpperCase();
      if (currentTrack !== title) {
        currentTrack = title;
        trackInfo.textContent = title; trackInfo.style.animation = "none"; void trackInfo.offsetWidth;
        trackInfo.style.animation = "scorriIntero 18s linear infinite";
        $.getJSON("https://itunes.apple.com/search?term=" + encodeURIComponent(title) + "&limit=1&callback=?", function(res) {
          mCover.src = (res.results && res.results[0] && res.results[0].artworkUrl100) 
            ? res.results[0].artworkUrl100.replace("100x100", "600x600") : defaultCover;
        }).fail(function() { mCover.src = defaultCover; });
      }
    }
  });
}

updateMetadata(); setInterval(updateMetadata, 10000);

const toggleButtons = document.querySelectorAll(".circle-toggle[data-toggle]");

toggleButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    const type = btn.getAttribute("data-toggle");
    if(!type) return;
    const isActive = btn.classList.toggle("active");
    const labelParts = btn.getAttribute("data-label").split(":");
    btn.setAttribute("data-label", `${labelParts[0]}: ${isActive ? "ON" : "OFF"}`);
    
    switch (type) {
      case "lap": barWrap.classList.toggle("hide-lap", !isActive); break;
      case "neb": barWrap.classList.toggle("neb-on", isActive); break;
      case "ani": barWrap.classList.toggle("anima-on", isActive); break;
    }
  });
});

const volPct = document.getElementById("volPct"), volIcon = document.getElementById("volIcon");
volumeControl.addEventListener("input", (e) => {
  const val = Math.round(parseFloat(e.target.value) * 100);
  volPct.textContent = val + "%";
  if (val === 0) volIcon.textContent = "🔇";
  else if (val < 50) volIcon.textContent = "🔉";
  else volIcon.textContent = "🔊";
});
