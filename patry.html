<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>patrizia angel</title>

<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Arial Black', Impact, sans-serif;
  color: white;
}

.container {
  position: relative;
  width: 1308px;
  height: 484px;
}

/* ===== VIDEO LATERALI (9:16) ===== */
.video-wrapper {
  position: absolute;
  width: 270px;
  height: 484px;
  overflow: hidden;
  z-index: 1;
  background: transparent;
  border-radius: 20px;
}
.left { left: 0; }
.right { right: 0; }

.side-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
}

/* ===== AREA CENTRALE CON PALETTE CYBERPUNK ===== */
.center-area {
  position: absolute;
  left: 290px;
  right: 290px;
  top: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
}

.center-box {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 20px;
  overflow: hidden;
  /* Composizione a strati: bagliori + base scarlatto/fucsia */
  background: 
    radial-gradient(circle at 0% 50%, rgba(77, 238, 234, 0.45) 0%, transparent 40%),
    radial-gradient(circle at 100% 50%, rgba(77, 238, 234, 0.45) 0%, transparent 40%),
    radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.25) 0%, rgba(224, 40, 117, 0.7) 35%, rgba(196, 21, 91, 0.85) 60%, transparent 85%),
    repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(255, 255, 255, 0.04) 50px, transparent 52px),
    linear-gradient(180deg, #ff6a00 0%, #e61a29 25%, #c4155b 60%, #4a031e 100%);
  border: 1.5px solid rgba(77, 238, 234, 0.4);
  box-shadow: 
    0 0 30px rgba(224, 40, 117, 0.6), 
    0 0 15px rgba(77, 238, 234, 0.4),
    inset 0 0 45px rgba(230, 26, 41, 0.5);
}

/* ===== IMMAGINE FUSA / IMPASTATA CON LO SFONDO ===== */
.blended-bg-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  mix-blend-mode: screen; /* Fa fondere la luce dell'immagine con i colori sotto */
  opacity: 0.75;
  filter: contrast(115%) saturate(130%);
  /* Sfuma i bordi per non creare stacchi netti */
  mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 90%);
  -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 90%);
  z-index: 1;
}

/* Seconda velatura di contrasto per unire ancora di più i toni */
.blend-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, transparent 30%, rgba(196, 21, 91, 0.4) 70%, rgba(74, 3, 30, 0.75) 100%);
  mix-blend-mode: color-burn;
  pointer-events: none;
  z-index: 2;
}

/* ===== STELLINE E PARTICELLE LUMINOSE (GLOW) ===== */
.sparkle-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 3;
}

.star {
  position: absolute;
  color: #fff;
  user-select: none;
  line-height: 1;
  animation: starTwinkle 3s ease-in-out infinite alternate;
}

/* Varianti colore e bagliori */
.star-cyan {
  color: #c7ffff;
  text-shadow: 0 0 8px #4deeea, 0 0 18px #4deeea, 0 0 28px #00ffff;
}

.star-pink {
  color: #fff0f5;
  text-shadow: 0 0 8px #ff2d78, 0 0 20px #e02875, 0 0 30px #ff0055;
}

.star-gold {
  color: #fff8e7;
  text-shadow: 0 0 8px #ffd700, 0 0 18px #ff6a00, 0 0 26px #ff4500;
}

/* Posizioni e grandezze stelline */
.s1 { top: 15%; left: 12%; font-size: 26px; animation-duration: 2.2s; }
.s2 { top: 22%; right: 18%; font-size: 20px; animation-duration: 3.1s; animation-delay: 0.5s; }
.s3 { top: 70%; left: 15%; font-size: 18px; animation-duration: 2.7s; animation-delay: 1.1s; }
.s4 { bottom: 18%; right: 14%; font-size: 28px; animation-duration: 2.5s; animation-delay: 0.3s; }
.s5 { top: 40%; left: 32%; font-size: 16px; animation-duration: 3.5s; animation-delay: 0.8s; }
.s6 { top: 55%; right: 28%; font-size: 22px; animation-duration: 2.9s; animation-delay: 1.4s; }
.s7 { top: 10%; left: 52%; font-size: 24px; animation-duration: 2.4s; animation-delay: 0.2s; }
.s8 { bottom: 25%; left: 45%; font-size: 18px; animation-duration: 3.2s; animation-delay: 1.7s; }

/* Animazione pulsazione e scintillio */
@keyframes starTwinkle {
  0% {
    opacity: 0.3;
    transform: scale(0.75) rotate(0deg);
  }
  50% {
    opacity: 1;
    transform: scale(1.25) rotate(15deg);
  }
  100% {
    opacity: 0.4;
    transform: scale(0.85) rotate(-10deg);
  }
}
</style>
</head>
<body>

<div class="container">
  <!-- VIDEO SINISTRO (9:16) -->
  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/baby.mp4" type="video/mp4">
    </video>
  </div>

  <!-- AREA CENTRALE CON IMMAGINE IMPASTATA E GLOW -->
  <div class="center-area">
    <div class="center-box">
      <!-- Immagine fusa sullo sfondo -->
      <img src="https://xatimg.com/image/pNxZrqKIyNEo.jpg" alt="Artwork" class="blended-bg-img">
      <div class="blend-overlay"></div>

      <!-- Stelline con bagliore neon fluttuanti -->
      <div class="sparkle-container">
        <span class="star star-cyan s1">✦</span>
        <span class="star star-pink s2">★</span>
        <span class="star star-gold s3">✦</span>
        <span class="star star-pink s4">★</span>
        <span class="star star-cyan s5">✧</span>
        <span class="star star-gold s6">✦</span>
        <span class="star star-pink s7">✧</span>
        <span class="star star-cyan s8">★</span>
      </div>
    </div>
  </div>

  <!-- VIDEO DESTRO (9:16) -->
  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/baby.mp4" type="video/mp4">
    </video>
  </div>
</div>

</body>
</html>
