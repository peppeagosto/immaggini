<!DOCTYPE html>
<html lang="it">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> &Global& </title>
    <!-- Leaflet CSS -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: #e5e3df;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #333;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #e5e3df;
            z-index: 1;
        }

        /* Frase professionale fluttuante */
        .floating-text {
            position: absolute;
            font-size: 1.6rem;
            font-weight: 800;
            color: #0044cc;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.7);
            animation: float-xy 14s infinite ease-in-out alternate;
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 2px;
        }

        /* Nick ai bordi estremi */
        .static-nick-left, .static-nick-right {
            position: absolute;
            bottom: 15px;
            font-size: 1rem;
            letter-spacing: 3px;
            color: #d60036;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            z-index: 1000;
            text-transform: uppercase;
            font-weight: bold;
        }
        .static-nick-left { left: 25px; }
        .static-nick-right { right: 25px; }

        /* Container Dashboard e Ricerca */
        .dashboard-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 340px;
        }

        .search-box {

            border: 1px solid rgba(0, 68, 204, 0.4);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 8px;
            backdrop-filter: blur(5px);
            position: relative;
        }

        .search-box input {
            flex: 1;
            background: #f4f6f9;
            border: 1px solid #ccc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #333;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0044cc;
        }

        .search-box button {
            background: #0044cc;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: #003399;
        }

        /* Storico Ricerche a tendina */
        .history-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none;
            z-index: 1001;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            padding: 6px 12px;
            font-size: 0.8rem;
            color: #333;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .history-item:hover {
            background: #f0f4ff;
            color: #0044cc;
        }

        .flag-dashboard {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(0, 68, 204, 0.4);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .flag-dashboard h4 {
            font-size: 0.9rem;
            color: #0044cc;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 68, 204, 0.2);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flag-list {
            max-height: 130px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .flag-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.04);
            padding: 6px 8px;
            border-radius: 5px;
            border-left: 3px solid #0044cc;
            color: #222;
        }

        .flag-item span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Pulsante Condivisione Rapida */
        .share-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .share-btn:hover {
            background: #218838;
        }

        /* Marker radar pulsante */
        .city-pulse {
            width: 16px;
            height: 16px;
            background: #0044cc;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #0044cc;
            animation: radar-pulse 2s infinite;
        }

        @keyframes radar-pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 68, 204, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(0, 68, 204, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 68, 204, 0); }
        }

        @keyframes float-xy {
            0% { top: 10%; left: 5%; }
            33% { top: 75%; left: 50%; }
            66% { top: 20%; left: 55%; }
            100% { top: 65%; left: 10%; }
        }
    </style>
</head>

    <!-- Frase professionale fluttuante -->

            <!-- Pulsante Condivisione -->
            <button class="share-btn" id="share-btn">📋 Copia Posizione</button>
        </div>
    </div>

    <!-- Mappa -->
