<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>EL DIABLO</title>
<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.container {
  position: relative;
  width: 1308px;
  height: 484px;
}

.video-wrapper {
  position: absolute;
  width: 270px;
  height: 484px;
  overflow: hidden;
  z-index: 1;
  background: transparent;
  border-radius: 20px;
}
.left { left: 0; }
.right { right: 0; }

.side-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
}

/* SCRITTA SOTTO DENTRO IL VIDEO (Senza uscire dai bordi) */
.nik-dentro-video {
  position: absolute;
  bottom: 20px; /* Quasi alla fine del video */
  width: 100%;
  text-align: center;
  font-size: 24px;
  font-weight: 900;
  white-space: nowrap;
  /* Sfumatura Arcobaleno */
  background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.9));
  z-index: 3;
  /* Animazione contenuta dentro il video */
  animation: scorriDentroVideo 3s ease-in-out infinite alternate;
}

@keyframes scorriDentroVideo {
  0%   { transform: translateX(-25px); } /* Spostamento DX/SX limitato al video */
  100% { transform: translateX(25px); }
}

/* Area Centrale */
.center-area {
  position: absolute;
  left: 340px;  
  right: 340px; 
  top: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2; 
  pointer-events: none;
}

/* TESTO CENTRALE ARCOBALENO (DX, SX, ALTO, BASSO) */
.testo-benvenuto-arcobaleno {
  position: absolute;
  font-size: 28px;
  font-weight: bold;
  text-align: center;
  line-height: 1.4;
  background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.9));
  animation: fluttuaTutteDirezioni 10s ease-in-out infinite;
}

@keyframes fluttuaTutteDirezioni {
  0%   { transform: translate(-100px, -100px); }
  25%  { transform: translate(100px, -80px); }
  50%  { transform: translate(80px, 90px); }
  75%  { transform: translate(-90px, 80px); }
  100% { transform: translate(-100px, -100px); }
}

</style>
</head>
<body>

<div class="container">

  <!-- Video Sinistra con Nik DENTRO -->
  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/loirinha.mp4" type="video/mp4">
    </video>
    <div class="nik-dentro-video">❤ LOIRINHA ❤</div>
  </div>

  <!-- Area Centrale col Benvenuto -->
  <div class="center-area">
    <div class="testo-benvenuto-arcobaleno">
      Boa audição e bem-vindos da <br> ❤ LOC LOIRINHA❤
    </div>
  </div>

  <!-- Video Destra con Nik DENTRO -->
  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://peppeagosto.github.io/immaggini/loirinha.mp4" type="video/mp4">
    </video>
    <div class="nik-dentro-video">❤ LOIRINHA ❤</div>
  </div>

</div>

</body>
</html>
