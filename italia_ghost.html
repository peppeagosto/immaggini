<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITALIA GHOST - Chat Ufficiale</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle, #1a1a24 0%, #0a0a0f 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Finestra Pop-up Bloccante all'avvio */
    #welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .modal-box {
      background: #14141c;
      border: 1px solid #00ffcc;
      border-radius: 12px;
      padding: 30px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.35);
      animation: popupAnim 0.3s ease;
    }

    @keyframes popupAnim {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-box h2 {
      color: #00ffcc;
      font-size: 22px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .modal-box p {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 18px;
    }

    #user-greeting {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #09090d;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
      transition: 0.3s;
    }

    #user-greeting:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }

    #btn-enter {
      width: 100%;
      padding: 12px;
      background: #00ffcc;
      color: #0d0d12;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    #btn-enter:hover {
      background: #00e6b8;
      transform: scale(1.02);
    }

    #error-msg {
      color: #ff4d4d;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* Layout Chat */
    .chat-wrapper {
      text-align: center;
      padding: 20px;
    }

    .chat-frame {
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      background: #000;
      border: 1px solid #222;
      max-width: 100%;
    }

    .chat-footer {
      margin-top: 15px;
      font-size: 13px;
      color: #888;
    }

    .chat-footer a {
      color: #00ffcc;
      text-decoration: none;
      transition: color 0.2s;
    }

    .chat-footer a:hover {
      text-decoration: underline;
      color: #fff;
    }

    .chat-footer .badge-welcome {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Overlay di Blocco e Saluto -->
  <div id="welcome-overlay">
    <div class="modal-box">
      <h2>ITALIA GHOST</h2>
      <p>Scrivi un saluto prima di entrare in chat:</p>
      <input type="text" id="user-greeting" placeholder="Es: Ciao a tutti!" autocomplete="off" />
      <button id="btn-enter" onclick="unlockChat()">Saluta ed Entra</button>
      <div id="error-msg">⚠️ Inserisci un saluto per continuare!</div>
    </div>
  </div>

  <!-- Contenitore Chat xat -->
  <div class="chat-wrapper">
    <iframe 
      class="chat-frame"
      src="https://xat.com/embed/chat.php#id=220536060&gn=ITALIA_GHOST" 
      allow="clipboard-write" 
      width="650" 
      height="486" 
      frameborder="0" 
      scrolling="no">
    </iframe>
    
    <div class="chat-footer">
      <span class="badge-welcome">👋 Benvenuti! Lascia un saluto per entrare</span> | 
      <a target="_blank" href="https://xat.com/ITALIA_GHOST">Vai al sito di ITALIA_GHOST</a>
    </div>
  </div>

  <script>
    function unlockChat() {
      const input = document.getElementById('user-greeting');
      const overlay = document.getElementById('welcome-overlay');
      const error = document.getElementById('error-msg');

      if (input.value.trim() === '') {
        error.style.display = 'block';
        return;
      }

      error.style.display = 'none';
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
    }

    // Abilita l'invio con il tasto Invio della tastiera
    document.getElementById('user-greeting').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        unlockChat();
      }
    });
  </script>

</body>
</html>
